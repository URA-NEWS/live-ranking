<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>URA Memo Controller</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#111;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif;color:#f0f0f0;font-size:13px;min-height:100vh;}

/* ステータス */
#status-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;}
#status-dot{width:8px;height:8px;border-radius:50%;background:#555;flex-shrink:0;}
#status-dot.on{background:#22cc44;}
#status-txt{font-size:10px;font-weight:500;color:#888;letter-spacing:.06em;flex:1;}
#status-txt.on{color:#22cc44;}

/* タブ */
.tabs{display:flex;border-bottom:2px solid #222;}
.tab{flex:1;padding:11px 4px;font-size:10px;font-weight:500;letter-spacing:.08em;text-align:center;cursor:pointer;color:#666;border:none;background:transparent;border-bottom:3px solid transparent;margin-bottom:-2px;-webkit-tap-highlight-color:transparent;}
.tab.on{color:#fff;border-bottom-color:#e53e3e;}
.tab:hover{color:#ccc;}

.pane{display:none;padding:14px;}
.pane.on{display:block;}

/* 見出し */
.sh{font-size:10px;font-weight:500;letter-spacing:.18em;color:#e53e3e;margin-bottom:8px;margin-top:14px;padding-bottom:4px;border-bottom:1px solid #2a2a2a;}
.sh:first-child{margin-top:0;}
.sub{font-size:10px;color:#666;margin:0 0 6px 0;font-weight:400;line-height:1.5;}

/* スライダー */
.sl-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.sl-row label{font-size:11px;color:#bbb;font-weight:500;white-space:nowrap;min-width:90px;}
.sl-row input[type=range]{flex:1;accent-color:#e53e3e;height:4px;}
.sl-row .v{font-size:11px;color:#999;font-family:'SF Mono',monospace;min-width:50px;text-align:right;}

/* ボタン */
.btn-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.tg-btn{flex:1;min-width:0;padding:8px 8px;font-size:11px;font-weight:500;border-radius:5px;background:transparent;color:#888;border:1px solid #2a2a2a;cursor:pointer;letter-spacing:.04em;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.tg-btn.on{background:#e53e3e;color:#fff;border-color:#e53e3e;}
.tg-btn:disabled{opacity:.4;cursor:not-allowed;}

.apply-btn{width:100%;padding:13px;font-size:13px;font-weight:500;border-radius:6px;background:#e53e3e;color:#fff;border:none;cursor:pointer;letter-spacing:.1em;margin-top:8px;}
.apply-btn:active{transform:scale(.98);}
.apply-btn.sub{background:transparent;color:#e53e3e;border:1px solid #e53e3e;padding:9px;font-size:11px;letter-spacing:.06em;}
.apply-btn.danger{background:transparent;color:#cc4444;border:1px solid #cc4444;padding:8px;font-size:11px;}
.help-txt{font-size:10px;color:#555;margin-top:6px;text-align:center;letter-spacing:.04em;}

/* 入力 */
input[type=text], textarea, input[type=color]{
  width:100%;background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;
  font-family:inherit;font-size:12px;
  padding:8px 10px;border-radius:4px;outline:none;resize:vertical;
}
input[type=text]:focus, textarea:focus{border-color:#e53e3e;}
input[type=color]{padding:2px;height:32px;cursor:pointer;}
textarea#bodyInput{min-height:200px;font-size:13px;line-height:1.5;}

label.field-label{font-size:10px;color:#888;display:block;margin-bottom:4px;letter-spacing:.06em;}

/* メモリスト */
#memoList, #pinList{display:flex;flex-direction:column;gap:5px;max-height:55vh;overflow-y:auto;}
#memoList::-webkit-scrollbar, #pinList::-webkit-scrollbar{width:5px;}
#memoList::-webkit-scrollbar-thumb, #pinList::-webkit-scrollbar-thumb{background:#333;border-radius:3px;}

.mm-item{
  padding:8px 10px;border-radius:5px;
  border:1px solid #2a2a2a;background:#1a1a1a;
  cursor:pointer;
  transition:border-color .15s, background .15s;
}
.mm-item:hover{border-color:#444;background:#1f1f1f;}
.mm-item.editing{border-color:#e53e3e;background:#1f1010;}
.mm-item.active-on-stage{border-color:#22cc44;background:#0d1f10;}

.mm-meta{display:flex;align-items:center;gap:6px;font-size:9px;color:#666;letter-spacing:.04em;margin-bottom:3px;}
.mm-pin{color:#ffd700;}
.mm-active{background:#22cc44;color:#000;font-weight:700;padding:1px 5px;border-radius:2px;font-size:9px;}
.mm-time{margin-left:auto;font-family:'SF Mono',monospace;}
.mm-title{font-size:12px;color:#fff;font-weight:600;line-height:1.4;}
.mm-preview{font-size:10px;color:#888;line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

.mm-acts{display:flex;gap:4px;margin-top:6px;}
.mm-acts button{flex:1;font-size:9px;padding:4px;background:transparent;color:#888;border:1px solid #2a2a2a;border-radius:3px;cursor:pointer;letter-spacing:.04em;}
.mm-acts button:hover{color:#fff;border-color:#444;}
.mm-acts button.act-pin.on{color:#ffd700;border-color:#ffd700;}
.mm-acts button.act-del{color:#cc4444;border-color:#3a1818;}

/* 検索 */
#searchBox{margin-bottom:10px;}

/* 配信中バー */
#stageBar{
  background:#0d1f10;border:1px solid #22cc44;
  padding:8px 10px;border-radius:5px;
  margin-bottom:10px;display:none;
}
#stageBar.show{display:block;}
.stage-lbl{font-size:9px;color:#22cc44;letter-spacing:.1em;margin-bottom:3px;}
.stage-title{font-size:11px;font-weight:700;color:#fff;line-height:1.4;}

/* マークダウンヘルプ */
.md-help{
  background:#0a0a0a;border:1px solid #2a2a2a;border-radius:5px;
  padding:8px 10px;font-size:10px;color:#777;line-height:1.6;
  margin-top:8px;font-family:'SF Mono',monospace;
}
.md-help b{color:#ffd700;}
</style>
</head>
<body>

<div id="status-bar">
  <div id="status-dot"></div>
  <div id="status-txt">未配信</div>
  <button class="tg-btn" id="newBtn" type="button" style="flex:0 0 auto;">➕ 新規</button>
</div>

<div class="tabs">
  <button class="tab on" data-tab="edit" type="button">📝 メモ</button>
  <button class="tab" data-tab="list" type="button">📋 一覧</button>
  <button class="tab" data-tab="io" type="button">📤 入出力</button>
  <button class="tab" data-tab="style" type="button">🎨 スタイル</button>
</div>

<!-- ========================= 編集 ========================= -->
<div class="pane on" id="pane-edit">

  <div id="stageBar">
    <div class="stage-lbl">📡 配信中</div>
    <div class="stage-title" id="stageTitle">—</div>
  </div>

  <label class="field-label">タイトル</label>
  <input type="text" id="titleInput" placeholder="タイトルを入力" maxlength="100">

  <label class="field-label" style="margin-top:10px;">本文（マークダウン対応）</label>
  <textarea id="bodyInput" placeholder="メモ本文を入力&#10;&#10;# 見出し&#10;**太字** *斜体* ==マーカー==&#10;- 箇条書き&#10;1. 番号リスト&#10;> 引用"></textarea>

  <div class="md-help">
    <b># </b>見出し　<b>**太字**</b>　<b>*斜体*</b>　<b>==マーカー==</b><br>
    <b>- </b>箇条書き　<b>1. </b>番号　<b>&gt; </b>引用　<b>---</b>区切り　<b>`コード`</b>
  </div>

  <div class="btn-row" style="margin-top:14px;">
    <button class="tg-btn" id="saveBtn" type="button">💾 保存</button>
    <button class="tg-btn" id="speakBtn" type="button">🔊 音読</button>
  </div>
  <button class="apply-btn" id="stageBtn" type="button">⚡ 配信画面に表示</button>
  <button class="apply-btn sub" id="hideBtn" type="button">⛔ 配信画面から消す</button>
</div>

<!-- ========================= 一覧 ========================= -->
<div class="pane" id="pane-list">
  <input type="text" id="searchBox" placeholder="🔍 タイトルで検索">
  <div class="sub" style="display:flex;align-items:center;gap:8px;">
    <span id="listCount">— 件</span>
    <span style="color:#444;">|</span>
    <span style="color:#ffd700;">📌</span>
    <span style="color:#444;">|</span>
    <span style="color:#22cc44;">配信中</span>
  </div>
  <div id="memoList"></div>
</div>

<!-- ========================= 入出力 ========================= -->
<div class="pane" id="pane-io">
  <div class="sh">エクスポート</div>
  <div class="sub">現在編集中のメモをファイルに保存</div>
  <div class="btn-row">
    <button class="tg-btn" id="expTxtBtn" type="button">📄 .txt</button>
    <button class="tg-btn" id="expMdBtn" type="button">📝 .md</button>
  </div>

  <div class="sh">全メモを書き出し</div>
  <div class="sub">バックアップとして使えるJSON形式</div>
  <button class="apply-btn sub" id="expAllBtn" type="button">💾 全メモをJSONで書き出し</button>

  <div class="sh">インポート</div>
  <div class="sub">.txt / .md / .json から読み込み</div>
  <input type="file" id="impFile" accept=".txt,.md,.json,text/plain,application/json" style="display:none;">
  <button class="apply-btn sub" id="impBtn" type="button">📂 ファイルを選択</button>
</div>

<!-- ========================= スタイル ========================= -->
<div class="pane" id="pane-style">
  <div class="sub">編集中のメモに適用される見た目設定</div>

  <div class="sh">本文文字</div>
  <div class="sl-row">
    <label>サイズ</label>
    <input type="range" id="fontSize" min="12" max="36" step="1">
    <span class="v" id="fontSizeV">18px</span>
  </div>
  <div class="sl-row">
    <label>太さ</label>
    <input type="range" id="fontWeight" min="300" max="900" step="100">
    <span class="v" id="fontWeightV">400</span>
  </div>
  <div class="sl-row">
    <label>行間</label>
    <input type="range" id="lineHeight" min="120" max="240" step="5">
    <span class="v" id="lineHeightV">170%</span>
  </div>
  <div class="sl-row">
    <label>文字色</label>
    <input type="color" id="textColor" style="flex:1;">
  </div>

  <div class="sh">マーカー色</div>
  <div class="sub">==文字== で囲んだ部分の背景色</div>
  <div class="sl-row">
    <label>色</label>
    <input type="color" id="markerColor" style="flex:1;">
  </div>

  <div class="sh">フレーム</div>
  <div class="sl-row">
    <label>背景透過</label>
    <input type="range" id="frameOpacity" min="0" max="100" step="1">
    <span class="v" id="frameOpacityV">92%</span>
  </div>
  <div class="sl-row">
    <label>枠の色</label>
    <input type="color" id="borderColor" style="flex:1;">
  </div>

  <button class="apply-btn" id="applyStyleBtn" type="button">✓ スタイルを保存</button>
  <button class="apply-btn sub" id="resetStyleBtn" type="button">↺ デフォルトに戻す</button>
</div>

<script>
'use strict';

// ============================================================
// 既定値
// ============================================================
var DEFAULT_STYLE = {
  fontSize:18,
  fontWeight:400,
  lineHeight:1.7,
  color:'#ffffff',
  markerColor:'#ffd700',
  frameOpacity:92,
  borderColor:'#e53e3e'
};

// ============================================================
// データ層（localStorage）
// ============================================================
function loadList(){
  try{
    var s = localStorage.getItem('ura_memo_list');
    if(!s) return [];
    return JSON.parse(s) || [];
  }catch(e){ return []; }
}
function saveList(arr){
  try{ localStorage.setItem('ura_memo_list', JSON.stringify(arr)); }catch(e){}
}
function loadActive(){
  try{
    var s = localStorage.getItem('ura_memo_active');
    if(!s) return {visible:false, memo:null};
    return JSON.parse(s);
  }catch(e){ return {visible:false, memo:null}; }
}
function saveActive(obj){
  try{ localStorage.setItem('ura_memo_active', JSON.stringify(obj)); }catch(e){}
}
function loadCurrentId(){
  try{ return localStorage.getItem('ura_memo_current') || null; }catch(e){ return null; }
}
function saveCurrentId(id){
  try{
    if(id) localStorage.setItem('ura_memo_current', id);
    else   localStorage.removeItem('ura_memo_current');
  }catch(e){}
}

function newId(){ return 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ============================================================
// 編集中メモ（メモリ上）
// ============================================================
var current = null;  // {id, title, body, style, pinned, createdAt, updatedAt}

function makeBlank(){
  return {
    id: newId(),
    title: '',
    body: '',
    style: Object.assign({}, DEFAULT_STYLE),
    pinned: false,
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}

function loadCurrentMemo(){
  var id = loadCurrentId();
  if(!id) return makeBlank();
  var arr = loadList();
  var found = arr.find(function(x){ return x.id === id; });
  return found ? Object.assign({}, found) : makeBlank();
}

function pushCurrentToUI(){
  document.getElementById('titleInput').value = current.title || '';
  document.getElementById('bodyInput').value = current.body || '';
  syncStyleUI();
  updateStageBar();
}

function pullCurrentFromUI(){
  current.title = document.getElementById('titleInput').value;
  current.body = document.getElementById('bodyInput').value;
  current.style = readStyleFromUI();
}

// ============================================================
// 保存
// ============================================================
function saveCurrent(){
  pullCurrentFromUI();
  if(!current.title.trim() && !current.body.trim()){
    flashBtn('saveBtn', '空っぽ');
    return;
  }
  current.updatedAt = Date.now();
  var arr = loadList();
  var idx = arr.findIndex(function(x){ return x.id === current.id; });
  if(idx >= 0){
    arr[idx] = Object.assign({}, current);
  }else{
    arr.unshift(Object.assign({}, current));
  }
  saveList(arr);
  saveCurrentId(current.id);
  // もし配信中ならアクティブも更新
  var active = loadActive();
  if(active && active.visible && active.memo && active.memo.id === current.id){
    saveActive({visible:true, memo:Object.assign({}, current)});
    bumpActive();
  }
  flashBtn('saveBtn', '✓ 保存');
  renderList();
}

function flashBtn(id, txt){
  var b = document.getElementById(id);
  var prev = b.textContent;
  b.textContent = txt;
  setTimeout(function(){ b.textContent = prev; }, 1100);
}

// ============================================================
// 配信画面 ON/OFF
// ============================================================
function stage(){
  pullCurrentFromUI();
  // 自動保存
  saveCurrent();
  saveActive({visible:true, memo:Object.assign({}, current)});
  bumpActive();
  updateStageBar();
  renderList();
  flashBtn('stageBtn', '⚡ 配信中');
}
function unstage(){
  saveActive({visible:false, memo:null});
  bumpActive();
  updateStageBar();
  renderList();
  flashBtn('hideBtn', '⛔ 非表示');
}
function bumpActive(){
  // 同一タブだとstorageイベント発火しないが、
  // display側は別タブ/別ソースなのでOK
}
function updateStageBar(){
  var bar = document.getElementById('stageBar');
  var dot = document.getElementById('status-dot');
  var txt = document.getElementById('status-txt');
  var active = loadActive();
  if(active && active.visible && active.memo){
    bar.classList.add('show');
    document.getElementById('stageTitle').textContent = active.memo.title || '—';
    dot.classList.add('on');
    txt.classList.add('on');
    txt.textContent = '配信中: ' + (active.memo.title || '—').slice(0,20);
  }else{
    bar.classList.remove('show');
    dot.classList.remove('on');
    txt.classList.remove('on');
    txt.textContent = '未配信';
  }
}

// ============================================================
// 新規・選択・ピン・削除
// ============================================================
function newMemo(){
  pullCurrentFromUI();
  // 編集中に内容あれば自動保存
  if(current.title.trim() || current.body.trim()){
    current.updatedAt = Date.now();
    var arr = loadList();
    var idx = arr.findIndex(function(x){ return x.id === current.id; });
    if(idx >= 0) arr[idx] = Object.assign({}, current);
    else arr.unshift(Object.assign({}, current));
    saveList(arr);
  }
  current = makeBlank();
  saveCurrentId(current.id);
  pushCurrentToUI();
  switchTab('edit');
  document.getElementById('titleInput').focus();
}
function selectMemo(id){
  pullCurrentFromUI();
  // 編集中に内容あれば自動保存
  if(current.title.trim() || current.body.trim()){
    current.updatedAt = Date.now();
    var arr0 = loadList();
    var idx0 = arr0.findIndex(function(x){ return x.id === current.id; });
    if(idx0 >= 0) arr0[idx0] = Object.assign({}, current);
    else arr0.unshift(Object.assign({}, current));
    saveList(arr0);
  }
  var arr = loadList();
  var found = arr.find(function(x){ return x.id === id; });
  if(!found) return;
  current = Object.assign({}, found);
  saveCurrentId(id);
  pushCurrentToUI();
  switchTab('edit');
}
function togglePin(id){
  var arr = loadList();
  var idx = arr.findIndex(function(x){ return x.id === id; });
  if(idx < 0) return;
  arr[idx].pinned = !arr[idx].pinned;
  saveList(arr);
  if(current.id === id) current.pinned = arr[idx].pinned;
  renderList();
}
function deleteMemo(id){
  if(!confirm('このメモを削除しますか？')) return;
  var arr = loadList().filter(function(x){ return x.id !== id; });
  saveList(arr);
  // 削除したのが編集中なら新規にする
  if(current.id === id){
    current = makeBlank();
    saveCurrentId(current.id);
    pushCurrentToUI();
  }
  // 削除したのが配信中なら非表示
  var active = loadActive();
  if(active && active.memo && active.memo.id === id){
    saveActive({visible:false, memo:null});
    updateStageBar();
  }
  renderList();
}

// ============================================================
// 一覧描画
// ============================================================
function renderList(){
  var arr = loadList();
  var q = (document.getElementById('searchBox').value || '').trim();
  if(q){
    var qLow = q.toLowerCase();
    arr = arr.filter(function(x){ return (x.title||'').toLowerCase().indexOf(qLow) >= 0; });
  }
  // ピン留め優先 → updatedAt 降順
  arr.sort(function(a,b){
    if(a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    return (b.updatedAt||0) - (a.updatedAt||0);
  });

  document.getElementById('listCount').textContent = arr.length + ' 件';
  var active = loadActive();
  var activeId = (active && active.visible && active.memo) ? active.memo.id : null;
  var editingId = current ? current.id : null;

  var html = arr.map(function(m){
    var t = '';
    try{
      var d = new Date(m.updatedAt||m.createdAt);
      var mm = String(d.getMonth()+1).padStart(2,'0');
      var dd = String(d.getDate()).padStart(2,'0');
      var hh = String(d.getHours()).padStart(2,'0');
      var mi = String(d.getMinutes()).padStart(2,'0');
      t = mm+'/'+dd+' '+hh+':'+mi;
    }catch(e){}
    var classes = 'mm-item';
    if(m.id === editingId) classes += ' editing';
    if(m.id === activeId)  classes += ' active-on-stage';
    var preview = (m.body||'').replace(/[#*=`>\-]/g,'').replace(/\s+/g,' ').trim().slice(0,60);
    return '<div class="'+classes+'" data-id="'+esc(m.id)+'">'
      + '<div class="mm-meta">'
      +   (m.pinned?'<span class="mm-pin">📌</span>':'')
      +   (m.id === activeId ? '<span class="mm-active">配信中</span>' : '')
      +   '<span class="mm-time">'+t+'</span>'
      + '</div>'
      + '<div class="mm-title">'+esc(m.title || '（無題）')+'</div>'
      + (preview ? '<div class="mm-preview">'+esc(preview)+'</div>' : '')
      + '<div class="mm-acts">'
      +   '<button class="act-edit" data-id="'+esc(m.id)+'" type="button">📝 開く</button>'
      +   '<button class="act-stage" data-id="'+esc(m.id)+'" type="button">⚡ 配信</button>'
      +   '<button class="act-pin'+(m.pinned?' on':'')+'" data-id="'+esc(m.id)+'" type="button">📌</button>'
      +   '<button class="act-del" data-id="'+esc(m.id)+'" type="button">🗑</button>'
      + '</div>'
      + '</div>';
  }).join('');

  var listEl = document.getElementById('memoList');
  listEl.innerHTML = html;
  listEl.querySelectorAll('.act-edit').forEach(function(b){
    b.addEventListener('click', function(ev){ ev.stopPropagation(); selectMemo(this.dataset.id); });
  });
  listEl.querySelectorAll('.act-stage').forEach(function(b){
    b.addEventListener('click', function(ev){ ev.stopPropagation(); selectMemo(this.dataset.id); setTimeout(stage, 50); });
  });
  listEl.querySelectorAll('.act-pin').forEach(function(b){
    b.addEventListener('click', function(ev){ ev.stopPropagation(); togglePin(this.dataset.id); });
  });
  listEl.querySelectorAll('.act-del').forEach(function(b){
    b.addEventListener('click', function(ev){ ev.stopPropagation(); deleteMemo(this.dataset.id); });
  });
}

// ============================================================
// スタイルUI
// ============================================================
function syncStyleUI(){
  var st = current.style || DEFAULT_STYLE;
  setSlider('fontSize', st.fontSize||18, 'fontSizeV', function(v){ return v+'px'; });
  setSlider('fontWeight', st.fontWeight||400, 'fontWeightV', function(v){ return ''+v; });
  setSlider('lineHeight', Math.round((st.lineHeight||1.7)*100), 'lineHeightV', function(v){ return v+'%'; });
  document.getElementById('textColor').value = st.color || '#ffffff';
  document.getElementById('markerColor').value = st.markerColor || '#ffd700';
  setSlider('frameOpacity', st.frameOpacity==null?92:st.frameOpacity, 'frameOpacityV', function(v){ return v+'%'; });
  document.getElementById('borderColor').value = st.borderColor || '#e53e3e';
}
function readStyleFromUI(){
  return {
    fontSize: +document.getElementById('fontSize').value,
    fontWeight: +document.getElementById('fontWeight').value,
    lineHeight: (+document.getElementById('lineHeight').value)/100,
    color: document.getElementById('textColor').value,
    markerColor: document.getElementById('markerColor').value,
    frameOpacity: +document.getElementById('frameOpacity').value,
    borderColor: document.getElementById('borderColor').value
  };
}
function setSlider(id, val, valId, fmt){
  var s = document.getElementById(id);
  s.value = val;
  document.getElementById(valId).textContent = fmt(val);
}

// ============================================================
// エクスポート / インポート
// ============================================================
function downloadFile(name, content, mime){
  var blob = new Blob([content], {type: mime || 'text/plain;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}
function exportTxt(){
  pullCurrentFromUI();
  var name = (current.title||'memo').replace(/[\\/:*?"<>|]/g,'_') + '.txt';
  downloadFile(name, (current.title||'')+'\n\n'+(current.body||''), 'text/plain;charset=utf-8');
}
function exportMd(){
  pullCurrentFromUI();
  var name = (current.title||'memo').replace(/[\\/:*?"<>|]/g,'_') + '.md';
  var content = '# ' + (current.title||'') + '\n\n' + (current.body||'');
  downloadFile(name, content, 'text/markdown;charset=utf-8');
}
function exportAll(){
  var arr = loadList();
  var name = 'ura_memo_'+ new Date().toISOString().slice(0,10) +'.json';
  downloadFile(name, JSON.stringify(arr,null,2), 'application/json;charset=utf-8');
}
function importFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    var text = String(reader.result || '');
    var name = file.name.replace(/\.(txt|md|json)$/i,'');
    var lower = file.name.toLowerCase();
    if(lower.endsWith('.json')){
      try{
        var arr = JSON.parse(text);
        if(!Array.isArray(arr)) throw new Error('JSON should be array');
        var existing = loadList();
        // IDが重複したら新ID振る
        var existingIds = {};
        existing.forEach(function(x){ existingIds[x.id] = true; });
        arr.forEach(function(x){
          if(!x.id || existingIds[x.id]){ x.id = newId(); }
          existingIds[x.id] = true;
        });
        var merged = arr.concat(existing);
        saveList(merged);
        renderList();
        alert(arr.length + ' 件を読み込みました');
      }catch(e){
        alert('JSONの読み込みに失敗: ' + e.message);
      }
      return;
    }
    // .txt / .md は新規メモとして追加
    var lines = text.split(/\r?\n/);
    var title = '';
    var body = text;
    if(lower.endsWith('.md')){
      // 先頭が `# タイトル` ならそれをタイトルに
      var m = text.match(/^#\s+(.+?)(?:\r?\n)/);
      if(m){
        title = m[1].trim();
        body = text.slice(m[0].length).replace(/^\r?\n/,'');
      }else{
        title = name;
      }
    }else{
      // .txt : 1行目をタイトル、2行目以降を本文
      title = (lines[0] || name).trim();
      body = lines.slice(1).join('\n').replace(/^\r?\n/,'');
    }
    var memo = {
      id: newId(), title: title, body: body,
      style: Object.assign({}, DEFAULT_STYLE),
      pinned: false,
      createdAt: Date.now(), updatedAt: Date.now()
    };
    var arr2 = loadList();
    arr2.unshift(memo);
    saveList(arr2);
    renderList();
    alert('「' + title + '」を読み込みました');
  };
  reader.readAsText(file, 'utf-8');
}

// ============================================================
// 音読
// ============================================================
function speak(){
  if(!('speechSynthesis' in window)){
    alert('お使いのブラウザは音読に対応していません');
    return;
  }
  pullCurrentFromUI();
  var text = (current.title || '') + '。' + (current.body || '');
  // マークダウン記号を除去
  text = text
    .replace(/^#+\s+/gm, '')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/==([^=]+)==/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/^[->]\s*/gm, '')
    .replace(/---+/g, '')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
  if(!text.trim()){ alert('読み上げる内容がありません'); return; }
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 1.05;
  u.pitch = 1.0;
  speechSynthesis.speak(u);
  flashBtn('speakBtn', '🔊 再生中');
}

// タブ切替
// ============================================================
function switchTab(name){
  document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('on', x.dataset.tab === name); });
  document.querySelectorAll('.pane').forEach(function(x){ x.classList.toggle('on', x.id === 'pane-'+name); });
  if(name === 'list') renderList();
  if(name === 'style') syncStyleUI();
}

});

  if(f) importFile(f);
  this.value = '';
});

// 自動保存（タイトル/本文の変更で5秒後に保存）
var autoTimer = null;
function scheduleAutoSave(){
  if(autoTimer) clearTimeout(autoTimer);
  autoTimer = setTimeout(function(){
    pullCurrentFromUI();
    if(current.title.trim() || current.body.trim()){
      current.updatedAt = Date.now();
      var arr = loadList();
      var idx = arr.findIndex(function(x){ return x.id === current.id; });
      if(idx >= 0) arr[idx] = Object.assign({}, current);
      else arr.unshift(Object.assign({}, current));
      saveList(arr);
    }
  }, 5000);
}
document.getElementById('titleInput').addEventListener('input', scheduleAutoSave);
document.getElementById('bodyInput').addEventListener('input', scheduleAutoSave);

current = loadCurrentMemo();

pushCurrentToUI();
