<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBS テロップ操作</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111;color:#f5f5f5;font-family:"Yu Gothic","Meiryo",sans-serif}.wrap{padding:14px}h1{font-size:18px;margin:0 0 12px}label{display:block;font-size:12px;color:#aaa;margin:12px 0 6px}input[type=text]{width:100%;border:1px solid #3a3a3a;background:#1c1c1c;color:#fff;border-radius:7px;padding:10px;font:inherit}.editor{min-height:68px;border:1px solid #3a3a3a;background:#1c1c1c;color:#fff;border-radius:7px;padding:10px;outline:none;white-space:pre-wrap}.editor:focus,input:focus{border-color:#53fc18}.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px}.c{width:29px;height:29px;border:2px solid #555;border-radius:6px;padding:0;cursor:pointer}.picker{width:35px;height:29px}.clear{background:#333;color:#fff;padding:7px 9px}.hint{font-size:11px;color:#888;margin-top:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}button{border:0;border-radius:7px;font-weight:800;cursor:pointer}.save,.reset{padding:11px}.save{background:#53fc18;color:#071007}.reset{background:#333;color:#fff}.status{margin-top:10px;font-size:12px;color:#9cff77;min-height:18px}.defaults{margin-top:14px;padding:10px;border:1px solid #2c2c2c;border-radius:7px;background:#171717;font-size:11px;color:#888;line-height:1.6}</style></head>
<body><div class="wrap"><h1>テロップ文字・部分色変更</h1><label>KICK ID</label><input type="text" id="kick_id">
<label>テロップ 1</label><div id="message1" class="editor" contenteditable="true"></div><div class="toolbar" data-e="message1"></div>
<label>テロップ 2</label><div id="message2" class="editor" contenteditable="true"></div><div class="toolbar" data-e="message2"></div>
<div class="hint">色を変えたい文字をドラッグ選択 → 色を押す →「反映」。空欄なら元のデフォルト文字・色に戻ります。</div>
<div class="row"><button class="save" id="save">反映</button><button class="reset" id="reset">初期値に戻す</button></div><div class="status" id="status"></div><div class="defaults" id="defaults"></div></div>
<script>
const $=i=>document.getElementById(i), colors=['#ffffff','#ff3030','#ffd400','#53fc18','#35a7ff'];let range=null,editor=null;
document.querySelectorAll('.toolbar').forEach(tb=>{colors.forEach(col=>{let b=document.createElement('button');b.className='c';b.style.background=col;b.dataset.color=col;b.onmousedown=e=>e.preventDefault();b.onclick=()=>paint(tb.dataset.e,col);tb.appendChild(b)});let p=document.createElement('input');p.type='color';p.className='picker';p.value='#ff3030';p.oninput=()=>paint(tb.dataset.e,p.value);tb.appendChild(p);let x=document.createElement('button');x.className='clear';x.textContent='色解除';x.onmousedown=e=>e.preventDefault();x.onclick=()=>{restore(tb.dataset.e);document.execCommand('removeFormat')};tb.appendChild(x)});
document.querySelectorAll('.editor').forEach(ed=>['mouseup','keyup','focus'].forEach(ev=>ed.addEventListener(ev,()=>{let s=getSelection();if(s.rangeCount){range=s.getRangeAt(0).cloneRange();editor=ed.id}})));
function restore(id){$(id).focus();if(range&&editor===id){let s=getSelection();s.removeAllRanges();s.addRange(range)}}
function paint(id,c){restore(id);document.execCommand('styleWithCSS',false,true);document.execCommand('foreColor',false,c)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function load(){let d=await(await fetch('/api/telop?'+Date.now(),{cache:'no-store'})).json();$('kick_id').value=d.overrides.kick_id||'';$('message1').innerHTML=d.overrides.message1_html||esc(d.overrides.message1||'');$('message2').innerHTML=d.overrides.message2_html||esc(d.overrides.message2||'');$('defaults').innerHTML='<b>デフォルト</b><br>KICK ID：'+esc(d.defaults.kick_id)+'<br>① '+esc(d.defaults.message1)+'<br>② '+esc(d.defaults.message2)}
$('save').onclick=async()=>{let a=$('message1'),b=$('message2');let body={kick_id:$('kick_id').value,message1:a.innerText.trim(),message2:b.innerText.trim(),message1_html:a.innerText.trim()?a.innerHTML:'',message2_html:b.innerText.trim()?b.innerHTML:''};let r=await fetch('/api/telop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('status').textContent=r.ok?'反映しました':'反映に失敗しました';setTimeout(()=>$('status').textContent='',1500)}
$('reset').onclick=async()=>{await fetch('/api/telop/reset',{method:'POST'});await load();$('status').textContent='デフォルトに戻しました';setTimeout(()=>$('status').textContent='',1500)};load().catch(()=>$('status').textContent='サーバーに接続できません');
</script></body></html>
