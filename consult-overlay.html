<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,"Noto Sans JP",sans-serif;color:#fff}
#toasts{position:absolute;right:28px;top:28px;width:430px;display:flex;flex-direction:column;gap:10px;z-index:50}.toast{transform:translateX(130%);opacity:0;background:#151d22f3;border:1px solid #39464e;border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 16px 45px #0009;transition:.34s cubic-bezier(.2,.8,.2,1)}.toast.show{transform:translateX(0);opacity:1}.icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#27333a;font-size:25px}.toast.call{border-color:#5bdd42}.toast.urgent{border-color:#ff5555}.title{font-size:18px;font-weight:900}.sub{font-size:12px;color:#a9b6bc;margin-top:3px}
#panel{position:absolute;right:40px;bottom:40px;width:520px;height:520px;background:#11181df3;border:1px solid #354149;border-radius:20px;box-shadow:0 20px 60px #0009;display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateX(100px);transition:.34s}.showPanel{opacity:1!important;transform:translateX(0)!important}.head{padding:13px 16px;border-bottom:1px solid #303a41;display:flex;justify-content:space-between}.scroll{flex:1;overflow-y:auto;padding:16px}.m{margin:0 0 13px}.m.admin{text-align:right}.meta{font-size:10px;color:#96a3aa}.b{display:inline-block;max-width:88%;padding:10px 12px;background:#202a30;border-radius:14px 14px 14px 4px;font-size:20px;line-height:1.5;font-weight:700}.m.admin .b{background:#283526;border-left:3px solid #65dc45;border-radius:14px 14px 4px 14px}
</style></head><body><div id="toasts"></div><div id="panel"><div class="head"><b id="pt"></b><span id="tag"></span></div><div id="scroll" class="scroll"></div></div><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id);let seen=0,callId=0,lastBroadcast='',cfg={position:'right',width:520,height:520,fontSize:20,offsetX:40,offsetY:40};
function esc(s){return String(s||'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}
function toast(d){if(d.id&&d.id<=seen)return;if(d.id)seen=Math.max(seen,d.id);const e=document.createElement('div');e.className='toast '+(d.kind||'');const icon=d.kind==='call'?'📞':d.kind==='urgent'?'🔥':d.kind==='info'?'📎':d.kind==='reply'?'💬':'🔔';e.innerHTML=`<div class="icon">${icon}</div><div><div class="title">${esc(d.title)}</div><div class="sub">${esc((d.name||'')+' '+(d.consultNo||''))}</div></div>`;$('toasts').prepend(e);requestAnimationFrame(()=>e.classList.add('show'));if(d.kind!=='call')setTimeout(()=>{e.classList.remove('show');setTimeout(()=>e.remove(),400)},5200)}
function setCall(c){document.querySelectorAll('.toast.call').forEach(x=>x.remove());if(c)toast({...c,kind:'call',title:'相談者から着信'})}
function apply(c){cfg={...cfg,...(c||{})};const p=$('panel');p.style.width=cfg.width+'px';p.style.height=cfg.height+'px';p.style.bottom=cfg.offsetY+'px';p.style.left='auto';p.style.right='auto';if(cfg.position==='left')p.style.left=cfg.offsetX+'px';else if(cfg.position==='center')p.style.left='calc(50% - '+(cfg.width/2)+'px)';else p.style.right=cfg.offsetX+'px';document.querySelectorAll('.b').forEach(x=>x.style.fontSize=cfg.fontSize+'px')}
function showBroadcast(d){if(!d)return clearBroadcast();lastBroadcast=JSON.stringify([d.id,d.at,(d.messages||[]).length]);$('pt').textContent=d.consultNo;$('tag').textContent=(d.type==='info'?'情報提供':'相談')+' / '+d.category;$('scroll').innerHTML=(d.messages||[]).map(m=>`<div class="m ${m.sender==='admin'?'admin':''}"><div class="meta">${esc(m.name)} ・ ${new Date(m.createdAt).toLocaleTimeString('ja-JP')}</div><div class="b" style="font-size:${cfg.fontSize}px">${esc(m.text)}</div></div>`).join('');$('panel').classList.add('showPanel');$('scroll').scrollTop=$('scroll').scrollHeight}
function clearBroadcast(){$('panel').classList.remove('showPanel');lastBroadcast=''}
const s=io({transports:['websocket','polling'],reconnection:true});s.on('connect',()=>s.emit('join:overlay',{},ack=>{if(ack?.ok){const st=ack.state;apply(st.config);(st.notifications||[]).forEach(toast);setCall(st.call);if(st.broadcast)showBroadcast(st.broadcast)}}));s.on('overlay:notification',toast);s.on('overlay:call',setCall);s.on('overlay:call-clear',()=>setCall(null));s.on('overlay:broadcast',showBroadcast);s.on('overlay:broadcast-clear',clearBroadcast);s.on('overlay:config',apply);
async function poll(){try{const d=await fetch('/api/overlay/state?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());apply(d.config);(d.notifications||[]).forEach(toast);setCall(d.call);const sig=d.broadcast?JSON.stringify([d.broadcast.id,d.broadcast.at,(d.broadcast.messages||[]).length]):'';if(d.broadcast&&sig!==lastBroadcast)showBroadcast(d.broadcast);if(!d.broadcast&&lastBroadcast)clearBroadcast()}catch{}}poll();setInterval(poll,1000);
</script></body></html>
