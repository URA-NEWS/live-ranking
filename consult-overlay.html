*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,"Noto Sans JP",sans-serif;color:#fff}#toasts{position:absolute;right:24px;top:24px;width:410px;display:flex;flex-direction:column;gap:9px;z-index:50}.toast{transform:translateX(130%);opacity:0;background:#151d22f4;border:1px solid #38454c;border-radius:16px;padding:12px 14px;display:flex;gap:11px;align-items:center;box-shadow:0 15px 40px #0008;transition:.32s cubic-bezier(.2,.8,.2,1)}.toast.show{transform:translateX(0);opacity:1}.toast.urgent{border-color:#ff5555}.toast.call{border-color:#5bdd42}.ico{width:42px;height:42px;border-radius:13px;background:#263238;display:flex;align-items:center;justify-content:center;font-size:23px}.tt{font-size:16px;font-weight:900}.ts{font-size:11px;color:#aab6bc;margin-top:2px}
#panel{position:absolute;right:40px;bottom:40px;width:520px;height:520px;background:#12191ef4;border:1px solid #354149;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px #0009;opacity:0;transform:translateX(90px);transition:.32s}.show{opacity:1!important;transform:translateX(0)!important}.head{padding:12px 14px;border-bottom:1px solid #303a41}.scroll{flex:1;overflow:hidden!important;padding:14px;display:flex;flex-direction:column;gap:9px}.msg{max-width:88%}.msg.admin{align-self:flex-end;text-align:right}.msg.user{align-self:flex-start}.meta{font-size:9px;color:#93a0a7}.bubble{margin-top:3px;display:inline-block;background:#222c32;border-radius:13px 13px 13px 4px;padding:9px 11px;font-weight:700;line-height:1.5}.admin .bubble{background:#2a3828;border-left:3px solid #68dd49;border-radius:13px 13px 4px 13px}.system{align-self:center;background:#26322d;border-radius:999px;padding:5px 9px;font-size:10px;color:#ced7d2}.urgent{color:#ff7474;font-size:10px;font-weight:900}

.row{display:flex;align-items:flex-end;gap:7px;width:100%}.row.admin{justify-content:flex-end}.row.user{justify-content:flex-start}
.avatar{width:30px;height:30px;border-radius:50%;overflow:hidden;flex:0 0 30px;background:#dfe5e8;color:#53616a;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.row.admin .avatar{order:2}
.ovAttach{margin-top:5px}.ovAttach img{max-width:180px;max-height:120px;border-radius:8px;object-fit:cover;border:1px solid #48555d}
.callBanner{align-self:center;background:#1d3325;border:1px solid #57d643;color:#dff9d8;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900}

let seen=0,last='',cfg={position:'right',width:520,height:520,fontSize:20,offsetX:40,offsetY:40},callState=null,lastCallSig='';
function esc(s){return String(s||'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}
function toast(d){
 if(d.id&&d.id<=seen)return;if(d.id)seen=Math.max(seen,d.id);
 const e=document.createElement('div');e.className='toast '+(d.kind||'');
 const ico=d.kind==='urgent'?'🔥':d.kind==='call'?'📞':d.kind==='info'?'📎':'🔔';
 e.innerHTML=`<div class="ico">${ico}</div><div><div class="tt">${esc(d.title)}</div><div class="ts">${esc((d.name||'')+' '+(d.consultNo||''))}</div></div>`;
 $('toasts').prepend(e);requestAnimationFrame(()=>e.classList.add('show'));
 if(d.kind!=='call')setTimeout(()=>{e.classList.remove('show');setTimeout(()=>e.remove(),350)},5200)
}
function setCall(c){
 const sig=c?JSON.stringify([c.id,c.state,c.from,c.consultNo,c.name]):'none';
 if(sig===lastCallSig)return;
 lastCallSig=sig;callState=c;
 document.querySelectorAll('.toast.call').forEach(x=>x.remove());
 if(!c){if(last)refreshBroadcast();return}
 const title=c.state==='connected'?'📞 通話中':(c.from==='admin'?'📲 イコエルから発信中':'📞 相談者から着信');
 const e=document.createElement('div');e.className='toast call show';
 e.innerHTML=`<div class="ico">📞</div><div><div class="tt">${title}</div><div class="ts">${esc(c.name||'')} ${esc(c.consultNo||'')}</div></div>`;
 $('toasts').prepend(e);
 if(last)refreshBroadcast();
}
function apply(c){
 cfg={...cfg,...(c||{})};const p=$('panel');
 p.style.width=cfg.width+'px';p.style.height=cfg.height+'px';p.style.bottom=cfg.offsetY+'px';p.style.left='auto';p.style.right='auto';
 if(cfg.position==='left')p.style.left=cfg.offsetX+'px';else if(cfg.position==='center')p.style.left='calc(50% - '+cfg.width/2+'px)';else p.style.right=cfg.offsetX+'px';
 document.querySelectorAll('.bubble').forEach(x=>x.style.fontSize=cfg.fontSize+'px')
}
function attachmentHTML(conv,e){
 if(!e.attachments?.length)return '';
 return `<div class="ovAttach">${e.attachments.map(a=>{
   const url=`/api/overlay/attachment/${encodeURIComponent(conv)}/${encodeURIComponent(a.id)}`;
   return (a.mime||'').startsWith('image/')?`<img src="${url}" alt="${esc(a.name)}">`:`<div>📎 ${esc(a.name)}</div>`;
 }).join('')}</div>`
}
function show(d){
 if(!d)return clear();last=JSON.stringify([d.id,d.at,(d.events||[]).length]);$('head').textContent=d.consultNo+' チャット';
 const html=[];
 if(callState?.state==='connected')html.push('<div class="callBanner">📞 通話中</div>');
 for(const e of (d.events||[])){
   if(e.kind==='call'){
     const label=e.from==='admin'?'📲 発信':'📞 着信',st=e.status==='connected'?'通話':e.status==='rejected'?'拒否':e.status==='ended'?'切断':'呼出中';
     html.push(`<div class="system">${label} ・ ${st} ・ ${new Date(e.time).toLocaleString('ja-JP')}</div>`);continue;
   }
   const adm=e.sender==='admin';
   html.push(`<div class="row ${adm?'admin':'user'}"><div class="avatar">${adm?`<img src="${ICON}">`:'相談者'}</div><div class="msg ${adm?'admin':'user'}">${e.urgent?'<div class="urgent">🔥 緊急</div>':''}<div class="meta">${esc(e.name)} ・ ${new Date(e.time).toLocaleTimeString('ja-JP')}</div><div class="bubble" style="font-size:${cfg.fontSize}px">${esc(e.text||((e.attachments||[]).length?'📎 添付ファイル':''))}</div>${attachmentHTML(d.id,e)}</div></div>`);
 }
 $('scroll').innerHTML=html.join('');$('panel').classList.add('show');
 requestAnimationFrame(()=>{const sc=$('scroll');sc.scrollTop=sc.scrollHeight})
}
function clear(){$('panel').classList.remove('show');last=''}
async function refreshBroadcast(){try{const d=await fetch('/api/overlay/state?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());if(d.broadcast)show(d.broadcast)}catch{}}
const s=io({transports:['websocket','polling'],reconnection:true});
s.on('connect',()=>s.emit('join:overlay',{},ack=>{if(ack?.ok){const st=ack.state;apply(st.config);(st.notifications||[]).forEach(toast);setCall(st.call);if(st.broadcast)show(st.broadcast)}}));
s.on('overlay:notification',toast);s.on('overlay:call',setCall);s.on('overlay:call-clear',()=>setCall(null));s.on('overlay:broadcast',show);s.on('overlay:broadcast-clear',clear);s.on('overlay:config',apply);
async function poll(){
 try{
  const d=await fetch('/api/overlay/state?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());
  apply(d.config);(d.notifications||[]).forEach(toast);setCall(d.call);
  const sig=d.broadcast?JSON.stringify([d.broadcast.id,d.broadcast.at,(d.broadcast.events||[]).length]):'';
  if(d.broadcast&&sig!==last)show(d.broadcast);else if(d.broadcast&&callState?.state==='connected')show(d.broadcast);
  if(!d.broadcast&&last)clear()
 }catch{}
}
poll();setInterval(poll,1000);
</script></body></html>
