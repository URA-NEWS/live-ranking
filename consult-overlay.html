<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,"Noto Sans JP",sans-serif;color:#fff}#toasts{position:absolute;right:24px;top:24px;width:410px;display:flex;flex-direction:column;gap:9px;z-index:50}.toast{transform:translateX(130%);opacity:0;background:#151d22f4;border:1px solid #38454c;border-radius:16px;padding:12px 14px;display:flex;gap:11px;align-items:center;box-shadow:0 15px 40px #0008;transition:.32s cubic-bezier(.2,.8,.2,1)}.toast.show{transform:translateX(0);opacity:1}.toast.urgent{border-color:#ff5555}.toast.call{border-color:#5bdd42}.ico{width:42px;height:42px;border-radius:13px;background:#263238;display:flex;align-items:center;justify-content:center;font-size:23px}.tt{font-size:16px;font-weight:900}.ts{font-size:11px;color:#aab6bc;margin-top:2px}
#panel{position:absolute;right:40px;bottom:40px;width:520px;height:520px;background:#12191ef4;border:1px solid #354149;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px #0009;opacity:0;transform:translateX(90px);transition:.32s}.show{opacity:1!important;transform:translateX(0)!important}.head{padding:12px 14px;border-bottom:1px solid #303a41}.scroll{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px}.msg{max-width:88%}.msg.admin{align-self:flex-end;text-align:right}.msg.user{align-self:flex-start}.meta{font-size:9px;color:#93a0a7}.bubble{margin-top:3px;display:inline-block;background:#222c32;border-radius:13px 13px 13px 4px;padding:9px 11px;font-weight:700;line-height:1.5}.admin .bubble{background:#2a3828;border-left:3px solid #68dd49;border-radius:13px 13px 4px 13px}.system{align-self:center;background:#26322d;border-radius:999px;padding:5px 9px;font-size:10px;color:#ced7d2}.urgent{color:#ff7474;font-size:10px;font-weight:900}
</style></head><body><div id="toasts"></div><div id="panel"><div id="head" class="head"></div><div id="scroll" class="scroll"></div></div><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id);let seen=0,callId=0,last='',cfg={position:'right',width:520,height:520,fontSize:20,offsetX:40,offsetY:40};function esc(s){return String(s||'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}
function toast(d){if(d.id&&d.id<=seen)return;if(d.id)seen=Math.max(seen,d.id);const e=document.createElement('div');e.className='toast '+(d.kind||'');const ico=d.kind==='urgent'?'🔥':d.kind==='call'?'📞':d.kind==='info'?'📎':'🔔';e.innerHTML=`<div class="ico">${ico}</div><div><div class="tt">${esc(d.title)}</div><div class="ts">${esc((d.name||'')+' '+(d.consultNo||''))}</div></div>`;$('toasts').prepend(e);requestAnimationFrame(()=>e.classList.add('show'));if(d.kind!=='call')setTimeout(()=>{e.classList.remove('show');setTimeout(()=>e.remove(),350)},5200)}
function call(c){document.querySelectorAll('.toast.call').forEach(x=>x.remove());if(c)toast({...c,kind:'call',title:'相談者から着信'})}
function apply(c){cfg={...cfg,...(c||{})};const p=$('panel');p.style.width=cfg.width+'px';p.style.height=cfg.height+'px';p.style.bottom=cfg.offsetY+'px';p.style.left='auto';p.style.right='auto';if(cfg.position==='left')p.style.left=cfg.offsetX+'px';else if(cfg.position==='center')p.style.left='calc(50% - '+cfg.width/2+'px)';else p.style.right=cfg.offsetX+'px';document.querySelectorAll('.bubble').forEach(x=>x.style.fontSize=cfg.fontSize+'px')}
function show(d){if(!d)return clear();last=JSON.stringify([d.id,d.at,(d.events||[]).length]);$('head').textContent=d.consultNo+' チャット';$('scroll').innerHTML=(d.events||[]).map(e=>{if(e.kind==='call'){const label=e.from==='admin'?'📲 発信':'📞 着信',st=e.status==='connected'?'通話':e.status==='rejected'?'拒否':e.status==='ended'?'切断':'呼出中';return `<div class="system">${label} ・ ${st} ・ ${new Date(e.time).toLocaleString('ja-JP')}</div>`}return `<div class="msg ${e.sender==='admin'?'admin':'user'}">${e.urgent?'<div class="urgent">🔥 緊急</div>':''}<div class="meta">${esc(e.name)} ・ ${new Date(e.time).toLocaleTimeString('ja-JP')}</div><div class="bubble" style="font-size:${cfg.fontSize}px">${esc(e.text)}</div></div>`}).join('');$('panel').classList.add('show');$('scroll').scrollTop=$('scroll').scrollHeight}function clear(){$('panel').classList.remove('show');last=''}
const s=io({transports:['websocket','polling'],reconnection:true});s.on('connect',()=>s.emit('join:overlay',{},ack=>{if(ack?.ok){const st=ack.state;apply(st.config);(st.notifications||[]).forEach(toast);call(st.call);if(st.broadcast)show(st.broadcast)}}));s.on('overlay:notification',toast);s.on('overlay:call',call);s.on('overlay:call-clear',()=>call(null));s.on('overlay:broadcast',show);s.on('overlay:broadcast-clear',clear);s.on('overlay:config',apply);
async function poll(){try{const d=await fetch('/api/overlay/state?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());apply(d.config);(d.notifications||[]).forEach(toast);call(d.call);const sig=d.broadcast?JSON.stringify([d.broadcast.id,d.broadcast.at,(d.broadcast.events||[]).length]):'';if(d.broadcast&&sig!==last)show(d.broadcast);if(!d.broadcast&&last)clear()}catch{}}poll();setInterval(poll,1000);
</script></body></html>
