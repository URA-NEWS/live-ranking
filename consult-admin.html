<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>イコエル相談管理</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Noto Sans JP",sans-serif;background:#edf1f4;color:#182128}button,input,select,textarea{font:inherit}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#eef1f4;z-index:100}#loginBox{background:#fff;border:1px solid #dce3e7;border-radius:20px;padding:20px;width:320px;box-shadow:0 20px 50px #0001}#login input{width:100%;padding:12px;border:1px solid #d9e0e4;border-radius:12px;margin:10px 0}button{border:0;border-radius:999px;padding:8px 12px;font-weight:900;cursor:pointer}.dark{background:#1e292f;color:#fff}.green{background:#77df4a;color:#12330b}.gray{background:#edf1f3;color:#53616a}.gold{background:#fff0c8;color:#8b5c00}.red{background:#ffe6ea;color:#b92b3d}
#app{display:none;height:100vh}header{height:54px;background:#fff;border-bottom:1px solid #dce3e7;display:flex;align-items:center;justify-content:space-between;padding:0 12px}.tabs{height:48px;background:#f8fafb;border-bottom:1px solid #dce3e7;display:flex;gap:6px;align-items:center;padding:5px 8px;overflow:auto}.tab{white-space:nowrap}.tab.active{background:#20292f;color:#fff}
.main{height:calc(100vh - 102px);display:grid;grid-template-columns:360px 1fr}#list{overflow:auto;border-right:1px solid #d9e1e5;background:#f6f8f9}.item{padding:12px;border-bottom:1px solid #e2e7ea;background:#fff;cursor:pointer}.item.active{background:#eef8ea;border-left:4px solid #77dc4b}.itemTop{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#718087}.itemName{font-size:14px;font-weight:900;margin:5px 0}.preview{font-size:12px;color:#5d6a72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#42d62d;box-shadow:0 0 8px #42d62d;margin-right:5px}
#detail{overflow:auto;padding:12px 16px;background:#eef1f4}.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#829099}.panel{background:#fff;border:1px solid #dce3e7;border-radius:20px;margin-bottom:12px;padding:12px;box-shadow:0 4px 16px #0000000c}.headRow{display:flex;justify-content:space-between;align-items:center;gap:10px}.name{font-size:20px;font-weight:900}.meta{font-size:11px;color:#77858c;margin-top:3px}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.voice{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px;padding:9px;border:1px solid #dce8d8;background:#f7fbf5;border-radius:15px}.online{font-size:11px;font-weight:900;margin-right:auto}.mic{max-width:220px;padding:7px;border:1px solid #d7dee2;border-radius:10px}.meter{width:80px;height:8px;border-radius:999px;background:#dde5e1;overflow:hidden}.meter i{display:block;width:0;height:100%;background:linear-gradient(90deg,#48d735,#e8b532,#e95050)}.vol{width:90px}
.chat{padding:14px;min-height:300px;display:flex;flex-direction:column;gap:10px}.msg{display:flex;align-items:flex-end;gap:8px;width:100%}.msg.user{justify-content:flex-start}.msg.admin{justify-content:flex-end}.av{width:36px;height:36px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#dfe5e8;font-size:10px;font-weight:900;flex:0 0 36px}.av img{width:100%;height:100%;object-fit:cover}.msg.admin .av{order:2}.bubble{max-width:72%;padding:10px 13px}.msg.user .bubble{background:#fff;border:1px solid #dde3e6;border-radius:18px 18px 18px 5px}.msg.admin .bubble{background:#8de055;border-radius:18px 18px 5px 18px;color:#14220d}.mmeta{font-size:10px;color:#758188;margin-bottom:4px}.mtext{font-size:14px;line-height:1.55;font-weight:600;white-space:pre-wrap}.system{align-self:center;padding:6px 10px;border-radius:999px;background:#e5ebe8;color:#59675f;font-size:10px;font-weight:900}
.reply textarea{width:100%;min-height:85px;border:1px solid #d9e0e4;background:#f9fbfc;border-radius:16px;padding:12px;resize:vertical}.reply input[type=file]{margin-top:7px}.overlayGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.overlayGrid label{font-size:10px;color:#617078}.overlayGrid input{width:100%}
@media(max-width:800px){.main{grid-template-columns:1fr}#list.hide{display:none}#detail{display:none}#detail.show{display:block}}
</style></head><body>

const $=id=>document.getElementById(id);let KEY=localStorage.consultAdminKey||'',socket=null,items=[],cur=null,tab='inbox',draft='',selectedFiles=[],pc=null,localStream=null,remoteAudio=null,pendingOffer=null,pendingIce=[],ringTimer=null,audioCtx=null,callState='idle',muted=false,micPreview=null,micCtx=null,micAnalyser=null,micRAF=null;

const tabs=[['inbox','受信箱'],['in_progress','対応中'],['resolved','対応済み'],['starred','★重要'],['archived','アーカイブ'],['blocked','ブロック']];
function esc(s){return String(s||'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function dt(s){return new Date(s).toLocaleString('ja-JP')}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-key':KEY};const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'エラー');return d}
function renderTabs(counts={}){$('tabs').innerHTML=tabs.map(([k,n])=>`<button class="tab ${tab===k?'active':''}" onclick="switchTab('${k}')">${n} ${counts[k==='in_progress'?'inProgress':k]||0}</button>`).join('')}
async function loadList(){const d=await api('/api/admin/list?tab='+tab);items=d.conversations;$('unread').textContent=d.unreadCount;renderTabs(d.counts);renderList();if(cur){const f=items.find(x=>x.id===cur.id);if(f)cur={...cur,...f}}}
function renderList(){$('list').innerHTML=items.map(c=>{const last=c.messages?.[c.messages.length-1];return `<div class="item ${cur?.id===c.id?'active':''}" onclick="openConv('${c.id}')"><div class="itemTop"><span>${c.consultNo}</span><span>${dt(c.updatedAt)}</span></div><div class="itemName">${c.userOnline?'<span class="dot"></span>':''}${esc(c.displayName||'匿名')}</div><div class="preview">${esc(last?.text||'（添付）')}</div></div>`}).join('')}
async function openConv(id){const d=await api('/api/admin/'+id);cur=d.conversation;draft='';selectedFiles=[];renderList();renderDetail();startPresencePoll();startCallPoll();if(socket)socket.emit('join:admin',{key:KEY});await api(`/api/admin/${id}/read`,{method:'POST'}).catch(()=>{})}
function timeline(c){const e=[];(c.messages||[]).forEach(m=>e.push({k:'m',t:m.createdAt,d:m}));(c.callHistory||[]).forEach(x=>e.push({k:'c',t:x.startedAt,d:x}));return e.sort((a,b)=>new Date(a.t)-new Date(b.t))}
function callHtml(x){const label=x.from==='admin'?'📲 発信':'📞 着信',st=x.status==='connected'?'通話':x.status==='rejected'?'拒否':x.status==='ended'?'切断':'呼出中';return `<div class="system">${label} ・ ${st} ・ ${dt(x.startedAt)}</div>`}
function chatHtml(c){return timeline(c).map(e=>{if(e.k==='c')return callHtml(e.d);const m=e.d,adm=m.sender==='admin';return `<div class="msg ${adm?'admin':'user'}"><div class="av">${adm?`<img src="${ICON}">`:'相談者'}</div><div class="bubble"><div class="mmeta">${adm?'イコエル':esc(c.displayName||'匿名')} ・ ${dt(m.createdAt)}</div><div class="mtext">${esc(m.text)}</div></div></div>`}).join('')}
function renderDetail(){if(!cur)return;$('detail').classList.add('show');$('list').classList.add('hide');$('detail').innerHTML=`<div class="panel"><button class="gray" onclick="back()">← 戻る</button><div class="headRow"><div><div class="name">${cur.consultNo} ${esc(cur.displayName||'匿名')}</div><div class="meta">${dt(cur.createdAt)} / ${esc(cur.category)} / ${esc(cur.permission)}</div></div><span>${cur.status}</span></div><div class="actions"><button class="gray" onclick="status('new')">未対応</button><button class="gold" onclick="status('in_progress')">対応中</button><button class="green" onclick="status('resolved')">対応済み</button><button class="gold" onclick="star()">☆重要</button><button class="gray" onclick="archive()">アーカイブ</button><button class="red" onclick="block()">ブロック</button></div><div class="voice"><span id="online" class="online">${cur.userOnline?'● 相談者オンライン':'○ 相談者オフライン'}</span><select id="mic" class="mic"><option value="">既定のマイク</option></select><button class="gray" id="micTest">🎙 マイク確認</button><div class="meter"><i id="meterBar"></i></div><span id="meterPct" style="font-size:10px">0%</span><span>🔊</span><input id="volume" class="vol" type="range" min="0" max="150" value="${localStorage.callVolume||100}"><button class="dark" id="callBtn">📞 通話する</button><button class="gray hidden" id="muteBtn">🎤 マイクON</button><button class="red hidden" id="hangBtn">終了</button></div><div id="callLabel" style="font-size:11px;font-weight:900;margin-top:6px"></div><div id="incomingBox" class="panel" style="display:none;background:#fff3d9"><b>📞 相談者から着信</b><div class="actions"><button class="green" id="answerBtn">応答</button><button class="red" id="rejectBtn">拒否</button></div></div></div><div class="panel chat">${chatHtml(cur)}</div><div class="panel reply"><b>返信</b><textarea id="replyText" placeholder="メッセージを入力">${esc(draft)}</textarea><input id="replyFiles" type="file" multiple accept="image/*,video/*,audio/*"><div style="margin-top:8px"><button class="dark" id="sendReply">返信する</button></div></div><div class="panel"><b>配信で取り上げる</b><div class="actions"><button class="green" id="showBroadcast">チャットを配信表示</button><button class="gray" id="clearBroadcast">表示を消す</button></div><div class="overlayGrid"><label>横幅<input id="ow" type="range" min="280" max="1200" value="520"></label><label>高さ<input id="oh" type="range" min="220" max="1000" value="520"></label><label>文字<input id="of" type="range" min="14" max="42" value="20"></label><label>横位置<input id="ox" type="range" min="0" max="500" value="40"></label><label>縦位置<input id="oy" type="range" min="0" max="500" value="40"></label></div><div class="actions"><button class="gray" onclick="saveOverlay('left')">左</button><button class="gray" onclick="saveOverlay('center')">中央</button><button class="gray" onclick="saveOverlay('right')">右</button></div></div>`;
 bindDetail();loadMics();loadOverlay()}
function back(){stopMicPreview();cur=null;$('detail').classList.remove('show');$('list').classList.remove('hide');$('detail').innerHTML='<div class="empty">相談を選択してください</div>';renderList()}
function bindDetail(){$('replyText').oninput=e=>draft=e.target.value;$('replyFiles').onchange=e=>selectedFiles=[...e.target.files];$('sendReply').onclick=sendReply;$('callBtn').onclick=callUser;$('micTest').onclick=()=>micPreview?stopMicPreview():startMicPreview();$('muteBtn').onclick=toggleMute;$('hangBtn').onclick=()=>endCall(true);$('answerBtn').onclick=answer;$('rejectBtn').onclick=reject;$('volume').oninput=e=>{localStorage.callVolume=e.target.value;if(remoteAudio)remoteAudio.volume=Math.min(1,Number(e.target.value)/100)};$('showBroadcast').onclick=()=>api(`/api/admin/${cur.id}/broadcast`,{method:'POST'});$('clearBroadcast').onclick=()=>api('/api/admin/broadcast-clear',{method:'POST'})}
function switchTab(t){tab=t;cur=null;loadList()}async function status(s){await api(`/api/admin/${cur.id}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});cur.status=s;renderDetail();loadList()}async function star(){await api(`/api/admin/${cur.id}/star`,{method:'POST'});loadList()}async function archive(){await api(`/api/admin/${cur.id}/archive`,{method:'POST'});back();loadList()}async function block(){await api(`/api/admin/${cur.id}/block`,{method:'POST'});loadList()}
async function sendReply(){const fd=new FormData();fd.append('text',draft);selectedFiles.forEach(f=>fd.append('files',f));const d=await api(`/api/admin/${cur.id}/reply`,{method:'POST',body:fd});cur=d.conversation;draft='';selectedFiles=[];renderDetail();loadList()}
function connect(){if(socket)socket.disconnect();socket=io({transports:['websocket','polling'],reconnection:true});socket.on('connect',()=>socket.emit('join:admin',{key:KEY},ack=>{if(!ack?.ok)return}));socket.on('conversation:new',()=>loadList());socket.on('conversation:update',d=>{const i=items.findIndex(x=>x.id===d.conversation.id);if(i>=0)items[i]=d.conversation;if(cur?.id===d.conversation.id){const editing=document.activeElement?.id==='replyText';cur={...cur,...d.conversation};if(!editing)renderDetail()}renderList()});socket.on('presence:update',p=>{const i=items.findIndex(x=>x.id===p.id);if(i>=0)items[i].userOnline=p.online;if(cur?.id===p.id){cur.userOnline=p.online;const e=$('online');if(e)e.textContent=p.online?'● 相談者オンライン':'○ 相談者オフライン'}renderList()});socket.on('voice:signal',s=>{if(cur?.id===s.id)handleSignal(s)})}
let presenceTimer=null,callPollTimer=null;function startPresencePoll(){clearInterval(presenceTimer);presenceTimer=setInterval(async()=>{if(!cur)return;try{const d=await api(`/api/admin/${cur.id}/presence?t=${Date.now()}`);cur.userOnline=d.online;const e=$('online');if(e)e.textContent=d.online?'● 相談者オンライン':'○ 相談者オフライン'}catch{}},1000)}function startCallPoll(){clearInterval(callPollTimer);callPollTimer=setInterval(async()=>{if(!cur)return;try{const d=await api(`/api/admin/${cur.id}/call-state?t=${Date.now()}`);handleCallState(d.state)}catch{}},1000)}
async function loadMics(){const s=$('mic');if(!s||!navigator.mediaDevices)return;try{let ds=await navigator.mediaDevices.enumerateDevices(),m=ds.filter(d=>d.kind==='audioinput');if(!m.length||m.every(x=>!x.label)){try{const t=await navigator.mediaDevices.getUserMedia({audio:true});t.getTracks().forEach(x=>x.stop());ds=await navigator.mediaDevices.enumerateDevices();m=ds.filter(d=>d.kind==='audioinput')}catch{}}const saved=localStorage.micId||'';s.innerHTML='<option value="">既定のマイク</option>'+m.map((d,i)=>`<option value="${d.deviceId}">${esc(d.label||'マイク '+(i+1))}</option>`).join('');s.value=[...s.options].some(o=>o.value===saved)?saved:'';s.onchange=()=>{localStorage.micId=s.value;if(micPreview)startMicPreview()}}catch{}}
function stopMicPreview(){if(micPreview)micPreview.getTracks().forEach(t=>t.stop());micPreview=null;if(micRAF)cancelAnimationFrame(micRAF);micRAF=null;const b=$('meterBar');if(b)b.style.width='0';const p=$('meterPct');if(p)p.textContent='0%';const x=$('micTest');if(x)x.textContent='🎙 マイク確認'}
async function getMic(){const id=localStorage.micId||'';const a={echoCancellation:true,noiseSuppression:true,autoGainControl:true};if(id)a.deviceId={ideal:id};return navigator.mediaDevices.getUserMedia({audio:a,video:false})}
async function startMicPreview(){try{stopMicPreview();micPreview=await getMic();startMeter(micPreview);$('micTest').textContent='■ 確認停止'}catch(e){$('callLabel').textContent=e.name==='NotAllowedError'?'マイク権限がありません':e.name==='NotReadableError'?'マイクが他で使用中です':'マイクを使用できません ('+e.name+')'}}
function startMeter(stream){if(!micCtx)micCtx=new (window.AudioContext||window.webkitAudioContext)();micAnalyser=micCtx.createAnalyser();micAnalyser.fftSize=256;micCtx.createMediaStreamSource(stream).connect(micAnalyser);const a=new Uint8Array(micAnalyser.fftSize);const draw=()=>{micAnalyser.getByteTimeDomainData(a);let sum=0;for(const v of a){const x=(v-128)/128;sum+=x*x}const n=Math.min(100,Math.round(Math.sqrt(sum/a.length)*350));if($('meterBar'))$('meterBar').style.width=n+'%';if($('meterPct'))$('meterPct').textContent=n+'%';micRAF=requestAnimationFrame(draw)};draw()}
function unlock(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch{}}document.addEventListener('pointerdown',unlock,{passive:true});function beep(f,d=.18,delay=0,g=.14){unlock();if(!audioCtx)return;const o=audioCtx.createOscillator(),x=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.connect(x);x.connect(audioCtx.destination);o.frequency.value=f;x.gain.setValueAtTime(g,t);x.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.03)}function stopRing(){if(ringTimer)clearInterval(ringTimer);ringTimer=null}function ring(k){stopRing();const p=()=>{if(k==='incoming'){beep(900,.18,0,.16);beep(1080,.18,.25,.16)}else{beep(440,.25,0,.11);beep(520,.25,.35,.11)}};p();ringTimer=setInterval(p,1500)}function dropTone(){stopRing();beep(520,.13,0,.13);beep(320,.22,.15,.13)}
async function sig(type,data=null){return api(`/api/admin/${cur.id}/voice-signal`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,data})})}async function ensurePC(){if(pc)return;stopMicPreview();localStream=await getMic();startMeter(localStream);pc=new RTCPeerConnection(RTC);localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));remoteAudio=document.createElement('audio');remoteAudio.autoplay=true;remoteAudio.volume=Math.min(1,Number(localStorage.callVolume||100)/100);document.body.appendChild(remoteAudio);pc.ontrack=e=>remoteAudio.srcObject=e.streams[0];pc.onicecandidate=e=>{if(e.candidate)sig('ice',e.candidate)};pc.onconnectionstatechange=()=>{if(pc?.connectionState==='connected'){stopRing();callState='connected';label('通話中');$('callBtn').classList.add('hidden');$('muteBtn').classList.remove('hidden');$('hangBtn').classList.remove('hidden')}}}async function flushIce(){if(!pc?.remoteDescription)return;for(const c of pendingIce.splice(0))try{await pc.addIceCandidate(new RTCIceCandidate(c))}catch{}}function label(s){if($('callLabel'))$('callLabel').textContent=s}
async function callUser(){try{unlock();await ensurePC();ring('outgoing');label('発信中');await sig('call');const o=await pc.createOffer();await pc.setLocalDescription(o);await sig('offer',o)}catch(e){label('マイクを使用できません ('+e.name+')')}}async function answer(){try{stopRing();$('incomingBox').style.display='none';await ensurePC();if(pendingOffer){await pc.setRemoteDescription(new RTCSessionDescription(pendingOffer));await flushIce();const a=await pc.createAnswer();await pc.setLocalDescription(a);await sig('answer',a);pendingOffer=null}await sig('accept');label('通話中')}catch(e){label('接続失敗')}}async function reject(){stopRing();dropTone();await sig('reject');$('incomingBox').style.display='none';label('切断')}async function endCall(send=true){if(send)try{await sig('hangup')}catch{}dropTone();if(pc)pc.close();pc=null;if(localStream)localStream.getTracks().forEach(t=>t.stop());localStream=null;if(remoteAudio)remoteAudio.remove();remoteAudio=null;pendingOffer=null;pendingIce=[];if($('callBtn'))$('callBtn').classList.remove('hidden');if($('muteBtn'))$('muteBtn').classList.add('hidden');if($('hangBtn'))$('hangBtn').classList.add('hidden');label('切断')}function toggleMute(){muted=!muted;localStream?.getAudioTracks().forEach(t=>t.enabled=!muted);$('muteBtn').textContent=muted?'🔇 ミュート中':'🎤 マイクON'}async function handleSignal(s){if(s.type==='call'){ring('incoming');label('受信中');$('incomingBox').style.display='block'}if(s.type==='offer'){pendingOffer=s.data;ring('incoming');label('受信中');$('incomingBox').style.display='block'}if(s.type==='answer'){await ensurePC();if(!pc.remoteDescription){await pc.setRemoteDescription(new RTCSessionDescription(s.data));await flushIce()}}if(s.type==='ice'){await ensurePC();if(pc.remoteDescription)try{await pc.addIceCandidate(new RTCIceCandidate(s.data))}catch{}else pendingIce.push(s.data)}if(s.type==='reject'||s.type==='hangup')endCall(false)}function handleCallState(s){if(!s)return;if(s.state==='ringing'&&s.from==='user'){if(s.offer)pendingOffer=s.offer;if($('incomingBox')){$('incomingBox').style.display='block';ring('incoming');label('受信中')}}}
async function loadOverlay(){try{const d=await fetch('/api/overlay/config').then(r=>r.json());for(const [id,k] of [['ow','width'],['oh','height'],['of','fontSize'],['ox','offsetX'],['oy','offsetY']])if($(id))$(id).value=d[k]}catch{}}async function saveOverlay(position){await api('/api/admin/overlay-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({position,width:Number($('ow').value),height:Number($('oh').value),fontSize:Number($('of').value),offsetX:Number($('ox').value),offsetY:Number($('oy').value)})})}
$('loginBtn').onclick=async()=>{KEY=$('key').value;localStorage.consultAdminKey=KEY;try{await loadList();$('login').style.display='none';$('app').style.display='block';connect()}catch(e){alert(e.message)}};if(KEY){$('key').value=KEY;loadList().then(()=>{$('login').style.display='none';$('app').style.display='block';connect()}).catch(()=>{})}
</script></body></html>
