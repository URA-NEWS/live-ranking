<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>イコエル 相談管理</title>
<style>
:root{--bg:#eef2f4;--panel:#fff;--line:#d9e0e4;--text:#182025;--sub:#78868f;--lime:#55d73b;--dark:#20282d;--red:#ed4b5b;--gold:#d39a24}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,"Noto Sans JP","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}
body{overflow:hidden}.login{padding:18px}.login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}.login button{width:100%;margin-top:8px;padding:11px;border:0;border-radius:10px;background:var(--dark);color:#fff;font-weight:800}
.app{display:none;height:100%;grid-template-rows:auto auto 1fr}.head{background:#fff;border-bottom:1px solid var(--line);padding:10px 11px}.title{display:flex;justify-content:space-between;align-items:center;font-weight:900}.unread{background:var(--red);color:#fff;border-radius:999px;padding:3px 7px;font-size:11px}
.search{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:8px}.search input,.search select{min-width:0;padding:8px;border:1px solid var(--line);border-radius:9px;background:#f7f9fa}
.tabs{display:flex;gap:5px;overflow-x:auto;padding:8px;background:#f8fafb;border-bottom:1px solid var(--line)}.tab{white-space:nowrap;border:1px solid #dce3e7;background:#fff;border-radius:999px;padding:7px 9px;font-size:11px;font-weight:800;color:#60707a;cursor:pointer}.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}.count{opacity:.8;margin-left:3px}
.main{display:grid;grid-template-columns:minmax(230px,38%) 1fr;min-height:0}.list{overflow:auto;padding:8px;border-right:1px solid var(--line)}.item{background:#fff;border:1px solid #dce3e6;border-radius:12px;padding:10px;margin-bottom:7px;cursor:pointer}.item.unread{border-left:4px solid var(--red)}.item.selected{box-shadow:0 0 0 2px #76dd6230;border-color:#76d966}.iTop{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#83919a}.iName{font-size:14px;font-weight:900;margin:4px 0}.iTags{display:flex;gap:4px;flex-wrap:wrap}.tag{background:#eff3f5;color:#62717a;border-radius:999px;padding:3px 6px;font-size:10px}.tag.red{background:#fff0f2;color:#c73949}.tag.green{background:#edfaea;color:#34782d}.snippet{font-size:11px;color:#697881;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{overflow:auto;background:#f7f9fa;padding:10px}.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#87949b}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px}.dHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.dNo{font-weight:900;font-size:16px}.dMeta{font-size:11px;color:#83919a;margin-top:3px}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.btn{border:0;border-radius:9px;padding:7px 9px;font-weight:800;font-size:11px;cursor:pointer}.btn.dark{background:var(--dark);color:#fff}.btn.green{background:#eaf9e7;color:#2e7e25}.btn.gold{background:#fff5dd;color:#9b6c00}.btn.red{background:#fff0f2;color:#b82f40}.btn.gray{background:#edf1f3;color:#56656d}
.msg{display:flex;gap:8px;margin:11px 0}.msg.admin{flex-direction:row-reverse}.avatar{width:34px;height:34px;border-radius:50%;background:#e6ebed;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;flex:0 0 34px}.msg.admin .avatar{background:#20282d;color:#78ee5d}.bubble{max-width:80%;background:#f1f4f5;border-radius:13px 13px 13px 4px;padding:9px 11px}.msg.admin .bubble{background:#f3f8f1;border-left:3px solid #59d23f;border-radius:13px 13px 4px 13px}.mMeta{font-size:10px;color:#819099;margin-bottom:4px}.mText{font-size:14px;font-weight:650;line-height:1.5;white-space:pre-wrap}
.attachments{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.att{border:1px solid #dce3e6;background:#f8fafb;border-radius:8px;padding:5px;max-width:230px}.att img{width:210px;max-height:140px;object-fit:cover;border-radius:6px;cursor:zoom-in}.att video{width:210px;max-height:150px}.att audio{width:210px}.attName{font-size:9px;color:#74828a;margin-top:4px;word-break:break-all}.att a{font-size:10px;color:#2d7897}
.reply textarea,.broadcast textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;resize:vertical}.fileInput{width:100%;padding:7px;border:1px dashed #cfd8dc;border-radius:9px;background:#f8fafb;margin-top:6px}.fileQueue{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.fileChip{font-size:9px;padding:5px 6px;border-radius:8px;background:#eef3f5}.fileChip button{border:0;background:transparent;font-weight:900;cursor:pointer}.template{display:flex;gap:5px;margin:6px 0}.template select{flex:1;min-width:0}.preview{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:99;padding:20px}.preview.show{display:flex}.preview img{max-width:95vw;max-height:92vh}
@media(max-width:720px){.main{grid-template-columns:1fr}.list{border-right:0}.detail{display:none}.detail.mobileShow{display:block;position:fixed;inset:0;z-index:40}.list.mobileHide{display:none}}
</style>
</head>
<body>
<div id="login" class="login"><b>管理キー</b><input id="key" type="password"><button id="loginBtn">開く</button><div id="loginErr"></div></div>
<div id="app" class="app">
  <div class="head">
    <div class="title"><span>イコエル相談管理</span><span class="unread" id="unread">0</span></div>
    <div class="search"><input id="q" placeholder="相談番号・名前・本文を検索"><select id="type"><option value="">全種類</option><option value="consult">相談</option><option value="info">情報提供</option></select><select id="category"><option value="">全カテゴリ</option><option>配信</option><option>活動者</option><option>事件・トラブル</option><option>その他</option></select></div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="new">受信箱 <span class="count" id="cNew">0</span></button>
    <button class="tab" data-tab="in_progress">対応中 <span class="count" id="cProgress">0</span></button>
    <button class="tab" data-tab="resolved">対応済み <span class="count" id="cResolved">0</span></button>
    <button class="tab" data-tab="starred">★重要 <span class="count" id="cStarred">0</span></button>
    <button class="tab" data-tab="archived">アーカイブ <span class="count" id="cArchived">0</span></button>
    <button class="tab" data-tab="blocked">ブロック <span class="count" id="cBlocked">0</span></button>
  </div>
  <div class="main">
    <div id="list" class="list"></div>
    <div id="detail" class="detail"><div class="empty">相談を選択してください</div></div>
  </div>
</div>
<div id="preview" class="preview" onclick="this.classList.remove('show')"><img id="previewImg"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dt=s=>new Date(s).toLocaleString('ja-JP');
let KEY=localStorage.consultAdminKey||'',tab='new',items=[],cur=null,es=null,templates=[],replyFiles=[];
function headers(){return {'Content-Type':'application/json','x-admin-key':KEY}}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-key':KEY};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'エラー');return j}
function statusText(s){return s==='resolved'?'対応済み':s==='in_progress'?'対応中':'未対応'}
function permText(p){return p==='allow'?'掲載OK':p==='anonymous_only'?'匿名掲載のみ':p==='ask'?'要相談':'掲載不可'}
function setCounts(c={}){$('cNew').textContent=c.inbox||0;$('cProgress').textContent=c.inProgress||0;$('cResolved').textContent=c.resolved||0;$('cStarred').textContent=c.starred||0;$('cArchived').textContent=c.archived||0;$('cBlocked').textContent=c.blocked||0}
function query(){
 const p=new URLSearchParams();
 if($('q').value)p.set('q',$('q').value);if($('type').value)p.set('type',$('type').value);if($('category').value)p.set('category',$('category').value);
 if(tab==='new'||tab==='in_progress'||tab==='resolved')p.set('status',tab);
 if(tab==='starred')p.set('starred','1');if(tab==='archived')p.set('archived','1');if(tab==='blocked')p.set('blocked','1');
 return p.toString()
}
async function load(){const d=await api('/api/consult/admin/list?'+query());items=d.conversations;templates=d.templates||[];$('unread').textContent=d.unreadCount;setCounts(d.counts);renderList();if(cur){const n=items.find(x=>x.id===cur.id);if(n){cur=n;renderDetail()}else if(tab!=='blocked')clearDetail()}}
function renderList(){
 $('list').innerHTML=items.length?items.map(c=>{const last=c.messages[c.messages.length-1];return `<div class="item ${c.unread?'unread':''} ${cur&&cur.id===c.id?'selected':''}" data-id="${c.id}"><div class="iTop"><span>${esc(c.consultNo)} ${c.starred?'★':''}</span><span>${dt(c.updatedAt)}</span></div><div class="iName">${esc(c.displayName)}</div><div class="iTags"><span class="tag ${c.status==='resolved'?'green':''}">${statusText(c.status)}</span><span class="tag">${c.type==='info'?'情報提供':'相談'}</span>${c.urgent?'<span class="tag red">緊急</span>':''}${c.blocked?'<span class="tag red">BLOCK</span>':''}</div><div class="snippet">${esc(last?.text||'(添付のみ)')}</div></div>`}).join(''):'<div class="empty">該当する相談はありません</div>';
 document.querySelectorAll('.item').forEach(x=>x.onclick=()=>openItem(x.dataset.id))
}
function attachment(c,a){
 const base=`/api/consult/admin/${c.id}/attachment/${a.id}?key=${encodeURIComponent(KEY)}`,inline=base+'&inline=1',m=(a.mime||'').toLowerCase();let media='';
 if(m.startsWith('image/'))media=`<img src="${inline}" onclick="openPreview('${inline}')">`;
 else if(m.startsWith('video/'))media=`<video src="${inline}" controls preload="metadata"></video>`;
 else if(m.startsWith('audio/'))media=`<audio src="${inline}" controls preload="metadata"></audio>`;
 return `<div class="att">${media}<div class="attName">${esc(a.name)}</div><a href="${base}">ダウンロード</a></div>`
}
function renderDetail(){
 if(!cur)return clearDetail();
 $('detail').classList.add('mobileShow');$('list').classList.add('mobileHide');
 $('detail').innerHTML=`<div class="card"><button class="btn gray" onclick="closeMobile()">← 戻る</button><div class="dHead"><div><div class="dNo">${esc(cur.consultNo)} ${esc(cur.displayName)}</div><div class="dMeta">${dt(cur.createdAt)} / ${esc(cur.category)} / ${permText(cur.permission)}</div></div><span class="tag ${cur.status==='resolved'?'green':''}">${statusText(cur.status)}</span></div><div class="actions"><button class="btn gray" onclick="setStatus('new')">未対応</button><button class="btn gold" onclick="setStatus('in_progress')">対応中</button><button class="btn green" onclick="setStatus('resolved')">✓ 対応済み</button><button class="btn gold" onclick="toggleStar()">${cur.starred?'★解除':'☆重要'}</button><button class="btn gray" onclick="toggleArchive()">${cur.archived?'受信箱へ戻す':'アーカイブ'}</button><button class="btn red" onclick="toggleBlock()">${cur.blocked?'ブロック解除':'ブロック'}</button></div></div>
 <div class="card">${cur.messages.map(m=>`<div class="msg ${m.sender==='admin'?'admin':''}"><div class="avatar">${m.sender==='admin'?'E':'相談者'}</div><div class="bubble"><div class="mMeta">${m.sender==='admin'?'イコエル':'相談者'} ・ ${dt(m.createdAt)}</div><div class="mText">${esc(m.text)}</div><div class="attachments">${m.attachments.map(a=>attachment(cur,a)).join('')}</div></div></div>`).join('')}</div>
 <div class="card reply"><b>返信</b><div class="template"><select id="tpl">${templates.map((t,i)=>`<option value="${i}">${esc(t.slice(0,38))}</option>`).join('')}</select><button class="btn gray" onclick="useTpl()">挿入</button></div><textarea id="replyText" placeholder="返信内容"></textarea><input id="replyInput" class="fileInput" type="file" multiple accept="image/*,video/*,audio/*"><div id="replyQueue" class="fileQueue"></div><button class="btn dark" style="width:100%;margin-top:7px" onclick="sendReply()">返信する</button></div>
 <div class="card broadcast"><b>配信で取り上げる</b><textarea id="broadcastText">${esc(cur.messages[0]?.text||'')}</textarea><div class="actions"><button class="btn green" ${cur.permission==='deny'?'disabled':''} onclick="broadcast()">配信表示</button><button class="btn gray" onclick="clearBroadcast()">表示を消す</button></div></div>`;
 $('replyInput').onchange=()=>{addReplyFiles([...$('replyInput').files]);$('replyInput').value=''};
 renderReplyQueue()
}
function clearDetail(){cur=null;$('detail').classList.remove('mobileShow');$('list').classList.remove('mobileHide');$('detail').innerHTML='<div class="empty">相談を選択してください</div>';renderList()}
function closeMobile(){$('detail').classList.remove('mobileShow');$('list').classList.remove('mobileHide')}
async function openItem(id){cur=items.find(x=>x.id===id);if(!cur)return;if(cur.unread){const d=await api(`/api/consult/admin/${id}/read`,{method:'POST'});cur=d.conversation}renderList();renderDetail()}
async function setStatus(v){const d=await api(`/api/consult/admin/${cur.id}/status`,{method:'POST',headers:headers(),body:JSON.stringify({value:v})});cur=d.conversation;renderDetail();load()}
async function toggleStar(){await api(`/api/consult/admin/${cur.id}/star`,{method:'POST',headers:headers(),body:JSON.stringify({value:!cur.starred})});cur.starred=!cur.starred;renderDetail();load()}
async function toggleArchive(){await api(`/api/consult/admin/${cur.id}/archive`,{method:'POST',headers:headers(),body:JSON.stringify({value:!cur.archived})});clearDetail();load()}
async function toggleBlock(){await api(`/api/consult/admin/${cur.id}/block`,{method:'POST',headers:headers(),body:JSON.stringify({value:!cur.blocked})});cur.blocked=!cur.blocked;renderDetail();load()}
function useTpl(){const i=Number($('tpl').value);$('replyText').value=templates[i]||''}
function addReplyFiles(arr){for(const f of arr){if(replyFiles.length>=10)break;if(!replyFiles.some(x=>x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified))replyFiles.push(f)}renderReplyQueue()}
function renderReplyQueue(){const box=$('replyQueue');if(!box)return;box.innerHTML=replyFiles.map((f,i)=>`<div class="fileChip">${esc(f.name)} <button onclick="replyFiles.splice(${i},1);renderReplyQueue()">×</button></div>`).join('')}
async function sendReply(){if(!cur)return;const text=$('replyText').value.trim();if(!text&&!replyFiles.length)return;const fd=new FormData();fd.append('text',text);replyFiles.forEach(f=>fd.append('files',f));const r=await fetch(`/api/consult/admin/${cur.id}/reply?key=${encodeURIComponent(KEY)}`,{method:'POST',body:fd});const j=await r.json();if(!r.ok)return alert(j.error||'返信失敗');cur=j.conversation;replyFiles=[];renderDetail();load()}
async function broadcast(){await api(`/api/consult/admin/${cur.id}/broadcast`,{method:'POST',headers:headers(),body:JSON.stringify({text:$('broadcastText').value})})}
async function clearBroadcast(){await api('/api/consult/admin/broadcast/clear',{method:'POST',headers:headers()})}
function openPreview(src){$('previewImg').src=src;$('preview').classList.add('show')}
function connect(){if(es)try{es.close()}catch{};es=new EventSource('/api/consult/admin/events?key='+encodeURIComponent(KEY));const on=e=>{try{const d=JSON.parse(e.data);$('unread').textContent=d.unreadCount;if(d.conversation){const i=items.findIndex(x=>x.id===d.conversation.id);if(i>=0)items[i]=d.conversation;else if(tab==='new')items.unshift(d.conversation);if(cur&&cur.id===d.conversation.id){cur=d.conversation;renderDetail()}renderList()}clearTimeout(window._reload);window._reload=setTimeout(load,150)}catch{}};es.addEventListener('new',on);es.addEventListener('update',on);es.onerror=()=>{try{es.close()}catch{};es=null;setTimeout(connect,1200)}}
async function login(){KEY=$('key').value.trim();try{await api('/api/consult/admin/list');localStorage.consultAdminKey=KEY;$('login').style.display='none';$('app').style.display='grid';load();connect()}catch(e){$('loginErr').textContent=e.message}}
$('loginBtn').onclick=login;if(KEY){$('key').value=KEY;login()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;clearDetail();load()});
let t;['q','type','category'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',()=>{clearTimeout(t);t=setTimeout(load,200)}));
</script>
</body>
</html>
