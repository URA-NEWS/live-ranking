<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>イコエル相談管理</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Noto Sans JP",sans-serif;background:#f1f3f5;color:#172027}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer}.dark{background:#1d272d;color:#fff}.green{background:#84e258;color:#17310e}.gray{background:#edf1f3;color:#506069}.gold{background:#fff0c7;color:#8b5d00}.red{background:#ffe7ea;color:#b72c3d}.hidden{display:none!important}
#login{position:fixed;inset:0;background:#f1f3f5;display:flex;align-items:center;justify-content:center;z-index:50}#loginBox{width:310px;background:#fff;border:1px solid #dde3e6;border-radius:18px;padding:18px;box-shadow:0 18px 45px #0001}#login input{width:100%;padding:11px;border:1px solid #d8e0e4;border-radius:10px;margin:10px 0}
#app{display:none;height:100vh}header{height:48px;background:#fff;border-bottom:1px solid #dde3e6;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:14px}.tabs{height:42px;background:#fafbfc;border-bottom:1px solid #dde3e6;display:flex;align-items:center;gap:5px;padding:5px 7px;overflow-x:auto}.tab{white-space:nowrap;border-radius:999px}.tab.active{background:#1d272d;color:#fff}
.main{height:calc(100vh - 135px);display:grid;grid-template-columns:310px 1fr}#list{overflow:auto;background:#f8f9fa;border-right:1px solid #dfe4e7}.item{background:#fff;border-bottom:1px solid #e6eaed;padding:10px;cursor:pointer}.item.active{background:#eef8ea;border-left:3px solid #76db4c}.itop{display:flex;justify-content:space-between;font-size:10px;color:#7b888f}.iname{font-size:13px;font-weight:900;margin:4px 0;display:flex;align-items:center;gap:5px}.preview{font-size:11px;color:#637078;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{font-size:9px;border-radius:999px;padding:2px 6px;font-weight:900}.bnew{background:#e8f3ff;color:#176aa8}.burgent{background:#ffe6ea;color:#c7293c}.breply{background:#fff1ca;color:#8b6200}.onlineDot{width:8px;height:8px;border-radius:50%;background:#43d532;box-shadow:0 0 7px #43d532}.offlineDot{width:8px;height:8px;border-radius:50%;background:#ea6161}
#detail{overflow:auto;padding:10px;background:#f1f3f5}.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#859198}.panel{background:#fff;border:1px solid #dfe4e7;border-radius:16px;margin-bottom:9px;padding:10px;box-shadow:0 3px 12px #00000009}.headrow{display:flex;justify-content:space-between;gap:8px;align-items:center}.title{font-size:17px;font-weight:900}.meta{font-size:10px;color:#7a878e;margin-top:2px}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.voice{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px;background:#f7fbf5;border:1px solid #dbe7d7;border-radius:12px;margin-top:8px}.presence{font-size:11px;font-weight:900;margin-right:auto}.presence.on{color:#24951d}.presence.off{color:#d24c4c}.mic{max-width:190px;padding:6px;border:1px solid #d7dee2;border-radius:9px;font-size:12px}.meter{width:70px;height:7px;border-radius:999px;background:#dbe3df;overflow:hidden}.meter i{display:block;width:0;height:100%;background:linear-gradient(90deg,#4bd637,#e9b532,#e84f50)}.vol{width:80px}
.chat{padding:12px;min-height:260px;display:flex;flex-direction:column;gap:8px;background:#eef1f4}.msg{display:flex;align-items:flex-end;gap:7px;width:100%}.msg.user{justify-content:flex-start}.msg.admin{justify-content:flex-end}.av{width:32px;height:32px;border-radius:50%;overflow:hidden;background:#dfe5e8;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;flex:0 0 32px}.av img{width:100%;height:100%;object-fit:cover}.msg.admin .av{order:2}.bubble{max-width:72%;padding:9px 11px}.msg.user .bubble{background:#fff;border:1px solid #dce3e6;border-radius:16px 16px 16px 4px}.msg.admin .bubble{background:#8de055;border-radius:16px 16px 4px 16px;color:#14220d}.mmeta{font-size:9px;color:#748188;margin-bottom:3px}.mtext{font-size:13px;line-height:1.5;font-weight:600;white-space:pre-wrap}.urgent{font-size:9px;color:#c9283b;font-weight:900;margin-bottom:2px}.read{font-size:9px;color:#627078;text-align:right;margin-top:3px}.system{align-self:center;border-radius:999px;background:#e3eae6;color:#58665e;padding:5px 9px;font-size:9px;font-weight:900}
.reply textarea{width:100%;min-height:78px;border:1px solid #d8e0e4;background:#f9fbfc;border-radius:13px;padding:10px;font-size:13px;resize:vertical}.settings{position:relative}.settingsBox{display:none;position:absolute;right:0;top:34px;width:260px;background:#fff;border:1px solid #dce3e7;border-radius:14px;padding:10px;box-shadow:0 15px 40px #0002;z-index:20}.settingsBox.show{display:block}.settingRow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;padding:6px 0}.settingRow input[type=range]{width:120px}
.overlayGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.overlayGrid label{font-size:10px;color:#627079}.overlayGrid input{width:100%}
@media(max-width:760px){.main{grid-template-columns:1fr}#list.hide{display:none}#detail{display:none}#detail.show{display:block}}

.attachList{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.attachCard{display:flex;flex-direction:column;gap:4px;max-width:220px}
.attachCard img{max-width:220px;max-height:160px;border-radius:10px;border:1px solid #d9e1e5;object-fit:cover;background:#fff}
.attachActions{display:flex;gap:5px;font-size:10px}
.attachActions a{color:#246c9e;text-decoration:none;font-weight:800}

.item.unresolved{position:relative;animation:unresolvedGlow 1.35s ease-in-out infinite}
.item.unresolved:before{content:"";position:absolute;inset:1px;border-radius:8px;border:2px solid #ff6a54;pointer-events:none;opacity:.8}
@keyframes unresolvedGlow{0%,100%{background:#fff;box-shadow:0 0 0 rgba(255,88,64,0)}50%{background:#fff8f4;box-shadow:0 0 16px rgba(255,88,64,.28)}}
.btag-new{background:#ffe6df;color:#bb3d27}.btag-resolved{background:#e5f7df;color:#287d1e}.btag-blocked{background:#eceff1;color:#3e4a50}

.item{position:relative;z-index:1;cursor:pointer;user-select:none}
.item>*{position:relative;z-index:2}

.searchWrap{padding:7px;background:#fff;border-bottom:1px solid #dfe4e7}
.searchWrap input{width:100%;border:1px solid #d7dee2;border-radius:11px;background:#f7f9fa;padding:8px 10px;font-size:12px;outline:none}
.searchWrap input:focus{border-color:#7b8b94;background:#fff}
.bimportant{background:#fff0bd;color:#8a5f00}

.item.priority-important{border-left:3px solid #e3b73e;background:#fffdf4}
.item.priority-resolved{border-left:3px solid #6fc45c;background:#f8fff6}

.item.ringing{position:relative!important;border:3px solid #1687ff!important;background:#edf7ff!important;animation:ringBlueFrame .65s ease-in-out infinite alternate!important}
.item.ringing:after{content:"📞 着信中";position:absolute;right:8px;top:7px;background:#1687ff;color:#fff;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;z-index:5;box-shadow:0 0 14px rgba(22,135,255,.7)}
@keyframes ringBlueFrame{from{box-shadow:0 0 0 2px rgba(22,135,255,.25),inset 0 0 0 rgba(22,135,255,.08)}to{box-shadow:0 0 28px 7px rgba(22,135,255,.8),inset 0 0 24px rgba(22,135,255,.22)}}

#incoming:not(.hidden){
  background:#eaf5ff!important;
  border:3px solid #1687ff!important;
  box-shadow:0 0 0 2px rgba(22,135,255,.18);
  animation:incomingBluePulse .65s ease-in-out infinite alternate!important;
}
#incoming:not(.hidden) b{color:#075da8!important}
@keyframes incomingBluePulse{
  from{box-shadow:0 0 0 2px rgba(22,135,255,.20),inset 0 0 0 rgba(22,135,255,.08)}
  to{box-shadow:0 0 26px 7px rgba(22,135,255,.70),inset 0 0 22px rgba(22,135,255,.20)}
}

.bridgeStatus{font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px;background:#ffe9e9;color:#a93232}
.bridgeStatus.on{background:#e6f8df;color:#23801b}
.item.ringing{border:4px solid #1687ff!important;animation:ringBlueFrame .6s ease-in-out infinite alternate!important}
@keyframes ringBlueFrame{from{box-shadow:0 0 4px 1px rgba(22,135,255,.35)}to{box-shadow:0 0 30px 8px rgba(22,135,255,.9),inset 0 0 22px rgba(22,135,255,.22)}}
</style></head><body><div id="login"><div id="loginBox"><b>管理キー</b><input id="key" type="password"><button id="loginBtn" class="dark">開く</button></div></div><div id="app"><header><b>イコエル相談管理</b><div style="display:flex;align-items:center;gap:8px"><span id="unread">0</span><div class="settings"><button id="settingsBtn" class="gray">⚙ 設定</button><div id="settingsBox" class="settingsBox"><div class="settingRow"><span>新着音</span><input id="soundMsg" type="checkbox"></div><div class="settingRow"><span>着信音</span><input id="soundCall" type="checkbox"></div><div class="settingRow"><span>通知音量</span><input id="soundVol" type="range" min="0" max="100"></div></div></div></div></header><div id="tabs" class="tabs"></div><div class="searchWrap"><input id="searchInput" type="search" placeholder="全スレッドから検索（新着 → 重要 → 対応済の順）"></div><div class="main"><div id="list"></div><div id="detail"><div class="empty">相談を選択してください</div></div></div></div>

 };

}

function connect(){
 if(socket)socket.disconnect();
 socket=io({transports:['websocket','polling'],reconnection:true});
 socket.on('connect',()=>socket.emit('join:admin',{key:KEY}));
 socket.on('conversation:new',()=>loadList());
 socket.on('conversation:update',d=>{
   const c=d.conversation,i=items.findIndex(x=>x.id===c.id);
   if(i>=0)items[i]=c;
   if(cur?.id===c.id){cur={...cur,...c};updateDetail()}
   renderList();
 });
 socket.on('presence:update',p=>{
   const i=items.findIndex(x=>x.id===p.id);if(i>=0)items[i].userOnline=p.online;
   if(cur?.id===p.id){cur.userOnline=p.online;updateDetail()}renderList();
 });
 socket.on('voice:signal',s=>{
   const i=items.findIndex(x=>x.id===s.id);if(i>=0)items[i].callState=s.state||null;
   if(s.from==='user'&&(s.type==='call'||s.type==='offer')){
     globalIncomingId=s.id;ring('incoming');
   }
   if(s.type==='reject'||s.type==='hangup'){
     if(globalIncomingId===s.id){globalIncomingId=null;stopRing()}
   }
   renderList();
   if(cur?.id===s.id){cur.callState=s.state||null;handleState(cur.callState)}
 });
 socket.on('mic:bridge',d=>{
   micBridgeConnected=!!d.connected;
   const b=$('bridgeStatus');if(b){b.textContent=micBridgeConnected?'マイク接続済':'マイク未接続';b.classList.toggle('on',micBridgeConnected)}
   if(!micBridgeConnected&&$('callLabel'))$('callLabel').textContent='マイクブリッジ未接続';
 });
 socket.on('mic:status',d=>{
   if(Array.isArray(d.devices)){micBridgeDevices=d.devices;loadMics()}
   if(typeof d.level==='number'){
     micBridgeLevel=d.level;
     if($('meterBar'))$('meterBar').style.width=Math.max(0,Math.min(100,d.level))+'%';
     if($('meterPct'))$('meterPct').textContent=Math.round(d.level)+'%';
   }
   if(d.state==='connected'){stopRing();globalIncomingId=null;if($('callLabel'))$('callLabel').textContent='通話中'}
   if(d.state==='idle'||d.state==='ended'){stopRing();globalIncomingId=null}
   if(d.error&&$('callLabel'))$('callLabel').textContent=d.error;
 });
}

function unlock(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch{}}document.addEventListener('pointerdown',unlock,{passive:true});document.addEventListener('keydown',unlock,{passive:true});function beep(f,d=.15,delay=0,g=.13){unlock();if(!audioCtx)return;const o=audioCtx.createOscillator(),x=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.connect(x);x.connect(audioCtx.destination);o.frequency.value=f;x.gain.setValueAtTime(g*(cfg.vol/100),t);x.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.02)}function playMessage(){if(!cfg.msg)return;beep(670,.12,0,.14);beep(820,.1,.14,.11)}function stopRing(){if(ringTimer)clearInterval(ringTimer);ringTimer=null}function ring(k){if(!cfg.call)return;stopRing();const p=()=>{if(k==='incoming'){beep(900,.18,0,.17);beep(1080,.18,.24,.17)}else{beep(440,.25,0,.12);beep(520,.25,.35,.12)}};p();ringTimer=setInterval(p,1400)}function drop(){stopRing();beep(520,.13,0,.13);beep(320,.22,.15,.13)}

function restoreCallUI(s){
 if(!$('callBtn'))return;
 const incoming=s?.state==='ringing'&&s?.from==='user';
 const outgoing=s?.state==='ringing'&&s?.from==='admin';
 const connected=s?.state==='connected';
 $('incoming').classList.toggle('hidden',!incoming);
 $('callBtn').classList.toggle('hidden',incoming||outgoing||connected);
 $('cancelCallBtn').classList.toggle('hidden',!outgoing);
 $('muteBtn').classList.toggle('hidden',!connected);
 $('hangBtn').classList.toggle('hidden',!connected);
 if(incoming){if(s.offer)pendingOffer=s.offer;$('callLabel').textContent='受信中'}
 else if(outgoing){$('callLabel').textContent='発信中'}
 else if(connected){$('callLabel').textContent='通話中';stopRing()}
 else{$('callLabel').textContent='';stopRing()}
}

function startPresence(){clearInterval(presTimer);presTimer=setInterval(async()=>{if(!cur)return;try{const d=await api(`/api/admin/${cur.id}/presence?t=${Date.now()}`);cur.userOnline=d.online;updateDetail()}catch{}},1000)}function startCallPolling(){
 clearInterval(callPoll);
 const check=async()=>{
  if(!cur)return;
  try{
   const d=await api(`/api/admin/${cur.id}/call-state?t=${Date.now()}`),s=d.state,k=s?JSON.stringify([s.state,s.from,s.at]):'none';
   cur.callState=s;
   const li=items.findIndex(x=>x.id===cur.id);if(li>=0)items[li].callState=s;
   renderList();restoreCallUI(s);
   if(k!==lastCallKey){lastCallKey=k;handleState(s)}
  }catch{}
 };
 check();callPoll=setInterval(check,1000)
}

async function requestMicPermission(){
 const url=location.origin+'/consult-mic.html?key='+encodeURIComponent(KEY);
 try{
  window.open(url,'ikoeru-mic','width=460,height=680');
 }catch{}
 try{await navigator.clipboard?.writeText(url)}catch{}
 if($('callLabel'))$('callLabel').textContent='通常ブラウザでマイク接続ページを開いてください';
 return true;
}
async function loadMics(){
 const sel=$('mic');if(!sel)return;
 const saved=localStorage.micId||'';
 sel.innerHTML='<option value="">既定のマイク</option>'+micBridgeDevices.map((d,i)=>`<option value="${esc(d.deviceId)}">${esc(d.label||'マイク '+(i+1))}</option>`).join('');
 sel.value=[...sel.options].some(o=>o.value===saved)?saved:'';
 sel.onchange=()=>{
  localStorage.micId=sel.value;
  socket?.emit('mic:command',{action:'select',deviceId:sel.value});
 };
}
function stopMicPreview(){socket?.emit('mic:command',{action:'preview-stop'});if(micPreview)micPreview.getTracks().forEach(t=>t.stop());micPreview=null;if(micRAF)cancelAnimationFrame(micRAF);micRAF=null;if($('meterBar'))$('meterBar').style.width='0';if($('meterPct'))$('meterPct').textContent='0%'}async function getMic(){throw Object.assign(new Error('OBS dock mic unsupported'),{name:'NotSupportedError'})}
async function startMicPreview(){try{stopMicPreview();micPreview=await getMic();startMeter(micPreview);$('micTest').textContent='■停止'}catch(e){$('callLabel').textContent=e.name==='NotAllowedError'?'マイク権限が拒否されています':e.name==='NotReadableError'?'マイクが他アプリで使用中です':e.name==='NotFoundError'?'マイクが見つかりません':'マイクを使用できません ('+e.name+')'}}function startMeter(stream){if(!micCtx)micCtx=new (window.AudioContext||window.webkitAudioContext)();micAnalyser=micCtx.createAnalyser();micAnalyser.fftSize=256;micCtx.createMediaStreamSource(stream).connect(micAnalyser);const a=new Uint8Array(micAnalyser.fftSize);const draw=()=>{micAnalyser.getByteTimeDomainData(a);let sum=0;for(const v of a){const x=(v-128)/128;sum+=x*x}const n=Math.min(100,Math.round(Math.sqrt(sum/a.length)*350));if($('meterBar'))$('meterBar').style.width=n+'%';if($('meterPct'))$('meterPct').textContent=n+'%';micRAF=requestAnimationFrame(draw)};draw()}
async function sig(type,data=null){return api(`/api/admin/${cur.id}/voice-signal`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,data})})}async function ensurePC(){if(pc)return;stopMicPreview();localStream=await getMic();startMeter(localStream);pc=new RTCPeerConnection(RTC);localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));remoteAudio=document.createElement('audio');remoteAudio.autoplay=true;remoteAudio.volume=Math.min(1,Number(localStorage.callVolume||100)/100);document.body.appendChild(remoteAudio);pc.ontrack=e=>remoteAudio.srcObject=e.streams[0];pc.onicecandidate=e=>{if(e.candidate)sig('ice',e.candidate)};pc.onconnectionstatechange=()=>{if(pc?.connectionState==='connected'){stopRing();$('callLabel').textContent='通話中';$('callBtn').classList.add('hidden');$('muteBtn').classList.remove('hidden');$('hangBtn').classList.remove('hidden')}}}async function flush(){if(!pc?.remoteDescription)return;for(const c of pendingIce.splice(0))try{await pc.addIceCandidate(new RTCIceCandidate(c))}catch{}}async function callUser(){
 if(!micBridgeConnected){await requestMicPermission();return}
 $('callLabel').textContent='発信中';
 $('callBtn').classList.add('hidden');$('cancelCallBtn').classList.remove('hidden');
 socket?.emit('mic:command',{action:'call',id:cur.id});
}
async function answer(){
 if(!micBridgeConnected){await requestMicPermission();return}
 stopRing();globalIncomingId=null;$('incoming').classList.add('hidden');
 socket?.emit('mic:command',{action:'answer',id:cur.id});
}
async function reject(){
 stopRing();globalIncomingId=null;
 try{await sig('reject')}catch{}
 $('incoming').classList.add('hidden');$('callLabel').textContent='切断';
 socket?.emit('mic:command',{action:'reset',id:cur.id});
}
async function endCall(send=true){
 stopRing();globalIncomingId=null;
 socket?.emit('mic:command',{action:'hangup',id:cur?.id||null,signal:send});
 if($('callBtn'))$('callBtn').classList.remove('hidden');
 if($('cancelCallBtn'))$('cancelCallBtn').classList.add('hidden');
 if($('muteBtn'))$('muteBtn').classList.add('hidden');
 if($('hangBtn'))$('hangBtn').classList.add('hidden');
 if($('callLabel'))$('callLabel').textContent='切断';
}
function toggleMute(){
 muted=!muted;socket?.emit('mic:command',{action:'mute',muted});
 if($('muteBtn'))$('muteBtn').textContent=muted?'🔇ミュート':'🎤ON';
}
async function handleSignal(s){if(s.type==='call'){ring('incoming');$('incoming').classList.remove('hidden');$('callLabel').textContent='受信中'}if(s.type==='offer'){pendingOffer=s.data;ring('incoming');$('incoming').classList.remove('hidden');$('callLabel').textContent='受信中'}if(s.type==='answer'){await ensurePC();if(!pc.remoteDescription){await pc.setRemoteDescription(new RTCSessionDescription(s.data));await flush()}}if(s.type==='ice'){await ensurePC();if(pc.remoteDescription)try{await pc.addIceCandidate(new RTCIceCandidate(s.data))}catch{}else pendingIce.push(s.data)}if(s.type==='reject'||s.type==='hangup')endCall(false)}function handleState(s){if(s?.offer)pendingOffer=s.offer;restoreCallUI(s)}
let pos='right',ovTimer=null;async function loadOverlay(){try{const d=await fetch('/api/overlay/config').then(r=>r.json());pos=d.position;for(const [id,k] of [['ow','width'],['oh','height'],['of','fontSize'],['ox','offsetX'],['oy','offsetY']])$(id).value=d[k]??(id==='os'?100:0)}catch{}}function setPos(p){pos=p;sendOverlay()}function debouncedOverlay(){clearTimeout(ovTimer);ovTimer=setTimeout(sendOverlay,80)}async function sendOverlay(){await api('/api/admin/overlay-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({position:pos,width:Number($('ow').value),height:Number($('oh').value),fontSize:Number($('of').value),offsetX:Number($('ox').value),offsetY:Number($('oy').value)})})}
