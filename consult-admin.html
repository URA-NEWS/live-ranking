<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<link rel="manifest" href="/consult-admin-manifest.webmanifest">
<link rel="apple-touch-icon" href="/consult-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="イコエル管理">
<meta name="theme-color" content="#1d282e"><title>イコエル相談管理</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Noto Sans JP",sans-serif;background:#f1f3f5;color:#172027}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer}.dark{background:#1d272d;color:#fff}.green{background:#84e258;color:#17310e}.gray{background:#edf1f3;color:#506069}.gold{background:#fff0c7;color:#8b5d00}.red{background:#ffe7ea;color:#b72c3d}.hidden{display:none!important}
#login{position:fixed;inset:0;background:#f1f3f5;display:flex;align-items:center;justify-content:center;z-index:50}#loginBox{width:310px;background:#fff;border:1px solid #dde3e6;border-radius:18px;padding:18px;box-shadow:0 18px 45px #0001}#login input{width:100%;padding:11px;border:1px solid #d8e0e4;border-radius:10px;margin:10px 0}
#app{display:none;height:100vh}header{height:48px;background:#fff;border-bottom:1px solid #dde3e6;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:14px}.tabs{height:42px;background:#fafbfc;border-bottom:1px solid #dde3e6;display:flex;align-items:center;gap:5px;padding:5px 7px;overflow-x:auto}.tab{white-space:nowrap;border-radius:999px}.tab.active{background:#1d272d;color:#fff}
.main{height:calc(100vh - 135px);display:grid;grid-template-columns:310px 1fr}#list{overflow:auto;background:#f8f9fa;border-right:1px solid #dfe4e7}.item{background:#fff;border-bottom:1px solid #e6eaed;padding:10px;cursor:pointer}.item.active{background:#eef8ea;border-left:3px solid #76db4c}.itop{display:flex;justify-content:space-between;font-size:10px;color:#7b888f}.iname{font-size:13px;font-weight:900;margin:4px 0;display:flex;align-items:center;gap:5px}.preview{font-size:11px;color:#637078;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{font-size:9px;border-radius:999px;padding:2px 6px;font-weight:900}.bnew{background:#e8f3ff;color:#176aa8}.burgent{background:#ffe6ea;color:#c7293c}.breply{background:#fff1ca;color:#8b6200}.onlineDot{width:8px;height:8px;border-radius:50%;background:#43d532;box-shadow:0 0 7px #43d532}.offlineDot{width:8px;height:8px;border-radius:50%;background:#ea6161}
#detail{overflow:auto;padding:10px;background:#f1f3f5}.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#859198}.panel{background:#fff;border:1px solid #dfe4e7;border-radius:16px;margin-bottom:9px;padding:10px;box-shadow:0 3px 12px #00000009}.headrow{display:flex;justify-content:space-between;gap:8px;align-items:center}.title{font-size:17px;font-weight:900}.meta{font-size:10px;color:#7a878e;margin-top:2px}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.voice{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px;background:#f7fbf5;border:1px solid #dbe7d7;border-radius:12px;margin-top:8px}.presence{font-size:11px;font-weight:900;margin-right:auto}.presence.on{color:#24951d}.presence.off{color:#d24c4c}.mic{max-width:190px;padding:6px;border:1px solid #d7dee2;border-radius:9px;font-size:12px}.meter{width:70px;height:7px;border-radius:999px;background:#dbe3df;overflow:hidden}.meter i{display:block;width:0;height:100%;background:linear-gradient(90deg,#4bd637,#e9b532,#e84f50)}.vol{width:80px}
.chat{padding:12px;min-height:260px;display:flex;flex-direction:column;gap:8px;background:#eef1f4}.msg{display:flex;align-items:flex-end;gap:7px;width:100%}.msg.user{justify-content:flex-start}.msg.admin{justify-content:flex-end}.av{width:32px;height:32px;border-radius:50%;overflow:hidden;background:#dfe5e8;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;flex:0 0 32px}.av img{width:100%;height:100%;object-fit:cover}.msg.admin .av{order:2}.bubble{max-width:72%;padding:9px 11px}.msg.user .bubble{background:#fff;border:1px solid #dce3e6;border-radius:16px 16px 16px 4px}.msg.admin .bubble{background:#8de055;border-radius:16px 16px 4px 16px;color:#14220d}.mmeta{font-size:9px;color:#748188;margin-bottom:3px}.mtext{font-size:13px;line-height:1.5;font-weight:600;white-space:pre-wrap}.urgent{font-size:9px;color:#c9283b;font-weight:900;margin-bottom:2px}.read{font-size:9px;color:#627078;text-align:right;margin-top:3px}.system{align-self:center;border-radius:999px;background:#e3eae6;color:#58665e;padding:5px 9px;font-size:9px;font-weight:900}
.reply textarea{width:100%;min-height:78px;border:1px solid #d8e0e4;background:#f9fbfc;border-radius:13px;padding:10px;font-size:13px;resize:vertical}.settings{position:relative}.settingsBox{display:none;position:absolute;right:0;top:34px;width:260px;background:#fff;border:1px solid #dce3e7;border-radius:14px;padding:10px;box-shadow:0 15px 40px #0002;z-index:20}.settingsBox.show{display:block}.settingRow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;padding:6px 0}.settingRow input[type=range]{width:120px}
.overlayGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.overlayGrid label{font-size:10px;color:#627079}.overlayGrid input{width:100%}
@media(max-width:760px){.main{grid-template-columns:1fr}#list.hide{display:none}#detail{display:none}#detail.show{display:block}}

.attachList{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.attachCard{display:flex;flex-direction:column;gap:4px;max-width:220px}
.attachCard img{max-width:220px;max-height:160px;border-radius:10px;border:1px solid #d9e1e5;object-fit:cover;background:#fff}
.attachActions{display:flex;gap:5px;font-size:10px}
.attachActions a{color:#246c9e;text-decoration:none;font-weight:800}

.item.unresolved{position:relative;animation:unresolvedGlow 1.35s ease-in-out infinite}
.item.unresolved:before{content:"";position:absolute;inset:1px;border-radius:8px;border:2px solid #ff6a54;pointer-events:none;opacity:.8}
@keyframes unresolvedGlow{0%,100%{background:#fff;box-shadow:0 0 0 rgba(255,88,64,0)}50%{background:#fff8f4;box-shadow:0 0 16px rgba(255,88,64,.28)}}
.btag-new{background:#ffe6df;color:#bb3d27}.btag-resolved{background:#e5f7df;color:#287d1e}.btag-blocked{background:#eceff1;color:#3e4a50}

.item{position:relative;z-index:1;cursor:pointer;user-select:none}
.item>*{position:relative;z-index:2}

.searchWrap{padding:7px;background:#fff;border-bottom:1px solid #dfe4e7}
.searchWrap input{width:100%;border:1px solid #d7dee2;border-radius:11px;background:#f7f9fa;padding:8px 10px;font-size:12px;outline:none}
.searchWrap input:focus{border-color:#7b8b94;background:#fff}
.bimportant{background:#fff0bd;color:#8a5f00}

.item.priority-important{border-left:3px solid #e3b73e;background:#fffdf4}
.item.priority-resolved{border-left:3px solid #6fc45c;background:#f8fff6}

.item.ringing{position:relative!important;border:3px solid #1687ff!important;background:#edf7ff!important;animation:ringBlueFrame .65s ease-in-out infinite alternate!important}
.item.ringing:after{content:"📞 着信中";position:absolute;right:8px;top:7px;background:#1687ff;color:#fff;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;z-index:5;box-shadow:0 0 14px rgba(22,135,255,.7)}
@keyframes ringBlueFrame{from{box-shadow:0 0 0 2px rgba(22,135,255,.25),inset 0 0 0 rgba(22,135,255,.08)}to{box-shadow:0 0 28px 7px rgba(22,135,255,.8),inset 0 0 24px rgba(22,135,255,.22)}}

#incoming:not(.hidden){
  background:#eaf5ff!important;
  border:3px solid #1687ff!important;
  box-shadow:0 0 0 2px rgba(22,135,255,.18);
  animation:incomingBluePulse .65s ease-in-out infinite alternate!important;
}
#incoming:not(.hidden) b{color:#075da8!important}
@keyframes incomingBluePulse{
  from{box-shadow:0 0 0 2px rgba(22,135,255,.20),inset 0 0 0 rgba(22,135,255,.08)}
  to{box-shadow:0 0 26px 7px rgba(22,135,255,.70),inset 0 0 22px rgba(22,135,255,.20)}
}

.bridgeStatus{font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px;background:#ffe9e9;color:#a93232}
.bridgeStatus.on{background:#e6f8df;color:#23801b}
.item.ringing{border:4px solid #1687ff!important;animation:ringBlueFrame .6s ease-in-out infinite alternate!important}
@keyframes ringBlueFrame{from{box-shadow:0 0 4px 1px rgba(22,135,255,.35)}to{box-shadow:0 0 30px 8px rgba(22,135,255,.9),inset 0 0 22px rgba(22,135,255,.22)}}

#callLabel{font-size:14px;font-weight:900;color:#1d272d;margin-top:8px;min-height:19px}
#callLabel.err{color:#b3122a;background:#fff0f2;border:2px solid #f2a7b3;border-radius:11px;padding:9px 11px;line-height:1.5}
#callLabel.ok{color:#1f7d18}
.micDiagBox{margin-top:9px;border:2px solid #2b3a44;border-radius:13px;background:#101a20;padding:9px}
.micDiagHead{display:flex;align-items:center;gap:6px;color:#cfe6f5;font-size:12px;font-weight:900;margin-bottom:7px}
.micDiagHead button{margin-left:auto;background:#2f4653;color:#fff}
.micDiagHead button+button{margin-left:5px}
.micDiagBox textarea{width:100%;height:210px;background:#0a1216;color:#9ef0a8;border:1px solid #2b3a44;border-radius:9px;padding:9px;font-family:Consolas,"Courier New",monospace;font-size:11px;line-height:1.55;resize:vertical;white-space:pre}
.micDiagHint{color:#8fa6b4;font-size:10px;margin-top:6px;line-height:1.6}

/* ===== スマホ対応（iOSの入力フォーカス時 自動ズーム防止 / 返信行の折り返し） ===== */
textarea,input[type=text],input[type=password],input[type=search],select{font-size:16px}
#reply{font-size:16px;line-height:1.55}
.reply .actions,.reply>div{flex-wrap:wrap}
#replyFiles{max-width:100%;flex:1 1 190px;min-width:0;font-size:13px}
#sendReply{flex:0 0 auto}
@media (max-width:560px){
 .reply>div{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
 #sendReply{margin-left:0!important;width:100%;padding:13px;font-size:15px;writing-mode:horizontal-tb}
 #replyFiles{flex:1 1 100%}
 .overlayGrid{grid-template-columns:1fr}
 .settingRow input[type=range]{width:100%}
}

function absUrl(u){try{return new URL(u,location.href).href}catch{return u}}
async function copyAttachUrl(url){
 const full=absUrl(url);
 let ok=false;
 try{await navigator.clipboard.writeText(full);ok=true}catch{}
 if(!ok){
  try{
   const ta=document.createElement('textarea');ta.value=full;
   ta.style.cssText='position:fixed;left:-9999px';
   document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,999999);
   ok=document.execCommand('copy');ta.remove();
  }catch{}
 }
 attachToast(ok?'URLをコピーしました。通常のブラウザに貼り付けて保存してください':'コピーできませんでした',ok);
}
async function saveAttach(url,name){
 // OBSドックのCEFはダウンロードマネージャを持たないため、まずBlob経由を試す
 try{
  const r=await fetch(url,{headers:{'x-admin-key':KEY}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const b=await r.blob();
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');
  a.href=u;a.download=name||'download';a.style.display='none';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},1500);
  attachToast('保存を実行しました。保存されない場合はOBS内蔵ブラウザの制限です。「URLコピー」で通常のブラウザからどうぞ',true);
 }catch(e){
  attachToast('OBS内では保存できません。URLをコピーします',false);
  copyAttachUrl(url);
 }
}

/* ===================== プッシュ通知 / PWA（管理側・イコエル） ===================== */
let swReg=null,pushReady=false;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||
  (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=window.matchMedia?.('(display-mode: standalone)')?.matches
  ||window.navigator.standalone===true;
const isOBS=/OBS/i.test(navigator.userAgent);

function b64ToU8(base64){
 const pad='='.repeat((4-base64.length%4)%4);
 const s=(base64+pad).replace(/-/g,'+').replace(/_/g,'/');
 const raw=atob(s),out=new Uint8Array(raw.length);
 for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
 return out;
}
async function registerSW(){
 if(!('serviceWorker' in navigator))return null;
 try{
  swReg=await navigator.serviceWorker.register('/consult-sw.js',{scope:'/'});
  await navigator.serviceWorker.ready;
  return swReg;
 }catch(e){console.warn('SW登録失敗',e);return null}
}
async function subscribeAdminPush(){
 if(!KEY)return {ok:false,reason:'管理キーでログインしてください'};
 if(!('Notification' in window))return {ok:false,reason:'この端末は通知に対応していません'};
 if(isOBS)return {ok:false,reason:'OBS内蔵ブラウザは通知に対応していません。スマホや通常のChromeで開いてください'};
 if(isIOS&&!isStandalone)
   return {ok:false,reason:'iPhoneでは「ホーム画面に追加」したアイコンから開いた場合のみ通知を受け取れます'};
 try{
  const perm=await Notification.requestPermission();
  if(perm!=='granted')return {ok:false,reason:'通知が許可されていません（端末の設定から許可してください）'};
  const reg=swReg||await registerSW();
  if(!reg)return {ok:false,reason:'Service Worker を登録できませんでした'};
  const r=await fetch('/api/consult/push-public-key');
  const {publicKey}=await r.json();
  if(!publicKey)return {ok:false,reason:'サーバ側の通知キー(VAPID)が未設定です'};
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({
    userVisibleOnly:true,applicationServerKey:b64ToU8(publicKey)});
  const res=await api('/api/admin/push-subscribe',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({subscription:sub.toJSON?sub.toJSON():sub})});
  pushReady=true;localStorage.adminPushOn='1';
  return {ok:true,count:res?.count};
 }catch(e){
  return {ok:false,reason:'通知の設定に失敗しました ('+(e?.name||'Error')+': '+(e?.message||'')+')'};
 }
}
async function unsubscribeAdminPush(){
 try{
  const reg=swReg||await registerSW();
  const sub=await reg?.pushManager.getSubscription();
  if(sub){
   await api('/api/admin/push-unsubscribe',{method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({endpoint:sub.endpoint})});
   await sub.unsubscribe().catch(()=>{});
  }
 }catch{}
 pushReady=false;localStorage.adminPushOn='0';
}

 if(Notification.permission==='denied')return '🔕 通知がブロック中';

 return '🔔 通知をONにする';
}

 };
}

function guessMime(a){
 const m=(a.mime||'').toLowerCase();
 if(m&&m!=='application/octet-stream')return m;
 const e=(a.name||'').toLowerCase().split('.').pop();
 const map={mp4:'video/mp4',mov:'video/quicktime',webm:'video/webm',m4v:'video/mp4',
   avi:'video/x-msvideo',mkv:'video/x-matroska','3gp':'video/3gpp',

 return map[e]||m||'';
}

let overlayScrollTimer=null,overlayScrollHoldStart=0;
function stopOverlayScroll(){if(overlayScrollTimer)clearInterval(overlayScrollTimer);overlayScrollTimer=null;overlayScrollHoldStart=0}
function startOverlayScroll(dir){
 stopOverlayScroll();overlayScrollHoldStart=Date.now();
 const tick=()=>{
  const held=Date.now()-overlayScrollHoldStart;
  const step=held>1800?220:held>900?110:45;
  api('/api/admin/overlay-scroll',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({delta:dir*step})}).catch(()=>{});
 };
 tick();overlayScrollTimer=setInterval(tick,100);
}
function bindOverlayScrollButtons(){
 for(const [el,dir] of [[$('scrollUp'),-1],[$('scrollDown'),1]]){
  if(!el)continue;
  el.onpointerdown=e=>{e.preventDefault();startOverlayScroll(dir)};
  el.onpointerup=stopOverlayScroll;el.onpointercancel=stopOverlayScroll;el.onpointerleave=e=>{if(e.buttons===1)stopOverlayScroll()};
  el.oncontextmenu=e=>e.preventDefault();
 }
}

 cur=null;renderedId=null;

 $('detail').classList.remove('show');

async function setTag(tag){
 if(!cur)return;
 try{
  const d=await api(`/api/admin/${cur.id}/tag`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tag})});
  cur=d.conversation;
  const i=items.findIndex(x=>x.id===cur.id);
  if(i>=0)items[i]=cur;
  updateDetail();
  renderList();

  if(tag==='blocked'&&tab!=='blocked'){
   items=items.filter(x=>x.id!==cur.id);
   back();renderList();
  }else if(tab==='resolved'&&tag!=='resolved'){
   back();
  }else if(tab==='blocked'&&tag!=='blocked'){
   back();
  }
  await loadList();
 }catch(e){alert('タグ変更に失敗しました: '+(e?.message||'エラー'))}
}
async function toggleImportant(){
 if(!cur)return;
 try{
  const wanted=!cur.starred;
  const d=await api(`/api/admin/${cur.id}/star`,{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({starred:wanted})
  });
  cur=d.conversation;
  const i=items.findIndex(x=>x.id===cur.id);if(i>=0)items[i]=cur;
  updateDetail();renderList();
  if(tab==='starred'&&!cur.starred)back();
  await loadList();
 }catch(e){alert('重要タグ変更に失敗しました: '+(e?.message||'エラー'))}
}
async function sendReply(){
 const box=$('reply'),text=box?.value||'',selected=$('replyFiles')?[...$('replyFiles').files]:[];
 if(!text.trim()&&!selected.length){alert('返信内容を入力してください');return}
 const fd=new FormData();fd.append('text',text);selected.forEach(f=>fd.append('files',f));
 try{
  const d=await api(`/api/admin/${cur.id}/reply`,{method:'POST',body:fd});
  cur=d.conversation;draft='';files=[];box.value='';$('replyFiles').value='';updateDetail();loadList();
 }catch(e){alert('返信できません: '+(e?.message||'エラー'))}
}

function connect(){
 if(socket)socket.disconnect();
 socket=io({transports:['websocket','polling'],reconnection:true});

 const handleIncomingConversation=c=>{
  const prev=lastUserMsgById.get(c.id)||'';
  const latest=[...(c.messages||[])].reverse().find(m=>m.sender==='user');
  const latestId=latest?.id||'';
  const isNewUserMessage=!!latestId&&latestId!==prev;

  if(latestId)lastUserMsgById.set(c.id,latestId);

  const i=items.findIndex(x=>x.id===c.id);
  if(i>=0)items[i]=c;
  if(cur?.id===c.id){cur={...cur,...c};updateDetail()}
  renderList();

  if(isNewUserMessage){
   if(latest?.urgent)playUrgent();
   else playMessage();
  }
 };

 socket.on('connect',()=>socket.emit('join:admin',{key:KEY}));

 socket.on('conversation:new',d=>{
  const c=d.conversation;
  const latest=[...(c.messages||[])].reverse().find(m=>m.sender==='user');
  if(latest?.id){
   lastUserMsgById.set(c.id,latest.id);
   latest.urgent?playUrgent():playMessage();
  }
  loadList();
 });

 socket.on('conversation:update',d=>handleIncomingConversation(d.conversation));

 socket.on('presence:update',p=>{
  const i=items.findIndex(x=>x.id===p.id);if(i>=0)items[i].userOnline=p.online;
  if(cur?.id===p.id){cur.userOnline=p.online;updateDetail()}
  renderList();
 });

 socket.on('voice:signal',s=>{
  const i=items.findIndex(x=>x.id===s.id);if(i>=0)items[i].callState=s.state||null;
  if(s.from==='user'&&(s.type==='call'||s.type==='offer')){globalIncomingId=s.id;ring('incoming')}
  if(['answer','accept','reject','hangup'].includes(s.type)){if(globalIncomingId===s.id)globalIncomingId=null;stopRing()}
  renderList();
  if(cur?.id===s.id){cur.callState=s.state||null;handleState(cur.callState)}
 });
}

let sndIn=new Audio(RING_IN_SRC),sndOut=new Audio(RING_OUT_SRC),sndDrop=new Audio(DROP_SRC);
sndIn.loop=true;sndOut.loop=true;sndDrop.loop=false;
[sndIn,sndOut,sndDrop].forEach(a=>{a.preload='auto'});
let sndUnlocked=false;
async function unlockSounds(except){
 try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume()}catch{}
 if(sndUnlocked)return;
 // iOS は volume=0 を無視するが muted は尊重する。
 // 各音源を muted のまま1回だけ再生して個別に解錠する。
 // これから鳴らす音（except）と、既に再生中の音は絶対に触らない。
 // （触ると鳴り始めた直後に自分で pause してしまい、音が出ない）
 let ok=true;
 for(const a of [sndIn,sndOut,sndDrop]){
  if(a===except){continue}
  if(!a.paused){continue}
  try{
   const lp=a.loop;
   a.muted=true;a.loop=false;
   await a.play();
   if(!a.paused){a.pause()}
   a.currentTime=0;
   a.loop=lp;a.muted=false;
  }catch{a.muted=false;ok=false}
 }
 if(ok&&!except)sndUnlocked=true;
}
['pointerdown','touchstart','touchend','click','keydown'].forEach(ev=>
  document.addEventListener(ev,unlockSounds,{passive:true}));
function volOf(k){return Math.max(0,Math.min(1,Number(cfg[k]??100)/100))}
function sndVol(){return volOf('vol')}
function stopAllSnd(){for(const a of [sndIn,sndOut]){try{a.pause();a.currentTime=0}catch{}}}
function playSnd(a,fallback,volKey){
 try{
  a.volume=volOf(volKey||'vol');
  if(a!==sndDrop&&!a.paused)return true;
  a.currentTime=0;
  const p=a.play();
  if(p?.catch)p.catch(()=>{try{if(audioCtx?.state==='suspended')audioCtx.resume()}catch{};fallback&&fallback()});
  return true;
 }catch{fallback&&fallback();return false}
}
function testSounds(){
 unlockSounds().then(()=>{
  playSnd(sndIn,null,'volIn');
  setTimeout(()=>{stopAllSnd();playSnd(sndOut,null,'volOut')},1800);
  setTimeout(()=>{stopAllSnd();playSnd(sndDrop,null,'volDrop')},3600);
  setTimeout(()=>{try{stopAllSnd()}catch{}},5200);
 });
}
function beep(f,d=.15,delay=0,g=.13){unlock();if(!audioCtx)return;const o=audioCtx.createOscillator(),x=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.connect(x);x.connect(audioCtx.destination);o.frequency.value=f;x.gain.setValueAtTime(g*(cfg.vol/100),t);x.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.02)}function playMessage(){if(!cfg.msg)return;beep(670,.12,0,.16);beep(820,.12,.14,.13)}
function playUrgent(){if(!cfg.msg)return;beep(980,.13,0,.19);beep(760,.13,.16,.18);beep(980,.18,.32,.20)}

function stopTone(){
 toneMode='';
 if(ringTimer){clearInterval(ringTimer);ringTimer=null}
 for(const a of [sndIn,sndOut]){try{a.pause();a.currentTime=0}catch{}}
}
function setTone(mode){
 if(mode===toneMode)return;
 if(ringTimer){clearInterval(ringTimer);ringTimer=null}
 for(const a of [sndIn,sndOut]){try{a.pause();a.currentTime=0}catch{}}
 toneMode=mode||'';
 if(!mode)return;
 if(!cfg.call)return;                      // 着信音OFF設定を尊重するのは鳴動音のみ
 const target=(mode==='incoming')?sndIn:sndOut;
 const beepPat=()=>{
  if(mode==='incoming'){beep(900,.18,0,.17);beep(1080,.18,.24,.17)}
  else{beep(440,.25,0,.12);beep(520,.25,.35,.12)}
 };
 unlockSounds(target);
 try{
  target.muted=false;
  target.loop=true;
  target.volume=volOf(mode==='incoming'?'volIn':'volOut');
  target.currentTime=0;
  const p=target.play();
  if(p?.catch)p.catch(()=>{
   try{if(audioCtx?.state==='suspended')audioCtx.resume()}catch{}
   beepPat();ringTimer=setInterval(beepPat,1400);
  });
 }catch{beepPat();ringTimer=setInterval(beepPat,1400)}
}
function playDrop(){
 stopTone();
 unlockSounds(sndDrop);
 try{
  sndDrop.muted=false;
  sndDrop.loop=false;
  sndDrop.volume=volOf('volDrop');
  sndDrop.currentTime=0;
  const p=sndDrop.play();
  if(p?.catch)p.catch(()=>{beep(520,.16,0,.60);beep(320,.30,.17,.60)});
 }catch{beep(520,.16,0,.60);beep(320,.30,.17,.60)}
}
function stopRing(){stopTone()}function ring(k){setTone(k==='incoming'?'incoming':'outgoing')}
function drop(){playDrop()}

function restoreCallUI(s){
 if(!$('callBtn'))return;
 // 発信者はサーバの caller で判定する（from は相手の signal で揺れるため使わない）
 const caller=s?.caller||s?.from;
 const incoming=s?.state==='ringing'&&caller==='user';
 const outgoing=s?.state==='ringing'&&caller==='admin';
 const connected=s?.state==='connected';
 $('incoming').classList.toggle('hidden',!incoming);
 $('callBtn').classList.toggle('hidden',incoming||outgoing||connected);
 $('cancelCallBtn').classList.toggle('hidden',!outgoing);
 $('muteBtn').classList.toggle('hidden',!connected);
 $('hangBtn').classList.toggle('hidden',!connected);
 if(incoming){if(s.offer)pendingOffer=s.offer;$('callLabel').textContent='受信中';setTone('incoming')}
 else if(outgoing){$('callLabel').textContent='発信中';setTone('outgoing')}
 else if(connected){$('callLabel').textContent='通話中';setTone('')}
 else{$('callLabel').textContent='';setTone('')}
 // 相手が切ったのに hangup を取りこぼした場合の保険。
 // 通話中／呼び出し中から状態が消えたら、ここで切断音を鳴らす。
 const live=incoming||outgoing||connected;
 if(callWasLive&&!live){playDrop()}
 callWasLive=live;
}

async function getMic(){
 if(!navigator.mediaDevices?.getUserMedia)throw Object.assign(new Error('mediaDevices unavailable'),{name:'NotSupportedError'});
 const id=localStorage.micId||'';
 const base={echoCancellation:true,noiseSuppression:true,autoGainControl:true};
 const tries=[];
 if(id)tries.push({...base,deviceId:{ideal:id}});
 tries.push(base);
 tries.push(true);
 let last=null;
 for(const audio of tries){
   try{const s=await navigator.mediaDevices.getUserMedia({audio,video:false});micLastError=null;return s}catch(e){last=e;micLastError=e}
 }
 throw last||new Error('microphone unavailable');
}

async function sig(type,data=null){return api(`/api/admin/${cur.id}/voice-signal`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,data})})}let remoteVoiceCtx=null,remoteVoiceRAF=null;
function stopRemoteVoiceMeter(){
 if(remoteVoiceRAF)cancelAnimationFrame(remoteVoiceRAF);remoteVoiceRAF=null;

}
function startRemoteVoiceMeter(stream){
 stopRemoteVoiceMeter();
 try{
  remoteVoiceCtx=remoteVoiceCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(remoteVoiceCtx.state==='suspended')remoteVoiceCtx.resume();
  const src=remoteVoiceCtx.createMediaStreamSource(stream),an=remoteVoiceCtx.createAnalyser();
  an.fftSize=512;an.smoothingTimeConstant=.72;src.connect(an);
  const a=new Uint8Array(an.fftSize);
  const tick=()=>{
   an.getByteTimeDomainData(a);
   let sum=0;for(const x of a){const n=(x-128)/128;sum+=n*n}
   const rms=Math.sqrt(sum/a.length);
   const level=Math.max(0,Math.min(100,Math.round(rms*420)));
   socket?.emit('admin:voice-level',{level});
   remoteVoiceRAF=requestAnimationFrame(tick);
  };tick();
 }catch{}
}

 pc.onicegatheringstatechange=()=>{callLog.push(new Date().toLocaleTimeString('ja-JP')+' gather='+pc?.iceGatheringState);if(callLog.length>60)callLog.shift()};

  }
 };
}

async function handleSignal(s){
 try{
  if(s.type==='call'){ring('incoming');$('incoming').classList.remove('hidden');$('callLabel').textContent='受信中'}
  if(s.type==='offer'){pendingOffer=s.data;ring('incoming');$('incoming').classList.remove('hidden');$('callLabel').textContent='受信中'}
  if(s.type==='answer'){
   if(!pc)return;
   if(!pc.remoteDescription){await pc.setRemoteDescription(new RTCSessionDescription(s.data));await flush()}
  }
  if(s.type==='ice'){
   // 応答前は PeerConnection を作らない。候補は貯めるだけ。
   if(pc&&pc.remoteDescription){try{await pc.addIceCandidate(new RTCIceCandidate(s.data))}catch{}}
   else{pendingIce.push(s.data)}
  }
  if(s.type==='reject'||s.type==='hangup'){callWasLive=false;playDrop();endCall(false)}
 }catch(e){console.error('handleSignal',s?.type,e)}
}let appliedIce=new Set(),appliedAnswer='',pollCallKey='',callWasLive=false;
async function pollCall(){

  const k=s?JSON.stringify([s.state,s.from,s.at,(s.userIce||[]).length,(s.adminIce||[]).length,!!s.offer,!!s.answer]):'none';
  if(k!==pollCallKey){pollCallKey=k;await handleState(s)}
  else{restoreCallUI(s)}
 }catch{}
}
setInterval(pollCall,1000);

function iceKey(c){try{return (c.candidate||'')+'|'+(c.sdpMid||'')+'|'+(c.sdpMLineIndex??'')}catch{return Math.random().toString()}}
async function handleState(s){
 try{
  if(s?.offer)pendingOffer=s.offer;
  // サーバに残っている answer を回収（socket を取りこぼしても復旧できる）
  if(s?.answer&&pc&&pc.signalingState==='have-local-offer'){
   const k=JSON.stringify(s.answer).slice(0,120);
   if(k!==appliedAnswer){
    appliedAnswer=k;
    callLog.push(new Date().toLocaleTimeString('ja-JP')+' answer回収(polling)');
    await pc.setRemoteDescription(new RTCSessionDescription(s.answer));
    await flush();
   }
  }
  // サーバに残っている相手のICE候補を回収
  if(Array.isArray(s?.userIce)&&s.userIce.length){
   for(const c of s.userIce){
    const k=iceKey(c);
    if(appliedIce.has(k))continue;
    if(pc&&pc.remoteDescription){
     appliedIce.add(k);
     try{await pc.addIceCandidate(new RTCIceCandidate(c))}catch{}
    }else if(!pendingIce.some(x=>iceKey(x)===k)){pendingIce.push(c)}
