<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>イコエル 相談管理</title>
<style>
:root{--bg:#eef2f4;--panel:#fff;--line:#d9e0e4;--text:#182025;--sub:#78868f;--lime:#55d73b;--dark:#20282d;--red:#ed4b5b;--gold:#d39a24}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,"Noto Sans JP","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}
body{overflow:hidden}.login{padding:18px}.login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}.login button{width:100%;margin-top:8px;padding:11px;border:0;border-radius:10px;background:var(--dark);color:#fff;font-weight:800}
.app{display:none;height:100%;grid-template-rows:auto auto 1fr}.head{background:#fff;border-bottom:1px solid var(--line);padding:10px 11px}.title{display:flex;justify-content:space-between;align-items:center;font-weight:900}.unread{background:var(--red);color:#fff;border-radius:999px;padding:3px 7px;font-size:11px}
.search{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:8px}.search input,.search select{min-width:0;padding:8px;border:1px solid var(--line);border-radius:9px;background:#f7f9fa}
.tabs{display:flex;gap:5px;overflow-x:auto;padding:8px;background:#f8fafb;border-bottom:1px solid var(--line)}.tab{white-space:nowrap;border:1px solid #dce3e7;background:#fff;border-radius:999px;padding:7px 9px;font-size:11px;font-weight:800;color:#60707a;cursor:pointer}.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}.count{opacity:.8;margin-left:3px}
.main{display:grid;grid-template-columns:minmax(230px,38%) 1fr;min-height:0}.list{overflow:auto;padding:8px;border-right:1px solid var(--line)}.item{background:#fff;border:1px solid #dce3e6;border-radius:12px;padding:10px;margin-bottom:7px;cursor:pointer}.item.unread{border-left:4px solid var(--red)}.item.selected{box-shadow:0 0 0 2px #76dd6230;border-color:#76d966}.iTop{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#83919a}.iName{font-size:14px;font-weight:900;margin:4px 0}.iTags{display:flex;gap:4px;flex-wrap:wrap}.tag{background:#eff3f5;color:#62717a;border-radius:999px;padding:3px 6px;font-size:10px}.tag.red{background:#fff0f2;color:#c73949}.tag.green{background:#edfaea;color:#34782d}
.tag.reply{background:#dff5ff;color:#006b9d;font-weight:900;border:1px solid #73c9ed;box-shadow:0 0 0 2px #65c9f018}
.tag.replyNew{background:#fff0c9;color:#8b4c00;font-weight:950;border:1px solid #ffb83d;box-shadow:0 0 12px #ffb52d88;animation:replyPulse 1.05s ease-in-out infinite}
.item.unread{animation:itemGlow 1.25s ease-in-out infinite}
@keyframes replyPulse{0%,100%{transform:scale(1);box-shadow:0 0 7px #ffb52d66}50%{transform:scale(1.08);box-shadow:0 0 20px #ff9f1ccc}}
@keyframes itemGlow{0%,100%{box-shadow:0 0 0 1px #ffb52d22,0 0 7px #ffb52d22}50%{box-shadow:0 0 0 2px #ffb52d88,0 0 20px #ffb52d77}}
.snippet{font-size:11px;color:#697881;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{overflow:auto;background:#f7f9fa;padding:10px}.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#87949b}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px}.dHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.dNo{font-weight:900;font-size:16px}.dMeta{font-size:11px;color:#83919a;margin-top:3px}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.btn{border:0;border-radius:9px;padding:7px 9px;font-weight:800;font-size:11px;cursor:pointer}.btn.dark{background:var(--dark);color:#fff}.btn.green{background:#eaf9e7;color:#2e7e25}.btn.gold{background:#fff5dd;color:#9b6c00}.btn.red{background:#fff0f2;color:#b82f40}.btn.gray{background:#edf1f3;color:#56656d}
.msg{display:flex;gap:8px;margin:11px 0}.msg.admin{flex-direction:row-reverse}.avatar{width:34px;height:34px;border-radius:50%;background:#e6ebed;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;flex:0 0 34px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.msg.admin .avatar{background:#20282d;color:#78ee5d}.bubble{max-width:80%;background:#f1f4f5;border-radius:13px 13px 13px 4px;padding:9px 11px}.msg.admin .bubble{background:#f3f8f1;border-left:3px solid #59d23f;border-radius:13px 13px 4px 13px}.mMeta{font-size:10px;color:#819099;margin-bottom:4px}.mText{font-size:14px;font-weight:650;line-height:1.5;white-space:pre-wrap}
.attachments{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.att{border:1px solid #dce3e6;background:#f8fafb;border-radius:8px;padding:5px;max-width:230px}.att img{width:210px;max-height:140px;object-fit:cover;border-radius:6px;cursor:zoom-in}.att video{width:210px;max-height:150px}.att audio{width:210px}.attName{font-size:9px;color:#74828a;margin-top:4px;word-break:break-all}.att a{font-size:10px;color:#2d7897}
.reply textarea,.broadcast textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;resize:vertical}.fileInput{width:100%;padding:7px;border:1px dashed #cfd8dc;border-radius:9px;background:#f8fafb;margin-top:6px}.fileQueue{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.fileChip{font-size:9px;padding:5px 6px;border-radius:8px;background:#eef3f5}.fileChip button{border:0;background:transparent;font-weight:900;cursor:pointer}.template{display:flex;gap:5px;margin:6px 0}.template select{flex:1;min-width:0}.preview{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:99;padding:20px}.preview.show{display:flex}.preview img{max-width:95vw;max-height:92vh}
@media(max-width:720px){.main{grid-template-columns:1fr}.list{border-right:0}.detail{display:none}.detail.mobileShow{display:block;position:fixed;inset:0;z-index:40}.list.mobileHide{display:none}}

.settingsModal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:120;padding:16px}.settingsModal.show{display:flex}
.settingsBox{width:min(420px,95vw);background:#fff;border-radius:16px;padding:16px;border:1px solid #d9e0e4;box-shadow:0 20px 60px #0004}.settingsBox h3{margin:0 0 12px}.settingRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #edf1f2}.settingRow input[type=range]{width:160px}
.voicePanel{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:9px;padding:8px;background:#f3f8f1;border-radius:10px;border:1px solid #dcebd8}.onlineDot{width:8px;height:8px;border-radius:50%;background:#aaa}.onlineDot.on{background:#4bd42e;box-shadow:0 0 10px #4bd42e}.voiceStat{font-size:11px;font-weight:800;color:#5b6b62;margin-right:auto}
.incomingAdmin{display:none;margin-top:8px;padding:9px;border:1px solid #f2c46b;background:#fff4de;border-radius:10px;animation:incomingAdminPulse 1s ease-in-out infinite}.incomingAdmin.show{display:block}@keyframes incomingAdminPulse{0%,100%{box-shadow:0 0 7px #f3b84b33}50%{box-shadow:0 0 22px #f3b84b99}}

.micSelectWrap{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#596970}
.micSelect{max-width:190px;border:1px solid #d4dde1;background:#fff;border-radius:8px;padding:6px 8px;font-size:11px;color:#263238;outline:none}

.callVolumeWrap{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:900;color:#596970;white-space:nowrap}
.callVolumeWrap input{width:105px;accent-color:#4fcf36;cursor:pointer}
.callVolumeWrap b{min-width:32px;text-align:right}
.muteState{transition:.15s}.muteState.isMuted{background:#ffe3e7!important;color:#b42336!important;border-color:#ef9aa6!important;box-shadow:0 0 0 2px #ef9aa622}

.micMeterWrap{display:flex;align-items:center;gap:5px;min-width:120px}
.micMeterIcon{font-size:12px}
.micMeter{width:72px;height:8px;background:#dfe6e2;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 2px #0002}
.micMeter i{display:block;width:0%;height:100%;background:linear-gradient(90deg,#51d936 0%,#b6dc32 65%,#efb431 82%,#e65353 100%);border-radius:inherit;transition:width .055s linear}
.micMeterWrap b{width:30px;font-size:10px;color:#617068;text-align:right}

.adminCallHistoryItem{display:flex;justify-content:space-between;gap:8px;padding:7px 8px;border-bottom:1px solid #edf1f2;font-size:10px;color:#687780}.adminCallHistoryItem:last-child{border-bottom:0}.adminCallHistoryItem b{color:#263238}

.overlaySettings{margin-top:12px;padding-top:10px;border-top:1px solid #edf1f2}.overlayGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.overlayGrid label{display:grid;grid-template-columns:42px 1fr 48px;align-items:center;gap:5px;font-size:10px;color:#617078}.overlayGrid input{width:100%;accent-color:#55d73b}
</style>
</head>
<body>
<div id="login" class="login"><b>管理キー</b><input id="key" type="password"><button id="loginBtn">開く</button><div id="loginErr"></div></div>
<div id="app" class="app">
  <div class="head">
    <div class="title"><span>イコエル相談管理</span><div style="display:flex;gap:7px;align-items:center"><button id="settingsBtn" class="btn gray">⚙ 通知設定</button><span class="unread" id="unread">0</span></div></div>
    <div class="search"><input id="q" placeholder="相談番号・名前・本文を検索"><select id="type"><option value="">全種類</option><option value="consult">相談</option><option value="info">情報提供</option></select><select id="category"><option value="">全カテゴリ</option><option>配信</option><option>活動者</option><option>事件・トラブル</option><option>その他</option></select></div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="new">受信箱 <span class="count" id="cNew">0</span></button>
    <button class="tab" data-tab="in_progress">対応中 <span class="count" id="cProgress">0</span></button>
    <button class="tab" data-tab="resolved">対応済み <span class="count" id="cResolved">0</span></button>
    <button class="tab" data-tab="starred">★重要 <span class="count" id="cStarred">0</span></button>
    <button class="tab" data-tab="archived">アーカイブ <span class="count" id="cArchived">0</span></button>
    <button class="tab" data-tab="blocked">ブロック <span class="count" id="cBlocked">0</span></button>
  </div>
  <div class="main">
    <div id="list" class="list"></div>
    <div id="detail" class="detail"><div class="empty">相談を選択してください</div></div>
  </div>
</div>
<div id="settingsModal" class="settingsModal"><div class="settingsBox"><h3>通知設定</h3>
<div class="settingRow"><span>🔔 新規相談音</span><input id="setNewSound" type="checkbox"></div>
<div class="settingRow"><span>💬 追加メッセージ音</span><input id="setReplySound" type="checkbox"></div>
<div class="settingRow"><span>📞 着信音</span><input id="setCallSound" type="checkbox"></div>
<div class="settingRow"><span>🖥 OBSベル表示</span><input id="setOverlay" type="checkbox"></div>
<div class="settingRow"><span>🔥 緊急は強制通知</span><input id="setUrgentForce" type="checkbox"></div>
<div class="settingRow"><span>🔊 通知音量</span><input id="setVolume" type="range" min="0" max="100" step="1"><b id="volLabel"></b></div>
<div style="display:flex;gap:8px;margin-top:12px"><button id="testSound" class="btn green">テスト再生</button><button id="closeSettings" class="btn dark">閉じる</button></div>
</div></div>
<div id="preview" class="preview" onclick="this.classList.remove('show')"><img id="previewImg"></div>

let KEY=localStorage.consultAdminKey||'',tab='new',items=[],cur=null,es=null,templates=[],replyFiles=[],pollTimer=null,draftText='';
function headers(){return {'Content-Type':'application/json','x-admin-key':KEY}}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-key':KEY};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'エラー');return j}

const defaultNotifySettings={newSound:true,replySound:true,callSound:true,overlay:true,urgentForce:true,volume:70};
let notifySettings=Object.assign({},defaultNotifySettings,JSON.parse(localStorage.getItem('consult_notify_settings')||'{}'));
function saveNotify(){localStorage.setItem('consult_notify_settings',JSON.stringify(notifySettings))}
function syncNotifyUI(){
 $('setNewSound').checked=notifySettings.newSound;$('setReplySound').checked=notifySettings.replySound;$('setCallSound').checked=notifySettings.callSound;$('setOverlay').checked=notifySettings.overlay;$('setUrgentForce').checked=notifySettings.urgentForce;$('setVolume').value=notifySettings.volume;$('volLabel').textContent=notifySettings.volume+'%';
}
function playTone(kind='new'){
 const enabled=kind==='call'?notifySettings.callSound:kind==='reply'?notifySettings.replySound:notifySettings.newSound;
 if(!enabled)return;
 if(kind==='call'){dockBeep(760,.18,0,.15);dockBeep(920,.18,.23,.15)}
 else if(kind==='reply'){dockBeep(650,.16,0,.12);dockBeep(760,.12,.18,.10)}
 else {dockBeep(520,.18,0,.12);dockBeep(660,.16,.20,.10)}
}
$('settingsBtn').onclick=()=>{syncNotifyUI();$('settingsModal').classList.add('show')};$('closeSettings').onclick=()=>$('settingsModal').classList.remove('show');
['setNewSound','setReplySound','setCallSound','setOverlay','setUrgentForce'].forEach(id=>$(id).onchange=()=>{notifySettings[id.replace('set','').replace('NewSound','newSound').replace('ReplySound','replySound').replace('CallSound','callSound').replace('Overlay','overlay').replace('UrgentForce','urgentForce')]=$(id).checked;saveNotify()});
$('setVolume').oninput=()=>{notifySettings.volume=Number($('setVolume').value);$('volLabel').textContent=notifySettings.volume+'%';saveNotify()};$('testSound').onclick=()=>playTone('new');


let dockAudioCtx=null,dockRingTimer=null;
function unlockDockAudio(){
 try{
  if(!dockAudioCtx)dockAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(dockAudioCtx.state==='suspended')dockAudioCtx.resume();
 }catch{}
}
document.addEventListener('pointerdown',unlockDockAudio,{passive:true});
function dockBeep(freq,duration=.18,delay=0,gain=.12){
 unlockDockAudio();if(!dockAudioCtx)return;
 const o=dockAudioCtx.createOscillator(),g=dockAudioCtx.createGain(),t=dockAudioCtx.currentTime+delay;
 o.connect(g);g.connect(dockAudioCtx.destination);o.frequency.value=freq;
 g.gain.setValueAtTime(gain*(notifySettings.volume/100),t);
 g.gain.exponentialRampToValueAtTime(.001,t+duration);o.start(t);o.stop(t+duration+.02);
}
function stopDockRing(){if(dockRingTimer){clearInterval(dockRingTimer);dockRingTimer=null}}
function startDockRing(kind){
 stopDockRing();if(!notifySettings.callSound)return;
 const play=()=>{
  if(kind==='incoming'){dockBeep(900,.18,0,.16);dockBeep(1080,.18,.26,.16)}
  else {dockBeep(440,.26,0,.12);dockBeep(520,.26,.38,.12)}
 };
 play();dockRingTimer=setInterval(play,1500);
}
function playDockDisconnect(){stopDockRing();dockBeep(520,.12,0,.14);dockBeep(310,.22,.15,.14)}

function statusText(s){return s==='resolved'?'対応済み':s==='in_progress'?'対応中':'未対応'}
function permText(p){return p==='allow'?'掲載OK':p==='anonymous_only'?'匿名掲載のみ':p==='ask'?'要相談':'掲載不可'}
function setCounts(c={}){$('cNew').textContent=c.inbox||0;$('cProgress').textContent=c.inProgress||0;$('cResolved').textContent=c.resolved||0;$('cStarred').textContent=c.starred||0;$('cArchived').textContent=c.archived||0;$('cBlocked').textContent=c.blocked||0}
function query(){
 const p=new URLSearchParams();
 if($('q').value)p.set('q',$('q').value);if($('type').value)p.set('type',$('type').value);if($('category').value)p.set('category',$('category').value);
 if(tab==='new'||tab==='in_progress'||tab==='resolved')p.set('status',tab);
 if(tab==='starred')p.set('starred','1');if(tab==='archived')p.set('archived','1');if(tab==='blocked')p.set('blocked','1');
 return p.toString()
}

function detailInteractionActive(){
 const a=document.activeElement;
 return !!(a&&$('detail')&&$('detail').contains(a)&&['SELECT','INPUT','TEXTAREA','BUTTON'].includes(a.tagName));
}
let pendingDetailRefresh=false;
function safeRenderDetail(){
 if(detailInteractionActive()){pendingDetailRefresh=true;return}
 pendingDetailRefresh=false;renderDetail();
}
document.addEventListener('focusout',()=>{if(pendingDetailRefresh)setTimeout(()=>{if(!detailInteractionActive()&&cur)safeRenderDetail()},80)});

async function load(){
 const d=await api('/api/consult/admin/list?'+query());
 items=d.conversations;templates=d.templates||[];
 $('unread').textContent=d.unreadCount;setCounts(d.counts);
 if(cur){
   const fresh=items.find(x=>x.id===cur.id);
   if(fresh){cur=fresh;safeRenderDetail()}
 }
 renderList();

function stopMicMeter(){
 if(micMeterRAF)cancelAnimationFrame(micMeterRAF);micMeterRAF=0;
 try{micMeterSource?.disconnect()}catch{};micMeterSource=null;micMeterAnalyser=null;
 const bar=$('micMeterBar'),pct=$('micMeterPct');if(bar)bar.style.width='0%';if(pct)pct.textContent='0%';
}
function startMicMeter(stream){
 stopMicMeter();if(!stream)return;
 try{
  if(!micMeterCtx)micMeterCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(micMeterCtx.state==='suspended')micMeterCtx.resume();
  micMeterAnalyser=micMeterCtx.createAnalyser();micMeterAnalyser.fftSize=512;micMeterAnalyser.smoothingTimeConstant=.72;
  micMeterSource=micMeterCtx.createMediaStreamSource(stream);micMeterSource.connect(micMeterAnalyser);
  const data=new Uint8Array(micMeterAnalyser.fftSize);
  const draw=()=>{
   if(!micMeterAnalyser)return;
   micMeterAnalyser.getByteTimeDomainData(data);
   let sum=0;for(let i=0;i<data.length;i++){const v=(data[i]-128)/128;sum+=v*v}
   const rms=Math.sqrt(sum/data.length);
   let level=Math.min(100,Math.max(0,Math.round(rms*320)));
   if(adminMuted)level=0;
   const bar=$('micMeterBar'),pct=$('micMeterPct');if(bar)bar.style.width=level+'%';if(pct)pct.textContent=level+'%';
   micMeterRAF=requestAnimationFrame(draw);
  };draw();
 }catch{}
}

async function adminEnsureVoice(){
 if(adminPc)return;
 await stopMicPreview();
 const selectedMic=localStorage.getItem('consult_voice_mic')||'';
 const audioConstraints={echoCancellation:true,noiseSuppression:true,autoGainControl:true};
 if(selectedMic)audioConstraints.deviceId={exact:selectedMic};
 try{adminLocalStream=await navigator.mediaDevices.getUserMedia({audio:audioConstraints,video:false});startMicMeter(adminLocalStream)}
 catch(e){if(selectedMic){localStorage.removeItem('consult_voice_mic');adminLocalStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});startMicMeter(adminLocalStream)}else throw e}
 adminPc=new RTCPeerConnection(ADMIN_RTC);adminLocalStream.getTracks().forEach(t=>adminPc.addTrack(t,adminLocalStream));
 adminRemoteAudio=document.createElement('audio');adminRemoteAudio.autoplay=true;adminRemoteAudio.playsInline=true;adminRemoteAudio.volume=adminCallVolume/100;document.body.appendChild(adminRemoteAudio);
 adminPc.ontrack=e=>{adminRemoteAudio.srcObject=e.streams[0]};
 adminPc.onicecandidate=e=>{if(e.candidate)adminVoiceSignal('ice',e.candidate)};
 adminPc.onconnectionstatechange=()=>{if(adminPc?.connectionState==='connected'){adminVoiceUiState='connected';stopDockRing();if($('voiceStat'))$('voiceStat').textContent='通話中';if($('voiceMuteBtn'))$('voiceMuteBtn').style.display='';if($('voiceHangBtn'))$('voiceHangBtn').style.display='';if($('voiceCallBtn'))$('voiceCallBtn').style.display='none'}if(['failed','closed','disconnected'].includes(adminPc?.connectionState))adminEndVoice(false)}
}
async function adminMakeCall(){try{adminVoiceUiState='outgoing';startDockRing('outgoing');restoreAdminVoiceUI();await adminEnsureVoice();await loadVoiceMics();await adminVoiceSignal('call');const offer=await adminPc.createOffer({offerToReceiveAudio:true});await adminPc.setLocalDescription(offer);await adminVoiceSignal('offer',offer);if($('voiceStat'))$('voiceStat').textContent='発信中'}catch{if($('voiceStat'))$('voiceStat').textContent='マイクを利用できません'}}
async function adminAcceptCall(){try{adminIncoming=false;adminVoiceUiState='connected';stopDockRing();restoreAdminVoiceUI();await adminEnsureVoice();await loadVoiceMics();if(adminPendingOffer){await adminPc.setRemoteDescription(new RTCSessionDescription(adminPendingOffer));await adminFlushIce();const ans=await adminPc.createAnswer();await adminPc.setLocalDescription(ans);await adminVoiceSignal('answer',ans);adminPendingOffer=null}await adminVoiceSignal('accept')}catch{}}

async function adminEndVoice(send=true){if(send&&cur)try{await adminVoiceSignal('hangup')}catch{};if(adminPc){try{adminPc.close()}catch{}adminPc=null}if(adminLocalStream){adminLocalStream.getTracks().forEach(t=>t.stop());adminLocalStream=null}stopMicMeter();if(adminRemoteAudio){adminRemoteAudio.remove();adminRemoteAudio=null}adminPendingOffer=null;adminPendingIce=[];adminMuted=false;adminIncoming=false;adminVoiceUiState='disconnected';playDockDisconnect();if($('voiceMuteBtn'))$('voiceMuteBtn').style.display='none';if($('voiceHangBtn'))$('voiceHangBtn').style.display='none';if($('voiceCallBtn'))$('voiceCallBtn').style.display='';}

function startAdminVoiceEvents(){
 if(!cur)return;if(adminVoiceES){adminVoiceES.close();adminVoiceES=null}
 adminVoiceES=new EventSource(`/api/consult/admin/${cur.id}/voice-events?key=${encodeURIComponent(KEY)}`);
 adminVoiceES.addEventListener('presence',e=>{const p=JSON.parse(e.data);adminUserOnline=!!p.userOnline;restoreAdminVoiceUI()});
 adminVoiceES.addEventListener('call-state',e=>{const s=JSON.parse(e.data);
 if(s.state==='ringing'&&s.from==='user'){if(s.offer)adminPendingOffer=s.offer;adminIncoming=true;adminVoiceUiState='incoming';startDockRing('incoming')}
 else if(s.state==='connected'){adminVoiceUiState='connected'}
 restoreAdminVoiceUI()});
 adminVoiceES.addEventListener('signal',async e=>{const s=JSON.parse(e.data);try{
   if(s.type==='call'){adminIncoming=true;adminVoiceUiState='incoming';startDockRing('incoming');restoreAdminVoiceUI()}
   else if(s.type==='offer'){adminPendingOffer=s.data;adminIncoming=true;adminVoiceUiState='incoming';startDockRing('incoming');restoreAdminVoiceUI()}
   else if(s.type==='answer'){await adminEnsureVoice();await adminPc.setRemoteDescription(new RTCSessionDescription(s.data));await adminFlushIce()}
   else if(s.type==='ice'){await adminEnsureVoice();if(s.data){if(adminPc.remoteDescription)await adminPc.addIceCandidate(new RTCIceCandidate(s.data));else adminPendingIce.push(s.data)}}
   else if(s.type==='reject'){playDockDisconnect();await adminEndVoice(false)}
   else if(s.type==='hangup'){playDockDisconnect();await adminEndVoice(false)}
 }catch{}});
 adminVoiceES.onerror=()=>{try{adminVoiceES.close()}catch{};adminVoiceES=null;setTimeout(()=>cur&&startAdminVoiceEvents(),1500)}
}

   try{

     if(d.conversation){
       if(d.conversation.unread&&d.conversation.lastSender==='user'){
         playTone(d.conversation.userMessageCount>1?'reply':'new');
       }
       const incoming=d.conversation;
       const i=items.findIndex(x=>x.id===incoming.id);
       if(i>=0)items[i]=incoming;else items.unshift(incoming);
       if(cur&&cur.id===incoming.id){cur=incoming;safeRenderDetail()}
       renderList();
     }
     clearTimeout(window._consultReload);
     window._consultReload=setTimeout(()=>load().catch(()=>{}),120);
   }catch{}
 };

   try{es.close()}catch{}
   es=null;

async function login(){KEY=$('key').value.trim();try{await api('/api/consult/admin/list');localStorage.consultAdminKey=KEY;$('login').style.display='none';$('app').style.display='grid';load();connect();startPolling()}catch(e){$('loginErr').textContent=e.message}}
$('loginBtn').onclick=login;if(KEY){$('key').value=KEY;login()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;clearDetail();load()});
let t;['q','type','category'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',()=>{clearTimeout(t);t=setTimeout(load,200)}));
</script>
</body>
</html>
