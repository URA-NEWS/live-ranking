:root{--bg:#0e1013;--panel:#171b20;--line:#2d343c;--accent:#53fc18;--text:#f5f7f8;--sub:#96a1ac;--danger:#ff4058;--gold:#ffc043}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Yu Gothic","Meiryo",sans-serif;font-size:13px}
.top{position:sticky;top:0;z-index:10;background:#101318;border-bottom:1px solid var(--line);padding:9px}.titleline{display:flex;justify-content:space-between;align-items:center}.unread{background:#ff354d;border-radius:999px;padding:4px 8px;font-weight:900}.tools{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:8px}input,select,textarea{background:#0e1115;color:#fff;border:1px solid #343d46;border-radius:7px;padding:8px;font:inherit}.filters{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}.filters select{padding:6px}.toggles{display:flex;gap:12px;margin-top:7px;color:#b4bec7;font-size:11px}
.list{padding:8px}.item{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:9px;margin-bottom:7px;cursor:pointer}.item.unreadItem{border-left:4px solid #ff4058}.item.star{box-shadow:inset 0 0 0 1px #ffc04355}.meta{display:flex;justify-content:space-between;gap:8px;color:#97a2ac;font-size:10px}.name{font-weight:900;font-size:14px;margin:4px 0}.snippet{color:#cdd3d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{display:inline-block;background:#252c33;padding:2px 5px;border-radius:5px;margin-right:4px;font-size:10px}.urgent{color:#ff5569}.detail{position:fixed;inset:0;background:#0d0f12;z-index:20;display:none;overflow:auto}.detail.show{display:block}.detailHead{position:sticky;top:0;background:#14181d;border-bottom:1px solid var(--line);padding:10px;display:flex;justify-content:space-between;align-items:center}.back{background:#292f36;color:#fff;border:0;border-radius:7px;padding:7px 10px}.body{padding:10px}.msg{background:#191e24;border-radius:9px;padding:9px;margin:8px 0}.msg.admin{border-left:3px solid var(--accent)}.msgMeta{font-size:10px;color:#89949e;margin-bottom:5px}.attachments a{display:block;color:#aaff91;margin-top:5px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.actions button,.sendBtn{border:0;border-radius:7px;padding:8px;font-weight:800;cursor:pointer}.starBtn{background:#5a4710;color:#ffe69a}.archiveBtn{background:#333b44;color:#fff}.blockBtn{background:#5a1c26;color:#ffb0bb}.broadcastBtn{background:#235b14;color:#baff9f}.replybox textarea,.broadcastText{width:100%;min-height:85px}.templateRow{display:flex;gap:5px;margin:6px 0}.templateRow select{flex:1;min-width:0}.sendBtn{width:100%;background:var(--accent);color:#071007;margin-top:6px}.perm{padding:8px;border-radius:8px;background:#20262c;margin:8px 0}.status{font-size:11px;color:#aaff91;min-height:16px}
.login{padding:14px}.login input{width:100%;margin:8px 0}.login button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--accent);font-weight:900}

<div class="filters"><select id="type"><option value="">全種類</option><option value="consult">相談</option><option value="info">情報提供</option></select><select id="category"><option value="">全カテゴリ</option><option>配信</option><option>活動者</option><option>事件・トラブル</option><option>その他</option></select><select id="view"><option value="normal">受信箱</option><option value="starred">★重要</option><option value="archived">アーカイブ</option></select></div>
<div class="toggles"><label><input id="overlay" type="checkbox"> 新着通知を配信画面に出す</label><label><input id="sound" type="checkbox"> 通知音</label></div></div><div class="list" id="list"></div></div>
<div class="detail" id="detail"><div class="detailHead"><button class="back" id="back">← 戻る</button><b id="dTitle"></b><span id="dDate"></span></div><div class="body">
<div id="dInfo"></div><div class="actions"><button id="starBtn" class="starBtn">★ 重要</button><button id="archiveBtn" class="archiveBtn">アーカイブ</button><button id="blockBtn" class="blockBtn">NG/ブロック</button></div>
<div id="messages"></div>
<div class="replybox"><div class="templateRow"><select id="templates"></select><button id="useTpl">挿入</button><button id="addTpl">＋</button></div><textarea id="replyText" placeholder="相談者へ返信"></textarea><button id="sendReply" class="sendBtn">返信する</button><div class="status" id="replyStatus"></div></div>
<hr style="border-color:#2d343c;border-style:solid;border-width:1px 0 0;margin:14px 0"><b>配信で取り上げる</b><div class="perm" id="permission"></div><textarea id="broadcastText" class="broadcastText" placeholder="配信画面に出す文章（編集可能）"></textarea><div class="actions"><button id="broadcastBtn" class="broadcastBtn">配信で取り上げる</button><button id="clearBroadcast" class="archiveBtn">表示を消す</button></div><div class="status" id="broadcastStatus"></div>
</div></div>
<script>
const $=i=>document.getElementById(i);let KEY=localStorage.consultAdminKey||'',items=[],cur=null;
function h(){return {'Content-Type':'application/json','x-admin-key':KEY}}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function dt(s){return new Date(s).toLocaleString('ja-JP')}

function attachmentHtml(a){
 const base=`/api/consult/admin/${cur.id}/attachment/${a.id}?key=${encodeURIComponent(KEY)}`;
 const inline=base+'&inline=1';
 const mime=(a.mime||'').toLowerCase();
 let media='';
 if(mime.startsWith('image/')) media=`<img src="${inline}" alt="${esc(a.name)}" onclick="event.preventDefault();openPreview('${inline.replace(/'/g,"%27")}')">`;
 else if(mime.startsWith('video/')) media=`<video src="${inline}" controls preload="metadata"></video>`;
 else if(mime.startsWith('audio/')) media=`<audio src="${inline}" controls preload="metadata"></audio>`;
 return `<div class="attachmentCard">${media}<div class="attachmentName">📎 ${esc(a.name)} (${Math.round(a.size/1024)}KB)</div><a href="${base}">ダウンロード</a></div>`;
}
function openPreview(src){$('previewImage').src=src;$('previewModal').classList.add('show')}

async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-key':KEY};let r=await fetch(url,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'エラー');return d}
function showApp(){localStorage.consultAdminKey=KEY;$('login').style.display='none';$('app').style.display='block';load();connect()}
$('loginBtn').onclick=async()=>{KEY=$('keyInput').value.trim();try{await api('/api/consult/admin/list');showApp()}catch(e){$('loginErr').textContent=e.message}}
if(KEY){$('keyInput').value=KEY;api('/api/consult/admin/list').then(showApp).catch(()=>{})}
async function load(){let p=new URLSearchParams();if($('search').value)p.set('q',$('search').value);if($('type').value)p.set('type',$('type').value);if($('category').value)p.set('category',$('category').value);if($('view').value==='archived')p.set('archived','1');if($('view').value==='starred')p.set('starred','1');let d=await api('/api/consult/admin/list?'+p);items=d.conversations;$('unread').textContent=d.unreadCount;$('overlay').checked=d.config.notificationOverlay;$('sound').checked=d.config.soundEnabled;fillTpl(d.templates);renderList()}
function renderList(){$('list').innerHTML=items.map(c=>{let last=c.messages[c.messages.length-1];return `<div class="item ${c.unread?'unreadItem':''} ${c.starred?'star':''}" data-id="${c.id}"><div class="meta"><span>${esc(c.consultNo)} ${c.urgent?'<b class="urgent">🔥緊急</b>':''}</span><span>${dt(c.updatedAt)}</span></div><div class="name">${esc(c.displayName)} ${c.starred?'★':''}</div><div><span class="tag">${c.type==='info'?'📎 情報提供':'💬 相談'}</span><span class="tag">${esc(c.category)}</span></div><div class="snippet">${esc(last?.text||'(添付のみ)')}</div></div>`}).join('');document.querySelectorAll('.item').forEach(x=>x.onclick=()=>openItem(x.dataset.id))}
async function openItem(id){cur=items.find(x=>x.id===id)||await api('/api/consult/admin/list').then(d=>d.conversations.find(x=>x.id===id));if(!cur)return;if(cur.unread){await api(`/api/consult/admin/${cur.id}/read`,{method:'POST'});cur.readAt=new Date().toISOString();cur.unread=false}
$('detail').classList.add('show');$('dTitle').textContent=cur.consultNo+' '+cur.displayName;$('dDate').textContent=dt(cur.createdAt);$('dInfo').innerHTML=`<span class="tag">${cur.type==='info'?'情報提供':'相談'}</span><span class="tag">${esc(cur.category)}</span>${cur.urgent?'<span class="tag urgent">🔥緊急</span>':''}<br><small>掲載許可: ${permText(cur.permission)} / 端末:${cur.deviceFingerprint}</small>`;$('starBtn').textContent=cur.starred?'★ 重要解除':'☆ 重要';$('archiveBtn').textContent=cur.archived?'受信箱へ戻す':'アーカイブ';$('blockBtn').textContent=cur.blocked?'ブロック解除':'NG/ブロック';
$('messages').innerHTML=cur.messages.map(m=>`<div class="msg ${m.sender==='admin'?'admin':''}"><div class="msgMeta">${m.sender==='admin'?'イコエル':'相談者'} ・ ${dt(m.createdAt)}</div><div>${esc(m.text).replace(/\n/g,'<br>')}</div><div class="attachments">${m.attachments.map(attachmentHtml).join('')}</div></div>`).join('');$('permission').textContent=permText(cur.permission);$('broadcastText').value=cur.messages[0]?.text||'';$('broadcastBtn').disabled=cur.permission==='deny';await load()}
function permText(p){return p==='allow'?'掲載OK':p==='anonymous_only'?'匿名化した場合のみOK':'掲載不可'}
$('back').onclick=()=>{$('detail').classList.remove('show');cur=null}
$('reload').onclick=load;let st;['search','type','category','view'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{clearTimeout(st);st=setTimeout(load,250)}))
async function cfg(){await api('/api/consult/admin/config',{method:'POST',headers:h(),body:JSON.stringify({notificationOverlay:$('overlay').checked,soundEnabled:$('sound').checked})})}$('overlay').onchange=cfg;$('sound').onchange=cfg;
$('starBtn').onclick=async()=>{await api(`/api/consult/admin/${cur.id}/star`,{method:'POST',headers:h(),body:JSON.stringify({value:!cur.starred})});cur.starred=!cur.starred;openItem(cur.id)}
$('archiveBtn').onclick=async()=>{await api(`/api/consult/admin/${cur.id}/archive`,{method:'POST',headers:h(),body:JSON.stringify({value:!cur.archived})});$('detail').classList.remove('show');load()}
$('blockBtn').onclick=async()=>{if(!confirm(cur.blocked?'この端末のブロックを解除しますか？':'この端末からの今後の送信をブロックしますか？'))return;await api(`/api/consult/admin/${cur.id}/block`,{method:'POST',headers:h(),body:JSON.stringify({value:!cur.blocked})});cur.blocked=!cur.blocked;openItem(cur.id)}
$('sendReply').onclick=async()=>{let text=$('replyText').value.trim();if(!text)return;try{let d=await api(`/api/consult/admin/${cur.id}/reply`,{method:'POST',headers:h(),body:JSON.stringify({text})});cur=d.conversation;$('replyText').value='';$('replyStatus').textContent='返信しました';openItem(cur.id)}catch(e){$('replyStatus').textContent=e.message}}
function fillTpl(arr){let old=$('templates').value;$('templates').innerHTML=(arr||[]).map((t,i)=>`<option value="${i}">${esc(t.slice(0,35))}</option>`).join('');if(old)$('templates').value=old;$('templates').dataset.full=JSON.stringify(arr||[])}
$('useTpl').onclick=()=>{let a=JSON.parse($('templates').dataset.full||'[]');$('replyText').value=a[Number($('templates').value)]||''}
$('addTpl').onclick=async()=>{let t=prompt('追加する返信テンプレート');if(!t)return;let d=await api('/api/consult/admin/templates',{method:'POST',headers:h(),body:JSON.stringify({text:t})});fillTpl(d.templates)}
$('broadcastBtn').onclick=async()=>{try{await api(`/api/consult/admin/${cur.id}/broadcast`,{method:'POST',headers:h(),body:JSON.stringify({text:$('broadcastText').value})});$('broadcastStatus').textContent='配信画面に表示しました'}catch(e){$('broadcastStatus').textContent=e.message}}
$('clearBroadcast').onclick=async()=>{await api('/api/consult/admin/broadcast/clear',{method:'POST',headers:h()});$('broadcastStatus').textContent='表示を消しました'}
function connect(){let es=new EventSource('/api/consult/admin/events?key='+encodeURIComponent(KEY));es.addEventListener('new',e=>{let d=JSON.parse(e.data);$('unread').textContent=d.unreadCount;load()});es.addEventListener('update',e=>{let d=JSON.parse(e.data);$('unread').textContent=d.unreadCount;load()})}
</script><div id="previewModal" class="previewModal" onclick="this.classList.remove('show')"><img id="previewImage"></div></body></html>
