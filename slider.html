<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>URA Streamer Slider</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1280px;height:720px;overflow:hidden;background:transparent;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif;}

#root{position:absolute;display:flex;flex-direction:column;background:rgba(0,0,0,.85);}

#root.h-mode{left:0;right:0;width:1280px;}
#root.h-mode.pos-bottom{bottom:0;border-top:2px solid var(--accent,#e53e3e);}
#root.h-mode.pos-top{top:0;border-bottom:2px solid var(--accent,#e53e3e);flex-direction:column-reverse;}
#root.v-mode{top:0;bottom:0;height:720px;}
#root.v-mode.pos-right{right:0;border-left:2px solid var(--accent,#e53e3e);}
#root.v-mode.pos-left{left:0;border-right:2px solid var(--accent,#e53e3e);}

#hdr{display:flex;align-items:center;gap:10px;padding:5px 14px;background:rgba(10,10,10,.95);border-bottom:1px solid #1a1a1a;font-size:11px;flex-shrink:0;}
#root.v-mode #hdr{flex-direction:column;align-items:flex-start;gap:5px;border-bottom:1px solid #1a1a1a;border-right:none;padding:8px 12px;}
#root.h-mode.pos-top #hdr{border-bottom:none;border-top:1px solid #1a1a1a;}

.hd-logo{color:#fff;font-weight:500;letter-spacing:.1em;}
.hd-logo span{color:var(--accent,#e53e3e);}
.hd-pill{background:rgba(229,62,62,.15);border:1px solid var(--accent,#e53e3e);color:var(--accent,#e53e3e);font-weight:500;padding:2px 8px;border-radius:2px;font-size:10px;letter-spacing:.04em;}
.hd-count{color:#888;font-weight:500;font-family:'SF Mono',monospace;font-size:10px;}
#root.h-mode .hd-count{margin-left:auto;}
.hd-live{display:flex;align-items:center;gap:4px;color:var(--accent,#e53e3e);font-size:10px;font-weight:500;letter-spacing:.1em;}
.hd-live::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
#root.v-mode .hd-meta{display:flex;justify-content:space-between;width:100%;align-items:center;}

#stage{flex:1;overflow:hidden;display:flex;}
#root.h-mode #stage{padding:8px 0;align-items:center;}
#root.v-mode #stage{padding:8px 0;flex-direction:column;}

#track{display:flex;gap:8px;will-change:transform;}
#root.h-mode #track{flex-direction:row;padding:0 10px;animation:hroll var(--speed,70s) linear infinite;}
#root.v-mode #track{flex-direction:column;padding:0 10px;animation:vroll var(--speed,60s) linear infinite;}
@keyframes hroll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
@keyframes vroll{0%{transform:translateY(0);}100%{transform:translateY(-50%);}}

/* 一時停止 */
#root.paused #track{animation-play-state:paused !important;}

/* スポットライト（急上昇/お気に入り通知時に該当カードを光らせる） */
.scard.spotlight{
  z-index:5;
  transform:scale(1.18);
  transition:transform .5s cubic-bezier(.16,1,.3,1),box-shadow .5s ease;
  box-shadow:0 0 30px 8px #fff,0 0 60px 12px var(--accent,#e53e3e);
  border-color:#fff !important;
}
#paused-indicator{
  display:none;
  position:absolute;top:6px;right:6px;
  background:rgba(255,180,0,.95);color:#000;
  font-size:10px;font-weight:700;letter-spacing:.1em;
  padding:3px 9px;border-radius:3px;
  z-index:15;
  box-shadow:0 2px 6px rgba(0,0,0,.4);
}
#root.paused #paused-indicator{display:block;}

.scard{flex-shrink:0;display:flex;flex-direction:column;background:rgba(13,13,13,var(--cardop,.95));border:1px solid #1f1f1f;border-radius:3px;overflow:hidden;width:var(--thumbw,148px);position:relative;}

/* HOT/急上昇 - 派手な点滅ふち */
.scard.hot{
  border:2.5px solid var(--accent,#e53e3e);
  background:rgba(20,4,4,var(--cardop,.95));
  animation:hot-pulse 1.2s ease-in-out infinite;
  box-shadow:0 0 14px var(--accent,#e53e3e),inset 0 0 8px rgba(229,62,62,.3);
}
@keyframes hot-pulse{
  0%,100%{box-shadow:0 0 14px var(--accent,#e53e3e),inset 0 0 8px rgba(229,62,62,.3);border-color:var(--accent,#e53e3e);}
  50%{box-shadow:0 0 24px var(--accent,#e53e3e),0 0 38px rgba(229,62,62,.6),inset 0 0 14px rgba(229,62,62,.5);border-color:#fff;}
}

.scard.pinned{border:2px solid #ffd700;box-shadow:0 0 8px rgba(255,215,0,.4);}
.scard.pinned.hot{border:2.5px solid #ffaa00;box-shadow:0 0 18px #ff6600,inset 0 0 10px rgba(255,150,0,.4);}

.scard-thumb{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;background:#0a0a0a;}
.scard-thumb img{width:100%;height:100%;object-fit:cover;}

/* プラットフォームバッジ - サイズ調整可能 */
.scard-plat{
  position:absolute;top:4px;left:4px;color:#000;
  font-size:var(--platsize,11px);font-weight:700;
  padding:2px 7px;border-radius:3px;line-height:1.4;letter-spacing:.04em;
  box-shadow:0 1px 3px rgba(0,0,0,.5);
}
.scard-plat.fwt{background:rgba(255,154,60,.97);}
.scard-plat.twc{background:rgba(77,184,255,.97);}
.scard-plat.kck{background:rgba(83,252,24,.97);color:#000;}

/* 急上昇バッジ */
.scard-rising{
  position:absolute;bottom:4px;right:4px;
  background:var(--accent,#e53e3e);color:#fff;
  font-size:var(--risesize,11px);font-weight:700;
  padding:2px 6px;border-radius:3px;
  display:flex;align-items:center;gap:2px;
  animation:flash .7s ease-in-out infinite;line-height:1.4;
  box-shadow:0 0 10px var(--accent,#e53e3e);
}
@keyframes flash{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.65;transform:scale(1.08);}}

.scard-pin{
  position:absolute;bottom:4px;left:4px;
  background:#ffd700;color:#000;
  font-size:var(--platsize,11px);font-weight:700;
  padding:2px 6px;border-radius:3px;line-height:1.4;
  box-shadow:0 1px 3px rgba(0,0,0,.5);
}

/* 視聴者数バッジ - サイズ調整可能 */
.scard-viewers{
  position:absolute;top:4px;right:4px;
  background:rgba(0,0,0,.82);color:#fff;
  font-size:var(--viewsize,13px);font-weight:600;
  padding:2px 7px;border-radius:3px;
  font-family:'SF Mono','Helvetica Neue',sans-serif;line-height:1.4;
  box-shadow:0 1px 3px rgba(0,0,0,.5);
}
.scard-viewers::before{content:"●";color:var(--accent,#e53e3e);margin-right:4px;font-size:.7em;}
.scard-comments::before{content:"💬";margin-right:3px;font-size:.85em;}
.scard-comments{background:rgba(255,85,136,.92) !important;color:#fff !important;}

.scard-info{padding:5px 7px;display:flex;flex-direction:column;gap:1px;}
.scard-name{color:#fff;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;font-size:var(--namesize,11px);}
.scard-title{color:#999;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;font-size:var(--titlesize,9px);}

/* テロップ通知 */
#alert{
  position:absolute;left:50%;transform:translateX(-50%) translateY(-100%);top:0;
  background:var(--accent,#e53e3e);color:#fff;
  padding:7px 22px;font-size:14px;font-weight:600;
  border-radius:0 0 5px 5px;
  display:flex;align-items:center;gap:8px;
  opacity:0;transition:opacity .3s,transform .4s cubic-bezier(.16,1,.3,1);
  pointer-events:none;z-index:10;letter-spacing:.04em;white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.4);
}
#alert.show{opacity:1;transform:translateX(-50%) translateY(0);}
#alert.alert-fav{background:#ffd700;color:#000;}
#alert.alert-favend{background:#999;color:#000;}
#alert.alert-rise{background:var(--accent,#e53e3e);color:#fff;}

#root.hidden{opacity:0;transition:opacity .5s ease;pointer-events:none;}
#root.shown{opacity:1;transition:opacity .5s ease;}

#err{position:absolute;left:14px;bottom:14px;color:#e53e3e;font-size:11px;background:rgba(0,0,0,.85);padding:6px 12px;border-radius:3px;display:none;z-index:20;}
#err.show{display:block;}

#debug-overlay{
  display:none;
  position:absolute;right:8px;bottom:8px;z-index:50;
  background:rgba(0,0,0,.92);color:#0f0;
  font-family:'SF Mono','Courier New',monospace;font-size:10px;line-height:1.45;
  padding:6px 10px;border:1px solid #0a3a0a;border-radius:3px;
  max-width:340px;white-space:pre-wrap;
  pointer-events:none;
}
#debug-overlay.show{display:block;}

/* 急上昇/お気に入り通知のポップアップ（中央表示） */
#popup-host{
  position:fixed;
  pointer-events:none;
  z-index:100;
  display:flex;
  gap:14px;
  --pop-scale:1;
  --pop-textscale:1;
}
#popup-host.pos-right{
  top:50%;right:20px;left:auto;bottom:auto;
  transform:translateY(-50%) scale(var(--pop-scale,1));
  transform-origin:right center;
  flex-direction:column;align-items:flex-end;justify-content:center;
}
#popup-host.pos-left{
  top:50%;left:20px;right:auto;bottom:auto;
  transform:translateY(-50%) scale(var(--pop-scale,1));
  transform-origin:left center;
  flex-direction:column;align-items:flex-start;justify-content:center;
}
#popup-host.pos-top{
  top:20px;left:50%;right:auto;bottom:auto;
  transform:translateX(-50%) scale(var(--pop-scale,1));
  transform-origin:top center;
  flex-direction:row;align-items:flex-start;justify-content:center;
}
#popup-host.pos-bottom{
  bottom:140px;left:50%;top:auto;right:auto;
  transform:translateX(-50%) scale(var(--pop-scale,1));
  transform-origin:bottom center;
  flex-direction:row;align-items:flex-end;justify-content:center;
}

/* カード幅のバリエーション */
#popup-host.width-small .popup-card{width:260px;}
#popup-host.width-medium .popup-card{width:340px;}
#popup-host.width-large .popup-card{width:420px;}

/* 文字サイズのバリエーション（文字3種は base 変数化して文字倍率を掛ける） */
#popup-host.size-small .popup-banner{--banner-base:13px;padding:7px 12px;gap:7px;}
#popup-host.size-small .popup-banner-icon{font-size:17px;}
#popup-host.size-small .popup-platform{font-size:12px;padding:3px 9px;}
#popup-host.size-small .popup-viewers{font-size:14px;padding:3px 9px;}
#popup-host.size-small .popup-delta{font-size:13px;padding:3px 9px;}
#popup-host.size-small .popup-info{padding:9px 12px;}
#popup-host.size-small .popup-name{--name-base:14px;}
#popup-host.size-small .popup-title{--title-base:11px;}

#popup-host.size-medium .popup-banner{--banner-base:16px;padding:10px 16px;gap:10px;}
#popup-host.size-medium .popup-banner-icon{font-size:22px;}
#popup-host.size-medium .popup-platform{font-size:15px;padding:4px 11px;}
#popup-host.size-medium .popup-viewers{font-size:18px;padding:4px 12px;}
#popup-host.size-medium .popup-delta{font-size:17px;padding:4px 12px;}
#popup-host.size-medium .popup-info{padding:12px 16px;}
#popup-host.size-medium .popup-name{--name-base:18px;}
#popup-host.size-medium .popup-title{--title-base:13px;}

#popup-host.size-large .popup-banner{--banner-base:20px;padding:13px 20px;gap:12px;}
#popup-host.size-large .popup-banner-icon{font-size:28px;}
#popup-host.size-large .popup-platform{font-size:18px;padding:5px 14px;}
#popup-host.size-large .popup-viewers{font-size:22px;padding:5px 15px;}
#popup-host.size-large .popup-delta{font-size:21px;padding:5px 15px;}
#popup-host.size-large .popup-info{padding:15px 20px;}
#popup-host.size-large .popup-name{--name-base:22px;}
#popup-host.size-large .popup-title{--title-base:16px;}
.popup-card{
  background:#0d0d0d;
  border:3px solid var(--accent,#e53e3e);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 0 30px var(--accent,#e53e3e),0 0 60px rgba(229,62,62,.5),0 12px 40px rgba(0,0,0,.7);
  animation:popupIn .55s cubic-bezier(.16,1.4,.3,1) forwards;
  position:relative;
}
.popup-card.hide{animation:popupOut .35s cubic-bezier(.4,0,1,1) forwards;}
@keyframes popupIn{
  0%{transform:translateX(60px) scale(.85);opacity:0;}
  60%{transform:translateX(-6px) scale(1.03);opacity:1;}
  100%{transform:translateX(0) scale(1);opacity:1;}
}
@keyframes popupOut{
  0%{transform:translateX(0) scale(1);opacity:1;}
  100%{transform:translateX(40px) scale(.9);opacity:0;}
}
.popup-card.fav{border-color:#ffd700;box-shadow:0 0 30px #ffd700,0 0 60px rgba(255,215,0,.5),0 12px 40px rgba(0,0,0,.7);}
.popup-card.favend{border-color:#888;box-shadow:0 0 20px #888,0 12px 40px rgba(0,0,0,.7);}

.popup-banner{
  background:var(--accent,#e53e3e);color:#fff;
  font-weight:700;
  letter-spacing:.06em;
  display:flex;align-items:center;
  font-size:calc(var(--banner-base,16px) * var(--pop-textscale,1));
}
.popup-card.fav .popup-banner{background:#ffd700;color:#000;}
.popup-card.favend .popup-banner{background:#888;color:#000;}
.popup-banner-icon{}

.popup-thumb{
  width:100%;aspect-ratio:16/9;
  background:#0a0a0a;position:relative;overflow:hidden;
}
.popup-thumb img{width:100%;height:100%;object-fit:cover;}
.popup-platform{
  position:absolute;top:10px;left:10px;
  background:rgba(255,154,60,.97);color:#000;
  font-weight:700;
  border-radius:4px;
  box-shadow:0 1px 4px rgba(0,0,0,.5);
}
.popup-platform.twc{background:rgba(77,184,255,.97);}
.popup-platform.kck{background:rgba(83,252,24,.97);color:#000;}
.popup-viewers{
  position:absolute;top:10px;right:10px;
  background:rgba(0,0,0,.85);color:#fff;
  font-weight:700;
  border-radius:4px;
  font-family:'SF Mono',monospace;
}
.popup-viewers::before{content:"●";color:var(--accent,#e53e3e);margin-right:5px;font-size:.7em;}
.popup-delta{
  position:absolute;bottom:10px;right:10px;
  background:var(--accent,#e53e3e);color:#fff;
  font-weight:700;
  border-radius:4px;
  animation:flash .7s ease-in-out infinite;
}

.popup-info{}
.popup-name{
  color:#fff;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:4px;
  font-size:calc(var(--name-base,18px) * var(--pop-textscale,1));
}
.popup-title{
  color:#aaa;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:calc(var(--title-base,13px) * var(--pop-textscale,1));
}
</style>
</head>
<body>

<div id="root" class="h-mode pos-bottom">
  <div id="paused-indicator">⏸ 一時停止中</div>
  <div id="alert"><span id="alertIcon">🔥</span><span id="alertTxt"></span></div>
  <div id="hdr">
    <div class="hd-logo">/URA<span> live</span></div>
    <div class="hd-pill" id="filterPill">ALL · アクティブ順</div>
    <div class="hd-meta" style="display:contents;">
      <div class="hd-count" id="liveCount">— 配信中</div>
      <div class="hd-live">LIVE</div>
    </div>
  </div>
  <div id="stage"><div id="track"></div></div>
</div>
<div id="err"></div>
<div id="debug-overlay"></div>
<div id="popup-host"></div>
<div id="ver-banner" style="position:fixed;top:8px;left:8px;background:#0f0;color:#000;font-family:monospace;font-size:14px;font-weight:700;padding:6px 14px;border-radius:4px;z-index:9999;box-shadow:0 0 12px #0f0;">v23 LOADED</div>
<script>setTimeout(function(){var b=document.getElementById('ver-banner');if(b)b.style.display='none';},8000);</script>

<script>
var ST={
  api:'/api/ranking',
  mode:'h',pos:'bottom',platform:'all',sort:'recommend',
  badge:'viewers', // 'viewers' or 'comments' バッジ切替
  maxItems:40,
  // 急上昇判定（精度改善版）
  showRising:true,
  risingDelta:50,         // N人以上の増加で急上昇（NEW）
  risingWindowMin:5,      // N分以内（NEW、デフォ5分）
  risingMinViewers:30,    // 最低視聴者数（このレベル未満は判定対象外）
  risingThreshold:30,     // 旧パラメータ（互換のため残す、未使用）
  risingConfirm:true,
  alertOnRising:true,
  // お気に入り通知
  notifyFavStart:true,
  thumbWidth:148,bannerHeight:120,sidebarWidth:200,speed:3,
  bgOpacity:85,cardOpacity:95,
  nameSize:11,titleSize:9,
  // バッジサイズ（新規）
  platSize:11,viewSize:13,riseSize:11,
  pins:[],ngs:[],minViewers:0,
  autoHide:false,showSec:10,hideSec:30,
  paused:false,
  debugMode:false,
  // ポップアップ設定（NEW）
  popupEnabled:true,
  popupDuration:7,        // 秒
  popupPosition:'right',  // 'right' | 'left' | 'top' | 'bottom'
  popupSize:'medium',     // 'small' | 'medium' | 'large'
  popupWidth:'medium',    // 'small' | 'medium' | 'large'
  popupScale:100,         // ポップアップ全体サイズ %（無段階）
  popupTextScale:100,     // ポップアップ文字サイズ %（無段階）
  popupMaxVisible:2       // 1〜3
};

// 状態保存：localStorageに永続化してリロードを跨いで判定可能にする
var prevView={};       // 前回視聴者数（後方互換のため残す）
var viewHistory={};    // 配信者ごとの視聴者数履歴 [{at,viewers},...]（増加人数判定用）
var risingCandidate={}; // 急上昇候補（連続確認用）
var risingNotified={}; // 通知済み（5分間再通知しない）
var prevSeen={};       // 前回見えていた配信者（お気に入り通知用）
var allData=[],hideTimer=null;
var firstFetch=true;

// 起動時にlocalStorageから前回状態を復元
try{
  var savedState=localStorage.getItem('ura_slider_prevstate');
  if(savedState){
    var parsed=JSON.parse(savedState);
    // 10分以内のデータのみ有効
    if(parsed.savedAt && (Date.now()-parsed.savedAt)<10*60*1000){
      prevView=parsed.prevView||{};
      viewHistory=parsed.viewHistory||{};
      prevSeen=parsed.prevSeen||{};
      risingNotified=parsed.risingNotified||{};
      firstFetch=false;
    }
  }
}catch(e){}

function persistPrevState(){
  try{
    localStorage.setItem('ura_slider_prevstate',JSON.stringify({
      savedAt:Date.now(),
      prevView:prevView,
      viewHistory:viewHistory,
      prevSeen:prevSeen,
      risingNotified:risingNotified
    }));
  }catch(e){}
}

function $(id){return document.getElementById(id);}

function readState(){
  try{
    var d=new URLSearchParams(window.location.search).get('d');
    if(d){
      var obj=JSON.parse(decodeURIComponent(d));
      ST=Object.assign(ST,obj);
    }
  }catch(e){console.warn('state parse err',e);}
}

function applyStyle(){
  var root=$('root');
  root.className='';
  if(ST.mode==='h'){
    root.classList.add('h-mode');
    root.classList.add(ST.pos==='top'?'pos-top':'pos-bottom');
    root.style.height=ST.bannerHeight+'px';
    root.style.width='';
  }else{
    root.classList.add('v-mode');
    root.classList.add(ST.pos==='left'?'pos-left':'pos-right');
    root.style.width=ST.sidebarWidth+'px';
    root.style.height='';
  }
  root.style.background='rgba(0,0,0,'+(ST.bgOpacity/100)+')';
  if(ST.paused)root.classList.add('paused');
  root.style.setProperty('--thumbw',ST.thumbWidth+'px');
  root.style.setProperty('--cardop',(ST.cardOpacity/100));
  root.style.setProperty('--namesize',ST.nameSize+'px');
  root.style.setProperty('--titlesize',ST.titleSize+'px');
  root.style.setProperty('--platsize',(ST.platSize||11)+'px');
  root.style.setProperty('--viewsize',(ST.viewSize||13)+'px');
  root.style.setProperty('--risesize',(ST.riseSize||11)+'px');
  var accent='#e53e3e';
  if(ST.platform==='fuwacchi')accent='#ff9a3c';
  else if(ST.platform==='twitcasting')accent='#4db8ff';
  else if(ST.platform==='kick')accent='#53fc18';
  root.style.setProperty('--accent',accent);
  var label='ALL';
  if(ST.platform==='fuwacchi')label='ふわっち';
  else if(ST.platform==='twitcasting')label='ツイキャス';
  else if(ST.platform==='kick')label='Kick';
  var sortLabel={recommend:'アクティブ順',viewers:'閲覧順',recent:'新着順'}[ST.sort]||'';
  $('filterPill').textContent=label+' · '+sortLabel;

  // ポップアップ設定をCSSに反映
  applyPopupStyle();
}

function applyPopupStyle(){
  var host=$('popup-host');
  if(!host)return;
  // 位置クラス
  host.classList.remove('pos-right','pos-left','pos-top','pos-bottom');
  host.classList.add('pos-'+(ST.popupPosition||'right'));
  // 文字サイズクラス
  host.classList.remove('size-small','size-medium','size-large');
  host.classList.add('size-'+(ST.popupSize||'medium'));
  // 幅クラス
  host.classList.remove('width-small','width-medium','width-large');
  host.classList.add('width-'+(ST.popupWidth||'medium'));
  // 無段階スケール
  host.style.setProperty('--pop-scale',(ST.popupScale||100)/100);
  host.style.setProperty('--pop-textscale',(ST.popupTextScale||100)/100);
}

function platKey(p){
  if(p==='ふわっち')return 'fuwacchi';
  if(p==='ツイキャス')return 'twitcasting';
  if(p==='Kick')return 'kick';
  return p;
}

function filterAndSort(items){
  var out=items.slice();
  if(ST.platform!=='all'){
    out=out.filter(function(x){return platKey(x.platform)===ST.platform;});
  }
  out=out.filter(function(x){return ST.ngs.indexOf(x.name)===-1;});
  out=out.filter(function(x){return (x.viewers||0)>=ST.minViewers;});
  if(ST.sort==='viewers'){
    out.sort(function(a,b){return (b.viewers||0)-(a.viewers||0);});
  }else if(ST.sort==='recent'){
    out.sort(function(a,b){
      var ta=a.startedAt?new Date(a.startedAt).getTime():0;
      var tb=b.startedAt?new Date(b.startedAt).getTime():0;
      return tb-ta;
    });
  }else{
    // おすすめ順 = アクティブ順 (分間コメント数順)
    out.sort(function(a,b){return (b.activityScore||0)-(a.activityScore||0);});
  }
  var pinned=out.filter(function(x){return ST.pins.indexOf(x.name)!==-1;});
  var rest=out.filter(function(x){return ST.pins.indexOf(x.name)===-1;});
  out=pinned.concat(rest);
  return out.slice(0,ST.maxItems);
}

// デバッグ用カウンタ
var dbg={fetchCount:0,checked:0,detected:0,lastDetectedName:'',lastDetectedDelta:0,maxIncreasePct:0,maxIncreaseName:'',alertCount:0,scrollCount:0,lastError:''};

// 急上昇判定（増加人数ベース）
// ST.risingDelta 人以上、ST.risingWindowMin 分以内 = 急上昇
function checkRising(items){
  if(!ST.showRising)return;
  var now=Date.now();
  var windowMs=(ST.risingWindowMin||5)*60*1000;
  var deltaThreshold=ST.risingDelta||50;
  var minViewers=ST.risingMinViewers||30;
  dbg.checked=0;dbg.detected=0;dbg.maxIncreasePct=0;dbg.maxIncreaseName='';
  items.forEach(function(x){
    var current=x.viewers||0;
    var name=x.name;
    // 履歴を取得 or 新規作成
    if(!viewHistory[name])viewHistory[name]=[];
    var hist=viewHistory[name];
    // 古い履歴を削除（窓+30秒バッファより古いものは捨てる）
    var cutoff=now-windowMs-30*1000;
    while(hist.length && hist[0].at<cutoff)hist.shift();
    // 現在値を追加
    hist.push({at:now,viewers:current});
    // 履歴が多すぎたら間引く（メモリ対策）
    if(hist.length>50)hist.splice(0,hist.length-50);

    // 最低視聴者数を満たしてないなら判定スキップ
    if(current<minViewers)return;

    // 窓内で最も古いスナップショットを探す（窓範囲内で一番過去のもの）
    var winStart=now-windowMs;
    var oldest=null;
    for(var i=0;i<hist.length;i++){
      if(hist[i].at>=winStart-5000){ // 5秒の許容
        oldest=hist[i];
        break;
      }
    }
    // 履歴が窓を満たすほど蓄積されていない場合スキップ
    if(!oldest || (now-oldest.at)<windowMs*0.5)return; // 窓の半分以上の期間が必要

    var prev=oldest.viewers;
    var delta=current-prev;
    dbg.checked++;
    if(delta>dbg.maxIncreasePct){dbg.maxIncreasePct=delta;dbg.maxIncreaseName=name;}

    if(delta>=deltaThreshold){
      dbg.detected++;
      dbg.lastDetectedName=name;
      dbg.lastDetectedDelta=delta;
      x._rising=true;
      x._risingDelta=delta;
      x._risingPrev=prev;

      // 5分以内に通知済みならスキップ
      var lastNotified=risingNotified[name];
      if(lastNotified && (now-lastNotified)<5*60*1000)return;

      if(ST.risingConfirm){
        if(risingCandidate[name]){
          // 2回目！確定
          if(ST.alertOnRising){
            showAlert('rise',name+' が急上昇！ '+prev+' → '+current+'人 (+'+delta+')');
            (function(n){setTimeout(function(){scrollToStreamer(n,'rising');},100);})(name);
          }
          risingNotified[name]=now;
          delete risingCandidate[name];
        }else{
          risingCandidate[name]=now;
        }
      }else{
        if(ST.alertOnRising){
          showAlert('rise',name+' が急上昇！ '+prev+' → '+current+'人 (+'+delta+')');
          (function(n){setTimeout(function(){scrollToStreamer(n,'rising');},100);})(name);
        }
        risingNotified[name]=now;
      }
    }else{
      delete risingCandidate[name];
    }
  });

  // 古い通知履歴をクリーンアップ（10分以上前のは消す）
  Object.keys(risingNotified).forEach(function(k){
    if(now-risingNotified[k]>10*60*1000)delete risingNotified[k];
  });
}

// お気に入り（ピン留め）配信者の配信開始/終了通知
function checkFavStart(items){
  if(!ST.notifyFavStart||!ST.pins||!ST.pins.length){
    // フラグOFFでも prevSeen は更新しておく（次にONになった時の誤発火防止）
    var ns={};items.forEach(function(x){ns[x.name]=true;});
    prevSeen=ns;
    return;
  }
  if(firstFetch){
    // 初回はベースライン作成のみ
    items.forEach(function(x){prevSeen[x.name]=true;});
    return;
  }
  var nowSeen={};
  items.forEach(function(x){nowSeen[x.name]=true;});
  // ピン留め配信者の状態変化を検出
  ST.pins.forEach(function(name){
    if(nowSeen[name] && !prevSeen[name]){
      // 前回いなかった→今回いる：配信開始
      showAlert('fav','★ お気に入り '+name+' が配信を開始！');
      (function(n){setTimeout(function(){scrollToStreamer(n,'favStart');},100);})(name);
    }else if(!nowSeen[name] && prevSeen[name]){
      // 前回いた→今回いない：配信終了
      showAlert('favEnd','◆ お気に入り '+name+' の配信が終了');
      // 直前のデータからポップアップ用情報を作る（既に allData にはいないので prevAllData 参照）
      var prevData=null;
      for(var pi=0;pi<(window._prevAllData||[]).length;pi++){
        if(window._prevAllData[pi].name===name){prevData=window._prevAllData[pi];break;}
      }
      if(prevData){
        (function(d){setTimeout(function(){showPopup(d,'favend');},100);})(prevData);
      }
    }
  });
  prevSeen=nowSeen;
}

// 特定の配信者カードまでロールを一気にジャンプ＆ハイライト
// 該当配信者がフィルタ通過してリストに含まれているときのみ動作
// 急上昇/お気に入り通知のポップアップ表示（ロールには触らない）
// 設定で表示時間・位置・サイズ・幅・最大数・ON/OFF を動的変更可能
function showPopup(streamerData,type){
  // type: 'rising' | 'fav' | 'favend'
  if(!streamerData)return;
  if(ST.popupEnabled===false)return; // OFFなら何もしない
  var host=$('popup-host');
  if(!host)return;
  // 既に同じ配信者のポップアップが出てれば重複させない
  var existing=host.querySelectorAll('.popup-card');
  for(var j=0;j<existing.length;j++){
    if(existing[j].dataset.name===streamerData.name)return;
  }
  // 上限を超えたら古い順に消す
  var maxVisible=ST.popupMaxVisible||2;
  while(host.querySelectorAll('.popup-card:not(.hide)').length>=maxVisible){
    var oldest=host.querySelector('.popup-card:not(.hide)');
    if(oldest){oldest.classList.add('hide');setTimeout((function(el){return function(){if(el.parentNode)el.parentNode.removeChild(el);};})(oldest),350);}
    else break;
  }
  // 新規ポップアップ生成
  var card=document.createElement('div');
  card.className='popup-card '+(type==='fav'?'fav':type==='favend'?'favend':'');
  card.dataset.name=streamerData.name;

  var pk=platKey(streamerData.platform);
  var bannerTxt='',bannerIcon='🔥';
  if(type==='rising'){
    bannerTxt='急上昇！ '+(streamerData._risingPrev||'?')+' → '+(streamerData.viewers||0)+'人 (+'+(streamerData._risingDelta||'?')+')';
    bannerIcon='🔥';
  }else if(type==='fav'){
    bannerTxt='お気に入りが配信開始！';
    bannerIcon='★';
  }else if(type==='favend'){
    bannerTxt='お気に入りの配信が終了';
    bannerIcon='◆';
  }

  var thumbHtml=streamerData.thumb?'<img src="'+esc(streamerData.thumb)+'" loading="lazy" onerror="this.style.display=\'none\'">':'';
  var deltaHtml=(type==='rising' && streamerData._risingDelta)?'<div class="popup-delta">+'+streamerData._risingDelta+'人</div>':'';

  card.innerHTML=
    '<div class="popup-banner"><span class="popup-banner-icon">'+bannerIcon+'</span><span>'+esc(bannerTxt)+'</span></div>'+
    '<div class="popup-thumb">'+thumbHtml+
      '<div class="popup-platform '+(pk==='fuwacchi'?'fwt':pk==='twitcasting'?'twc':'kck')+'">'+esc(streamerData.platform||'')+'</div>'+
      '<div class="popup-viewers">'+fmtV(streamerData.viewers)+'</div>'+
      deltaHtml+
    '</div>'+
    '<div class="popup-info">'+
      '<div class="popup-name">'+esc(streamerData.name)+'</div>'+
      '<div class="popup-title">'+esc(streamerData.title||'')+'</div>'+
    '</div>';

  host.appendChild(card);

  // 設定された表示時間（秒）後に自動で消す
  var dur=(ST.popupDuration||7)*1000;
  setTimeout(function(){
    if(!card.parentNode)return;
    card.classList.add('hide');
    setTimeout(function(){if(card.parentNode)card.parentNode.removeChild(card);},350);
  },dur);
}

// 後方互換のために scrollToStreamer 名は残す（中身はポップアップ表示）
function scrollToStreamer(name,reason){
  dbg.scrollCount++;
  // allDataから該当配信者を探す
  var streamer=null;
  for(var i=0;i<allData.length;i++){
    if(allData[i].name===name){streamer=allData[i];break;}
  }
  if(!streamer){dbg.lastError='popup:notInData:'+name.slice(0,12);return;}
  // typeをreason から判定
  var type='rising';
  if(reason==='favStart')type='fav';
  else if(reason==='favEnd')type='favend';
  showPopup(streamer,type);
}

var alertQueue=[],alertShowing=false;
var ALERT_MAX_QUEUE=2;
function showAlert(type,txt){
  dbg.alertCount++;
  alertQueue.push({type:type,txt:txt});
  while(alertQueue.length>ALERT_MAX_QUEUE){alertQueue.shift();}
  if(!alertShowing)nextAlert();
}
function nextAlert(){
  if(!alertQueue.length){alertShowing=false;return;}
  alertShowing=true;
  var item=alertQueue.shift();
  var alertEl=$('alert');
  alertEl.classList.remove('alert-fav','alert-favend','alert-rise');
  if(item.type==='fav'){
    alertEl.classList.add('alert-fav');
    $('alertIcon').textContent='★';
  }else if(item.type==='favEnd'){
    alertEl.classList.add('alert-favend');
    $('alertIcon').textContent='◆';
  }else{
    alertEl.classList.add('alert-rise');
    $('alertIcon').textContent='🔥';
  }
  $('alertTxt').textContent=item.txt;
  alertEl.classList.add('show');
  setTimeout(function(){alertEl.classList.remove('show');setTimeout(nextAlert,300);},3000);
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtV(n){
  if(n>=10000)return(n/10000).toFixed(1)+'万';
  if(n>=1000)return n.toLocaleString();
  return String(n||0);
}

function buildCard(x){
  var pk=platKey(x.platform);
  var pinned=ST.pins.indexOf(x.name)!==-1;
  var cls='scard';
  if(x._rising)cls+=' hot';
  if(pinned)cls+=' pinned';
  var thumb=x.thumb?'<img src="'+esc(x.thumb)+'" loading="lazy" onerror="this.style.display=\'none\'">':'';
  var risingBdg=x._rising?'<div class="scard-rising">🔥急上昇</div>':'';
  var pinBdg=pinned?'<div class="scard-pin">★</div>':'';
  var platBdg='<div class="scard-plat '+(pk==='fuwacchi'?'fwt':pk==='twitcasting'?'twc':'kck')+'">'+esc(x.platform)+'</div>';
  // バッジ表示: ST.badge==='comments' ならコメント/分、それ以外なら視聴者数
  var badgeContent;
  if(ST.badge==='comments'){
    var rate = x.commentRatePerMin || 0;
    badgeContent = rate > 0 ? rate + '/分' : '─';
  } else {
    badgeContent = fmtV(x.viewers);
  }
  var badgeCls = ST.badge==='comments' ? 'scard-viewers scard-comments' : 'scard-viewers';
  return '<div class="'+cls+'">'+
    '<div class="scard-thumb">'+thumb+platBdg+
    '<div class="'+badgeCls+'">'+badgeContent+'</div>'+
    risingBdg+pinBdg+
    '</div>'+
    '<div class="scard-info">'+
    '<div class="scard-name">'+esc(x.name)+'</div>'+
    '<div class="scard-title">'+esc(x.title||'')+'</div>'+
    '</div>'+
    '</div>';
}

// 該当配信者がDOMに実際にカードとして存在してるかをチェック。
// なければrenderして強制表示、あればチラつき防止のためrenderしない。
function renderIfNeeded(name){
  var track=$('track');
  if(!track){render();return;}
  var cards=track.children;
  var found=false;
  for(var i=0;i<cards.length;i++){
    var nameEl=cards[i].querySelector('.scard-name');
    if(nameEl && nameEl.textContent===name){found=true;break;}
  }
  if(!found){
    render();
  }
}

function render(){
  applyStyle();
  var data=filterAndSort(allData);
  $('liveCount').textContent=data.length+' 配信中';
  if(!data.length){
    $('track').innerHTML='<div style="color:#666;padding:14px;font-size:12px;">配信中の配信者がいません</div>';
    return;
  }
  var html=data.map(buildCard).join('');
  $('track').innerHTML=html+html;

  // ロール速度を動的に計算：件数とサムネ幅から総距離を出して、px/秒の指定速度で割る
  // ST.speed は「1サムネ通過にかかる秒数」として再解釈（横モード）
  // 縦モードはサムネ高さ＝幅×9/16 でアスペクト比から計算
  var perCard=ST.speed||3; // 1枚あたりの通過秒数（デフォ3秒）
  var totalSec;
  if(ST.mode==='h'){
    // 横ロール：(サムネ幅+gap8) × 件数 = 総距離px、それを (perCard秒/(サムネ幅+gap)) で...
    // シンプルに：件数 × perCard秒 = 総時間
    totalSec=data.length*perCard;
  }else{
    // 縦ロール：サムネ高さは幅の9/16+情報部約30px+gap8 ≒ width*0.56+38
    totalSec=data.length*perCard;
  }
  // 最低5秒、最大600秒でクランプ
  if(totalSec<5)totalSec=5;
  if(totalSec>600)totalSec=600;
  $('root').style.setProperty('--speed',totalSec+'s');
}

function showError(msg){var e=$('err');e.textContent=msg;e.classList.add('show');}
function hideError(){$('err').classList.remove('show');}

// デバッグオーバーレイ表示更新
function updateDebugOverlay(items){
  var enabled=ST.debugMode||(new URLSearchParams(window.location.search).get('debug')==='1');
  var ov=$('debug-overlay');
  if(!enabled){ov.classList.remove('show');return;}
  ov.classList.add('show');
  dbg.fetchCount++;
  var prevCount=Object.keys(viewHistory).length;
  var notifiedCount=Object.keys(risingNotified).length;
  var pinCount=(ST.pins||[]).length;
  var settings='+'+(ST.risingDelta||50)+'/'+(ST.risingWindowMin||5)+'min min:'+(ST.risingMinViewers||30)+' confirm:'+(ST.risingConfirm?'Y':'N');
  ov.textContent=
    '[DBG] fetch#'+dbg.fetchCount+' items:'+items.length+' first:'+(firstFetch?'Y':'N')+'\n'+
    'hist:'+prevCount+' pins:'+pinCount+' notified:'+notifiedCount+'\n'+
    settings+' rising:'+(ST.showRising?'Y':'N')+' alert:'+(ST.alertOnRising?'Y':'N')+'\n'+
    'checked:'+dbg.checked+' detected:'+dbg.detected+' alerts:'+dbg.alertCount+' scrolls:'+dbg.scrollCount+'\n'+
    'maxDelta:+'+dbg.maxIncreasePct+' ('+dbg.maxIncreaseName.slice(0,12)+')\n'+
    (dbg.lastDetectedName?'last:'+dbg.lastDetectedName.slice(0,16)+' +'+dbg.lastDetectedDelta:'last:none')+
    (dbg.lastError?'\nERR:'+dbg.lastError.slice(0,40):'');
}

async function fetchData(){
  try{
    var r=await fetch(ST.api,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    var json=await r.json();
    var items=json.ranking||json.items||[];
    // 前回のallDataを保持（お気に入り終了ポップアップ用）
    window._prevAllData=allData;
    checkRising(items);
    checkFavStart(items);
    firstFetch=false;
    allData=items;
    persistPrevState();
    updateDebugOverlay(items);
    hideError();
    render();
  }catch(e){
    console.warn('fetch err',e);
    showError('API接続エラー: '+e.message);
  }
}

function startAutoHide(){
  if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}
  if(!ST.autoHide){
    $('root').classList.remove('hidden');
    $('root').classList.add('shown');
    return;
  }
  function show(){
    $('root').classList.remove('hidden');
    $('root').classList.add('shown');
    hideTimer=setTimeout(hide,ST.showSec*1000);
  }
  function hide(){
    $('root').classList.remove('shown');
    $('root').classList.add('hidden');
    hideTimer=setTimeout(show,ST.hideSec*1000);
  }
  show();
}

readState();
applyStyle();
fetchData();
// OBSのCEFブラウザでバックグラウンド時にsetIntervalが間引かれる対策
// 複数のトリガーを併用して必ず15秒間隔で更新が走るようにする
var _lastFetchAt=0,_fetchInFlight=false;
var FETCH_INTERVAL_MS=15000;
async function smartFetch(){
  var now=Date.now();
  if(_fetchInFlight)return;
  if(now-_lastFetchAt<FETCH_INTERVAL_MS-500)return;
  _fetchInFlight=true;
  _lastFetchAt=now;
  try{await fetchData();}finally{_fetchInFlight=false;}
}
setInterval(smartFetch,5000);
function rafLoop(){
  smartFetch();
  requestAnimationFrame(function(){setTimeout(rafLoop,3000);});
}
requestAnimationFrame(function(){setTimeout(rafLoop,3000);});
document.addEventListener('visibilitychange',function(){if(!document.hidden)smartFetch();});
window.addEventListener('focus',smartFetch);
startAutoHide();
