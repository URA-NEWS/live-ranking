<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>URA News Display</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1280px;height:720px;overflow:hidden;background:transparent;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif;}

/* ===== 通常ロール（位置はJS側で上下切替＋オフセット） ===== */
#ticker{
  position:absolute;left:0;right:0;
  height:46px;
  background:rgba(0,0,0,.85);
  border-top:2px solid #e53e3e;
  display:flex;align-items:center;
  overflow:hidden;
  opacity:0;transition:opacity .4s ease;
}
#ticker.pos-bottom{border-top:2px solid #e53e3e;border-bottom:none;}
#ticker.pos-top{border-bottom:2px solid #e53e3e;border-top:none;}
#ticker.show{opacity:1;}

/* NEWSラベル：左端固定、最前面 */
#ticker-label{
  flex-shrink:0;
  position:relative;
  z-index:5;
  background:#e53e3e;
  color:#fff;
  font-size:13px;font-weight:700;letter-spacing:.18em;
  padding:0 14px;
  height:100%;
  display:flex;align-items:center;
  gap:6px;
  box-shadow:4px 0 10px rgba(0,0,0,.6); /* 右に影でロール文字との境界 */
}
#ticker-label::before{
  content:"●";
  font-size:8px;
  color:#fff;
  animation:tick-pulse 1.2s ease-in-out infinite;
}
@keyframes tick-pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ロール枠：ラベル右側の領域だけを使う */
#ticker-track-wrap{
  flex:1;
  height:100%;
  overflow:hidden;
  position:relative;
}

#ticker-track{
  position:absolute;
  top:0;left:0;
  height:100%;
  display:flex;
  align-items:center;
  white-space:nowrap;
  will-change:transform;
  animation:troll var(--tspeed,90s) linear infinite;
}
#ticker.paused #ticker-track{animation-play-state:paused;}

@keyframes troll{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

.tk-item{
  flex-shrink:0;
  display:flex;align-items:center;
  padding:0 28px;
  height:100%;
  color:#fff;
  font-size:15px;font-weight:500;
  letter-spacing:.02em;
  line-height:1;
}
.tk-genre{
  display:inline-flex;align-items:center;
  font-size:11px;font-weight:700;
  color:#e53e3e;
  letter-spacing:.1em;
  margin-right:10px;
  padding:3px 8px;
  border:1px solid #e53e3e;
  border-radius:2px;
  height:auto;
  line-height:1;
}
.tk-sep{
  color:#444;
  margin:0 4px;
}

/* ===== 緊急速報バナー ===== */
#flash{
  --tx: -50%;
  position:absolute;left:50%;top:80px;
  transform:translateX(var(--tx)) translateY(-30px);
  width:1100px;
  background:linear-gradient(180deg,#000 0%,#0a0000 32%,#1a0000 56%,#4a0000 80%,#8a0000 100%);
  border:2px solid #cc0000;
  box-shadow:0 0 28px rgba(204,0,0,.65),0 8px 28px rgba(0,0,0,.55);
  padding:20px 28px 22px;
  opacity:0;
  pointer-events:none;
  transition:opacity .35s ease,transform .45s cubic-bezier(.16,1,.3,1);
  z-index:50;
}
#flash.show{opacity:1;transform:translateX(var(--tx)) translateY(0);}

/* ピン留め（常時表示）バナー：flashとは別の場所 */
#pinned{
  position:absolute;left:50%;
  transform:translateX(-50%);
  width:1100px;
  background:linear-gradient(180deg,#000 0%,#0a0000 32%,#1a0000 56%,#4a0000 80%,#8a0000 100%);
  border:2px solid #cc0000;
  box-shadow:0 0 24px rgba(204,0,0,.5),0 6px 22px rgba(0,0,0,.55);
  padding:18px 26px 20px;
  display:none;
  pointer-events:none;
  z-index:45;
}
#pinned.show{display:block;}
.pn-head{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.pn-tag{
  background:#fff;color:#cc0000;
  font-size:14px;font-weight:900;letter-spacing:.2em;
  padding:4px 12px;border-radius:2px;
  display:flex;align-items:center;gap:6px;
}
.pn-tag::before{content:"📌";font-size:14px;}
.pn-genre{
  background:#cc0000;color:#fff;
  font-size:12px;font-weight:700;letter-spacing:.1em;
  padding:3px 10px;border:1px solid rgba(255,255,255,.5);border-radius:2px;
}
.pn-time{margin-left:auto;color:rgba(255,255,255,.85);font-size:11px;font-family:'SF Mono',monospace;}
.pn-title{color:#fff;font-size:24px;font-weight:900;line-height:1.3;text-shadow:0 2px 6px rgba(0,0,0,.6);}

#flash-head{
  display:flex;align-items:center;gap:12px;
  margin-bottom:10px;
}
.flash-tag{
  background:#fff;color:#cc0000;
  font-size:18px;font-weight:900;letter-spacing:.2em;
  padding:5px 14px;border-radius:2px;
  display:flex;align-items:center;gap:8px;
  animation:flash-blink .6s ease-in-out infinite;
}
@keyframes flash-blink{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:.7;transform:scale(1.04);}
}
.flash-tag::before{
  content:"⚠";font-size:18px;
}
.flash-genre{
  background:rgba(0,0,0,.4);
  color:#fff;
  font-size:13px;font-weight:700;letter-spacing:.1em;
  padding:4px 11px;
  border:1px solid rgba(255,255,255,.5);
  border-radius:2px;
}
.flash-time{
  margin-left:auto;
  color:rgba(255,255,255,.85);
  font-size:12px;font-weight:500;
  font-family:'SF Mono',monospace;
  letter-spacing:.04em;
}

#flash-title{
  color:#fff;
  font-size:30px;font-weight:900;
  line-height:1.3;
  letter-spacing:.02em;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
}

#flash-keywords{
  margin-top:10px;
  display:flex;gap:6px;flex-wrap:wrap;
}
.flash-kw{
  background:rgba(0,0,0,.55);
  color:#ffe0e0;
  font-size:12px;font-weight:700;
  padding:3px 9px;
  border-radius:2px;
  letter-spacing:.06em;
}

/* ===== デバッグ用バナー（OBS設置時の動作確認用） ===== */
#debug{
  display:none;
  position:absolute;top:8px;left:8px;
  background:rgba(20,20,20,.9);
  color:#0f0;
  font-family:monospace;font-size:11px;
  padding:6px 10px;border-radius:3px;
  z-index:100;line-height:1.4;
  border:1px solid #2a2a2a;
}
#debug.show{display:block;}
</style>
</head>
<body>

<!-- 通常ロール -->
<div id="ticker">
  <div id="ticker-label">NEWS</div>
  <div id="ticker-track-wrap">
    <div id="ticker-track"></div>
  </div>
</div>

<!-- 緊急速報バナー -->
<div id="flash">
  <div id="flash-head">
    <div class="flash-tag">速報</div>
    <div class="flash-genre" id="flashGenre">主要</div>
    <div class="flash-time" id="flashTime">--:--</div>
  </div>
  <div id="flash-title">—</div>
  <div id="flash-keywords"></div>
</div>

<!-- ピン留め常時表示バナー -->
<div id="pinned">
  <div class="pn-head">
    <div class="pn-tag">PIN</div>
    <div class="pn-genre" id="pinGenre">—</div>
    <div class="pn-time" id="pinTime">--:--</div>
  </div>
  <div class="pn-title" id="pinTitle">—</div>
</div>

<!-- デバッグ -->
<div id="debug"></div>

<script>
'use strict';

// ============================================================
// 設定（操作パネルからlocalStorage経由で受け取る）
// ============================================================
var DEFAULT_SETTINGS = {
  genres: ['主要','エンタメ','スポーツ'],
  ngWords: [],
  customUrgentKeywords: [],   // 追加の緊急ワード（標準26個に加えて判定）
  flashSound: 'siren',     // 'siren' | 'pico' | 'none'
  flashSoundOn: true,
  flashDuration: 7,        // 秒
  fetchInterval: 5,        // 分
  rollSpeed: 90,           // ロール1周の秒数（大きいほど遅い）
  showTicker: true,
  showFlash: true,
  volume: 0.6,
  // スタイル
  rollHeight: 46,
  rollSize: 15,
  rollBadgeSize: 11,       // ロール内バッジサイズ
  rollOpacity: 85,         // ロール背景の不透明度（0-100）
  popY: 80,
  popX: null,      // 横位置(px)。null=中央、数値=左端からpx
  popW: 1100,
  popSize: 30,
  popBadgeSize: 18,        // 速報/ジャンルバッジサイズ
  popTimeSize: 12,         // 時刻文字サイズ
  popKwSize: 12,           // キーワードチップサイズ
  popOpacity: 100,         // 背景の不透明度（0-100）
  tickerPosition: 'bottom',  // 'bottom' | 'top'
  tickerOffset: 0,           // 画面上端or下端からの距離(px)
  // ピン留め
  pinnedItem: null,          // {id, title, genre, urgentKeywords, url, pubDate}
  pinnedShow: false,         // ピン記事を画面に表示するか
  debug: false
};

function loadSettings(){
  try{
    var s = localStorage.getItem('ura_news_settings');
    if(!s) return Object.assign({},DEFAULT_SETTINGS);
    var parsed = JSON.parse(s);
    return Object.assign({},DEFAULT_SETTINGS,parsed);
  }catch(e){ return Object.assign({},DEFAULT_SETTINGS); }
}

var SETTINGS = loadSettings();

// ============================================================
// ジャンル色（共通定数）
// ============================================================
var GENRE_COLORS = {
  '主要':     '#e53e3e',
  '国内':     '#ff8c42',
  '国際':     '#4db8ff',
  '経済':     '#22cc88',
  'エンタメ': '#ff5ca8',
  'スポーツ': '#ffc83d',
  'IT':       '#b16cff',
  '科学':     '#00d4d4',
  '地域':     '#aaaaaa'
};
function genreColor(g){ return GENRE_COLORS[g] || '#e53e3e'; }

// ============================================================
// 既読管理（同じ速報を二度鳴らさない）
// ============================================================
function loadSeen(){
  try{
    var s = localStorage.getItem('ura_news_seen');
    if(!s) return {};
    var parsed = JSON.parse(s);
    // 24時間より古いものは捨てる
    var now = Date.now();
    var clean = {};
    for(var id in parsed){
      if(now - parsed[id] < 24*60*60*1000) clean[id] = parsed[id];
    }
    return clean;
  }catch(e){ return {}; }
}
function saveSeen(seen){
  try{ localStorage.setItem('ura_news_seen',JSON.stringify(seen)); }catch(e){}
}
var SEEN = loadSeen();

// ============================================================
// データ取得
// ============================================================
var ITEMS = [];
var lastFetchAt = 0;

function buildAPIURL(){
  var base = '/api/news';
  if(SETTINGS.genres && SETTINGS.genres.length){
    base += '?genres=' + encodeURIComponent(SETTINGS.genres.join(','));
  }
  return base;
}

async function fetchNews(){
  try{
    var r = await fetch(buildAPIURL(),{cache:'no-store'});
    var json = await r.json();
    var arr = json.news || [];
    // NGワードフィルタ
    if(SETTINGS.ngWords && SETTINGS.ngWords.length){
      arr = arr.filter(function(n){
        var text = (n.title||'') + ' ' + (n.summary||'');
        for(var i=0;i<SETTINGS.ngWords.length;i++){
          var ng = SETTINGS.ngWords[i].trim();
          if(ng && text.indexOf(ng) >= 0) return false;
        }
        return true;
      });
    }
    // カスタム緊急ワード再判定（標準26個に加えて）
    var customKW = (SETTINGS.customUrgentKeywords||[])
      .map(function(s){ return String(s).trim(); })
      .filter(Boolean);
    if(customKW.length){
      for(var i=0;i<arr.length;i++){
        var n = arr[i];
        var text = (n.title||'') + ' ' + (n.summary||'');
        var hit = customKW.filter(function(kw){ return text.indexOf(kw) >= 0; });
        if(hit.length){
          n.urgent = true;
          // 既存の urgentKeywords にカスタムを追加（重複除去）
          var merged = (n.urgentKeywords||[]).concat(hit);
          var seen = {};
          n.urgentKeywords = merged.filter(function(k){
            if(seen[k]) return false;
            seen[k] = 1; return true;
          });
        }
      }
    }
    ITEMS = arr;
    lastFetchAt = Date.now();
    debug('fetch OK: ' + arr.length + ' items');
    renderTicker();
    checkFlash();
  }catch(e){
    debug('fetch err: ' + e.message);
    console.warn('news fetch error',e);
  }
}

// ============================================================
// 通常ロール表示
// ============================================================
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 設定値をDOMスタイルへ反映
function applyStyle(){
  var ticker = document.getElementById('ticker');
  ticker.style.height = (SETTINGS.rollHeight||46) + 'px';

  // ロール位置（上 or 下）＋オフセット
  ticker.classList.remove('pos-bottom','pos-top');
  var offset = (SETTINGS.tickerOffset==null?0:SETTINGS.tickerOffset) + 'px';
  if(SETTINGS.tickerPosition === 'top'){
    ticker.classList.add('pos-top');
    ticker.style.top = offset;
    ticker.style.bottom = 'auto';
  }else{
    ticker.classList.add('pos-bottom');
    ticker.style.bottom = offset;
    ticker.style.top = 'auto';
  }

  // ticker内文字サイズを動的に
  var size = SETTINGS.rollSize || 15;
  document.querySelectorAll('.tk-item').forEach(function(el){
    el.style.fontSize = size + 'px';
  });

  // ロール背景透過
  var rollOp = (SETTINGS.rollOpacity == null ? 85 : SETTINGS.rollOpacity) / 100;
  ticker.style.background = 'rgba(0,0,0,' + Math.max(0, Math.min(1, rollOp)) + ')';

  // ロール内バッジサイズ
  var bdg = SETTINGS.rollBadgeSize || 11;
  document.querySelectorAll('.tk-genre').forEach(function(el){
    el.style.fontSize = bdg + 'px';
    el.style.padding = Math.round(bdg*0.27) + 'px ' + Math.round(bdg*0.73) + 'px';
  });

  // 速報ポップアップ
  var flash = document.getElementById('flash');
  flash.style.top = (SETTINGS.popY||80) + 'px';
  flash.style.width = (SETTINGS.popW||1100) + 'px';
  // 横位置: popXがnullなら中央（left:50% + translateX(-50%)）、数値なら左からpx（translateX(0)）
  if(SETTINGS.popX == null || SETTINGS.popX === ''){
    flash.style.left = '50%';
    flash.style.setProperty('--tx', '-50%');
  }else{
    flash.style.left = SETTINGS.popX + 'px';
    flash.style.setProperty('--tx', '0');
  }
  document.getElementById('flash-title').style.fontSize = (SETTINGS.popSize||30) + 'px';

  // バッジサイズ（速報・ジャンル）
  var bdgSize = SETTINGS.popBadgeSize || 18;
  var ftag = document.querySelector('.flash-tag');
  if(ftag){
    ftag.style.fontSize = bdgSize + 'px';
    ftag.style.padding = Math.round(bdgSize*0.3) + 'px ' + Math.round(bdgSize*0.85) + 'px';
  }
  var fgenre = document.getElementById('flashGenre');
  if(fgenre){
    fgenre.style.fontSize = Math.round(bdgSize*0.75) + 'px';
    fgenre.style.padding = Math.round(bdgSize*0.25) + 'px ' + Math.round(bdgSize*0.65) + 'px';
  }

  // 時刻
  var ftime = document.querySelector('.flash-time');
  if(ftime) ftime.style.fontSize = (SETTINGS.popTimeSize||12) + 'px';

  // キーワードチップ
  var kwSize = SETTINGS.popKwSize || 12;
  document.querySelectorAll('.flash-kw').forEach(function(el){
    el.style.fontSize = kwSize + 'px';
    el.style.padding = Math.round(kwSize*0.25) + 'px ' + Math.round(kwSize*0.7) + 'px';
  });

  // 背景グラデーション（黒→濃赤）にアルファ反映
  var op = (SETTINGS.popOpacity == null ? 100 : SETTINGS.popOpacity) / 100;
  var alpha = Math.max(0, Math.min(1, op));
  var grad = 'linear-gradient(180deg,'
    + 'rgba(0,0,0,'    + alpha + ') 0%,'
    + 'rgba(10,0,0,'   + alpha + ') 32%,'
    + 'rgba(26,0,0,'   + alpha + ') 56%,'
    + 'rgba(74,0,0,'   + alpha + ') 80%,'
    + 'rgba(138,0,0,'  + alpha + ') 100%)';
  flash.style.background = grad;
  flash.style.borderColor = 'rgba(204,0,0,' + alpha + ')';

  // ピン留めバナーも同じ位置基準＋同じグラデ
  var pin = document.getElementById('pinned');
  if(pin){
    // 速報バナーの真下に配置
    var pinTop = (SETTINGS.popY||80) + 200;
    pin.style.top = pinTop + 'px';
    pin.style.width = (SETTINGS.popW||1100) + 'px';
    pin.style.background = grad;
    pin.style.borderColor = 'rgba(204,0,0,' + alpha + ')';
    // 横位置: popXがnullなら中央
    if(SETTINGS.popX == null || SETTINGS.popX === ''){
      pin.style.left = '50%';
      pin.style.transform = 'translateX(-50%)';
    }else{
      pin.style.left = SETTINGS.popX + 'px';
      pin.style.transform = 'none';
    }
  }
}

// ピン留めバナーの表示制御
function renderPinned(){
  var el = document.getElementById('pinned');
  if(!el) return;
  if(!SETTINGS.pinnedItem || !SETTINGS.pinnedShow){
    el.classList.remove('show');
    return;
  }
  var n = SETTINGS.pinnedItem;
  document.getElementById('pinTitle').textContent = n.title || '';
  var gel = document.getElementById('pinGenre');
  gel.textContent = n.genre || '';
  var col = genreColor(n.genre);
  gel.style.background = col;
  gel.style.borderColor = 'rgba(255,255,255,.6)';
  // 時刻
  var t = '';
  if(n.pubDate){
    try{
      var d = new Date(n.pubDate);
      t = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }catch(e){}
  }
  document.getElementById('pinTime').textContent = t;
  el.classList.add('show');
}

function renderTicker(){
  var el = document.getElementById('ticker');
  var track = document.getElementById('ticker-track');

  if(!SETTINGS.showTicker || !ITEMS.length){
    el.classList.remove('show');
    return;
  }

  // 速度・サイズ設定
  el.style.setProperty('--tspeed', (SETTINGS.rollSpeed||90) + 's');

  // ロール用は速報以外の通常ニュースだけ
  var normal = ITEMS.filter(function(n){ return !n.urgent; });
  if(!normal.length){
    el.classList.remove('show');
    return;
  }

  // 同じセットを2回繰り返す（無限ループ用）
  var html = '';
  for(var pass=0; pass<2; pass++){
    for(var i=0;i<normal.length;i++){
      var n = normal[i];
      var col = genreColor(n.genre);
      html += '<div class="tk-item">'
            + '<span class="tk-genre" style="color:'+col+';border-color:'+col+';">' + esc(n.genre) + '</span>'
            + esc(n.title)
            + '<span class="tk-sep" style="margin-left:28px;">◆</span>'
            + '</div>';
    }
  }
  track.innerHTML = html;
  el.classList.add('show');
  applyStyle();
}

// ============================================================
// 緊急速報バナー
// ============================================================
var flashQueue = [];
var flashShowing = false;

function checkFlash(){
  if(!SETTINGS.showFlash) return;
  // 緊急 かつ 未読 の記事をキューに積む
  for(var i=0;i<ITEMS.length;i++){
    var n = ITEMS[i];
    if(!n.urgent) continue;
    if(SEEN[n.id]) continue;
    flashQueue.push(n);
    SEEN[n.id] = Date.now();
  }
  saveSeen(SEEN);
  pumpFlash();
}

function pumpFlash(){
  if(flashShowing) return;
  if(!flashQueue.length) return;
  var n = flashQueue.shift();
  showFlash(n);
}

function showFlash(n){
  flashShowing = true;
  applyStyle();  // ポップアップ位置・幅・サイズを最新設定で
  var el = document.getElementById('flash');
  var gel = document.getElementById('flashGenre');
  gel.textContent = n.genre || '速報';
  // ジャンルバッジを背景色で目立たせる
  var col = genreColor(n.genre);
  gel.style.background = col;
  gel.style.color = '#fff';
  gel.style.borderColor = 'rgba(255,255,255,.6)';
  document.getElementById('flash-title').textContent = n.title || '';

  // 時刻表示
  var t = '';
  if(n.pubDate){
    var d = new Date(n.pubDate);
    var hh = String(d.getHours()).padStart(2,'0');
    var mm = String(d.getMinutes()).padStart(2,'0');
    t = hh + ':' + mm;
  }
  document.getElementById('flashTime').textContent = t;

  // キーワード
  var kwHtml = '';
  if(n.urgentKeywords && n.urgentKeywords.length){
    for(var i=0;i<n.urgentKeywords.length && i<5;i++){
      kwHtml += '<span class="flash-kw">' + esc(n.urgentKeywords[i]) + '</span>';
    }
  }
  document.getElementById('flash-keywords').innerHTML = kwHtml;

  // 効果音
  if(SETTINGS.flashSoundOn) playFlashSound();

  // 表示
  el.classList.add('show');
  debug('FLASH: ' + n.title.slice(0,30));

  // 一定時間後に閉じる
  setTimeout(function(){
    el.classList.remove('show');
    setTimeout(function(){
      flashShowing = false;
      pumpFlash();  // キューに残ってれば次を出す
    }, 500);
  }, (SETTINGS.flashDuration||7) * 1000);
}

// ============================================================
// 効果音
// ============================================================
var _ac = null;
function getAC(){
  if(!_ac){
    try{ _ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  return _ac;
}

// MP3 用 Audio 要素＋WebAudioでゲインブースト（最大2倍音量）
var _sirenAudio = null;
var _sirenSrc = null;
var _sirenGain = null;
function getSirenAudio(){
  if(!_sirenAudio){
    _sirenAudio = new Audio('/News-Alert01-1.mp3');
    _sirenAudio.crossOrigin = 'anonymous';
    _sirenAudio.preload = 'auto';
  }
  return _sirenAudio;
}
function setupSirenChain(){
  if(_sirenSrc) return; // 一度作ったら使い回し
  var ac = getAC();
  if(!ac) return;
  try{
    var a = getSirenAudio();
    _sirenSrc = ac.createMediaElementSource(a);
    _sirenGain = ac.createGain();
    _sirenSrc.connect(_sirenGain);
    _sirenGain.connect(ac.destination);
  }catch(e){
    console.warn('siren chain err',e);
    _sirenSrc = null;
    _sirenGain = null;
  }
}

function playFlashSound(){
  var v = SETTINGS.volume || 0.6;

  if(SETTINGS.flashSound === 'siren'){
    // サイレン: MP3再生（WebAudioでゲインブースト）
    try{
      var ac = getAC();
      if(ac && ac.state === 'suspended'){ try{ ac.resume(); }catch(e){} }
      setupSirenChain();
      var a = getSirenAudio();
      a.currentTime = 0;
      // a.volume は 0..1 なので最大でいく
      a.volume = 1.0;
      // GainNode で最大2倍までブースト（v=1.0で2.0倍）
      if(_sirenGain){
        _sirenGain.gain.value = Math.max(0, Math.min(2.5, v * 2.0));
      }
      var p = a.play();
      if(p && p.catch){
        p.catch(function(err){
          // WebAudioがダメなら素のAudioで鳴らす
          console.warn('siren WebAudio play err',err);
          a.volume = Math.max(0, Math.min(1, v));
          a.play().catch(function(e2){ console.warn(e2); });
        });
      }
    }catch(e){ console.warn('siren err',e); }
    return;
  }

  // ピコン以下はWebAudioで合成
  var ac = getAC();
  if(!ac) return;
  if(ac.state === 'suspended'){ try{ ac.resume(); }catch(e){} }
  var t = ac.currentTime;

  if(SETTINGS.flashSound === 'pico'){
    // ピコン: ピンポン3回
    [0, .18, .36].forEach(function(off){
      var o = ac.createOscillator();
      var g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(1400, t+off);
      g.gain.setValueAtTime(0, t+off);
      g.gain.linearRampToValueAtTime(v, t+off+0.01);
      g.gain.exponentialRampToValueAtTime(.001, t+off+0.13);
      o.start(t+off); o.stop(t+off+0.14);
    });
  }
  // 'none' は鳴らさない
}

// ============================================================
// 設定変更の検知（操作パネルが設定変えたら即反映）
// ============================================================
window.addEventListener('storage', function(ev){
  if(ev.key === 'ura_news_settings'){
    var newSettings = loadSettings();
    var genresChanged = JSON.stringify(SETTINGS.genres) !== JSON.stringify(newSettings.genres);
    var ngChanged     = JSON.stringify(SETTINGS.ngWords) !== JSON.stringify(newSettings.ngWords);
    var kwChanged     = JSON.stringify(SETTINGS.customUrgentKeywords||[]) !== JSON.stringify(newSettings.customUrgentKeywords||[]);
    SETTINGS = newSettings;
    debug('settings updated');
    // ジャンル/NGワード/カスタム緊急ワード変更時はその場で再フェッチ
    if(genresChanged || ngChanged || kwChanged){
      fetchNews();
    }else{
      renderTicker();   // ロール再描画
      renderPinned();   // ピン再描画
      applyStyle();     // スタイルを即時反映
    }
  }
  // 操作パネルから「今すぐ更新」が押された
  if(ev.key === 'ura_news_force_refresh'){
    fetchNews();
  }
  // 操作パネルから「速報テスト」
  if(ev.key === 'ura_news_test_flash'){
    var fake = {
      id:'test_'+Date.now(),
      genre:'テスト',
      title:'これは速報テストです 動作確認のため',
      urgent:true,
      urgentKeywords:['テスト'],
      pubDate:new Date().toISOString()
    };
    showFlash(fake);
  }
});

// ============================================================
// デバッグ表示（settings.debug=true で右上に出す）
// ============================================================
function debug(msg){
  if(!SETTINGS.debug) return;
  var el = document.getElementById('debug');
  el.classList.add('show');
  var line = new Date().toTimeString().slice(0,8) + ' ' + msg;
  var prev = el.textContent.split('\n').slice(0,4).join('\n');
  el.textContent = line + (prev ? '\n' + prev : '');
}

// ============================================================
// 起動
// ============================================================
fetchNews();
applyStyle();   // 初期スタイル適用
renderPinned(); // ピン留め初期描画
setInterval(function(){
  fetchNews();
}, Math.max(1, SETTINGS.fetchInterval||5) * 60 * 1000);

// 初回ユーザー操作で AudioContext を解放（自動再生対策の保険）
// OBSのブラウザソースは「ページ操作によりオーディオ再生を制御」がOFFならそもそも問題ないが念のため
document.addEventListener('click', function(){ getAC(); }, {once:true});
</script>
