<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Overlay</title>
<style>
html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic UI',sans-serif}
.wrap{position:relative;width:100%;height:100%}
.wrap.solo{background:#000}
.frame{width:100%;height:100%;border:0;display:block}
.error{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:#fff;text-align:center;padding:20px;
  background:rgba(0,0,0,.7);border-radius:8px;
}

/* ===== 6枠ミラー ===== */
#grid{
  position:absolute;
  display:grid;
  grid-template-columns:repeat(2,var(--cardW,300px));
  grid-auto-rows:calc(var(--cardW,300px) * 9 / 16);
  gap:var(--gap,8px);
  right:var(--right,16px);
  top:var(--top,60px);
  align-content:start;
}

.mcard{
  position:relative;
  border-radius:6px;
  overflow:hidden;
  background:#000;
  border:2px solid var(--pc,#888);
  box-shadow:0 0 10px var(--pc,#888), 0 0 22px rgba(0,0,0,.5) inset, 0 6px 18px rgba(0,0,0,.55);
  animation:cardIn .45s ease;
}
/* 枠が光って呼吸する */
.mcard::after{
  content:'';position:absolute;inset:0;border-radius:4px;pointer-events:none;
  box-shadow:0 0 12px var(--pc,#888) inset;
  opacity:.45;
  animation:glow 2.6s ease-in-out infinite;
}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:.7}}
@keyframes cardIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}

/* 拡大中の枠は2x2セルぶんに広がる */
.mcard.zoom{grid-column:span 2;grid-row:span 2;z-index:5}

.mcard iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}

.mcard[data-p="kick"]{--pc:#53fc18}
.mcard[data-p="twitcasting"]{--pc:#4db8ff}
.mcard[data-p="fuwacchi"]{--pc:#ff9a3c}
.mcard[data-p="other"]{--pc:#9a9a9a}

.mfallback{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#0a0a0a;color:#4a4a4a;font-size:12px;letter-spacing:.06em;
}

.mlabel{
  position:absolute;left:0;right:0;bottom:0;
  display:flex;align-items:center;gap:7px;padding:6px 9px;
  background:linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,.55) 60%,rgba(0,0,0,0));
  z-index:3;pointer-events:none;
}
body.nolabel .mlabel{display:none}

.mbadge{
  flex-shrink:0;min-width:20px;height:20px;line-height:20px;padding:0 5px;border-radius:4px;
  font-size:12px;font-weight:800;text-align:center;color:#000;
  background:var(--pc,#888);
  box-shadow:0 0 8px var(--pc,#888);
}
.mname{
  color:#fff;font-size:13px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 2px 4px rgba(0,0,0,.95);
}
/* 閲覧数は大きく */
.mviews{
  flex-shrink:0;margin-left:auto;
  display:flex;align-items:baseline;gap:2px;
  color:#fff;font-weight:800;
  text-shadow:0 2px 5px rgba(0,0,0,.95);
}
.mviews .n{font-size:22px;line-height:1}
.mviews .u{font-size:11px;color:#cfcfcf}
.maudio{
  flex-shrink:0;
  font-size:10px;font-weight:800;color:#fff;background:#e53e3e;
  padding:2px 6px;border-radius:3px;letter-spacing:.05em;
  box-shadow:0 0 8px rgba(229,62,62,.9);
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <iframe class="frame" id="frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
</div>

<script>
(function(){
'use strict';

var params = new URLSearchParams(location.search);

/* ============================================================
   従来動作：?url= 単体指定で全画面1枠
   ============================================================ */
if(!params.get('mirror') && !params.get('g')){
  var streamUrl = params.get('url') || '';
  var frame = document.getElementById('frame');
  document.getElementById('wrap').classList.add('solo');
  if(streamUrl){ frame.src = streamUrl; }
  else { document.getElementById('wrap').innerHTML = '<div class="error">URLが指定されていません</div>'; }
  return;
}

/* ============================================================
   6枠ミラー：/api/mirror をポーリングして差分だけ描き替える
   ============================================================ */
var API = params.get('api') || '/api/mirror';
var POLL_MS = 1200;

document.getElementById('wrap').innerHTML = '<div id="grid"></div>';
var grid = document.getElementById('grid');
var mounted = {};    // slotIndex -> {el, key}
var lastRev = -1;

var PLAT = {
  kick:        {badge:'K',  name:'Kick'},
  twitcasting: {badge:'ツ', name:'ツイキャス'},
  fuwacchi:    {badge:'ふ', name:'ふわっち'},
  other:       {badge:'●', name:'配信'}
};

function platOf(slot){
  var p = (slot.platform || '').toLowerCase();
  var u = slot.url || '';
  if(p.indexOf('kick') !== -1 || /kick\.com/i.test(u)) return 'kick';
  if(p.indexOf('ツイ') !== -1 || p.indexOf('twitcas') !== -1 || /twitcasting\.tv/i.test(u)) return 'twitcasting';
  if(p.indexOf('ふわ') !== -1 || p.indexOf('fuwa') !== -1 || p.indexOf('whowatch') !== -1 || /whowatch\.tv/i.test(u)) return 'fuwacchi';
  return 'other';
}

/* 配信ページURLを枠に収まる埋め込みプレイヤーへ変換する。
   変換先が無いサイトは配信ページをそのまま読み込む。 */
function toEmbed(u, withAudio){
  var m;
  if(/kick\.com/i.test(u)){
    m = u.match(/kick\.com\/([^\/?#]+)/i);
    if(m) return 'https://player.kick.com/' + encodeURIComponent(m[1])
      + '?autoplay=true&muted=' + (withAudio ? 'false' : 'true');
  }
  if(/twitcasting\.tv/i.test(u)){
    m = u.match(/twitcasting\.tv\/([^\/?#]+)/i);
    if(m && m[1].toLowerCase() !== 'embeddedplayer'){
      return 'https://twitcasting.tv/' + encodeURIComponent(m[1])
        + '/embeddedplayer/live?auto_play=true&mute=' + (withAudio ? 'false' : 'true');
    }
  }
  return u;
}

function fmtV(n){
  n = n || 0;
  if(n >= 10000) return {n:(n/10000).toFixed(1), u:'万'};
  return {n:String(n), u:''};
}

function buildCard(slot, withAudio, isZoom){
  var pk = platOf(slot);
  var p = PLAT[pk];

  var card = document.createElement('div');
  card.className = 'mcard' + (isZoom ? ' zoom' : '');
  card.setAttribute('data-p', pk);

  var fb = document.createElement('div');
  fb.className = 'mfallback';
  fb.textContent = p.name;
  card.appendChild(fb);

  var fr = document.createElement('iframe');
  fr.src = toEmbed(slot.url, withAudio);
  fr.setAttribute('allow','autoplay; encrypted-media; picture-in-picture');
  fr.setAttribute('allowfullscreen','');
  fr.setAttribute('scrolling','no');
  card.appendChild(fr);

  var lb = document.createElement('div');
  lb.className = 'mlabel';

  var bd = document.createElement('span');
  bd.className = 'mbadge';
  bd.textContent = p.badge;
  lb.appendChild(bd);

  var nm = document.createElement('span');
  nm.className = 'mname';
  nm.textContent = slot.label || p.name;
  lb.appendChild(nm);

  if(withAudio){
    var au = document.createElement('span');
    au.className = 'maudio';
    au.textContent = '音声';
    lb.appendChild(au);
  }

  if(slot.viewers){
    var v = fmtV(slot.viewers);
    var vw = document.createElement('span');
    vw.className = 'mviews';
    vw.innerHTML = '<span class="n"></span><span class="u"></span>';
    vw.querySelector('.n').textContent = v.n;
    vw.querySelector('.u').textContent = v.u;
    lb.appendChild(vw);
  }

  card.appendChild(lb);
  return card;
}

function apply(st){
  var rs = document.documentElement.style;
  rs.setProperty('--cardW', (st.cardW || 300) + 'px');
  rs.setProperty('--gap',   (st.gap   || 0)   + 'px');
  rs.setProperty('--right', (st.right || 0)   + 'px');
  rs.setProperty('--top',   (st.top   || 0)   + 'px');
  document.body.classList.toggle('nolabel', st.showLabel === false);

  // 全体OFFのときはiframeを完全に捨てる（音と負荷を残さない）
  if(!st.enabled){
    if(Object.keys(mounted).length){ grid.innerHTML = ''; mounted = {}; }
    return;
  }

  var slots = st.slots || [];
  var desired = {};
  for(var i = 0; i < 6; i++){
    var s = slots[i];
    if(!s || s.mode === 'off' || !s.url) continue;
    var withAudio = (st.audio === i);
    var isZoom = (st.zoom === i);
    desired[i] = {
      slot: s, withAudio: withAudio, isZoom: isZoom,
      // ここが変わった枠だけ作り直す＝他の枠は再読み込みされない
      key: s.url + '|' + (withAudio ? 'a' : 'm') + '|' + (isZoom ? 'z' : 'n')
    };
  }

  Object.keys(mounted).forEach(function(k){
    if(!desired[k] || desired[k].key !== mounted[k].key){
      if(mounted[k].el.parentNode) mounted[k].el.parentNode.removeChild(mounted[k].el);
      delete mounted[k];
    }
  });

  Object.keys(desired).forEach(function(k){
    var d = desired[k];
    if(mounted[k]){
      // URLが同じなら作り直さず、名前と閲覧数だけ更新する
      var el = mounted[k].el;
      var nm = el.querySelector('.mname');
      if(nm) nm.textContent = d.slot.label || '';
      var vw = el.querySelector('.mviews');
      if(vw && d.slot.viewers){
        var v = fmtV(d.slot.viewers);
        vw.querySelector('.n').textContent = v.n;
        vw.querySelector('.u').textContent = v.u;
      }
      return;
    }
    mounted[k] = {el: buildCard(d.slot, d.withAudio, d.isZoom), key: d.key};
  });

  Object.keys(mounted)
    .map(Number).sort(function(a,b){ return a - b; })
    .forEach(function(i){ grid.appendChild(mounted[i].el); });
}

async function tick(){
  try{
    var r = await fetch(API, {cache:'no-store'});
    if(!r.ok) return;
    var st = await r.json();
    apply(st);
  }catch(e){}
}

tick();
setInterval(tick, POLL_MS);

})();
</script>
</body>
</html>
