<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Overlay</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;font-family:sans-serif}
.wrap{position:relative;width:100%;height:100%;background:#000}
.frame{width:100%;height:100%;border:0;display:block}
.bar{
  position:absolute;top:0;left:0;right:0;
  background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,0));
  padding:8px 14px;
  z-index:100;
  display:flex;align-items:center;gap:12px;
  pointer-events:none;
}
.label{
  color:#fff;font-weight:900;font-size:13px;
  letter-spacing:.05em;
  text-shadow:0 1px 4px rgba(0,0,0,.8);
  flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.close-btn{
  width:32px;height:32px;
  background:#ff3030;border:none;border-radius:50%;
  color:#fff;font-size:18px;font-weight:900;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(255,48,48,.6),inset 0 -2px 4px rgba(0,0,0,.3);
  pointer-events:auto;
  transition:.15s;
  display:flex;align-items:center;justify-content:center;
}
.close-btn:hover{background:#ff5050;transform:scale(1.1);box-shadow:0 4px 12px rgba(255,48,48,.8)}
.error{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:#fff;text-align:center;padding:20px;
  background:rgba(0,0,0,.7);border-radius:8px;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="label" id="label">読み込み中…</div>
    <button class="close-btn" id="closeBtn" title="閉じる">×</button>
  </div>
  <iframe class="frame" id="frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
</div>

<script>
(function(){
  // URLパラメータから配信URL取得
  var params = new URLSearchParams(location.search);
  var streamUrl = params.get('url') || '';
  var streamName = params.get('name') || '配信';

  document.getElementById('label').textContent = streamName + ' - ' + streamUrl;

  var frame = document.getElementById('frame');
  if(streamUrl){
    frame.src = streamUrl;
  } else {
    document.querySelector('.wrap').innerHTML = '<div class="error">URLが指定されていません</div>';
  }

  // 閉じるボタン: OBS WebSocket経由で自分自身のソースを非表示 or 削除依頼
  document.getElementById('closeBtn').addEventListener('click', function(){
    // postMessage で親 (controller) に閉じ要求を送る
    // ただしOBSブラウザソース内ではwindow.parentは存在しないため、
    // 同時に同じドメインのcontrollerにWebSocket的に通知する方法が必要
    // ここでは BroadcastChannel を使う (同一ブラウザ内で通信可能)
    try {
      var ch = new BroadcastChannel('eru_overlay');
      ch.postMessage({type:'close'});
      ch.close();
    } catch(e){}
    // フォールバック: localStorageイベント
    try {
      localStorage.setItem('eru_overlay_close', String(Date.now()));
    } catch(e){}
    // 即座に画面を黒く
    document.querySelector('.wrap').innerHTML = '<div class="error">閉じています…</div>';
  });
})();
</script>
</body>
</html>
