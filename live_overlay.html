<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Overlay</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic UI',sans-serif}
.wrap{position:relative;width:100%;height:100%}
.wrap.solo{background:#000}
.frame{width:100%;height:100%;border:0;display:block}
.error{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:#fff;text-align:center;padding:20px;
  background:rgba(0,0,0,.7);border-radius:8px;
}

/* ===== 6枠ミラー ===== */
#grid{
  position:absolute;
  display:grid;
  grid-template-columns:repeat(2,var(--cardW,300px));
  grid-auto-rows:calc(var(--cardW,300px) * 9 / 16);
  gap:var(--gap,8px);
  right:var(--right,16px);
  top:var(--top,60px);
  align-content:start;
}

.mcard{
  position:relative;
  border-radius:6px;
  overflow:hidden;
  background:#000;
  border:2px solid var(--pc,#888);
  box-shadow:0 0 10px var(--pc,#888), 0 0 22px rgba(0,0,0,.5) inset, 0 6px 18px rgba(0,0,0,.55);
}

/* 枠が入れ替わったときの演出 */
.mcard.swap{animation:swapIn .55s cubic-bezier(.2,.8,.3,1), swapFlash 1.1s ease-out}
@keyframes swapIn{
  0%{opacity:0;transform:scale(.88) translateY(10px)}
  55%{opacity:1;transform:scale(1.03) translateY(0)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes swapFlash{
  0%{box-shadow:0 0 0 3px #fff, 0 0 34px var(--pc,#fff), 0 6px 18px rgba(0,0,0,.55)}
  35%{box-shadow:0 0 0 2px var(--pc,#fff), 0 0 26px var(--pc,#fff), 0 6px 18px rgba(0,0,0,.55)}
  100%{box-shadow:0 0 10px var(--pc,#888), 0 6px 18px rgba(0,0,0,.55)}
}
/* 切り替わった直後だけ出る印 */
.mnew{
  position:absolute;left:10px;top:10px;z-index:4;
  background:#e8172d;color:#fff;
  font-size:20px;font-weight:900;letter-spacing:.12em;
  padding:5px 14px;border-radius:5px;
  border:2px solid #fff;
  text-shadow:0 2px 4px rgba(0,0,0,.6);
  box-shadow:0 0 20px rgba(232,23,45,.95), 0 0 44px rgba(232,23,45,.6);
  animation:newIn .35s cubic-bezier(.2,.9,.3,1) both, newPulse 1s ease-in-out 2 .35s, newOut .6s ease 4.4s both;
}
@keyframes newPulse{50%{transform:scale(1.12)}}
@keyframes newIn{from{opacity:0;transform:scale(.6) translateX(-10px)}to{opacity:1;transform:none}}
@keyframes newOut{to{opacity:0;transform:translateY(-10px) scale(.9)}}
/* 枠が光って呼吸する */
.mcard::after{
  content:'';position:absolute;inset:0;border-radius:4px;pointer-events:none;
  box-shadow:0 0 12px var(--pc,#888) inset;
  opacity:.45;
  animation:glow 2.6s ease-in-out infinite;
}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:.7}}


/* 拡大中はその枠だけを縦いっぱいに表示し、下にコメントを出す */
#grid.zoomed{grid-template-columns:var(--zoomW,620px);grid-auto-rows:var(--zoomH,660px)}
#grid.zoomed .mcard{aspect-ratio:auto;height:var(--zoomH,660px);display:block;position:relative}
.mchat{display:none}

.mcard iframe,.mcard video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000;object-fit:cover}
/* 配信ページ全体を読み込む枠は、映像部分だけが見えるように拡大して位置をずらす */
.mcard iframe.cropped{transform-origin:0 0;object-fit:fill;position:absolute;left:0;top:0;inset:auto}
.mcard .mthumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.mcard .mthumb+.mtag{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.75);color:#ccc;
  font-size:9px;padding:2px 6px;border-radius:3px;z-index:2}

.mcard[data-p="kick"]{--pc:#53fc18}
.mcard[data-p="twitcasting"]{--pc:#4db8ff}
.mcard[data-p="fuwacchi"]{--pc:#ff9a3c}
.mcard[data-p="other"]{--pc:#9a9a9a}

.mfallback{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#0a0a0a;color:#4a4a4a;font-size:12px;letter-spacing:.06em;
}

.mlabel{
  position:absolute;left:0;right:0;bottom:0;
  display:flex;align-items:center;gap:7px;padding:6px 9px;
  background:linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,.55) 60%,rgba(0,0,0,0));
  z-index:3;pointer-events:none;
}
body.nolabel .mlabel{display:none}

.mbadge{
  flex-shrink:0;min-width:24px;height:24px;line-height:24px;padding:0 6px;border-radius:4px;
  font-size:14px;font-weight:800;text-align:center;color:#000;
  background:var(--pc,#888);
  box-shadow:0 0 8px var(--pc,#888);
}
.mname{
  color:#fff;font-size:18px;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 2px 4px rgba(0,0,0,.95);
}
/* 閲覧数は大きく */
.mviews{
  flex-shrink:0;margin-left:auto;
  display:flex;align-items:baseline;gap:2px;
  color:#fff;font-weight:800;
  text-shadow:0 2px 5px rgba(0,0,0,.95);
}
.mviews .n{font-size:24px;line-height:1}
.mviews .u{font-size:11px;color:#cfcfcf}
.maudio{
  flex-shrink:0;
  font-size:10px;font-weight:800;color:#fff;background:#e53e3e;
  padding:2px 6px;border-radius:3px;letter-spacing:.05em;
  box-shadow:0 0 8px rgba(229,62,62,.9);
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <iframe class="frame" id="frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
</div>

<script>
(function(){
'use strict';

var params = new URLSearchParams(location.search);

/* ============================================================
   従来動作：?url= 単体指定で全画面1枠
   ============================================================ */
if(!params.get('mirror') && !params.get('g')){
  var streamUrl = params.get('url') || '';
  var frame = document.getElementById('frame');
  document.getElementById('wrap').classList.add('solo');
  if(streamUrl){ frame.src = streamUrl; }
  else { document.getElementById('wrap').innerHTML = '<div class="error">URLが指定されていません</div>'; }
  return;
}

/* ============================================================
   6枠ミラー：/api/mirror をポーリングして差分だけ描き替える
   ============================================================ */
var API = params.get('api') || '/api/mirror';
var SRC_API = params.get('srcapi') || '/api/stream-src';
var HLS_PROXY = params.get('hlsproxy') || '/api/hls';
var SHOW_TAG = params.get('tag') === '1';
// ツイキャス・ふわっちなど音を消せない埋め込みを、音声オフでも映像で出すかどうか
var ALWAYS_EMBED = false;

/* 枠を捨てるときに再生も確実に止める（音と負荷を残さない） */
function destroyCard(el){
  try{
    el.querySelectorAll('video').forEach(function(v){ v.pause(); v.removeAttribute('src'); v.load(); });
    el.querySelectorAll('div').forEach(function(h){
      if(h._hls){ try{ h._hls.destroy(); }catch(e){} h._hls=null; }
      if(h._thumbTimer){ clearInterval(h._thumbTimer); h._thumbTimer=null; }
      if(h._ro){ try{ h._ro.disconnect(); }catch(e){} h._ro=null; }
    });
  }catch(e){}
}
var POLL_MS = 1200;

document.getElementById('wrap').innerHTML = '<div id="grid"></div>';
var grid = document.getElementById('grid');
var mounted = {};    // slotIndex -> {el, key}
var lastRev = -1;
var firstPaint = true;
var lastUrlBySlot = {};

var PLAT = {
  kick:        {badge:'K',  name:'Kick'},
  twitcasting: {badge:'ツ', name:'ツイキャス'},
  fuwacchi:    {badge:'ふ', name:'ふわっち'},
  other:       {badge:'●', name:'配信'}
};

function platOf(slot){
  var p = (slot.platform || '').toLowerCase();
  var u = slot.url || '';
  if(p.indexOf('kick') !== -1 || /kick\.com/i.test(u)) return 'kick';
  if(p.indexOf('ツイ') !== -1 || p.indexOf('twitcas') !== -1 || /twitcasting\.tv/i.test(u)) return 'twitcasting';
  if(p.indexOf('ふわ') !== -1 || p.indexOf('fuwa') !== -1 || p.indexOf('whowatch') !== -1 || /whowatch\.tv/i.test(u)) return 'fuwacchi';
  return 'other';
}

/* 配信ページURLを枠に収まる埋め込みプレイヤーへ変換する。
   変換先が無いサイトは配信ページをそのまま読み込む。 */
function toEmbed(u, withAudio){
  var m;
  if(/kick\.com/i.test(u)){
    m = u.match(/kick\.com\/([^\/?#]+)/i);
    if(m) return 'https://player.kick.com/' + encodeURIComponent(m[1])
      + '?autoplay=true&muted=' + (withAudio ? 'false' : 'true');
  }
  if(/twitcasting\.tv/i.test(u)){
    m = u.match(/twitcasting\.tv\/([^\/?#]+)/i);
    if(m && m[1].toLowerCase() !== 'embeddedplayer'){
      return 'https://twitcasting.tv/' + encodeURIComponent(m[1])
        + '/embeddedplayer/live?auto_play=true&mute=' + (withAudio ? 'false' : 'true');
    }
  }
  return u;
}

function fmtV(n){
  n = n || 0;
  if(n >= 10000) return {n:(n/10000).toFixed(1), u:'万'};
  return {n:String(n), u:''};
}

function buildCard(slot, withAudio, isZoom){
  var pk = platOf(slot);
  var p = PLAT[pk];

  var card = document.createElement('div');
  card.className = 'mcard';
  card.setAttribute('data-p', pk);

  var fb = document.createElement('div');
  fb.className = 'mfallback';
  fb.textContent = p.name;
  card.appendChild(fb);

  // 映像は後から差し込む（HLS→埋め込み→サムネの順に試す）
  var media = document.createElement('div');
  media.className = 'mmedia';
  card.appendChild(media);

  attachMedia(media, slot, withAudio, null, isZoom);

  var lb = document.createElement('div');
  lb.className = 'mlabel';

  var bd = document.createElement('span');
  bd.className = 'mbadge';
  bd.textContent = p.badge;
  lb.appendChild(bd);

  var nm = document.createElement('span');
  nm.className = 'mname';
  nm.textContent = slot.label || p.name;
  lb.appendChild(nm);

  if(withAudio){
    var au = document.createElement('span');
    au.className = 'maudio';
    au.textContent = '音声';
    lb.appendChild(au);
  }

  if(slot.viewers){
    var v = fmtV(slot.viewers);
    var vw = document.createElement('span');
    vw.className = 'mviews';
    vw.innerHTML = '<span class="n"></span><span class="u"></span>';
    vw.querySelector('.n').textContent = v.n;
    vw.querySelector('.u').textContent = v.u;
    lb.appendChild(vw);
  }

  card.appendChild(lb);
  return card;
}

/* HLSを自前のvideoで再生する。
   直接読めない（CORSで弾かれる）ときは、サーバー中継に切り替えて必ず映す。 */
function playHls(host, slot, src, withAudio, viaProxy){
  var url = viaProxy ? (HLS_PROXY + '?u=' + encodeURIComponent(src)) : src;

  var v = document.createElement('video');
  v.muted = !withAudio;
  v.volume = withAudio ? 1 : 0;
  v.playsInline = true;
  v.autoplay = true;
  host.innerHTML = '';
  host.appendChild(v);

  var done = false;
  function ok(){
    done = true;
    clearTimeout(timer);
    v.play().catch(function(){});
  }
  function fail(why){
    if(done) return;
    done = true;
    clearTimeout(timer);
    cleanup();
    if(!viaProxy && host.isConnected){
      // まず中継経由でもう一度試す
      playHls(host, slot, src, withAudio, true);
    }else if(host.isConnected){
      showThumb(host, slot, why || 'サムネイル');
    }
  }
  function cleanup(){
    if(host._hls){ try{ host._hls.destroy(); }catch(e){} host._hls = null; }
  }

  var timer = setTimeout(function(){ fail('読み込み待ち'); }, viaProxy ? 20000 : 10000);

  if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src = url;
    v.addEventListener('loadeddata', ok);
    v.addEventListener('error', function(){ fail(); });
  }else if(window.Hls && window.Hls.isSupported()){
    var hls = new window.Hls({lowLatencyMode:true, backBufferLength:10, manifestLoadingMaxRetry:1});
    hls.loadSource(url);
    hls.attachMedia(v);
    hls.on(window.Hls.Events.MANIFEST_PARSED, ok);
    hls.on(window.Hls.Events.ERROR, function(e, d){ if(d && d.fatal) fail(); });
    host._hls = hls;
  }else{
    fail();
  }
}

/* 配信ページはPC幅で描画させ、枠に収まるよう縮小して全体を見せる。
   枠幅に合わせてiframeを小さくするとスマホ用レイアウトになるため、この方法を取る。 */
function fitPage(host, fr, baseW){
  baseW = baseW || 1280;
  fr.className = 'cropped';
  fr.style.width = baseW + 'px';

  function fit(){
    if(!host.isConnected) return;
    var bw = host.clientWidth, bh = host.clientHeight;
    if(!bw || !bh){ requestAnimationFrame(fit); return; }
    var k = bw / baseW;
    // 枠の縦横比に合わせて高さを決める（ページ上部＝映像が入る）
    fr.style.height = Math.round(bh / k) + 'px';
    fr.style.transform = 'scale(' + k + ')';
  }
  fit();
  if(window.ResizeObserver){
    if(host._ro) host._ro.disconnect();
    host._ro = new ResizeObserver(fit);
    host._ro.observe(host);
  }
}

/* サムネイルを貼り替える。
   新しい画像を裏で読み終えてから差し替えるので、切り替わりで一瞬消えることがない。 */
function showThumb(host, slot, note){
  if(!slot.thumb){
    if(host._thumbTimer){ clearInterval(host._thumbTimer); host._thumbTimer=null; }
    host.innerHTML = '';
    return;
  }

  var img = host.querySelector('.mthumb');
  if(!img){
    host.innerHTML = '';
    img = document.createElement('img');
    img.className = 'mthumb';
    img.src = slot.thumb;
    host.appendChild(img);
    // 調査用。?tag=1 を付けたときだけ状態を出す（通常は配信画面に出さない）
    if(note && SHOW_TAG){
      var tag = document.createElement('span');
      tag.className = 'mtag';
      tag.textContent = note;
      host.appendChild(tag);
    }
  }

  if(host._thumbTimer) clearInterval(host._thumbTimer);
  host._thumbTimer = setInterval(function(){
    if(!host.isConnected){ clearInterval(host._thumbTimer); host._thumbTimer=null; return; }
    var cur = host.querySelector('.mthumb');
    if(!cur) return;
    var next = new Image();
    next.onload = function(){
      // 読み終えてから差し替える（表示が途切れない）
      if(host.isConnected && cur.isConnected) cur.src = next.src;
    };
    next.src = slot.thumb + (slot.thumb.indexOf('?') === -1 ? '?' : '&') + 't=' + Date.now();
  }, 5200);
}

/* HLSが取れれば自前のvideoで再生する。
   ミュートで自分から再生を始めるので、埋め込みプレイヤーのように止まらない。 */
async function attachMedia(host, slot, withAudio, chatEl, isZoom){
  var info = null;
  try{
    var r = await fetch(SRC_API + '?url=' + encodeURIComponent(slot.url), {cache:'no-store'});
    if(r.ok) info = await r.json();
  }catch(e){}

  if(!host.isConnected) return;
  if(!info || !info.ok){ showThumb(host, slot, '取得できません'); return; }

  // 拡大中は配信ページを丸ごと出す。映像もコメントも一緒に見える。
  if(isZoom && info.page){
    var pf = document.createElement('iframe');
    pf.src = info.page;
    pf.setAttribute('allow','autoplay; encrypted-media; picture-in-picture');
    pf.setAttribute('allowfullscreen','');
    pf.setAttribute('scrolling','no');
    host.innerHTML = '';
    host.appendChild(pf);
    fitPage(host, pf, 1280);
    return;
  }

  // 通常の枠
  if(info.type === 'hls' && info.src){
    playHls(host, slot, info.src, withAudio, false);
    return;
  }

  if(info.type === 'iframe' && info.src){
    // 埋め込みは音を消せないので、音声に選ばれていない枠はサムネにする
    if(info.audioAlways && !withAudio && !ALWAYS_EMBED){
      showThumb(host, slot, '音声オフ');
      return;
    }
    var fr = document.createElement('iframe');
    fr.src = info.src;
    fr.setAttribute('allow','autoplay; encrypted-media; picture-in-picture');
    fr.setAttribute('allowfullscreen','');
    fr.setAttribute('scrolling','no');
    host.innerHTML = '';
    host.appendChild(fr);
    fitPage(host, fr, 1280);
    return;
  }

  showThumb(host, slot, 'サムネイル');
}

function apply(st){
  var rs = document.documentElement.style;
  rs.setProperty('--cardW', (st.cardW || 300) + 'px');
  rs.setProperty('--gap',   (st.gap   || 0)   + 'px');
  rs.setProperty('--right', (st.right || 0)   + 'px');
  rs.setProperty('--top',   (st.top   || 0)   + 'px');
  document.body.classList.toggle('nolabel', st.showLabel === false);
  if(typeof st.alwaysEmbed === 'boolean') ALWAYS_EMBED = st.alwaysEmbed;

  // 全体OFFのときはiframeを完全に捨てる（音と負荷を残さない）
  if(!st.enabled){
    if(Object.keys(mounted).length){
      Object.keys(mounted).forEach(function(k){ destroyCard(mounted[k].el); });
      grid.innerHTML = ''; mounted = {};
    }
    return;
  }

  var slots = st.slots || [];
  var zoom = (typeof st.zoom === 'number') ? st.zoom : -1;
  var zoomOn = zoom >= 0 && slots[zoom] && slots[zoom].mode !== 'off' && slots[zoom].url;

  // 拡大中はその枠だけを残す
  grid.classList.toggle('zoomed', !!zoomOn);
  if(zoomOn){
    // 拡大中は通常の枠サイズに縛られず、画面に収まる範囲で大きく取る
    var avail = 1280 - (st.right || 0) - 8;
    var zw = Math.max(520, Math.min(avail, (st.cardW || 300) * 3 + (st.gap || 0) * 2));
    var zh = Math.max(260, (window.innerHeight || 720) - (st.top || 0) - 8);
    var hasChat = !!(slots[zoom] && platOf(slots[zoom]) === 'kick');
    // 映像は16:9を保てる幅を上限にする
    var mediaW = hasChat ? Math.min(Math.round(zw * 0.68), Math.round(zh * 16 / 9)) : zw;
    document.documentElement.style.setProperty('--zoomW', zw + 'px');
    document.documentElement.style.setProperty('--zoomH', zh + 'px');
    document.documentElement.style.setProperty('--zoomMediaW', mediaW + 'px');
  }

  var desired = {};
  for(var i = 0; i < 6; i++){
    if(zoomOn && i !== zoom) continue;
    var s = slots[i];
    if(!s || s.mode === 'off' || !s.url) continue;
    var withAudio = (st.audio === i) || (zoomOn && i === zoom && st.audio === i);
    desired[i] = {
      slot: s, withAudio: withAudio, isZoom: !!(zoomOn && i === zoom),
      // 音声の切り替えは基本 video 側で行うのでkeyに入れない。
      // ただしツイキャスは音の有無で実映像/サムネが入れ替わるため、その枠だけkeyに含める。
      key: s.url + '|' + (zoomOn && i === zoom ? 'z' : 'n')
           + ((platOf(s) === 'twitcasting' || platOf(s) === 'fuwacchi') ? (withAudio ? '|a' : '|m') : '')
    };
  }

  Object.keys(mounted).forEach(function(k){
    if(!desired[k] || desired[k].key !== mounted[k].key){
      destroyCard(mounted[k].el);
      if(mounted[k].el.parentNode) mounted[k].el.parentNode.removeChild(mounted[k].el);
      delete mounted[k];
      if(!desired[k]) delete lastUrlBySlot[k];
    }
  });

  Object.keys(desired).forEach(function(k){
    var d = desired[k];
    if(mounted[k]){
      // URLが同じなら作り直さず、名前・閲覧数・音声だけ更新する
      var el = mounted[k].el;
      var vd = el.querySelector('video');
      if(vd){
        vd.muted = !d.withAudio;
        vd.volume = d.withAudio ? 1 : 0;
      }
      var badge = el.querySelector('.maudio');
      if(d.withAudio && !badge){
        var lb2 = el.querySelector('.mlabel');
        if(lb2){
          var au2 = document.createElement('span');
          au2.className = 'maudio';
          au2.textContent = '音声';
          lb2.appendChild(au2);
        }
      }else if(!d.withAudio && badge){
        badge.parentNode.removeChild(badge);
      }
      var nm = el.querySelector('.mname');
      if(nm) nm.textContent = d.slot.label || '';
      var vw = el.querySelector('.mviews');
      if(vw && d.slot.viewers){
        var v = fmtV(d.slot.viewers);
        vw.querySelector('.n').textContent = v.n;
        vw.querySelector('.u').textContent = v.u;
      }
      return;
    }
    var el = buildCard(d.slot, d.withAudio, d.isZoom);
    // 演出は配信そのものが入れ替わったときだけ。
    // 音声や拡大の切り替えで作り直された場合は出さない。
    var prevUrl = lastUrlBySlot[k];
    lastUrlBySlot[k] = d.slot.url;
    if(!firstPaint && prevUrl !== d.slot.url){
      el.classList.add('swap');
      var nb = document.createElement('span');
      nb.className = 'mnew';
      nb.textContent = 'NEW';
      el.appendChild(nb);
      setTimeout(function(){ if(nb.parentNode) nb.parentNode.removeChild(nb); }, 5200);
      el.addEventListener('animationend', function(){ el.classList.remove('swap'); });
      setTimeout(function(){ el.classList.remove('swap'); }, 1400);  // 保険
    }
    mounted[k] = {el: el, key: d.key};
  });

  // 並べ替えはCSSのorderだけで行う。
  // DOMに入っている要素をappendChildで入れ直すとiframe/videoが読み込み直しになるため、
  // 新しく作った枠だけを一度追加する。
  firstPaint = false;

  Object.keys(mounted).forEach(function(k){
    var m = mounted[k];
    var slot = slots[k] || {};
    // 順位が分かっていれば順位順、無ければ枠番号順に並べる
    var ord = slot.rank ? slot.rank : (Number(k) + 1) * 1000;
    if(m.el.style.order !== String(ord)) m.el.style.order = String(ord);
    if(!m.el.parentNode) grid.appendChild(m.el);
  });
}

async function tick(){
  try{
    var r = await fetch(API, {cache:'no-store'});
    if(!r.ok) return;
    var st = await r.json();
    apply(st);
  }catch(e){}
}

tick();
setInterval(tick, POLL_MS);

})();
</script>
