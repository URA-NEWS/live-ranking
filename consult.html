<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<link rel="manifest" href="/consult-manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="イコエル相談">
<meta name="theme-color" content="#1d282e">
<link rel="apple-touch-icon" href="/consult-icon.png"><title>イコエル相談チャット</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#eef1f4;color:#162027;font-family:Arial,"Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}body{min-height:100vh}input,textarea,select,button{font-size:16px!important}
.wrap{max-width:760px;margin:auto;padding:14px 10px 110px}.top{display:flex;align-items:center;gap:10px;margin:4px 4px 12px}.brandIcon{width:40px;height:40px;border-radius:50%;overflow:hidden}.brandIcon img{width:100%;height:100%;object-fit:cover}.brand b{font-size:19px}.brand p{font-size:12px;color:#77858d;margin:2px 0}
.card{background:#fff;border:1px solid #dce3e7;border-radius:20px;overflow:hidden;box-shadow:0 6px 24px #0000000d}.setup{padding:18px}.setup input{width:100%;padding:13px 14px;border:1px solid #d8e0e4;border-radius:14px;background:#f9fbfc}.hint{font-size:12px;color:#76848b;margin:7px 2px 12px}button{border:0;border-radius:999px;padding:10px 15px;font-weight:900}.dark{background:#1d282e;color:#fff}.green{background:#86e457;color:#16310d}.gray{background:#edf1f3;color:#516068}.red{background:#ffe7ea;color:#ba2d3e}.hidden{display:none!important}
.head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid #e5eaed}.no{font-size:18px;font-weight:900}.state{font-size:11px;background:#eef2f4;padding:6px 9px;border-radius:999px;color:#65737b}
.thread{min-height:360px;padding:16px 10px;display:flex;flex-direction:column;gap:10px;background:#eef1f4}.msg{display:flex;align-items:flex-end;gap:8px;width:100%}.msg.user{justify-content:flex-start}.msg.admin{justify-content:flex-end}.av{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:0 0 36px;display:flex;align-items:center;justify-content:center;background:#dfe5e8;color:#52616a;font-size:10px;font-weight:900}.av img{width:100%;height:100%;object-fit:cover}.admin .av{order:2}.bubble{max-width:76%;padding:10px 13px;box-shadow:0 1px 2px #0001}.user .bubble{background:#fff;border:1px solid #dce3e7;border-radius:18px 18px 18px 5px}.admin .bubble{background:#8de055;border-radius:18px 18px 5px 18px;color:#14220d}.meta{font-size:10px;color:#77848b;margin-bottom:3px}.text{font-size:16px;line-height:1.55;font-weight:600;white-space:pre-wrap;word-break:break-word}.urgent{font-size:10px;color:#d63245;font-weight:900;margin-bottom:3px}.system{align-self:center;border-radius:999px;background:#e3eae6;border:1px solid #d3ddd7;color:#57655d;padding:6px 10px;font-size:11px;font-weight:800}
.incoming{display:none;margin:10px;background:#fff3d8;border:1px solid #edc269;border-radius:16px;padding:12px}.incoming.show{display:block;animation:flash 1s infinite}@keyframes flash{50%{box-shadow:0 0 18px #eeb94c88}}
.callbar{margin:10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px;background:#fff;border:1px solid #dce3df;border-radius:16px}.callStatus{font-size:12px;font-weight:900;margin-right:auto}.compose{padding:11px;border-top:1px solid #e1e7ea;background:#fff}.compose textarea{width:100%;min-height:86px;border:1px solid #d7dfe3;background:#f9fbfc;border-radius:16px;padding:12px;resize:vertical}.composeRow{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}.urgentCheck{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:#c33343}.urgentCheck input{width:18px;height:18px}.fileName{font-size:11px;color:#67757d}

.attachList{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.attachCard{display:flex;flex-direction:column;gap:4px;max-width:230px}
.attachCard img{max-width:230px;max-height:180px;border-radius:11px;border:1px solid #d9e1e5;object-fit:cover;background:#fff}
.attachActions{display:flex;gap:6px;font-size:11px}
.attachActions a{color:#246c9e;text-decoration:none;font-weight:800}

/* ===== 通知ベル / 案内ポップアップ ===== */
.bellBtn{margin-left:auto;flex:0 0 auto;width:44px;height:44px;border:0;border-radius:50%;
 background:#e8edf0;color:#5b6a73;font-size:20px;line-height:1;cursor:pointer;position:relative;
 display:flex;align-items:center;justify-content:center}
.bellBtn.on{background:#e2f5e4;color:#1f7d18}
.bellBtn.warn{background:#fdefe0;color:#b76b16}
.bellBtn .dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;
 background:#d33a4b;border:2px solid #fff;display:none}
.bellBtn.needs .dot{display:block}
.notifyPanel{margin:0 4px 12px;background:#fff;border:1px solid #dce3e7;border-radius:16px;
 padding:14px;box-shadow:0 10px 28px #0000000f}
.notifyPanel h4{margin:0 0 6px;font-size:15px}
.notifyPanel p{margin:0 0 10px;font-size:13px;color:#5b6a73;line-height:1.65}
.notifyPanel ol{margin:0 0 10px;padding-left:20px;font-size:13px;color:#39474f;line-height:1.9}
.notifyPanel .row{display:flex;gap:8px;flex-wrap:wrap}
.notifyPanel button{flex:1 1 130px;padding:12px;border:0;border-radius:11px;font-weight:900;font-size:14px;cursor:pointer}
.notifyPanel .primary{background:#1d282e;color:#fff}
.notifyPanel .ghost{background:#eef2f4;color:#48575f}
.notifyPanel .stat{font-size:12px;font-weight:900;margin-bottom:8px}
.notifyPanel .stat.ok{color:#1f7d18}
.notifyPanel .stat.warn{color:#b76b16}
.notifyPanel .stat.off{color:#7a878e}
.modalBack{position:fixed;inset:0;background:#0009;z-index:99998;display:none;
 align-items:center;justify-content:center;padding:18px}
.modalBack.show{display:flex}
.modalCard{background:#fff;border-radius:20px;padding:20px;max-width:420px;width:100%;
 box-shadow:0 24px 60px #00000040;max-height:86vh;overflow:auto}
.modalCard h3{margin:0 0 10px;font-size:18px}
.modalCard p{margin:0 0 12px;font-size:14px;color:#4a585f;line-height:1.75}
.modalCard ol{margin:0 0 14px;padding-left:22px;font-size:14px;color:#39474f;line-height:2}
.modalCard .row{display:flex;gap:9px;flex-wrap:wrap}
.modalCard button{flex:1 1 130px;padding:13px;border:0;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer}
.modalCard .primary{background:#1d282e;color:#fff}
.modalCard .ghost{background:#eef2f4;color:#48575f}
.shareIcon{display:inline-block;padding:1px 7px;border-radius:6px;background:#eef2f4;font-weight:900}
.warnBox{background:#fff6e8;border:2px solid #f0b95f;border-radius:12px;padding:12px 13px;
 font-size:14px;line-height:1.75;color:#7a4a08;margin:0 0 12px}
.warnBox b{color:#8a4b00}
.copyUrlBtn{width:100%;padding:12px;border:0;border-radius:11px;background:#3d5866;color:#fff;
 font-weight:900;font-size:14px;cursor:pointer;margin-top:4px}
.copyHint{font-size:12px;color:#7a878e;line-height:1.6;margin-top:7px}

function render(c){$('setup').classList.add('hidden');$('chat').classList.remove('hidden');$('no').textContent=c.consultNo+' '+(c.displayName||'匿名');$('state').textContent=c.hasReply?'返信あり':c.readAt?'既読':'';const ev=[];(c.messages||[]).forEach(m=>ev.push({k:'m',t:m.createdAt,d:m}));(c.callHistory||[]).forEach(x=>ev.push({k:'c',t:x.startedAt,d:x}));ev.sort((a,b)=>new Date(a.t)-new Date(b.t));$('thread').innerHTML=ev.map(e=>{if(e.k==='c'){const x=e.d,label=x.from==='admin'?'📞 イコエルから着信':'📲 イコエルへ発信',st=x.status==='connected'?'通話':x.status==='rejected'?'拒否':x.status==='ended'?'切断':'呼出中';return `<div class="system">${label} ・ ${st} ・ ${dt(x.startedAt)}</div>`}const m=e.d,adm=m.sender==='admin';return `<div class="msg ${adm?'admin':'user'}"><div class="av">${adm?`<img src="${ICON}">`:'相談者'}</div><div class="bubble">${m.urgent?'<div class="urgent">🔥 緊急</div>':''}<div class="meta">${adm?'イコエル':esc(c.displayName||'匿名')} ・ ${dt(m.createdAt)}</div><div class="text">${esc(m.text||((m.attachments||[]).length?'📎 添付ファイル':''))}</div>${userAttachHTML(c,m)}</div></div>`}).join('');$('thread').scrollTop=$('thread').scrollHeight}
async function refresh(){if(!current)return;try{const d=await api(`/api/consult/${current.id}?token=${encodeURIComponent(current.token)}`);render(d.conversation);updateBadge(d.conversation)}catch{}}
let lastSeenAdminId='';
function updateBadge(c){
 try{
  const msgs=(c?.messages||[]).filter(m=>m.sender==='admin');
  if(!msgs.length)return setBadge(0);
  const unread=msgs.filter(m=>!m.readAt).length;
  if(document.visibilityState==='visible'){setBadge(0);lastSeenAdminId=msgs[msgs.length-1].id}
  else setBadge(unread);
 }catch{}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setBadge(0)});
function connect(){if(!current)return;if(socket)socket.disconnect();socket=io({transports:['websocket','polling'],reconnection:true});socket.on('connect',()=>socket.emit('join:user',{id:current.id,token:current.token},ack=>{if(ack?.ok){render(ack.conversation);const lm=[...(ack.conversation.messages||[])].reverse().find(x=>x.sender==='admin');lastAdminMsg=lm?.id||'';handleState(ack.callState)}}));socket.on('conversation:update',d=>{notifyMessage(d.conversation);render(d.conversation)});socket.on('voice:signal',s=>{if(s.id===current.id)handleSignal(s)})}

async function unlockSounds(){
 try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume()}catch{}
 if(sndUnlocked)return;

  catch{ok=false}

}async function pollCall(){if(!current)return;try{const d=await api(`/api/consult/${current.id}/call-state?token=${encodeURIComponent(current.token)}&t=${Date.now()}`),s=d.state,k=s?JSON.stringify([s.state,s.from,s.at,(s.adminIce||[]).length,(s.userIce||[]).length,!!s.offer,!!s.answer]):'none';restoreUserCallUI(s);if(k!==lastCallKey){lastCallKey=k;handleState(s)}}catch{}}setInterval(pollCall,1000);
async function callAdmin(){try{unlock();await ensurePC();ring('outgoing');status('発信中');$('call').classList.add('hidden');$('cancelCall').classList.remove('hidden');await sig('call');const o=await pc.createOffer();await pc.setLocalDescription(o);await sig('offer',o)}catch(e){status('マイクを使用できません')}}async function answer(){try{unlock();$('incoming').classList.remove('show');stopRing();await ensurePC();
 if(!pendingOffer){
  // offer 未着。サーバから取り直す。
  try{const d=await api(`/api/consult/${current.id}/call-state?token=${encodeURIComponent(current.token)}&t=${Date.now()}`);if(d?.state?.offer)pendingOffer=d.state.offer}catch{}
 }
 if(!pendingOffer){status('接続失敗（発信情報が届いていません）');return}
 await pc.setRemoteDescription(new RTCSessionDescription(pendingOffer));
 await flush();
 const a=await pc.createAnswer();
 await pc.setLocalDescription(a);
 await sig('answer',a);
 pendingOffer=null;
 await sig('accept');
 status('通話中')
}catch(e){console.error('answer',e);status('接続失敗 ('+(e?.name||'Error')+')')}}async function reject(){$('incoming').classList.remove('show');stopRing();drop();await sig('reject');status('切断')}async function endCall(send=true){if(send)try{await sig('hangup')}catch{}drop();if(pc)pc.close();pc=null;if(localStream)localStream.getTracks().forEach(t=>t.stop());localStream=null;if(remoteAudio)remoteAudio.remove();remoteAudio=null;pendingOffer=null;pendingIce=[];uAppliedIce=new Set();$('incoming').classList.remove('show');$('call').classList.remove('hidden');$('cancelCall').classList.add('hidden');$('mute').classList.add('hidden');$('hang').classList.add('hidden');status('切断');stopTimer();refresh()}function startTimer(){callStarted=Date.now();clearInterval(callTimer);callTimer=setInterval(()=>{const s=Math.floor((Date.now()-callStarted)/1000);$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000)}function stopTimer(){clearInterval(callTimer);$('timer').textContent=''}
$('setupBtn').onclick=async()=>{unlock();primeMessageAudio();try{const d=await api('/api/consult/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value})});current={id:d.id,token:d.accessToken};save();render(d.conversation);connect();initPush().then(()=>maybeShowNotifyModal()).catch(()=>{})}catch(e){alert(e.message)}};$('send').onclick=async()=>{
 unlock();primeMessageAudio();
 const btn=$('send'),chosen=[...$('files').files];
 const fd=new FormData();
 fd.append('text',$('text').value);
 fd.append('urgent',$('urgent').checked?'1':'0');
 fd.append('token',current.token);
 chosen.forEach(f=>fd.append('files',f));
 try{
  btn.disabled=true;btn.textContent=chosen.length?'画像送信中…':'送信中…';
  const d=await api(`/api/consult/${current.id}/reply`,{method:'POST',headers:{'x-consult-token':current.token},body:fd});
  $('text').value='';$('urgent').checked=false;$('files').value='';$('fileName').textContent='';
  render(d.conversation);
 }catch(e){alert('送信できません: '+e.message)}
 finally{btn.disabled=false;btn.textContent='送信'}
};
$('files').onchange=()=>$('fileName').textContent=[...$('files').files].map(f=>f.name).join(' / ');$('call').onclick=callAdmin;$('cancelCall').onclick=()=>endCall(true);$('answer').onclick=answer;$('reject').onclick=reject;$('hang').onclick=()=>endCall(true);$('mute').onclick=()=>{muted=!muted;localStream?.getAudioTracks().forEach(t=>t.enabled=!muted);$('mute').textContent=muted?'🔇 ミュート中':'🎤 マイクON'};
current=load();if(current){refresh();connect();initPush().catch(()=>{})}

/* ===================== 通話診断（?diag=1 のときだけ有効）===================== */
(function(){
 if(!/[?&]diag=1/.test(location.search))return;
 const box=document.createElement('div');
 box.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#101a20;border-top:2px solid #2b3a44;padding:8px;max-height:62vh;overflow:auto;display:none';
 box.innerHTML='<div style="display:flex;gap:6px;align-items:center;color:#cfe6f5;font:900 12px sans-serif;margin-bottom:6px">🩺 通話診断'
  +'<button id="dgCopy" style="margin-left:auto;background:#2f4653;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-weight:900">コピー</button>'
  +'<button id="dgClose" style="background:#2f4653;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-weight:900">閉じる</button></div>'
  +'<textarea id="dgText" readonly style="width:100%;height:38vh;background:#0a1216;color:#9ef0a8;border:1px solid #2b3a44;border-radius:8px;padding:8px;font:11px/1.55 Consolas,monospace;white-space:pre"></textarea>';
 const btn=document.createElement('button');
 btn.textContent='🩺';
 btn.style.cssText='position:fixed;right:10px;bottom:10px;z-index:99999;width:48px;height:48px;border-radius:50%;border:0;background:#1d282e;color:#fff;font-size:20px;box-shadow:0 6px 18px #0006';
 document.body.appendChild(box);document.body.appendChild(btn);
 box.querySelector('#dgClose').onclick=()=>box.style.display='none';
 box.querySelector('#dgCopy').onclick=()=>{const t=box.querySelector('#dgText');try{t.select();t.setSelectionRange(0,999999);document.execCommand('copy')}catch{}try{navigator.clipboard?.writeText(t.value)}catch{}};
 btn.onclick=async()=>{
  box.style.display='block';
  const out=box.querySelector('#dgText');out.value='診断中...';
  const L=[],add=(k,v)=>L.push(k+': '+v);
  try{
   add('画面バージョン',window.__CONSULT_VERSION||'不明');
   add('日時',new Date().toLocaleString('ja-JP'));
   add('URL',location.href);
   add('isSecureContext',window.isSecureContext?'true':'★false');
   add('userAgent',navigator.userAgent);
   add('mediaDevices',navigator.mediaDevices?'あり':'★なし');
   add('画面表示状態',document.visibilityState);
   L.push('');
   try{const p=await navigator.permissions.query({name:'microphone'});add('permissions.microphone',p.state==='denied'?'★denied':p.state)}
   catch(e){add('permissions.microphone','取得不可')}
   L.push('');
   L.push('----- 自分のマイク -----');
   if(typeof localStream!=='undefined'&&localStream){
    const ts=localStream.getAudioTracks();
    add('トラック数',(ts.length?'':'★')+ts.length);
    ts.forEach((t,i)=>{
     add('  track'+(i+1)+' label',t.label||'(なし)');
     add('  track'+(i+1)+' enabled',(t.enabled?'':'★')+String(t.enabled)+(t.enabled?'':'  ←ミュート中'));
     add('  track'+(i+1)+' muted',(t.muted?'★':'')+String(t.muted)+(t.muted?'  ←ブラウザが停止':''));
     add('  track'+(i+1)+' readyState',(t.readyState==='live'?'':'★')+t.readyState);
    });
   }else add('localStream','★なし（マイク未取得）');
   L.push('');
   L.push('----- 通話 -----');
   if(typeof pc==='undefined'||!pc){add('PeerConnection','なし（通話中に押してください）')}
   else{
    add('signalingState',pc.signalingState);
    add('iceConnectionState',(['failed','disconnected'].includes(pc.iceConnectionState)?'★':'')+pc.iceConnectionState);
    add('connectionState',(['failed','disconnected'].includes(pc.connectionState)?'★':'')+pc.connectionState);
    add('送信トラック',pc.getSenders().filter(x=>x.track).map(x=>x.track.kind+':'+x.track.readyState+(x.track.enabled?'':'(無効)')).join(', ')||'★なし');
    add('受信トラック',pc.getReceivers().filter(x=>x.track).map(x=>x.track.kind+':'+x.track.readyState).join(', ')||'★なし');
    if(typeof remoteAudio!=='undefined'&&remoteAudio){
     add('再生要素 paused',(remoteAudio.paused?'★':'')+String(remoteAudio.paused));
     add('再生要素 muted',String(remoteAudio.muted));
     add('再生要素 volume',String(remoteAudio.volume));
     add('再生要素 srcObject',remoteAudio.srcObject?'あり':'★なし');
    }
    try{
     const st=await pc.getStats();let pair=null,loc=null,rem=null,inb=null,outb=null,src=null;
     st.forEach(r=>{
      if(r.type==='candidate-pair'&&r.state==='succeeded'&&(r.nominated||!pair))pair=r;
      if(r.type==='inbound-rtp'&&r.kind==='audio')inb=r;
      if(r.type==='outbound-rtp'&&r.kind==='audio')outb=r;
      if(r.type==='media-source'&&r.kind==='audio')src=r;
     });
     if(pair){
      st.forEach(r=>{if(r.id===pair.localCandidateId)loc=r;if(r.id===pair.remoteCandidateId)rem=r});
      add('選ばれた経路','自分='+(loc?.candidateType||'?')+' / 相手='+(rem?.candidateType||'?'));
      add('往復遅延',pair.currentRoundTripTime!=null?Math.round(pair.currentRoundTripTime*1000)+' ms':'不明');
     }else add('選ばれた経路','★成立した経路なし');
     if(src){
      add('マイク入力レベル',(src.audioLevel!=null?src.audioLevel.toFixed(4):'不明')+(src.audioLevel!=null&&src.audioLevel<0.0001?'  ←★無音':''));
      if(src.totalAudioEnergy!=null)add('累積音声エネルギー',(src.totalAudioEnergy>0?'':'★')+src.totalAudioEnergy.toFixed(6));
     }else add('マイク入力','★media-source なし');
     if(outb){
      add('送信 packetsSent',(outb.packetsSent?'':'★')+String(outb.packetsSent??0));
      add('送信 bytesSent',(outb.bytesSent?'':'★')+String(outb.bytesSent??0));
     }else add('送信RTP','★なし');
     if(inb){
      add('受信 packetsReceived',(inb.packetsReceived?'':'★')+String(inb.packetsReceived??0));
      add('受信 bytesReceived',(inb.bytesReceived?'':'★')+String(inb.bytesReceived??0));
     }else add('受信RTP','★なし');
    }catch(e){add('getStats','★失敗 '+(e?.name||''))}
   }
  }catch(e){add('診断中に例外',(e?.name||'')+' '+(e?.message||''))}
  out.value=L.join('\n');
 };
})();
</script></body></html>
