<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>イコエル相談チャット</title>
<style>
:root{
  --bg:#eef2f4;
  --panel:#ffffff;
  --panel2:#f7f9fa;
  --line:#d9e0e4;
  --text:#182025;
  --sub:#71808a;
  --lime:#54d935;
  --lime2:#3bc821;
  --dark:#20282d;
  --danger:#ef4d5b;
  --gold:#d6a12e;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
  radial-gradient(circle at 10% 0,#f7fff4 0,transparent 34%),
  linear-gradient(180deg,#f3f6f7,#e9eef0);
  color:var(--text);font-family:Arial,"Noto Sans JP","Yu Gothic",sans-serif}
body{padding:0}
.shell{max-width:880px;margin:0 auto;padding:22px 16px 48px}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 2px 16px;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#20282d,#11171b);
  color:#7cff5c;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:900;
  box-shadow:0 8px 22px #1c292f22;
}
.brand h1{font-size:24px;margin:0;letter-spacing:-.02em}
.brand p{margin:3px 0 0;color:var(--sub);font-size:12px}
.newBtn{
  border:0;border-radius:999px;background:var(--dark);color:#fff;padding:10px 15px;font-weight:800;cursor:pointer;
  box-shadow:0 7px 16px #1c292f20
}
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#ffffff 0%,#f7fbf8 58%,#eeffe9 100%);
  border:1px solid #dce5df;border-radius:24px;padding:24px 24px 22px;margin-bottom:16px;
  box-shadow:0 16px 45px #33444d12;
}
.hero:after{
  content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-80px;top:-100px;
  background:#69e84c1b
}
.hero h2{margin:0 0 10px;font-size:22px}
.hero p{margin:0;color:#53626b;line-height:1.75;font-size:14px;max-width:690px}
.privacy{
  margin-top:15px;display:flex;gap:10px;align-items:flex-start;background:#f1f8f0;border:1px solid #d5ead1;
  border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.6;color:#415047
}
.privacy b{color:#258d18}
.sectionTitle{font-size:13px;color:#66757e;font-weight:800;margin:18px 2px 9px;letter-spacing:.04em}
.startCard,.chatCard,.historyCard{
  background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 12px 35px #2e3d4510
}
.startCard{padding:20px}
.group{margin-bottom:18px}
.groupLabel{font-size:12px;color:#7a8991;font-weight:800;margin-bottom:8px}
.choiceGrid{display:flex;gap:8px;flex-wrap:wrap}
.choice input{display:none}
.choice span{
  display:flex;align-items:center;gap:7px;padding:10px 13px;border-radius:13px;background:#f4f7f8;
  border:1px solid #dde4e7;color:#41505a;font-size:13px;font-weight:750;cursor:pointer;transition:.16s
}
.choice input:checked+span{
  background:#efffea;border-color:#7cdf64;color:#207a18;box-shadow:0 0 0 2px #65df4b18
}
.nameInput,.messageInput,.selectLike{
  width:100%;border:1px solid #dbe3e6;background:#f7f9fa;color:var(--text);border-radius:14px;padding:12px 14px;
  font:inherit;outline:none
}
.nameInput:focus,.messageInput:focus{border-color:#79d968;box-shadow:0 0 0 3px #65df4b18}
.messageInput{min-height:145px;resize:vertical;font-size:16px;line-height:1.55}
.attachBox{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:12px 14px;border:1px dashed #cbd5da;border-radius:14px;background:#f8fafb
}
.attachBox input{max-width:100%}
.attachNote{color:#87949b;font-size:11px}
.urgentRow{display:flex;align-items:center;gap:8px;color:#b52f3d;font-size:13px;font-weight:800}
.sendBtn{
  width:100%;border:0;border-radius:15px;background:linear-gradient(135deg,var(--lime),var(--lime2));
  color:#0d2b08;padding:14px 18px;font-size:16px;font-weight:900;cursor:pointer;
  box-shadow:0 9px 20px #45c92a32
}
.status{min-height:18px;margin-top:8px;color:#687780;font-size:12px}
.hidden{display:none!important}

.historyCard{padding:12px}
.historyList{display:grid;gap:8px}
.historyItem{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 13px;border-radius:14px;
  background:#f7f9fa;border:1px solid #e0e6e9;cursor:pointer
}
.historyItem:hover{border-color:#a8dba0;background:#f5fff2}
.historyMain{min-width:0}
.historyNo{font-weight:900;font-size:13px}
.historySub{font-size:11px;color:#7d8b93;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.historyState{font-size:11px;border-radius:999px;padding:5px 8px;background:#eaf3e8;color:#34762e;font-weight:800}

.chatCard{padding:16px}
.threadHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:3px 2px 12px;border-bottom:1px solid #edf0f2}
.threadMeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.threadNo{font-size:15px;font-weight:900}
.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef2f4;color:#54636c;font-weight:800}
.msg{display:flex;align-items:flex-end;gap:10px;margin:17px 0}
.avatar{
  width:42px;height:42px;border-radius:50%;flex:0 0 42px;background:#e4e9ec;border:1px solid #d4dde1;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#58666e;overflow:hidden
}
.avatar img{width:100%;height:100%;object-fit:cover}
.bubble{
  position:relative;max-width:76%;background:#f0f3f5;border:1px solid #e0e5e8;border-radius:17px 17px 17px 5px;
  padding:12px 15px
}
.msg.admin{flex-direction:row-reverse}
.msg.admin .bubble{
  background:#f5f8f3;border-color:#dbe8d7;border-left:3px solid #5bd23b;border-radius:17px 17px 5px 17px
}
.meta{font-size:12px;color:#829098;font-weight:700;margin-bottom:5px}
.msg.admin .meta{text-align:right}
.text{font-size:19px;font-weight:650;line-height:1.55;color:#1e272c;word-break:break-word}
.att{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.att a{font-size:11px;color:#2e789a;text-decoration:none;background:#eaf2f5;padding:5px 7px;border-radius:7px}
.replyArea{margin-top:20px;padding-top:16px;border-top:1px solid #edf0f2}
.replyArea textarea{min-height:95px}
.replyBar{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.replyBar input{flex:1;min-width:220px}
.replyBtn{
  border:0;border-radius:12px;background:#20282d;color:white;padding:11px 15px;font-weight:850;cursor:pointer
}
.backLink{border:0;background:transparent;color:#55656d;font-weight:800;cursor:pointer;padding:7px 3px}
@media(max-width:640px){
  .topbar{align-items:flex-start}.brand h1{font-size:20px}.newBtn{padding:9px 12px;font-size:12px}
  .hero{padding:20px}.startCard{padding:15px}.bubble{max-width:82%}.text{font-size:18px}
}

.fileQueue{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.fileChip{display:flex;align-items:center;gap:6px;padding:7px 9px;background:#eef3f5;border:1px solid #d9e2e6;border-radius:10px;font-size:11px;color:#55656e}
.fileChip button{border:0;background:#dfe7ea;color:#5d6970;border-radius:50%;width:20px;height:20px;cursor:pointer;font-weight:900;padding:0}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">
      <div class="logo">E</div>
      <div><h1>イコエル相談チャット</h1><p>1：1 相談・情報提供チャット</p></div>
    </div>
    <button class="newBtn" id="newConsultTop">＋ 新しい相談</button>
  </div>

  <section class="hero">
    <h2>イコエルと直接やり取りできます</h2>
    <p>匿名でも、お好きな名前を設定しても利用できます。相談・情報提供のほか、画像・動画・音声などの資料も送信できます。</p>
    <div class="privacy"><span>🔒</span><div><b>他のユーザーに公開されることはありません。</b><br>イコエルが確認すると既読になり、返信はリアルタイムでこの画面に届きます。</div></div>
  </section>

  <div id="historyWrap" class="hidden">
    <div class="sectionTitle">過去の相談</div>
    <div class="historyCard"><div id="historyList" class="historyList"></div></div>
  </div>

  <div id="startWrap">
    <div class="sectionTitle">新しい相談をはじめる</div>
    <div class="startCard">
      <div class="group">
        <div class="groupLabel">内容の種類</div>
        <div class="choiceGrid">
          <label class="choice"><input type="radio" name="type" value="consult" checked><span>💬 相談</span></label>
          <label class="choice"><input type="radio" name="type" value="info"><span>📎 情報提供</span></label>
        </div>
      </div>

      <div class="group">
        <div class="groupLabel">カテゴリ</div>
        <div class="choiceGrid">
          <label class="choice"><input type="radio" name="category" value="配信" checked><span>配信</span></label>
          <label class="choice"><input type="radio" name="category" value="活動者"><span>活動者</span></label>
          <label class="choice"><input type="radio" name="category" value="事件・トラブル"><span>事件・トラブル</span></label>
          <label class="choice"><input type="radio" name="category" value="その他"><span>その他</span></label>
        </div>
      </div>

      <div class="group">
        <div class="groupLabel">表示名</div>
        <div class="choiceGrid">
          <label class="choice"><input type="radio" name="nameMode" value="anonymous" checked><span>匿名</span></label>
          <label class="choice"><input type="radio" name="nameMode" value="named"><span>名前を設定</span></label>
        </div>
        <input id="name" class="nameInput hidden" maxlength="40" placeholder="表示する名前" style="margin-top:9px">
      </div>

      <div class="group">
        <div class="groupLabel">配信での取り扱い</div>
        <div class="choiceGrid">
          <label class="choice"><input type="radio" name="permission" value="allow"><span>掲載許可</span></label>
          <label class="choice"><input type="radio" name="permission" value="anonymous_only" checked><span>匿名掲載のみ</span></label>
          <label class="choice"><input type="radio" name="permission" value="ask"><span>要相談</span></label>
          <label class="choice"><input type="radio" name="permission" value="deny"><span>掲載不可</span></label>
        </div>
      </div>

      <div class="group">
        <div class="groupLabel">相談内容</div>
        <textarea id="text" class="messageInput" maxlength="8000" placeholder="ここに相談・情報提供の内容を書いてください"></textarea>
      </div>

      <div class="group">
        <div class="groupLabel">画像・動画・音声</div>
        <div class="attachBox">
          <input id="files" type="file" multiple accept="image/*,video/*,audio/*"><div id="filesQueue" class="fileQueue"></div>
          <div class="attachNote">最大10ファイル / 1ファイル50MB</div>
        </div>
      </div>

      <div class="group urgentRow"><input id="urgent" type="checkbox"> 🔥 緊急として送る</div>

      <button id="send" class="sendBtn">相談を送信する</button>
      <div id="sendStatus" class="status"></div>
    </div>
  </div>

  <div id="chatWrap" class="hidden">
    <div class="sectionTitle"><button id="backToList" class="backLink">← 相談一覧へ</button></div>
    <div class="chatCard">
      <div class="threadHead">
        <div class="threadMeta"><span id="consultNo" class="threadNo"></span><span id="kind" class="badge"></span></div>
        <span id="seen" class="badge">未読</span>
      </div>
      <div id="thread"></div>
      <div class="replyArea">
        <textarea id="replyText" class="messageInput" placeholder="追加メッセージ"></textarea>
        <div class="replyBar">
          <input id="replyFiles" type="file" multiple accept="image/*,video/*,audio/*"><div id="replyFilesQueue" class="fileQueue"></div>
          <button id="replySend" class="replyBtn">追加送信</button>
        </div>
        <div id="replyStatus" class="status"></div>
      </div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dt=s=>new Date(s).toLocaleString('ja-JP');
let device=localStorage.getItem('consult_device_token');
if(!device){device=crypto.randomUUID();localStorage.setItem('consult_device_token',device)}
let current=null,es=null;
let history=JSON.parse(localStorage.getItem('consult_history')||'[]');

let newFiles=[];
let replyFilesQueue=[];

function addToQueue(target,input,renderFn){
  const incoming=[...input.files];
  for(const f of incoming){
    if(target.length>=10)break;
    const duplicate=target.some(x=>x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified);
    if(!duplicate)target.push(f);
  }
  input.value='';
  renderFn();
}
function renderFileQueue(target,boxId,kind){
  $(boxId).innerHTML=target.map((f,i)=>`<div class="fileChip"><span>📎 ${esc(f.name)} (${Math.ceil(f.size/1024)}KB)</span><button type="button" data-i="${i}">×</button></div>`).join('');
  $(boxId).querySelectorAll('button').forEach(b=>b.onclick=()=>{
    target.splice(Number(b.dataset.i),1);
    renderFileQueue(target,boxId,kind);
  });
}
$('files').addEventListener('change',()=>addToQueue(newFiles,$('files'),()=>renderFileQueue(newFiles,'filesQueue','new')));
$('replyFiles').addEventListener('change',()=>addToQueue(replyFilesQueue,$('replyFiles'),()=>renderFileQueue(replyFilesQueue,'reply')));


document.querySelectorAll('input[name=nameMode]').forEach(x=>x.onchange=()=>{
  $('name').classList.toggle('hidden',document.querySelector('input[name=nameMode]:checked').value!=='named')
});

function saveHistory(){
  localStorage.setItem('consult_history',JSON.stringify(history.slice(0,20)));
  renderHistory();
}
function addHistory(item){
  history=history.filter(x=>x.id!==item.id);
  history.unshift(item);saveHistory();
}
function renderHistory(){
  if(!history.length){$('historyWrap').classList.add('hidden');return}
  $('historyWrap').classList.remove('hidden');
  $('historyList').innerHTML=history.map(h=>`
    <div class="historyItem" data-id="${h.id}">
      <div class="historyMain"><div class="historyNo">${esc(h.consultNo||'相談')}</div>
      <div class="historySub">${esc(h.preview||'相談履歴')}</div></div>
      <div class="historyState">${esc(h.state||'開く')}</div>
    </div>`).join('');
  document.querySelectorAll('.historyItem').forEach(el=>el.onclick=()=>openHistory(el.dataset.id));
}
function showStart(){
  if(es){es.close();es=null}
  current=null;
  $('startWrap').classList.remove('hidden');$('chatWrap').classList.add('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}
function showChat(){
  $('startWrap').classList.add('hidden');$('chatWrap').classList.remove('hidden');
}
function avatar(c){
  if(c.nameMode==='named') return `<div class="avatar">${esc((c.displayName||'名').trim().slice(0,1))}</div>`;
  return `<div class="avatar">相談者</div>`;
}
function adminAvatar(){return `<div class="avatar" style="background:#20282d;color:#72ef55">E</div>`}
function render(c){
  showChat();
  $('consultNo').textContent=c.consultNo;
  $('kind').textContent=(c.urgent?'🔥 緊急 / ':'')+(c.type==='info'?'情報提供':'相談')+' / '+c.category;
  $('seen').textContent=c.hasReply?'返信あり':(c.readAt?'既読':'未読');
  $('thread').innerHTML=c.messages.map(m=>{
    const isAdmin=m.sender==='admin';
    const who=isAdmin?'イコエル':(c.nameMode==='named'?c.displayName:'匿名');
    const av=isAdmin?adminAvatar():avatar(c);
    return `<div class="msg ${isAdmin?'admin':''}">${av}<div class="bubble">
      <div class="meta">${esc(who)} ・ ${dt(m.createdAt)}</div>
      <div class="text">${esc(m.text).replace(/\n/g,'<br>')}</div>
      <div class="att">${m.attachments.map(a=>`<a href="/api/consult/${c.id}/attachment/${a.id}?token=${encodeURIComponent(current.token)}">📎 ${esc(a.name)}</a>`).join('')}</div>
    </div></div>`;
  }).join('');
  const last=c.messages[c.messages.length-1];
  const h=history.find(x=>x.id===c.id);
  if(h){h.preview=(last?.text||'(添付あり)').slice(0,55);h.state=c.hasReply?'返信あり':(c.readAt?'既読':'未読');h.consultNo=c.consultNo;saveHistory()}
}
function startRealtime(){
  if(!current)return;
  if(es){es.close();es=null}
  es=new EventSource(`/api/consult/${current.id}/events?token=${encodeURIComponent(current.token)}`);
  es.addEventListener('update',e=>{try{render(JSON.parse(e.data).conversation)}catch{}});
  es.onerror=()=>{try{es.close()}catch{};es=null;setTimeout(()=>current&&startRealtime(),1800)};
}
async function openHistory(id){
  const h=history.find(x=>x.id===id);if(!h)return;
  current={id:h.id,token:h.token};
  try{
    const r=await fetch(`/api/consult/${current.id}?token=${encodeURIComponent(current.token)}&t=${Date.now()}`,{cache:'no-store'});
    if(!r.ok)throw Error();
    const j=await r.json();render(j.conversation);startRealtime();
  }catch{
    history=history.filter(x=>x.id!==id);saveHistory();showStart();
  }
}

$('newConsultTop').onclick=showStart;
$('backToList').onclick=showStart;

$('send').onclick=async()=>{
  $('sendStatus').textContent='送信中…';
  if(newFiles.length>10){$('sendStatus').textContent='添付は最大10ファイルです';return}
  const fd=new FormData();
  fd.append('device_token',device);
  fd.append('type',document.querySelector('input[name=type]:checked').value);
  fd.append('category',document.querySelector('input[name=category]:checked').value);
  fd.append('name_mode',document.querySelector('input[name=nameMode]:checked').value);
  fd.append('name',$('name').value);
  fd.append('permission',document.querySelector('input[name=permission]:checked').value);
  fd.append('text',$('text').value);
  fd.append('urgent',$('urgent').checked?'1':'0');
  newFiles.forEach(f=>fd.append('files',f));
  try{
    const r=await fetch('/api/consult/new',{method:'POST',body:fd});
    const j=await r.json();if(!r.ok)throw Error(j.error||'送信に失敗しました');
    current={id:j.id,token:j.accessToken};
    addHistory({id:j.id,token:j.accessToken,consultNo:j.consultNo,preview:$('text').value.slice(0,55),state:'未読'});
    $('text').value='';$('files').value='';newFiles=[];renderFileQueue(newFiles,'filesQueue','new');$('urgent').checked=false;$('sendStatus').textContent='';
    render(j.conversation);startRealtime();
  }catch(e){$('sendStatus').textContent=e.message}
};

$('replySend').onclick=async()=>{
  if(!current)return;
  if(replyFilesQueue.length>10){$('replyStatus').textContent='添付は最大10ファイルです';return}
  $('replyStatus').textContent='送信中…';
  const fd=new FormData();fd.append('access_token',current.token);fd.append('text',$('replyText').value);
  replyFilesQueue.forEach(f=>fd.append('files',f));
  try{
    const r=await fetch(`/api/consult/${current.id}/reply`,{method:'POST',body:fd});
    const j=await r.json();if(!r.ok)throw Error(j.error||'送信失敗');
    $('replyText').value='';$('replyFiles').value='';replyFilesQueue=[];renderFileQueue(replyFilesQueue,'replyFilesQueue','reply');$('replyStatus').textContent='送信しました';
    render(j.conversation);
    setTimeout(()=>$('replyStatus').textContent='',1200);
  }catch(e){$('replyStatus').textContent=e.message}
};

renderHistory();
if(history.length) openHistory(history[0].id); else showStart();
</script>
</body>
</html>
