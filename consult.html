*{box-sizing:border-box}html,body{margin:0;background:#eef1f4;color:#162027;font-family:Arial,"Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}body{min-height:100vh}input,textarea,select,button{font-size:16px!important}
.wrap{max-width:760px;margin:auto;padding:14px 10px 110px}.top{display:flex;align-items:center;gap:10px;margin:4px 4px 12px}.brandIcon{width:40px;height:40px;border-radius:50%;overflow:hidden}.brandIcon img{width:100%;height:100%;object-fit:cover}.brand b{font-size:19px}.brand p{font-size:12px;color:#77858d;margin:2px 0}
.card{background:#fff;border:1px solid #dce3e7;border-radius:20px;overflow:hidden;box-shadow:0 6px 24px #0000000d}.setup{padding:18px}.setup input{width:100%;padding:13px 14px;border:1px solid #d8e0e4;border-radius:14px;background:#f9fbfc}.hint{font-size:12px;color:#76848b;margin:7px 2px 12px}button{border:0;border-radius:999px;padding:10px 15px;font-weight:900}.dark{background:#1d282e;color:#fff}.green{background:#86e457;color:#16310d}.gray{background:#edf1f3;color:#516068}.red{background:#ffe7ea;color:#ba2d3e}.hidden{display:none!important}
.head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid #e5eaed}.no{font-size:18px;font-weight:900}.state{font-size:11px;background:#eef2f4;padding:6px 9px;border-radius:999px;color:#65737b}
.thread{min-height:360px;padding:16px 10px;display:flex;flex-direction:column;gap:10px;background:#eef1f4}.msg{display:flex;align-items:flex-end;gap:8px;width:100%}.msg.user{justify-content:flex-start}.msg.admin{justify-content:flex-end}.av{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:0 0 36px;display:flex;align-items:center;justify-content:center;background:#dfe5e8;color:#52616a;font-size:10px;font-weight:900}.av img{width:100%;height:100%;object-fit:cover}.admin .av{order:2}.bubble{max-width:76%;padding:10px 13px;box-shadow:0 1px 2px #0001}.user .bubble{background:#fff;border:1px solid #dce3e7;border-radius:18px 18px 18px 5px}.admin .bubble{background:#8de055;border-radius:18px 18px 5px 18px;color:#14220d}.meta{font-size:10px;color:#77848b;margin-bottom:3px}.text{font-size:16px;line-height:1.55;font-weight:600;white-space:pre-wrap;word-break:break-word}.urgent{font-size:10px;color:#d63245;font-weight:900;margin-bottom:3px}.system{align-self:center;border-radius:999px;background:#e3eae6;border:1px solid #d3ddd7;color:#57655d;padding:6px 10px;font-size:11px;font-weight:800}
.incoming{display:none;margin:10px;background:#fff3d8;border:1px solid #edc269;border-radius:16px;padding:12px}.incoming.show{display:block;animation:flash 1s infinite}@keyframes flash{50%{box-shadow:0 0 18px #eeb94c88}}
.callbar{margin:10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px;background:#fff;border:1px solid #dce3df;border-radius:16px}.callStatus{font-size:12px;font-weight:900;margin-right:auto}.compose{padding:11px;border-top:1px solid #e1e7ea;background:#fff}.compose textarea{width:100%;min-height:86px;border:1px solid #d7dfe3;background:#f9fbfc;border-radius:16px;padding:12px;resize:vertical}.composeRow{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}.urgentCheck{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:#c33343}.urgentCheck input{width:18px;height:18px}.fileName{font-size:11px;color:#67757d}

.attachList{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.attachCard{display:flex;flex-direction:column;gap:4px;max-width:230px}
.attachCard img{max-width:230px;max-height:180px;border-radius:11px;border:1px solid #d9e1e5;object-fit:cover;background:#fff}
.attachActions{display:flex;gap:6px;font-size:11px}
.attachActions a{color:#246c9e;text-decoration:none;font-weight:800}

function render(c){$('setup').classList.add('hidden');$('chat').classList.remove('hidden');$('no').textContent=c.consultNo+' '+(c.displayName||'匿名');$('state').textContent=c.hasReply?'返信あり':c.readAt?'既読':'';const ev=[];(c.messages||[]).forEach(m=>ev.push({k:'m',t:m.createdAt,d:m}));(c.callHistory||[]).forEach(x=>ev.push({k:'c',t:x.startedAt,d:x}));ev.sort((a,b)=>new Date(a.t)-new Date(b.t));$('thread').innerHTML=ev.map(e=>{if(e.k==='c'){const x=e.d,label=x.from==='admin'?'📞 イコエルから着信':'📲 イコエルへ発信',st=x.status==='connected'?'通話':x.status==='rejected'?'拒否':x.status==='ended'?'切断':'呼出中';return `<div class="system">${label} ・ ${st} ・ ${dt(x.startedAt)}</div>`}const m=e.d,adm=m.sender==='admin';return `<div class="msg ${adm?'admin':'user'}"><div class="av">${adm?`<img src="${ICON}">`:'相談者'}</div><div class="bubble">${m.urgent?'<div class="urgent">🔥 緊急</div>':''}<div class="meta">${adm?'イコエル':esc(c.displayName||'匿名')} ・ ${dt(m.createdAt)}</div><div class="text">${esc(m.text||((m.attachments||[]).length?'📎 添付ファイル':''))}</div>${userAttachHTML(c,m)}</div></div>`}).join('');$('thread').scrollTop=$('thread').scrollHeight}
async function refresh(){if(!current)return;try{const d=await api(`/api/consult/${current.id}?token=${encodeURIComponent(current.token)}`);render(d.conversation);updateBadge(d.conversation)}catch{}}
let lastSeenAdminId='';
function updateBadge(c){
 try{
  const msgs=(c?.messages||[]).filter(m=>m.sender==='admin');
  if(!msgs.length)return setBadge(0);
  const unread=msgs.filter(m=>!m.readAt).length;
  if(document.visibilityState==='visible'){setBadge(0);lastSeenAdminId=msgs[msgs.length-1].id}
  else setBadge(unread);
 }catch{}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setBadge(0)});
function connect(){if(!current)return;if(socket)socket.disconnect();socket=io({transports:['websocket','polling'],reconnection:true});socket.on('connect',()=>socket.emit('join:user',{id:current.id,token:current.token},ack=>{if(ack?.ok){render(ack.conversation);const lm=[...(ack.conversation.messages||[])].reverse().find(x=>x.sender==='admin');lastAdminMsg=lm?.id||'';handleState(ack.callState)}}));socket.on('conversation:update',d=>{notifyMessage(d.conversation);render(d.conversation)});socket.on('voice:signal',s=>{if(s.id===current.id)handleSignal(s)})}

async function primeMessageAudio(){
 if(messageAudioReady)return;
 try{
  messageAudio.volume=0;
  await messageAudio.play();
  messageAudio.pause();messageAudio.currentTime=0;messageAudio.volume=1;
  messageAudioReady=true;
 }catch{}
}
document.addEventListener('touchstart',primeMessageAudio,{passive:true,once:false});
document.addEventListener('pointerdown',primeMessageAudio,{passive:true,once:false});

 const m=[...(c.messages||[])].reverse().find(x=>x.sender==='admin');
 if(m&&m.id!==lastAdminMsg){playMessage();lastAdminMsg=m.id}
}

function b64ToU8(base64){
 const pad='='.repeat((4-base64.length%4)%4);
 const s=(base64+pad).replace(/-/g,'+').replace(/_/g,'/');
 const raw=atob(s),out=new Uint8Array(raw.length);
 for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
 return out;
}

async function subscribePush(){
 if(!current?.id)return {ok:false,reason:'相談が開始されていません'};
 if(!('Notification' in window))return {ok:false,reason:'この端末は通知に対応していません'};
 if(isIOS&&!isStandalone)
   return {ok:false,reason:'iPhoneでは「ホーム画面に追加」したアイコンから開いた場合のみ通知を受け取れます'};
 try{
  const perm=await Notification.requestPermission();
  if(perm!=='granted')return {ok:false,reason:'通知が許可されていません（端末の設定から許可してください）'};
  const reg=swReg||await registerSW();
  if(!reg)return {ok:false,reason:'Service Worker を登録できませんでした'};
  const r=await fetch('/api/consult/push-public-key');
  const {publicKey}=await r.json();
  if(!publicKey)return {ok:false,reason:'サーバ側の通知キーが未設定です'};
  let sub=await reg.pushManager.getSubscription();
  if(!sub){
   sub=await reg.pushManager.subscribe({
    userVisibleOnly:true,
    applicationServerKey:b64ToU8(publicKey)
   });
  }
  const res=await fetch(`/api/consult/${current.id}/push-subscribe`,{
   method:'POST',
   headers:{'Content-Type':'application/json','x-consult-token':current.token},
   body:JSON.stringify({subscription:sub.toJSON?sub.toJSON():sub})
  });
  if(!res.ok)return {ok:false,reason:'サーバへの登録に失敗しました'};
  pushReady=true;
  localStorage.pushOn='1';
  return {ok:true};
 }catch(e){
  return {ok:false,reason:'通知の設定に失敗しました ('+(e?.name||'Error')+')'};
 }
}
