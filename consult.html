<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>イコエル相談チャット</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d10;color:#f5f7f8;font-family:Arial,"Noto Sans JP",sans-serif}.wrap{max-width:820px;margin:auto;padding:24px}
.hero{padding:24px 0 18px;border-bottom:1px solid #263038;margin-bottom:18px}h1{margin:0 0 12px;font-size:30px}.lead{color:#c9d2d8;line-height:1.8;margin:0}
.notice{margin-top:14px;padding:13px 15px;border:1px solid #31404a;border-radius:12px;background:#10171c;color:#dce4e8;line-height:1.65}.notice strong{color:#43ff16}
.card{background:#11171c;border:1px solid #2a343b;border-radius:16px;padding:18px;margin:14px 0}label{display:block;color:#b9c6cc;font-size:13px;margin:12px 0 7px}
input,select,textarea{width:100%;background:#0b1014;color:white;border:1px solid #39464e;border-radius:10px;padding:12px;font-size:15px}textarea{min-height:130px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{display:flex;gap:16px;flex-wrap:wrap}.choice label{display:flex;gap:7px;align-items:center;margin:5px 0;color:#fff}.choice input{width:auto}
button{border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer;background:#39ff14;color:#071007;font-size:15px}button.secondary{background:#202a31;color:#fff}
.status{font-size:13px;color:#9db0ba;margin-top:8px}.thread-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.badge{padding:5px 9px;border-radius:999px;background:#202a31;font-size:12px}
.msg{display:flex;gap:10px;margin:14px 0;align-items:flex-start}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:0 0 42px;background:#263038;display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}.bubble{flex:1;background:#1a2228;border-radius:14px;padding:12px 14px;min-width:0}.msg.admin .bubble{border-left:3px solid #39ff14}.meta{font-size:12px;color:#8fa3ad;margin-bottom:7px}.text{font-size:16px;line-height:1.55;word-break:break-word}
.att a{display:inline-block;color:#7edfff;margin:8px 8px 0 0}.hidden{display:none}.avatar-preview{display:flex;align-items:center;gap:12px;margin-top:8px}.avatar-preview .avatar{width:52px;height:52px;flex-basis:52px}

<body><div class="wrap">
<section class="hero">
<h1>イコエル相談チャット</h1>
<p class="lead">イコエルと1：1で直接やり取りができる相談チャットです。匿名でも、お好きな名前を設定しても利用できます。相談・情報提供のほか、画像・動画・音声などの資料も送信できます。</p>
<div class="notice"><strong>相談内容やチャットのやり取りが、他のユーザーに公開されることはありません。</strong><br>イコエルが内容を確認すると「既読」が付き、返信もリアルタイムで表示されます。配信での取り扱いは、送信時に「掲載許可」「匿名での掲載のみ」「掲載不可」から選択できます。</div>
</section>

<div id="newBox" class="card">
<h2>相談・情報提供をはじめる</h2>
<div class="choice"><label><input type="radio" name="type" value="consult" checked>💬 相談</label><label><input type="radio" name="type" value="info">📎 情報提供</label></div>
<div class="row"><div><label>カテゴリ</label><select id="category"><option>配信</option><option>活動者</option><option>事件・トラブル</option><option>その他</option></select></div>
<div><label>配信での掲載</label><select id="permission"><option value="allow">掲載許可</option><option value="anonymous_only" selected>匿名での掲載のみ</option><option value="deny">掲載不可</option></select></div></div>
<label>表示名</label><div class="choice"><label><input type="radio" name="nameMode" value="anonymous" checked>匿名</label><label><input type="radio" name="nameMode" value="named">名前を設定</label></div>
<input id="name" placeholder="表示する名前" class="hidden">
<label>プロフィールアイコン（任意）</label><input id="avatarFile" type="file" accept="image/*">
<div class="status">未設定の場合：匿名は匿名アイコン、名前ありは名前の頭文字アイコンになります。</div>
<label>内容</label><textarea id="text" placeholder="相談・情報提供の内容"></textarea>
<label>画像・動画・音声（最大3ファイル）</label><input id="files" type="file" multiple accept="image/*,video/*,audio/*">
<div class="choice"><label><input id="urgent" type="checkbox">🔥 緊急として送る</label></div>
<button id="send">送信する</button><div id="sendStatus" class="status"></div>
</div>

<div id="chatBox" class="card hidden">
<div class="thread-head"><div><b id="consultNo"></b> <span id="kind" class="badge"></span></div><span id="seen" class="badge">未読</span></div>
<div id="thread"></div>
<label>追加メッセージ</label><textarea id="replyText" placeholder="追加情報や返信"></textarea>
<input id="replyFiles" type="file" multiple accept="image/*,video/*,audio/*">
<button id="replySend">追加送信</button><div id="replyStatus" class="status"></div>
</div>
</div>

const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fdate=s=>new Date(s).toLocaleString('ja-JP');
let device=localStorage.getItem('consult_device_token');if(!device){device=crypto.randomUUID();localStorage.setItem('consult_device_token',device)}
let current=JSON.parse(localStorage.getItem('consult_current')||'null');let es=null;

document.querySelectorAll('input[name=nameMode]').forEach(x=>x.onchange=()=>$('name').classList.toggle('hidden',document.querySelector('input[name=nameMode]:checked').value!=='named'));

function initial(name){return (String(name||'').trim()[0]||'名').toUpperCase()}
function userAvatar(c){
 if(c.avatarUrl) return `<div class="avatar"><img src="${c.avatarUrl}?token=${encodeURIComponent(current.token)}"></div>`;
 if(c.nameMode==='named') return `<div class="avatar">${esc(initial(c.displayName))}</div>`;
 return `<div class="avatar">匿</div>`;
}
function render(c){
 $('newBox').classList.add('hidden');$('chatBox').classList.remove('hidden');
 $('consultNo').textContent=c.consultNo;$('kind').textContent=(c.urgent?'🔥 緊急 / ':'')+(c.type==='info'?'情報提供':'相談')+' / '+c.category;
 $('seen').textContent=c.hasReply?'返信あり':(c.readAt?'既読':'未読');
 $('thread').innerHTML=c.messages.map(m=>{
   const admin=m.sender==='admin';
   const av=admin?`<div class="avatar"><img src="${ADMIN_ICON}"></div>`:userAvatar(c);
   const who=admin?'イコエル':(c.nameMode==='named'?esc(c.displayName):'匿名');
   return `<div class="msg ${admin?'admin':''}">${av}<div class="bubble"><div class="meta">${who} ・ ${fdate(m.createdAt)}</div><div class="text">${esc(m.text).replace(/\n/g,'<br>')}</div><div class="att">${m.attachments.map(a=>`<a href="/api/consult/${c.id}/attachment/${a.id}?token=${encodeURIComponent(current.token)}">📎 ${esc(a.name)}</a>`).join('')}</div></div></div>`;
 }).join('');
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
async function load(){
 if(!current)return;
 const r=await fetch(`/api/consult/${current.id}?token=${encodeURIComponent(current.token)}`);
 if(!r.ok){current=null;localStorage.removeItem('consult_current');return}
 const j=await r.json();render(j.conversation);startRealtime();
}
function startRealtime(){
 if(!current||es)return;
 es=new EventSource(`/api/consult/${current.id}/events?token=${encodeURIComponent(current.token)}`);
 es.addEventListener('update',e=>{const j=JSON.parse(e.data);render(j.conversation)});
 es.onerror=()=>{es.close();es=null;setTimeout(startRealtime,2000)};
}
$('send').onclick=async()=>{
 $('sendStatus').textContent='送信中…';
 const fd=new FormData();fd.append('device_token',device);fd.append('type',document.querySelector('input[name=type]:checked').value);fd.append('category',$('category').value);
 fd.append('name_mode',document.querySelector('input[name=nameMode]:checked').value);fd.append('name',$('name').value);fd.append('text',$('text').value);fd.append('permission',$('permission').value);fd.append('urgent',$('urgent').checked?'1':'0');
 if($('avatarFile').files[0])fd.append('avatar',$('avatarFile').files[0]);[...$('files').files].forEach(f=>fd.append('files',f));
 const r=await fetch('/api/consult/new',{method:'POST',body:fd});const j=await r.json();
 if(!r.ok){$('sendStatus').textContent=j.error||'送信失敗';return}
 current={id:j.id,token:j.accessToken};localStorage.setItem('consult_current',JSON.stringify(current));render(j.conversation);startRealtime();
};
$('replySend').onclick=async()=>{
 if(!current)return;$('replyStatus').textContent='送信中…';const fd=new FormData();fd.append('access_token',current.token);fd.append('text',$('replyText').value);[...$('replyFiles').files].forEach(f=>fd.append('files',f));
 const r=await fetch(`/api/consult/${current.id}/reply`,{method:'POST',body:fd});const j=await r.json();
 if(!r.ok){$('replyStatus').textContent=j.error||'送信失敗';return}
 $('replyText').value='';$('replyFiles').value='';$('replyStatus').textContent='送信しました';render(j.conversation);
};
load();
</script></body></html>
