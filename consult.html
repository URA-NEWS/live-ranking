<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>イコエル相談チャット</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#eef1f4;color:#162027;font-family:Arial,"Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}body{min-height:100vh}input,textarea,select,button{font-size:16px!important}
.wrap{max-width:760px;margin:auto;padding:14px 10px 110px}.top{display:flex;align-items:center;gap:10px;margin:4px 4px 12px}.brandIcon{width:40px;height:40px;border-radius:50%;overflow:hidden}.brandIcon img{width:100%;height:100%;object-fit:cover}.brand b{font-size:19px}.brand p{font-size:12px;color:#77858d;margin:2px 0}
.card{background:#fff;border:1px solid #dce3e7;border-radius:20px;overflow:hidden;box-shadow:0 6px 24px #0000000d}.setup{padding:18px}.setup input{width:100%;padding:13px 14px;border:1px solid #d8e0e4;border-radius:14px;background:#f9fbfc}.hint{font-size:12px;color:#76848b;margin:7px 2px 12px}button{border:0;border-radius:999px;padding:10px 15px;font-weight:900}.dark{background:#1d282e;color:#fff}.green{background:#86e457;color:#16310d}.gray{background:#edf1f3;color:#516068}.red{background:#ffe7ea;color:#ba2d3e}.hidden{display:none!important}
.head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid #e5eaed}.no{font-size:18px;font-weight:900}.state{font-size:11px;background:#eef2f4;padding:6px 9px;border-radius:999px;color:#65737b}
.thread{min-height:360px;padding:16px 10px;display:flex;flex-direction:column;gap:10px;background:#eef1f4}.msg{display:flex;align-items:flex-end;gap:8px;width:100%}.msg.user{justify-content:flex-start}.msg.admin{justify-content:flex-end}.av{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:0 0 36px;display:flex;align-items:center;justify-content:center;background:#dfe5e8;color:#52616a;font-size:10px;font-weight:900}.av img{width:100%;height:100%;object-fit:cover}.admin .av{order:2}.bubble{max-width:76%;padding:10px 13px;box-shadow:0 1px 2px #0001}.user .bubble{background:#fff;border:1px solid #dce3e7;border-radius:18px 18px 18px 5px}.admin .bubble{background:#8de055;border-radius:18px 18px 5px 18px;color:#14220d}.meta{font-size:10px;color:#77848b;margin-bottom:3px}.text{font-size:16px;line-height:1.55;font-weight:600;white-space:pre-wrap;word-break:break-word}.urgent{font-size:10px;color:#d63245;font-weight:900;margin-bottom:3px}.system{align-self:center;border-radius:999px;background:#e3eae6;border:1px solid #d3ddd7;color:#57655d;padding:6px 10px;font-size:11px;font-weight:800}
.incoming{display:none;margin:10px;background:#fff3d8;border:1px solid #edc269;border-radius:16px;padding:12px}.incoming.show{display:block;animation:flash 1s infinite}@keyframes flash{50%{box-shadow:0 0 18px #eeb94c88}}
.callbar{margin:10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px;background:#fff;border:1px solid #dce3df;border-radius:16px}.callStatus{font-size:12px;font-weight:900;margin-right:auto}.compose{padding:11px;border-top:1px solid #e1e7ea;background:#fff}.compose textarea{width:100%;min-height:86px;border:1px solid #d7dfe3;background:#f9fbfc;border-radius:16px;padding:12px;resize:vertical}.composeRow{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}.urgentCheck{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:#c33343}.urgentCheck input{width:18px;height:18px}.fileName{font-size:11px;color:#67757d}

.attachList{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.attachCard{display:flex;flex-direction:column;gap:4px;max-width:230px}
.attachCard img{max-width:230px;max-height:180px;border-radius:11px;border:1px solid #d9e1e5;object-fit:cover;background:#fff}
.attachActions{display:flex;gap:6px;font-size:11px}
.attachActions a{color:#246c9e;text-decoration:none;font-weight:800}

function userAttachHTML(c,m){
 if(!m.attachments?.length)return '';
 return `<div class="attachList">${m.attachments.map(a=>{
   const url=`/api/consult/${c.id}/attachment/${encodeURIComponent(a.id)}?token=${encodeURIComponent(current.token)}`;
   const img=(a.mime||'').startsWith('image/')?`<a href="${url}" target="_blank"><img src="${url}" alt="${esc(a.name)}"></a>`:'';
   return `<div class="attachCard">${img}<div class="attachActions"><a href="${url}" target="_blank">開く</a><a href="${url}" download="${esc(a.name)}">保存</a><span>${esc(a.name)}</span></div></div>`;
 }).join('')}</div>`;
}

function render(c){$('setup').classList.add('hidden');$('chat').classList.remove('hidden');$('no').textContent=c.consultNo+' '+(c.displayName||'匿名');$('state').textContent=c.hasReply?'返信あり':c.readAt?'既読':'';const ev=[];(c.messages||[]).forEach(m=>ev.push({k:'m',t:m.createdAt,d:m}));(c.callHistory||[]).forEach(x=>ev.push({k:'c',t:x.startedAt,d:x}));ev.sort((a,b)=>new Date(a.t)-new Date(b.t));$('thread').innerHTML=ev.map(e=>{if(e.k==='c'){const x=e.d,label=x.from==='admin'?'📞 イコエルから着信':'📲 イコエルへ発信',st=x.status==='connected'?'通話':x.status==='rejected'?'拒否':x.status==='ended'?'切断':'呼出中';return `<div class="system">${label} ・ ${st} ・ ${dt(x.startedAt)}</div>`}const m=e.d,adm=m.sender==='admin';return `<div class="msg ${adm?'admin':'user'}"><div class="av">${adm?`<img src="${ICON}">`:'相談者'}</div><div class="bubble">${m.urgent?'<div class="urgent">🔥 緊急</div>':''}<div class="meta">${adm?'イコエル':esc(c.displayName||'匿名')} ・ ${dt(m.createdAt)}</div><div class="text">${esc(m.text||((m.attachments||[]).length?'📎 添付ファイル':''))}</div>${userAttachHTML(c,m)}</div></div>`}).join('');$('thread').scrollTop=$('thread').scrollHeight}

async function getUserMic(){
 if(!navigator.mediaDevices?.getUserMedia)throw Object.assign(new Error('mediaDevices unavailable'),{name:'NotSupportedError'});
 const tries=[
   {echoCancellation:true,noiseSuppression:true,autoGainControl:true},
   true
 ];
 let last=null;
 for(const audio of tries){
   try{return await navigator.mediaDevices.getUserMedia({audio,video:false})}catch(e){last=e}
 }
 throw last||new Error('microphone unavailable');
}

async function ensurePC(){if(pc)return;localStream=await getUserMic();pc=new RTCPeerConnection(RTC);localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));remoteAudio=document.createElement('audio');remoteAudio.autoplay=true;remoteAudio.playsInline=true;document.body.appendChild(remoteAudio);pc.ontrack=e=>remoteAudio.srcObject=e.streams[0];pc.onicecandidate=e=>{if(e.candidate)sig('ice',e.candidate)};pc.onconnectionstatechange=()=>{if(pc?.connectionState==='connected'){stopRing();status('通話中');$('call').classList.add('hidden');$('mute').classList.remove('hidden');$('hang').classList.remove('hidden');startTimer()}}}
async function flush(){if(!pc?.remoteDescription)return;for(const c of pendingIce.splice(0))try{await pc.addIceCandidate(new RTCIceCandidate(c))}catch{}}async function handleSignal(s){if(s.type==='call'){ring('incoming');status('受信中');$('incoming').classList.add('show')}if(s.type==='offer'){pendingOffer=s.data;ring('incoming');status('受信中');$('incoming').classList.add('show')}if(s.type==='answer'){await ensurePC();if(!pc.remoteDescription){await pc.setRemoteDescription(new RTCSessionDescription(s.data));await flush()}}if(s.type==='ice'){await ensurePC();if(pc.remoteDescription)try{await pc.addIceCandidate(new RTCIceCandidate(s.data))}catch{}else pendingIce.push(s.data)}if(s.type==='reject'||s.type==='hangup')endCall(false)}
function restoreUserCallUI(s){
 const incoming=s?.state==='ringing'&&s?.from==='admin';
 const outgoing=s?.state==='ringing'&&s?.from==='user';
 const connected=s?.state==='connected';
 $('incoming').classList.toggle('show',incoming);
 $('call').classList.toggle('hidden',incoming||outgoing||connected);
 $('cancelCall').classList.toggle('hidden',!outgoing);
 $('mute').classList.toggle('hidden',!connected);
 $('hang').classList.toggle('hidden',!connected);
 if(incoming){if(s.offer)pendingOffer=s.offer;ring('incoming');status('受信中')}
 else if(outgoing){ring('outgoing');status('発信中')}
 else if(connected){stopRing();status('通話中')}
 else{stopRing();status('切断')}
}

function handleState(s){restoreUserCallUI(s)}async function pollCall(){if(!current)return;try{const d=await api(`/api/consult/${current.id}/call-state?token=${encodeURIComponent(current.token)}&t=${Date.now()}`),s=d.state,k=s?JSON.stringify([s.state,s.from,s.at]):'none';restoreUserCallUI(s);if(k!==lastCallKey){lastCallKey=k;handleState(s)}}catch{}}setInterval(pollCall,1000);
async function callAdmin(){try{unlock();await ensurePC();ring('outgoing');status('発信中');$('call').classList.add('hidden');$('cancelCall').classList.remove('hidden');await sig('call');const o=await pc.createOffer();await pc.setLocalDescription(o);await sig('offer',o)}catch(e){status('マイクを使用できません')}}async function answer(){try{unlock();$('incoming').classList.remove('show');stopRing();await ensurePC();if(pendingOffer){await pc.setRemoteDescription(new RTCSessionDescription(pendingOffer));await flush();const a=await pc.createAnswer();await pc.setLocalDescription(a);await sig('answer',a);pendingOffer=null}await sig('accept');status('通話中')}catch{status('接続失敗')}}async function reject(){$('incoming').classList.remove('show');stopRing();drop();await sig('reject');status('切断')}async function endCall(send=true){if(send)try{await sig('hangup')}catch{}drop();if(pc)pc.close();pc=null;if(localStream)localStream.getTracks().forEach(t=>t.stop());localStream=null;if(remoteAudio)remoteAudio.remove();remoteAudio=null;pendingOffer=null;pendingIce=[];$('incoming').classList.remove('show');$('call').classList.remove('hidden');$('cancelCall').classList.add('hidden');$('mute').classList.add('hidden');$('hang').classList.add('hidden');status('切断');stopTimer();refresh()}function startTimer(){callStarted=Date.now();clearInterval(callTimer);callTimer=setInterval(()=>{const s=Math.floor((Date.now()-callStarted)/1000);$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000)}function stopTimer(){clearInterval(callTimer);$('timer').textContent=''}
$('setupBtn').onclick=async()=>{unlock();try{const d=await api('/api/consult/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value})});current={id:d.id,token:d.accessToken};save();render(d.conversation);connect()}catch(e){alert(e.message)}};$('send').onclick=async()=>{unlock();const fd=new FormData();fd.append('text',$('text').value);fd.append('urgent',$('urgent').checked?'1':'0');fd.append('token',current.token);[...$('files').files].forEach(f=>fd.append('files',f));try{const d=await api(`/api/consult/${current.id}/reply`,{method:'POST',headers:{'x-consult-token':current.token},body:fd});$('text').value='';$('urgent').checked=false;$('files').value='';$('fileName').textContent='';render(d.conversation)}catch(e){alert(e.message)}};$('files').onchange=()=>$('fileName').textContent=[...$('files').files].map(f=>f.name).join(' / ');$('call').onclick=callAdmin;$('cancelCall').onclick=()=>endCall(true);$('answer').onclick=answer;$('reject').onclick=reject;$('hang').onclick=()=>endCall(true);$('mute').onclick=()=>{muted=!muted;localStream?.getAudioTracks().forEach(t=>t.enabled=!muted);$('mute').textContent=muted?'🔇 ミュート中':'🎤 マイクON'};
current=load();if(current){refresh();connect()}
</script></body></html>
