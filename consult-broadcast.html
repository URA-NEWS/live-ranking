<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:"Noto Sans JP","Yu Gothic",sans-serif}.card{position:absolute;left:50%;bottom:7%;transform:translateX(-50%) translateY(30px);width:min(1100px,88vw);background:linear-gradient(120deg,rgba(9,12,15,.97),rgba(20,28,22,.96));border:2px solid #53fc18;border-radius:18px;padding:20px 24px;color:#fff;opacity:0;transition:.35s;box-shadow:0 16px 55px #0009,0 0 30px #53fc1838}.card.show{opacity:1;transform:translateX(-50%) translateY(0)}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.type{font-weight:900;color:#8dff6b;font-size:18px}.no{font-size:17px;color:#aeb8c0}.name{font-size:22px;font-weight:900;margin:9px 0 5px}.text{font-size:27px;line-height:1.55;font-weight:800;white-space:pre-wrap;overflow-wrap:anywhere}.cat{font-size:13px;color:#9ca7b0;margin-top:10px}</style></head><body><div id="card" class="card"><div class="top"><div class="type" id="type"></div><div class="no" id="no"></div></div><div class="name" id="name"></div><div class="text" id="text"></div><div class="cat" id="cat"></div></div>
<script>const c=document.getElementById('card');function show(d){document.getElementById('type').textContent=d.type==='info'?'📎 情報提供':'💬 相談';document.getElementById('no').textContent=d.consultNo;document.getElementById('name').textContent=d.name;document.getElementById('text').textContent=d.text;document.getElementById('cat').textContent=d.category;c.classList.add('show')}function clear(){c.classList.remove('show')}fetch('/api/consult/broadcast-current').then(r=>r.json()).then(d=>{if(d.active)show(d.active)});let es=new EventSource('/api/consult/broadcast-events');es.addEventListener('show',e=>show(JSON.parse(e.data)));es.addEventListener('clear',clear)</script></body></html>
