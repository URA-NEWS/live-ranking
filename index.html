<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ライブランキング</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#eee;font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;min-height:100vh}

/* ヘッダー */
header{background:#1a1a1a;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:2px solid #e53935;position:sticky;top:0;z-index:100}
h1{font-size:17px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:#e53935;animation:blink 1.2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
#info{margin-left:auto;font-size:11px;color:#555;white-space:nowrap}

/* フィルター */
#filters{display:flex;gap:6px;padding:10px 14px;background:#161616;border-bottom:1px solid #222;overflow-x:auto;-webkit-overflow-scrolling:touch}
#filters::-webkit-scrollbar{display:none}
button{padding:6px 18px;border-radius:20px;border:1px solid #444;background:transparent;color:#aaa;cursor:pointer;font-size:13px;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent}
button.on{background:#e53935;border-color:#e53935;color:#fff;font-weight:700}

/* リスト */
#list{padding:10px 12px;display:flex;flex-direction:column;gap:8px}

/* カード（PC） */
a.card{
  display:flex;
  align-items:center;
  gap:12px;
  background:#1e1e1e;
  border-radius:10px;
  padding:12px 14px;
  text-decoration:none;
  color:inherit;
  transition:background .15s;
  border-left:3px solid #2a2a2a;
}
a.card:hover{background:#262626}
a.card.rank1{border-left-color:#ffd700}
a.card.rank2{border-left-color:#c0c0c0}
a.card.rank3{border-left-color:#cd7f32}

/* 順位 */
.num{font-size:20px;font-weight:700;color:#555;min-width:30px;text-align:center;flex-shrink:0}
.gold{color:#ffd700}.silver{color:#c0c0c0}.bronze{color:#cd7f32}

/* サムネ */
img.thumb{width:96px;height:58px;object-fit:cover;border-radius:5px;background:#2a2a2a;flex-shrink:0;display:block}
.nothumb{width:96px;height:58px;border-radius:5px;background:#2a2a2a;flex-shrink:0}

/* テキスト */
.mid{flex:1;overflow:hidden;min-width:0}
.ttl{font-size:14px;font-weight:600;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:#eee}
.ch{font-size:12px;color:#777;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* バッジ */
.badge{display:flex;align-items:center;gap:5px;font-size:11px;padding:5px 9px;border-radius:5px;background:#252525;color:#bbb;border-left:3px solid #555;white-space:nowrap;flex-shrink:0}
.badge img{width:15px;height:15px;object-fit:contain;border-radius:3px;flex-shrink:0}

/* 視聴者数 */
.viewers{text-align:right;flex-shrink:0;min-width:56px}
.vnum{font-size:17px;font-weight:700;color:#ff5252;line-height:1}
.vlabel{font-size:10px;color:#555;margin-top:2px}

#empty{text-align:center;padding:60px;color:#444;font-size:14px}

/* ── スマホ ── */
@media(max-width:520px){
  header{padding:10px 14px}
  h1{font-size:15px}
  #filters{padding:8px 10px;gap:5px}
  button{padding:5px 14px;font-size:12px}
  #list{padding:8px 10px;gap:6px}

  a.card{
    display:grid;
    grid-template-columns:24px 76px 1fr;
    grid-template-rows:auto auto;
    align-items:start;
    gap:0 10px;
    padding:10px 10px;
    border-left-width:3px;
  }

  /* 順位：左列上 */
  .num{
    grid-column:1;
    grid-row:1/3;
    font-size:17px;
    align-self:center;
    min-width:24px;
  }

  /* サムネ：中央列 縦2行 */
  img.thumb,.nothumb{
    grid-column:2;
    grid-row:1/3;
    width:76px;
    height:48px;
    align-self:center;
  }

  /* タイトル・チャンネル：右列上 */
  .mid{
    grid-column:3;
    grid-row:1;
    padding-bottom:5px;
  }
  .ttl{font-size:12px;font-weight:600;-webkit-line-clamp:2}
  .ch{font-size:10px;margin-top:3px}

  /* バッジ＋視聴者数：右列下 */
  .bottom-row{
    grid-column:3;
    grid-row:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
  }
  .badge{font-size:9px;padding:3px 6px;gap:3px}
  .badge img{width:12px;height:12px}
  .viewers{text-align:right;min-width:auto}
  .vnum{font-size:14px}
  .vlabel{font-size:9px;margin-top:1px}
}
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>ライブランキング</h1>
  <div id="info">読み込み中...</div>
</header>
<div id="filters">
  <button class="on" data-p="all">すべて</button>
  <button data-p="ふわっち">ふわっち</button>
  <button data-p="ツイキャス">ツイキャス</button>
</div>
<div id="list"><div id="empty">読み込み中...</div></div>

const platformIcons={'ふわっち':ICON_FUWATCHI,'ツイキャス':ICON_TWITCAS};
const colors={'ふわっち':'#ff69b4','Kick':'#53fc18','ツイキャス':'#1da1f2'};
let all=[], filter='all';

async function load(){
  const r=await fetch('/api/ranking').then(r=>r.json()).catch(()=>null);
  if(!r)return;
  all=r.ranking;
  const d=new Date(r.lastUpdated);
  document.getElementById('info').textContent=`最終更新 ${d.toLocaleTimeString('ja-JP')} | ${all.length}件`;
  render();
}

function render(){
  const data=filter==='all'?all:all.filter(x=>x.platform===filter);
  const list=document.getElementById('list');
  if(!data.length){list.innerHTML='<div id="empty">配信中の枠が見つかりません</div>';return;}
  const isSP=window.innerWidth<=520;
  list.innerHTML=data.map((x,i)=>{
    const n=i+1;
    const cls=n===1?'gold':n===2?'silver':n===3?'bronze':'';
    const rankCls=n===1?'rank1':n===2?'rank2':n===3?'rank3':'';
    const v=x.viewers>=10000?`${(x.viewers/10000).toFixed(1)}万`:x.viewers.toLocaleString();
    const c=colors[x.platform]||'#888';
    const iconSrc=platformIcons[x.platform]||'';
    const iconImg=iconSrc?`<img src="${iconSrc}" alt="${x.platform}">`:'';
    const badge=`<div class="badge" style="border-color:${c}">${iconImg}${esc(x.platform)}</div>`;
    const viewers=`<div class="viewers"><div class="vnum">${v}</div><div class="vlabel">視聴中</div></div>`;
    const thumb=x.thumb?`<img class="thumb" src="${x.thumb}" loading="lazy" onerror="this.className='nothumb'">`:`<div class="nothumb"></div>`;
    if(isSP){
      return `<a class="card ${rankCls}" href="${x.url}" target="_blank" rel="noopener">
  <div class="num ${cls}">${n}</div>
  ${thumb}
  <div class="mid">
    <div class="ttl">${esc(x.title)}</div>
    <div class="ch">${esc(x.name)}</div>
  </div>
  <div class="bottom-row">${badge}${viewers}</div>
</a>`;
    } else {
      return `<a class="card ${rankCls}" href="${x.url}" target="_blank" rel="noopener">
  <div class="num ${cls}">${n}</div>
  ${thumb}
  <div class="mid">
    <div class="ttl">${esc(x.title)}</div>
    <div class="ch">${esc(x.name)}</div>
  </div>
  ${badge}
  ${viewers}
</a>`;
    }
  }).join('');
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

window.addEventListener('resize',render);
document.getElementById('filters').addEventListener('click',e=>{
  if(!e.target.dataset.p)return;
  document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('on'));
  e.target.classList.add('on');
  filter=e.target.dataset.p;
  render();
});

load();
setInterval(load,60000);
</script>
