<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS CONTROL — 図鑑コントロール</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@300;400;700;900&display=swap');
  :root{--bg:#070910;--panel:#0d1018;--ink:#eef2ff;--dim:#6b7390;--neon:#00f0ff;--grn:#4dff9e;--pink:#ff2d95;--gold:#ffd24a;--line:rgba(120,160,255,.12);}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;padding:16px;max-width:560px;margin:0 auto;padding-bottom:60px;}
  h1{font-family:'Orbitron';font-weight:900;font-size:20px;letter-spacing:.03em;background:linear-gradient(90deg,#fff,#9b6bff,#ff2d95);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--dim);font-size:12px;margin:4px 0 16px;}
  .conn{display:flex;gap:8px;align-items:center;font-size:11px;font-family:'Orbitron';margin-bottom:14px;}
  .dot{width:9px;height:9px;border-radius:50%;background:#444;transition:.3s;}
  .dot.on{background:var(--grn);box-shadow:0 0 10px var(--grn);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:13px;}
  .card h2{font-family:'Orbitron';font-size:11px;letter-spacing:.18em;color:var(--neon);margin-bottom:13px;text-transform:uppercase;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px;}
  .row:last-child{margin-bottom:0;}
  .row label{font-size:13px;flex:none;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg button{font-family:'Zen Kaku Gothic New';font-size:13px;font-weight:700;padding:9px 15px;border-radius:8px;border:1px solid var(--line);background:rgba(120,160,255,.04);color:var(--dim);cursor:pointer;transition:.2s;}
  .seg button.on{background:var(--neon);color:#06080d;border-color:var(--neon);}
  .seg.gold button.on{background:var(--gold);color:#06080d;border-color:var(--gold);}
  input[type=range]{flex:1;height:30px;accent-color:var(--neon);}
  .val{font-family:'Orbitron';font-size:13px;color:var(--neon);min-width:58px;text-align:right;}
  .toggle{position:relative;width:52px;height:30px;border-radius:99px;background:#222a3a;cursor:pointer;transition:.25s;flex:none;}
  .toggle.on{background:var(--grn);}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.25s;}
  .toggle.on::after{transform:translateX(22px);}
  .actions{display:flex;gap:9px;flex-wrap:wrap;}
  .actions button{flex:1;min-width:130px;font-family:'Orbitron';font-size:12px;font-weight:700;padding:14px;border-radius:9px;border:1px solid var(--line);background:rgba(120,160,255,.05);color:var(--ink);cursor:pointer;}
  .actions button.danger{color:var(--pink);border-color:rgba(255,45,149,.3);}
  .openbtn{display:block;width:100%;margin-top:10px;font-family:'Orbitron';font-size:13px;font-weight:700;padding:14px;border-radius:9px;background:var(--grn);color:#06080d;text-decoration:none;text-align:center;cursor:pointer;border:none;}
  .urlbox{margin-top:8px;background:#06080e;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:monospace;font-size:10px;color:var(--grn);word-break:break-all;line-height:1.5;max-height:90px;overflow:auto;}
  .hint{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.6;}
  .field input{width:100%;padding:10px;font-size:13px;border-radius:8px;background:#11151f;border:1px solid var(--line);color:#fff;outline:none;}
  .field label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px;}
</style>
</head>
<body>
<h1>NEXUS CONTROL</h1>
<div class="sub">配信者図鑑コントロール（映し出しとは別画面）</div>
<div class="conn"><span class="dot" id="cdot"></span><span id="cstat">図鑑タブ未接続</span></div>

<div class="card">
  <h2>表示フォーメーション</h2>
  <div class="row"><label>配置</label>
    <div class="seg gold" id="seg-topo"><button data-v="0" class="on">頂点型</button><button data-v="1">サイト別</button><button data-v="2">乱戦型</button></div></div>
  <div class="row"><label>大きさ基準</label>
    <div class="seg" id="seg-metric"><button data-v="influence" class="on">影響力</button><button data-v="ccu">同接</button><button data-v="followers">勢い</button></div></div>
</div>

<div class="card">
  <h2>フィルタ</h2>
  <div class="row"><label>サイト</label>
    <div class="seg" id="seg-site"><button data-v="all" class="on">全部</button><button data-v="twitcasting">ツイキャス</button><button data-v="kick">KICK</button><button data-v="fuwacchi">ふわっち</button></div></div>
  <div class="row"><label>最低同接</label><input type="range" id="r-minccu" min="0" max="2000" step="50" value="0"><span class="val" id="v-minccu">0人</span></div>
</div>

<div class="card">
  <h2>配信出力・透過</h2>
  <div class="row"><label>OBS透過（背景を抜く）</label><div class="toggle" id="t-trans"></div></div>
  <div class="row"><label>背景の濃さ</label><input type="range" id="r-bgop" min="0" max="100" step="5" value="100"><span class="val" id="v-bgop">100%</span></div>
  <div class="hint">透過ONで背景を完全に抜く（ノードだけ配信に乗る）。濃さスライダーは半透明の黒背景を残したい時に。0%＝完全透明、100%＝真っ黒</div>
  <div class="row" style="margin-top:12px;"><label>UI最小化（タイトル等を隠す）</label><div class="toggle" id="t-min"></div></div>
</div>

<div class="card">
  <h2>カメラ・演出</h2>
  <div class="row"><label>全画面カメラ＋指操作</label><div class="toggle" id="t-cam"></div></div>
  <div class="row"><label>自動回転</label><div class="toggle on" id="t-spin"></div></div>
  <div class="row"><label>回転速度</label><input type="range" id="r-spin" min="0" max="60" step="1" value="12"><span class="val" id="v-spin">12</span></div>
  <div class="row"><label>ズーム</label><input type="range" id="r-zoom" min="30" max="130" step="2" value="70"><span class="val" id="v-zoom">70</span></div>
  <div class="row"><label>対決モード</label><div class="toggle" id="t-battle"></div></div>
</div>

<div class="card">
  <h2>アクション</h2>
  <div class="actions">
    <button id="a-connect">本番接続</button>
    <button id="a-shot">スクショ保存</button>
    <button id="a-clear" class="danger">図鑑初期化</button>
  </div>
</div>

<div class="card">
  <h2>セットアップ</h2>
  <div class="field" style="margin-bottom:10px;"><label>図鑑のURL（Renderに置いた場所。変える時だけ）</label><input type="text" id="dexurl" placeholder="https://live-ranking-d702.onrender.com/streamer-nexus.html"></div>
  <div class="hint">同じスマホ/PCの同ブラウザで「図鑑を別タブで開く」と即連動（BroadcastChannel）。OBSのブラウザソースには下のURLを貼ると設定が初期反映されます。</div>
  <button class="openbtn" id="a-open">図鑑を別タブで開く</button>
  <div class="urlbox" id="urlbox">URL生成中…</div>
  <button class="openbtn" id="a-copy" style="background:var(--neon)">URLをコピー</button>
</div>

<script>
let DEX_FILE='https://live-ranking-d702.onrender.com/streamer-nexus.html';
const S={topology:0,metric:'influence',siteFilter:'all',minCcu:0,autoSpin:true,spinSpeed:0.0012,zoom:70,battle:false,transparent:false,bgOpacity:1,minimal:false,camBg:false};
let bc=null;try{bc=new BroadcastChannel('nexus-control');}catch(e){}
let dexWin=null;
try{const u=localStorage.getItem('nexus_dexurl');if(u){DEX_FILE=u;}}catch(e){}

function send(patch){Object.assign(S,patch);const msg={__nexus:true,settings:patch};if(bc)bc.postMessage(msg);if(dexWin&&!dexWin.closed)dexWin.postMessage(msg,'*');updateURL();}
function setConn(on){document.getElementById('cdot').classList.toggle('on',on);document.getElementById('cstat').textContent=on?'図鑑タブ 接続中':'図鑑タブ未接続（別タブで開くと接続）';}
function updateURL(){
  const json=encodeURIComponent(JSON.stringify(S));
  document.getElementById('urlbox').textContent=DEX_FILE+'?d='+json;
}
function seg(id,key,parse){const w=document.getElementById(id);w.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{w.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');let v=b.dataset.v;if(parse)v=parse(v);send({[key]:v});}));}
seg('seg-topo','topology',v=>+v);seg('seg-metric','metric');seg('seg-site','siteFilter');
function tog(id,key,cb){const t=document.getElementById(id);t.addEventListener('click',()=>{const on=t.classList.toggle('on');send({[key]:on});if(cb)cb(on);});}
tog('t-spin','autoSpin');tog('t-battle','battle');tog('t-min','minimal');
tog('t-cam','camBg');
tog('t-trans','transparent',on=>{ // 透過ONなら濃さも0に同期
  const r=document.getElementById('r-bgop'),v=document.getElementById('v-bgop');
  r.value=on?0:100;v.textContent=(on?0:100)+'%';send({bgOpacity:on?0:1});});
function sld(id,vid,key,fmt,map){const r=document.getElementById(id),v=document.getElementById(vid);r.addEventListener('input',()=>{const raw=+r.value;v.textContent=fmt(raw);send({[key]:map?map(raw):raw});});}
sld('r-minccu','v-minccu','minCcu',x=>x+'人');
sld('r-spin','v-spin','spinSpeed',x=>x,x=>x*0.0001);
sld('r-zoom','v-zoom','zoom',x=>x);
sld('r-bgop','v-bgop','bgOpacity',x=>x+'%',x=>x/100);
document.getElementById('a-connect').addEventListener('click',()=>send({connect:true}));
document.getElementById('a-shot').addEventListener('click',()=>send({screenshot:true}));
document.getElementById('a-clear').addEventListener('click',()=>{if(confirm('蓄積した図鑑を全部消去しますか？'))send({clearArchive:true});});
document.getElementById('dexurl').addEventListener('change',e=>{const u=e.target.value.trim();if(u){DEX_FILE=u;try{localStorage.setItem('nexus_dexurl',u);}catch(x){}updateURL();}});
document.getElementById('a-open').addEventListener('click',()=>{dexWin=window.open(document.getElementById('urlbox').textContent,'nexus_dex');setTimeout(()=>setConn(!!dexWin),500);});
document.getElementById('a-copy').addEventListener('click',()=>{navigator.clipboard.writeText(document.getElementById('urlbox').textContent).then(()=>{const b=document.getElementById('a-copy');b.textContent='コピーしました';setTimeout(()=>b.textContent='URLをコピー',1500);});});
if(bc)bc.onmessage=e=>{if(e.data&&e.data.__nexusAlive)setConn(true);};
if(DEX_FILE)document.getElementById('dexurl').value=DEX_FILE;
updateURL();setConn(false);
</script>
</body>
</html>
