<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Noto Sans JP","Yu Gothic",sans-serif}.wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;align-items:center;gap:18px;background:rgba(8,10,12,.92);border:2px solid #53fc18;border-radius:18px;padding:17px 24px;color:#fff;box-shadow:0 0 38px #53fc1850}.wrap.show{display:flex;animation:pop .35s ease}.bell{font-size:58px;transform-origin:50% 10%}.show .bell{animation:ring .7s ease-in-out 3}.title{font-size:27px;font-weight:900}.no{font-size:14px;color:#aeb7bf;margin-top:4px}.wrap.strong{border-color:#ffc043;box-shadow:0 0 42px #ffc04365}.wrap.urgent{border-color:#ff304b;box-shadow:0 0 52px #ff304b90;background:rgba(42,3,10,.94)}.urgent .bell{animation:urgentRing .28s linear 7}.urgent .title{color:#ff8b9b}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(22deg)}40%{transform:rotate(-20deg)}60%{transform:rotate(14deg)}80%{transform:rotate(-10deg)}}@keyframes urgentRing{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(28deg) scale(1.1)}75%{transform:rotate(-28deg) scale(1.1)}}@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.75)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
</style></head><body><div id="wrap" class="wrap"><div class="bell">🔔</div><div><div class="title" id="title"></div><div class="no" id="no"></div></div></div>
<script>
const w=document.getElementById('wrap'),title=document.getElementById('title'),no=document.getElementById('no');let timer;
function tone(priority){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.value=priority==='urgent'?880:priority==='strong'?720:620;g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.18,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.5);o.start();o.stop(a.currentTime+.55)}catch{}}
function show(d){clearTimeout(timer);w.className='wrap show '+(d.priority||'normal');title.textContent=d.title||'相談が届きました';no.textContent=d.consultNo||'';if(d.soundEnabled)tone(d.priority);timer=setTimeout(()=>{w.className='wrap'},6000)}
let es=new EventSource('/api/consult/bell-events');es.addEventListener('bell',e=>show(JSON.parse(e.data)));
</script></body></html>
