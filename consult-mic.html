<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>イコエル マイク接続</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f4f5;font-family:Arial,"Noto Sans JP",sans-serif;color:#172027}.wrap{max-width:430px;margin:30px auto;padding:14px}.card{background:#fff;border:1px solid #dce3e7;border-radius:18px;padding:16px;box-shadow:0 12px 35px #0001}h2{margin:0 0 8px;font-size:20px}.status{font-weight:900;margin:8px 0}.ok{color:#279220}.bad{color:#c83a48}select,button{width:100%;padding:11px;border-radius:11px;font-size:14px;margin-top:8px}select{border:1px solid #d6dee2;background:#fff}button{border:0;background:#1d282e;color:#fff;font-weight:900;cursor:pointer}.meter{height:10px;background:#dfe5e2;border-radius:999px;overflow:hidden;margin-top:10px}.meter i{display:block;width:0;height:100%;background:linear-gradient(90deg,#52d63a,#e6b333,#e94e4e)}.hint{font-size:12px;color:#6c7980;line-height:1.5;margin-top:10px}</style></head><body><div class="wrap"><div class="card"><h2>イコエル マイク接続</h2><div id="status" class="status bad">接続準備中</div><select id="mic"><option value="">既定のマイク</option></select><div class="meter"><i id="bar"></i></div><button id="permit">マイクを許可・接続</button><div class="hint">このページは通常のChrome/Edgeで開いたままにしてください。OBSドックはそのまま操作できます。通話相手の音声もこのブラウザから再生されます。</div></div></div><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),KEY=new URLSearchParams(location.search).get('key')||localStorage.consultAdminKey||'';
let socket=null,stream=null,pc=null,remoteAudio=null,pendingOffer=null,pendingIce=[],activeId=null,muted=false,audioCtx=null,analyser=null,meterRAF=null,previewOnly=false;
const RTC={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
async function api(u,o={}){o.headers={...(o.headers||{}),'x-admin-key':KEY};const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'エラー');return d}
function sendStatus(d){socket?.emit('mic:status',d)}
async function enumerate(){let ds=await navigator.mediaDevices.enumerateDevices(),m=ds.filter(d=>d.kind==='audioinput');const saved=localStorage.micId||'';$('mic').innerHTML='<option value="">既定のマイク</option>'+m.map((d,i)=>`<option value="${d.deviceId}">${d.label||'マイク '+(i+1)}</option>`).join('');$('mic').value=[...$('mic').options].some(o=>o.value===saved)?saved:'';sendStatus({devices:m.map(d=>({deviceId:d.deviceId,label:d.label}))})}
async function getMic(deviceId=''){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}const a={echoCancellation:true,noiseSuppression:true,autoGainControl:true};if(deviceId)a.deviceId={ideal:deviceId};stream=await navigator.mediaDevices.getUserMedia({audio:a,video:false});startMeter(stream);return stream}
function startMeter(s){if(meterRAF)cancelAnimationFrame(meterRAF);audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=256;audioCtx.createMediaStreamSource(s).connect(analyser);const a=new Uint8Array(analyser.fftSize);const draw=()=>{analyser.getByteTimeDomainData(a);let sum=0;for(const v of a){const x=(v-128)/128;sum+=x*x}const n=Math.min(100,Math.round(Math.sqrt(sum/a.length)*350));$('bar').style.width=n+'%';sendStatus({level:n});meterRAF=requestAnimationFrame(draw)};draw()}
async function sig(type,data=null){if(!activeId)return;return api(`/api/admin/${activeId}/voice-signal`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,data})})}
async function ensurePC(id){if(pc&&activeId===id)return;resetMedia(false);activeId=id;const s=await getMic(localStorage.micId||'');pc=new RTCPeerConnection(RTC);s.getTracks().forEach(t=>pc.addTrack(t,s));remoteAudio=document.createElement('audio');remoteAudio.autoplay=true;remoteAudio.playsInline=true;document.body.appendChild(remoteAudio);pc.ontrack=e=>remoteAudio.srcObject=e.streams[0];pc.onicecandidate=e=>{if(e.candidate)sig('ice',e.candidate)};pc.onconnectionstatechange=()=>{if(pc?.connectionState==='connected'){sendStatus({state:'connected',id:activeId});$('status').textContent='通話中';$('status').className='status ok'} if(['failed','disconnected','closed'].includes(pc?.connectionState))sendStatus({state:'ended',id:activeId})}}
async function flush(){if(!pc?.remoteDescription)return;for(const c of pendingIce.splice(0))try{await pc.addIceCandidate(new RTCIceCandidate(c))}catch{}}
function resetMedia(stopStream=true){if(pc)pc.close();pc=null;if(stopStream&&stream)stream.getTracks().forEach(t=>t.stop());if(stopStream)stream=null;if(remoteAudio)remoteAudio.remove();remoteAudio=null;pendingOffer=null;pendingIce=[];activeId=null}
async function call(id){activeId=id;await ensurePC(id);await sig('call');const o=await pc.createOffer();await pc.setLocalDescription(o);await sig('offer',o);sendStatus({state:'ringing',id})}
async function answer(id){activeId=id;await ensurePC(id);if(pendingOffer){await pc.setRemoteDescription(new RTCSessionDescription(pendingOffer));await flush();const a=await pc.createAnswer();await pc.setLocalDescription(a);await sig('answer',a);pendingOffer=null}await sig('accept');sendStatus({state:'connected',id})}
async function hangup(signal=true){if(signal&&activeId)try{await sig('hangup')}catch{}resetMedia(true);sendStatus({state:'ended'});$('status').textContent='マイク接続済';$('status').className='status ok'}
async function handleSignal(s){if(s.from!=='user')return;if(s.type==='call'){activeId=s.id;sendStatus({state:'incoming',id:s.id})}if(s.type==='offer'){activeId=s.id;pendingOffer=s.data;sendStatus({state:'incoming',id:s.id})}if(s.type==='answer'){await ensurePC(s.id);if(!pc.remoteDescription){await pc.setRemoteDescription(new RTCSessionDescription(s.data));await flush()}}if(s.type==='ice'){await ensurePC(s.id);if(pc.remoteDescription)try{await pc.addIceCandidate(new RTCIceCandidate(s.data))}catch{}else pendingIce.push(s.data)}if(s.type==='reject'||s.type==='hangup')hangup(false)}
async function permit(){try{await getMic(localStorage.micId||'');await enumerate();$('status').textContent='マイク接続済';$('status').className='status ok';sendStatus({state:'ready'});previewOnly=true}catch(e){$('status').textContent=e.name==='NotAllowedError'?'マイク権限が拒否されています':'マイクを使用できません ('+e.name+')';$('status').className='status bad';sendStatus({error:$('status').textContent})}}
$('permit').onclick=permit;$('mic').onchange=async()=>{localStorage.micId=$('mic').value;await permit()};
socket=io({transports:['websocket','polling'],reconnection:true});socket.on('connect',()=>socket.emit('join:admin-mic',{key:KEY},ack=>{if(!ack?.ok){$('status').textContent='管理キーが違います';return}permit()}));socket.on('voice:signal',handleSignal);socket.on('mic:command',async d=>{try{if(d.action==='call')await call(d.id);if(d.action==='answer')await answer(d.id);if(d.action==='hangup')await hangup(d.signal!==false);if(d.action==='reset')await hangup(false);if(d.action==='mute'){muted=!!d.muted;stream?.getAudioTracks().forEach(t=>t.enabled=!muted)}if(d.action==='select'){localStorage.micId=d.deviceId||'';await permit()}if(d.action==='preview')await permit();if(d.action==='preview-stop'){if(stream&&!pc){stream.getTracks().forEach(t=>t.stop());stream=null}}}catch(e){sendStatus({error:'マイク処理エラー: '+(e?.message||e?.name||'Error')})}});
</script></body></html>
