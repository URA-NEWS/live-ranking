<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1280px;height:720px;overflow:hidden;background:transparent;}
body{font-family:'Noto Sans JP','Hiragino Kaku Gothic Pro',sans-serif;}
#hdr{position:absolute;top:20px;right:24px;display:flex;align-items:center;gap:14px;}
.live-badge{display:flex;align-items:center;gap:6px;background:#cc0000;padding:5px 12px;border-radius:3px;flex-shrink:0;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.15;}}
.live-txt{font-size:13px;font-weight:900;color:#fff;letter-spacing:.2em;}
#pDate{font-weight:900;letter-spacing:.06em;}
#divLine{position:absolute;right:0;height:3px;background:linear-gradient(90deg,transparent 0%,rgba(204,0,0,.6) 20%,#cc0000 60%,rgba(204,0,0,.3) 100%);}
#newsList{position:absolute;right:0;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
#fmBgList{position:absolute;right:0;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
#fullMode{position:absolute;bottom:60px;left:0;width:1280px;display:flex;justify-content:flex-end;}
@keyframes bflash{0%,100%{opacity:1;}50%{opacity:.3;}}
</style></head><body>

<div id="hdr">
  <div class="live-badge"><div class="live-dot"></div><span class="live-txt">LIVE</span></div>
  <div id="pDate">—</div>
</div>
<div id="divLine"></div>
<div id="newsList"></div>
<div id="fmBgList"></div>
<div id="fullMode">
  <div id="fmBar" style="display:flex;align-items:stretch;">
    <div id="fmLine" style="width:8px;flex-shrink:0;"></div>
    <div id="fmBody" style="flex:1;display:flex;align-items:center;padding:0 32px;gap:18px;">
      <div id="fmDot" style="display:none;width:12px;height:12px;border-radius:50%;flex-shrink:0;animation:pulse 1s ease-in-out infinite;"></div>
      <div id="fmTag"></div>
      <div id="fmTitle" style="color:#fff;font-weight:900;flex:1;">—</div>
      <div id="fmNum" style="font-weight:900;font-family:monospace;text-align:right;flex-shrink:0;">01</div>
    </div>
  </div>
</div>

<script>
var ITEMS=[], cur=0, prevCur=-1, _ac=null;
var ST={
  titleSize:48, titleWeight:900,
  dateSize:30, dateColor:'#ffffff',
  tagSize:14, itemHeight:88, numSize:32,
  itemWidth:760, inactiveOpacity:0.14,
  mode:'list', volume:0.6
};

function getAC(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;}
function pip(brk){
  try{
    var ctx=getAC();if(ctx.state==='suspended')ctx.resume();
    var v=ST.volume||0.6;
    if(brk){
      [0,.15].forEach(function(off){
        var o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);o.type='sine';
        o.frequency.setValueAtTime(1400,ctx.currentTime+off);
        g.gain.setValueAtTime(0,ctx.currentTime+off);
        g.gain.linearRampToValueAtTime(v,ctx.currentTime+off+.01);
        g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+off+.12);
        o.start(ctx.currentTime+off);o.stop(ctx.currentTime+off+.13);
      });
    }else{
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);o.type='sine';
      o.frequency.setValueAtTime(880,ctx.currentTime);
      o.frequency.linearRampToValueAtTime(1100,ctx.currentTime+.04);
      g.gain.setValueAtTime(0,ctx.currentTime);
      g.gain.linearRampToValueAtTime(v,ctx.currentTime+.01);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.15);
      o.start(ctx.currentTime);o.stop(ctx.currentTime+.16);
    }
  }catch(e){}
}

function h2r(h,a){
  var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

function buildItem(item, i, isActive){
  var c=item.color||'#cc0000';
  var op=isActive?1:ST.inactiveOpacity;
  var ts=isActive?(ST.titleSize||48)*1.2:(ST.titleSize||48);
  var tgs=isActive?(ST.tagSize||14)*1.15:(ST.tagSize||14);
  var tw=ST.titleWeight||900;
  var h=isActive?(ST.itemHeight||88)*1.3:(ST.itemHeight||88);
  var ns=isActive?(ST.numSize||32)*1.3:(ST.numSize||32);
  var iw=ST.itemWidth||760;
  var bodyBg=isActive?'rgba(10,10,10,.98)':'rgba(0,0,0,.90)';
  var borderCol=isActive?h2r(c,.35):'rgba(255,255,255,.07)';
  var numCol=c;

  var wrap=document.createElement('div');
  wrap.style.cssText='opacity:'+op+';height:'+h+'px;width:'+iw+'px;display:flex;align-items:stretch;overflow:hidden;';

  var line=document.createElement('div');
  line.style.cssText='width:6px;flex-shrink:0;background:'+c+';';
  wrap.appendChild(line);

  var body=document.createElement('div');
  body.style.cssText='flex:1;display:flex;align-items:center;padding:0 24px;gap:16px;background:'+bodyBg+';border-top:1px solid '+borderCol+';border-bottom:1px solid '+borderCol+';';

  if(isActive){
    var dot=document.createElement('div');
    dot.style.cssText='width:10px;height:10px;border-radius:50%;flex-shrink:0;background:'+c+';animation:pulse 1s ease-in-out infinite;';
    body.appendChild(dot);
  }

  var tag=document.createElement('div');
  if(item.breaking){
    var bp=ST.badgePad||5; tag.style.cssText='background:#cc0000;color:#fff;font-size:'+tgs+'px;font-weight:900;letter-spacing:.14em;padding:'+bp+'px '+(bp*2.4|0)+'px;flex-shrink:0;border-radius:2px;animation:bflash .8s ease-in-out infinite;';
    tag.textContent='速 報';
  }else{
    var bp=ST.badgePad||5; tag.style.cssText='color:'+c+';border:2px solid '+c+';font-size:'+tgs+'px;font-weight:900;letter-spacing:.14em;padding:'+bp+'px '+(bp*2.4|0)+'px;flex-shrink:0;border-radius:2px;white-space:nowrap;';
    tag.textContent=item.badge;
  }
  body.appendChild(tag);

  var title=document.createElement('div');
  title.style.cssText='font-size:'+ts+'px;font-weight:'+tw+';color:#fff;letter-spacing:.04em;line-height:1.15;flex:1;';
  title.textContent=item.title;
  body.appendChild(title);

  var num=document.createElement('div');
  num.style.cssText='font-size:'+Math.round(ns)+'px;font-weight:900;font-family:monospace;width:56px;text-align:right;flex-shrink:0;color:'+numCol+';';
  num.textContent='0'+(i+1);
  body.appendChild(num);

  wrap.appendChild(body);
  return wrap;
}

function slideIn(el){
  el.style.transition='none';
  el.style.transform='translateX(110%)';
  el.style.opacity='0';
  void el.offsetWidth;
  el.style.transition='transform 500ms cubic-bezier(.16,1,.3,1), opacity 480ms ease';
  el.style.transform='translateX(0)';
  el.style.opacity='1';
}

function updateLayout(){
  var hdrEl=document.getElementById('hdr');
  var hdrBottom=hdrEl.offsetTop+hdrEl.offsetHeight;
  var iw=ST.itemWidth||760;
  var ds=ST.dateSize||30;
  var divLine=document.getElementById('divLine');
  divLine.style.cssText='position:absolute;right:0;width:'+iw+'px;height:3px;background:linear-gradient(90deg,transparent 0%,rgba(204,0,0,.6) 20%,#cc0000 60%,rgba(204,0,0,.3) 100%);top:'+(hdrBottom+10)+'px;';
  var listTop=hdrBottom+40;
  document.getElementById('newsList').style.cssText='position:absolute;right:0;width:'+iw+'px;top:'+listTop+'px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;';
}

function renderList(doAnim){
  updateLayout();
  var list=document.getElementById('newsList');
  list.innerHTML='';
  ITEMS.forEach(function(item,i){
    var isAct=i===cur;
    var el=buildItem(item,i,isAct);
    list.appendChild(el);
    if(isAct&&doAnim){slideIn(el);}
  });
}

function renderFull(doAnim){
  if(!ITEMS.length)return;
  updateLayout();
  var item=ITEMS[cur];
  var c=item.color||'#cc0000';
  var ts=ST.fullSize?ST.fullSize*1.0:(ST.titleSize||48)*1.1;
  var tgs=(ST.tagSize||14)+4;
  var tw=ST.titleWeight||900;
  var h=(ST.itemHeight||88)*1.5;
  var ns=ST.numSize||Math.round(ts*.85);
  var iw=ST.itemWidth||760;

  var hdrEl=document.getElementById('hdr');
  var hdrBottom=hdrEl.offsetTop+hdrEl.offsetHeight+40;
  var bgList=document.getElementById('fmBgList');
  bgList.innerHTML='';
  bgList.style.cssText='position:absolute;top:'+hdrBottom+'px;right:0;width:'+iw+'px;display:flex;flex-direction:column;gap:8px;pointer-events:none;';
  ITEMS.forEach(function(it,i){
    if(i===cur)return;
    var el=buildItem(it,i,false);
    bgList.appendChild(el);
  });

  var fmBar=document.getElementById('fmBar');
  fmBar.style.cssText='display:flex;align-items:stretch;width:1280px;height:'+h+'px;';
  document.getElementById('fmLine').style.cssText='width:8px;flex-shrink:0;background:'+c+';';
  document.getElementById('fmBody').style.cssText='flex:1;display:flex;align-items:center;padding:0 32px;gap:18px;background:rgba(8,8,8,.98);border-top:1px solid '+h2r(c,.3)+';border-bottom:1px solid '+h2r(c,.3)+';';
  document.getElementById('fmDot').style.cssText='display:block;width:12px;height:12px;border-radius:50%;flex-shrink:0;background:'+c+';animation:pulse 1s ease-in-out infinite;';

  var tagEl=document.getElementById('fmTag');
  if(item.breaking){
    var fbp=(ST.badgePad||5)+1; tagEl.style.cssText='background:#cc0000;color:#fff;font-size:'+tgs+'px;font-weight:900;letter-spacing:.14em;padding:'+fbp+'px '+(fbp*2.4|0)+'px;flex-shrink:0;border-radius:2px;';
    tagEl.textContent='速 報';
  }else{
    var fbp=(ST.badgePad||5)+1; tagEl.style.cssText='color:'+c+';border:2px solid '+c+';font-size:'+tgs+'px;font-weight:900;letter-spacing:.14em;padding:'+fbp+'px '+(fbp*2.4|0)+'px;flex-shrink:0;border-radius:2px;white-space:nowrap;';
    tagEl.textContent=item.badge;
  }
  document.getElementById('fmTitle').style.cssText='font-size:'+ts+'px;font-weight:'+tw+';color:#fff;letter-spacing:.04em;line-height:1.15;flex:1;';
  document.getElementById('fmTitle').textContent=item.title;
  document.getElementById('fmNum').style.cssText='font-size:'+ns+'px;font-weight:900;font-family:monospace;width:110px;text-align:right;flex-shrink:0;color:'+c+';';
  document.getElementById('fmNum').textContent='0'+(cur+1);

  if(doAnim){slideIn(fmBar);}
}

function renderWithAnim(doAnim){
  var dateEl=document.getElementById('pDate');
  dateEl.style.fontSize=(ST.dateSize||30)+'px';
  dateEl.style.color=ST.dateColor||'#ffffff';
  var fm=document.getElementById('fullMode');
  var lm=document.getElementById('newsList');
  if(ST.mode==='full'){
    lm.style.display='none';
    fm.style.display='flex';
    document.getElementById('fmBgList').style.display='flex';
    renderFull(doAnim);
  }else{
    lm.style.display='flex';
    fm.style.display='none';
    document.getElementById('fmBgList').innerHTML='';
    document.getElementById('fmBgList').style.display='none';
    renderList(doAnim);
  }
}

function render(){renderWithAnim(false);}

function applyState(s){
  if(s.style)ST=Object.assign({},ST,s.style);
  var dateEl=document.getElementById('pDate');
  if(s.date!==undefined)dateEl.textContent=s.date||'—';
  if(s.title!==undefined)dateEl.textContent=s.title||'—';
  if(s.items)ITEMS=s.items;
  if(s.cur!==undefined){
    prevCur=cur;
    cur=s.cur;
  }
  render();
}

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '){
    e.preventDefault();
    if(!ITEMS.length)return;
    prevCur=cur;cur=(cur+1)%ITEMS.length;
    render();
  }else if(e.key==='ArrowLeft'){
    e.preventDefault();
    if(!ITEMS.length)return;
    prevCur=cur;cur=(cur-1+ITEMS.length)%ITEMS.length;
    render();
  }
});

try{
  var d=new URLSearchParams(window.location.search).get('d');
  if(d){
    var state=JSON.parse(decodeURIComponent(d));
    var lsKey='obs_last_d';
    var lastD=localStorage.getItem(lsKey);
    var isNew=(lastD!==d);
    localStorage.setItem(lsKey,d);
    var newCur=state.cur!==undefined?state.cur:0;
    if(state.style)ST=Object.assign({},ST,state.style);
    var dateEl=document.getElementById('pDate');
    if(state.date!==undefined)dateEl.textContent=state.date||'—';
    if(state.title!==undefined)dateEl.textContent=state.title||'—';
    if(state.items)ITEMS=state.items;
    prevCur=cur;cur=newCur;
    renderWithAnim(isNew);
  }else{
    render();
  }
}catch(e){render();}
</script></body></html>
