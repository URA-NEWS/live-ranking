<!DOCTYPE html><html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOLO DEX CARD v3 — 配信者ホログラム</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap');
  :root{--ink:#eef2ff;--dim:#8892b8;--neon:#62e9ff;--pink:#ff6ec7;--grn:#53fc18;--gold:#ffd24a;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;}
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transform:scaleX(-1);opacity:0;transition:opacity .8s;}
  #cam.on{opacity:1;}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.5) 100%);}
  #scan{position:fixed;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(98,233,255,.04) 2px,rgba(98,233,255,.04) 3px);mix-blend-mode:screen;}
  .corners{position:fixed;inset:0;pointer-events:none;z-index:9;}
  .corners span{position:absolute;width:36px;height:36px;border:1px solid var(--neon);opacity:.55;}
  .corners .c1{top:18px;left:18px;border-right:0;border-bottom:0;}
  .corners .c2{top:18px;right:18px;border-left:0;border-bottom:0;}
  .corners .c3{bottom:18px;left:18px;border-right:0;border-top:0;}
  .corners .c4{bottom:18px;right:18px;border-left:0;border-top:0;}

  /* HUD */
  .hud-top{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;font-family:'Share Tech Mono',monospace;color:var(--neon);text-shadow:0 0 10px var(--neon);letter-spacing:.3em;font-size:11px;pointer-events:none;}
  .hud-top .t{font-family:'Orbitron';font-weight:900;font-size:14px;margin-top:4px;letter-spacing:.18em;}
  .hud-status{position:fixed;bottom:18px;left:18px;z-index:10;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--neon);opacity:.7;pointer-events:none;}
  .hud-status::before{content:"● ";color:var(--grn);}
  .hud-counter{position:fixed;top:30px;right:80px;z-index:10;font-family:'Orbitron';font-weight:900;font-size:16px;color:var(--neon);letter-spacing:.08em;text-shadow:0 0 12px var(--neon);pointer-events:none;}
  .hud-counter .cur{font-size:24px;color:var(--neon);}
  .hud-counter .sl{color:var(--dim);font-size:14px;margin:0 6px;}
  .hud-counter .tot{font-size:14px;color:var(--dim);}

  /* ステージ：3D空間 */
  #stage{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;perspective:1600px;perspective-origin:center;pointer-events:none;}
  .anchor{position:absolute;transform-style:preserve-3d;will-change:transform;pointer-events:auto;cursor:grab;display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:stretch;width:min(960px,92vw);}
  .anchor.dragging{cursor:grabbing;}
  .anchor.memo-off{grid-template-columns:1fr;width:min(460px,86vw);}

  /* ホロ枠（カード/メモ共通の外装） */
  .holo-frame{position:relative;transform-style:preserve-3d;will-change:transform;}
  .holo-frame .layer-shadow{position:absolute;inset:-40px;background:radial-gradient(ellipse at center,rgba(98,233,255,.35) 0%,transparent 65%);transform:translateZ(-150px);filter:blur(40px);pointer-events:none;}
  .holo-frame .layer-shadow2{position:absolute;inset:-25px;background:radial-gradient(ellipse at center,currentColor 0%,transparent 60%);opacity:.15;transform:translateZ(-110px);filter:blur(28px);pointer-events:none;}
  .holo-frame .layer-back{position:absolute;inset:-20px;border:1px solid currentColor;border-radius:26px;opacity:.18;transform:translateZ(-80px);pointer-events:none;}
  .holo-frame .layer-back2{position:absolute;inset:-12px;border:1px solid currentColor;border-radius:23px;opacity:.32;transform:translateZ(-50px);pointer-events:none;}
  .holo-frame .layer-back3{position:absolute;inset:-6px;border:1px solid currentColor;border-radius:20px;opacity:.55;transform:translateZ(-22px);pointer-events:none;box-shadow:0 0 24px currentColor inset;}
  .holo-frame .layer-rays{position:absolute;inset:-2px;pointer-events:none;transform:translateZ(15px);}
  .holo-frame .layer-rays::before,.holo-frame .layer-rays::after{content:"";position:absolute;background:currentColor;}
  .holo-frame .layer-rays::before{left:-22px;top:30%;width:16px;height:2px;box-shadow:0 0 14px currentColor;}
  .holo-frame .layer-rays::after{right:-22px;top:65%;width:16px;height:2px;box-shadow:0 0 14px currentColor;}
  /* 四隅マーカー */
  .holo-frame .layer-corners{position:absolute;inset:0;pointer-events:none;transform:translateZ(12px);}
  .holo-frame .layer-corners::before,.holo-frame .layer-corners::after,
  .holo-frame .layer-corners .cb,.holo-frame .layer-corners .cd{content:"";position:absolute;width:18px;height:18px;border:1.5px solid currentColor;box-shadow:0 0 8px currentColor;}
  .holo-frame .layer-corners::before{top:-5px;left:-5px;border-right:0;border-bottom:0;}
  .holo-frame .layer-corners::after{top:-5px;right:-5px;border-left:0;border-bottom:0;}
  .holo-frame .layer-corners .cb{bottom:-5px;left:-5px;border-right:0;border-top:0;}
  .holo-frame .layer-corners .cd{bottom:-5px;right:-5px;border-left:0;border-top:0;}
  /* スキャンライン */
  .holo-frame .layer-scan{position:absolute;inset:0;border-radius:18px;pointer-events:none;overflow:hidden;transform:translateZ(22px);}
  .holo-frame .layer-scan::before{content:"";position:absolute;left:0;right:0;height:2px;background:linear-gradient(to bottom,transparent,currentColor 50%,transparent);box-shadow:0 0 18px currentColor;opacity:.85;animation:scanMove 2.2s linear infinite;}
  .holo-frame .layer-scan::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(255,255,255,.025) 2px,rgba(255,255,255,.025) 3px);mix-blend-mode:screen;}
  @keyframes scanMove{0%{top:-2%;}100%{top:102%;}}
  /* ホロのチラつき */
  .holo-frame .layer-flicker{position:absolute;inset:0;border-radius:18px;pointer-events:none;background:linear-gradient(to bottom,rgba(98,233,255,.06),transparent 30%);transform:translateZ(8px);animation:flicker 6s infinite;mix-blend-mode:screen;}
  @keyframes flicker{0%,98%,100%{opacity:1;}97%{opacity:.4;}94%{opacity:.8;}96%{opacity:.5;}}

  /* グリッチ - たまに横ずれ＋色ズレ */
  .holo-frame .layer-glitch{position:absolute;inset:0;border-radius:18px;pointer-events:none;transform:translateZ(30px);overflow:hidden;animation:glitchPos 11s infinite steps(1,end);}
  @keyframes glitchPos{
    0%,100%{transform:translateZ(30px) translateX(0);filter:none;}
    91.4%{transform:translateZ(30px) translateX(-6px);filter:hue-rotate(20deg);}
    91.6%{transform:translateZ(30px) translateX(7px);filter:hue-rotate(-30deg);}
    91.9%{transform:translateZ(30px) translateX(-2px);filter:none;}
    92%{transform:translateZ(30px) translateX(0);filter:none;}
  }
  .holo-frame .layer-glitch::before,.holo-frame .layer-glitch::after{content:"";position:absolute;left:0;right:0;height:6%;background:rgba(255,255,255,0);opacity:0;mix-blend-mode:screen;animation:glitchBand 9s infinite;}
  .holo-frame .layer-glitch::before{top:35%;animation-delay:.2s;}
  .holo-frame .layer-glitch::after{top:65%;animation-delay:2.5s;background:currentColor;}
  @keyframes glitchBand{
    0%,98%,100%{opacity:0;transform:translateX(0);}
    98.5%{opacity:.5;transform:translateX(-12px);}
    99%{opacity:.3;transform:translateX(8px);}
    99.5%{opacity:.4;transform:translateX(-3px);}
  }
  /* RGB色収差グリッチ */
  .holo-frame .layer-rgb{position:absolute;inset:0;border-radius:18px;pointer-events:none;transform:translateZ(35px);box-shadow:0 0 0 0 transparent;animation:rgbShift 13s infinite;mix-blend-mode:screen;}
  /* メモパネルはタイミングをずらしてランダム感を出す */
  .memo-panel .layer-glitch{animation-delay:4s;animation-duration:14s;}
  .memo-panel .layer-rgb{animation-delay:6.5s;animation-duration:17s;}
  .memo-panel .layer-flicker{animation-delay:2s;animation-duration:8s;}
  @keyframes rgbShift{
    0%,93%,100%{box-shadow:inset 0 0 0 0 transparent;}
    93.5%{box-shadow:inset 4px 0 0 0 rgba(255,0,80,.45), inset -4px 0 0 0 rgba(0,200,255,.45);}
    94%{box-shadow:inset -3px 0 0 0 rgba(255,0,80,.4), inset 3px 0 0 0 rgba(0,200,255,.4);}
    94.5%{box-shadow:inset 0 0 0 0 transparent;}
  }

  /* ===== カード本体 ===== */
  .card{position:relative;transform-style:preserve-3d;will-change:transform;
    transition:transform .55s cubic-bezier(.2,.9,.25,1), opacity .35s ease;}
  .card .layer-main{position:relative;background:linear-gradient(160deg,rgba(8,16,28,.65) 0%,rgba(8,16,28,.4) 100%);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1.5px solid currentColor;border-radius:18px;padding:26px;height:100%;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(98,233,255,.12),0 30px 80px -20px rgba(0,0,0,.7),0 0 80px -10px currentColor,0 0 160px -50px currentColor;}
  .card .rank{position:absolute;top:18px;right:24px;font-family:'Orbitron';font-weight:900;color:currentColor;text-shadow:0 0 22px currentColor,0 0 6px currentColor;letter-spacing:.02em;opacity:1;text-align:right;display:flex;flex-direction:column;align-items:flex-end;line-height:1;max-width:48%;pointer-events:none;}
  .card .rank .row1{display:flex;align-items:flex-end;gap:4px;line-height:.85;}
  .card .rank .num{font-size:54px;font-weight:900;line-height:.82;}
  .card .rank .lbl{font-size:16px;font-weight:700;letter-spacing:.1em;padding-bottom:5px;opacity:.95;}
  .card .rank .div{width:60px;height:1px;background:currentColor;opacity:.45;margin:5px 0 4px auto;box-shadow:0 0 4px currentColor;}
  .card .rank .row2{display:flex;align-items:baseline;gap:4px;line-height:1;}
  .card .rank .slash{font-family:'Orbitron';font-size:12px;opacity:.45;font-weight:400;}
  .card .rank .tot{font-family:'Orbitron';font-size:14px;font-weight:700;opacity:.85;}
  .card .rank .totLbl{font-size:9px;letter-spacing:.2em;font-weight:500;opacity:.7;margin-left:2px;}
  .card .hdr{display:flex;align-items:center;gap:16px;margin-bottom:18px;padding-right:130px;}
  .card .ava{width:92px;height:92px;border-radius:50%;border:2px solid currentColor;flex:none;object-fit:cover;background:#0a1320;display:flex;align-items:center;justify-content:center;font-family:'Orbitron';font-size:36px;font-weight:900;box-shadow:0 0 30px -5px currentColor,inset 0 0 20px rgba(0,0,0,.5);}
  /* デカ名前・デカサイトバッジ */
  .card .nm{font-family:'Zen Kaku Gothic New';font-weight:900;font-size:32px;color:#fff;line-height:1.05;text-shadow:0 1px 4px rgba(0,0,0,.8),0 0 10px currentColor;letter-spacing:.01em;word-break:break-all;}
  .card .badge{display:inline-block;font-family:'Orbitron';font-weight:700;font-size:13px;letter-spacing:.2em;padding:5px 14px;margin-top:8px;border:1.5px solid currentColor;border-radius:99px;color:currentColor;background:rgba(98,233,255,.06);text-shadow:0 0 8px currentColor;}
  .card .offline{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--dim);margin-left:8px;letter-spacing:.1em;}
  .card .stat{display:flex;gap:12px;margin-bottom:14px;}
  .card .stat .s{flex:1;background:rgba(98,233,255,.06);border:1px solid rgba(98,233,255,.2);border-radius:10px;padding:10px 12px;}
  .card .stat .lab{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.25em;color:var(--dim);text-transform:uppercase;}
  .card .stat .val{font-family:'Orbitron';font-weight:900;font-size:22px;color:#fff;margin-top:3px;text-shadow:0 0 8px currentColor;}
  .card .stat .val small{font-family:'Zen Kaku Gothic New';font-weight:700;font-size:12px;color:var(--dim);margin-left:2px;text-shadow:none;}
  .card .thumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0a1320;border:1px solid rgba(98,233,255,.2);margin-bottom:14px;box-shadow:inset 0 0 30px rgba(0,0,0,.5);}
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .card .thumb .live{position:absolute;top:8px;left:8px;font-family:'Orbitron';font-size:10px;font-weight:900;letter-spacing:.15em;background:var(--pink);color:#fff;padding:3px 8px;border-radius:4px;box-shadow:0 0 12px var(--pink);}
  /* 配信タイトル専用ブロック */
  .card .titleblock{margin-bottom:14px;padding:14px 16px;background:rgba(5,10,18,.55);border:1px solid currentColor;border-left:4px solid currentColor;border-radius:8px;box-shadow:0 0 24px -8px currentColor,inset 0 1px 0 rgba(255,255,255,.06);}
  .card .titleblock .lab{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.3em;color:currentColor;opacity:.7;margin-bottom:6px;}
  .card .titleblock .tt{font-family:'Zen Kaku Gothic New';font-weight:900;font-size:20px;line-height:1.4;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8),0 0 12px currentColor;letter-spacing:.01em;word-break:break-word;}
  .card .btns{display:flex;gap:8px;}
  .card .btn{flex:1;text-align:center;font-family:'Orbitron';font-weight:700;font-size:11px;letter-spacing:.15em;padding:12px;border-radius:9px;text-decoration:none;cursor:pointer;border:1px solid currentColor;color:currentColor;background:transparent;transition:.2s;}
  .card .btn.primary{background:currentColor;}
  .card .btn.primary span{color:#06080d;}
  .card .btn:hover{filter:brightness(1.2);}

  /* ===== 右隣のメモパネル ===== */
  .memo-panel{position:relative;transform-style:preserve-3d;will-change:transform;}
  .memo-panel .layer-main{position:relative;background:linear-gradient(160deg,rgba(8,16,28,.65) 0%,rgba(8,16,28,.4) 100%);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1.5px solid currentColor;border-radius:18px;padding:26px;height:100%;display:flex;flex-direction:column;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(98,233,255,.12),0 30px 80px -20px rgba(0,0,0,.7),0 0 80px -10px currentColor,0 0 160px -50px currentColor;}
  .memo-panel .ttl{font-family:'Orbitron';font-weight:900;font-size:16px;letter-spacing:.2em;color:currentColor;text-shadow:0 0 10px currentColor;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  .memo-panel .ttl .for{font-family:'Zen Kaku Gothic New';font-weight:700;font-size:14px;color:var(--ink);letter-spacing:.05em;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .memo-panel textarea{flex:1;width:100%;background:rgba(5,10,18,.7);border:1px solid rgba(98,233,255,.25);border-radius:10px;padding:16px;
    color:#fff;font-family:'Zen Kaku Gothic New';font-weight:700;font-size:16px;line-height:1.6;resize:none;outline:none;
    text-shadow:0 1px 2px rgba(0,0,0,.7);}
  .memo-panel textarea::placeholder{color:rgba(255,255,255,.35);font-weight:400;}
  .memo-panel textarea:focus{border-color:var(--neon);}
  .memo-panel .ft{margin-top:10px;display:flex;align-items:center;gap:8px;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.2em;color:var(--dim);}
  .memo-panel .saved{color:var(--grn);}

  /* ===== サイト別インデックス ===== */
  #idxPanel{position:fixed;right:18px;top:64px;bottom:80px;width:300px;z-index:20;background:rgba(5,8,16,.94);backdrop-filter:blur(18px);border:1px solid rgba(98,233,255,.3);border-radius:14px;display:none;flex-direction:column;box-shadow:0 20px 60px -20px rgba(0,0,0,.7),0 0 40px -10px var(--neon);}
  #idxPanel.show{display:flex;}
  .ix-head{padding:14px 16px;border-bottom:1px solid rgba(98,233,255,.15);display:flex;justify-content:space-between;align-items:center;}
  .ix-head .t{font-family:'Orbitron';font-weight:700;font-size:12px;letter-spacing:.2em;color:var(--neon);}
  .ix-close{cursor:pointer;color:var(--dim);font-size:18px;}
  .ix-search{padding:10px;border-bottom:1px solid rgba(98,233,255,.15);}
  .ix-search input{width:100%;padding:10px 12px;background:rgba(5,10,18,.7);border:1px solid rgba(98,233,255,.25);border-radius:8px;color:#fff;font-family:'Zen Kaku Gothic New';font-weight:700;font-size:14px;outline:none;}
  .ix-search input::placeholder{color:rgba(255,255,255,.4);font-weight:400;}
  .ix-search input:focus{border-color:var(--neon);box-shadow:0 0 12px -2px var(--neon);}
  .ix-tabs{display:flex;gap:4px;padding:10px;border-bottom:1px solid rgba(98,233,255,.15);}
  .ix-tabs button{flex:1;padding:7px 4px;border-radius:6px;border:1px solid rgba(98,233,255,.2);background:transparent;color:var(--dim);font-size:10px;font-weight:700;cursor:pointer;}
  .ix-tabs button.on{background:var(--neon);color:#06080d;border-color:var(--neon);}
  .ix-letters{display:flex;flex-wrap:wrap;gap:3px;padding:8px 10px;border-bottom:1px solid rgba(98,233,255,.15);max-height:90px;overflow:auto;}
  .ix-letters button{min-width:24px;padding:4px 6px;font-size:10px;border-radius:4px;border:1px solid rgba(98,233,255,.2);background:transparent;color:var(--ink);cursor:pointer;font-weight:700;}
  .ix-letters button.on{background:var(--neon);color:#06080d;}
  .ix-letters button.empty{opacity:.25;cursor:default;}
  #idxList{flex:1;overflow:auto;padding:6px 4px;}
  .ix-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;transition:.15s;}
  .ix-item:hover{background:rgba(98,233,255,.08);}
  .ix-item .av{width:30px;height:30px;border-radius:50%;border:1px solid currentColor;flex:none;background:#0a1320;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;overflow:hidden;}
  .ix-item .av img{width:100%;height:100%;object-fit:cover;}
  .ix-item .info{flex:1;min-width:0;}
  .ix-item .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ix-item .cc{font-family:'Orbitron';font-size:11px;color:var(--dim);}
  .ix-item.live .cc{color:var(--grn);}

  /* インデックスを開くボタン */
  #idxBtn{position:fixed;right:18px;top:18px;z-index:19;padding:10px 16px;background:rgba(8,16,28,.7);backdrop-filter:blur(10px);border:1px solid var(--neon);color:var(--neon);font-family:'Orbitron';font-size:11px;letter-spacing:.18em;font-weight:700;border-radius:10px;cursor:pointer;}
  #idxBtn:hover{box-shadow:0 0 24px -4px var(--neon);}

  /* スワイプヒント */
  .hint{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:10;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.3em;color:var(--neon);opacity:.55;text-align:center;pointer-events:none;}
  .hint .arr{font-size:18px;letter-spacing:.4em;margin-top:6px;}

  /* メニュー & サイドバー */
  #menubtn{position:fixed;left:18px;top:18px;z-index:25;width:44px;height:44px;border-radius:11px;background:rgba(8,16,28,.7);backdrop-filter:blur(12px);border:1px solid var(--neon);color:var(--neon);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  #menubtn:hover{box-shadow:0 0 24px -2px var(--neon);}
  #sidebar{position:fixed;left:0;top:0;height:100%;width:300px;z-index:26;background:rgba(5,8,16,.94);backdrop-filter:blur(20px);border-right:1px solid rgba(98,233,255,.2);transform:translateX(-320px);transition:transform .4s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:18px;}
  #sidebar.show{transform:none;}
  .sb-head{display:flex;justify-content:space-between;align-items:center;font-family:'Orbitron';font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--neon);margin-bottom:18px;}
  #sbclose{cursor:pointer;font-size:22px;color:var(--dim);}
  .sb-sec{margin-bottom:22px;}
  .sb-sec h4{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.25em;color:var(--dim);margin-bottom:10px;}
  .sb-seg{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;}
  .sb-seg button{flex:1;min-width:64px;padding:9px 6px;border-radius:7px;border:1px solid rgba(98,233,255,.2);background:rgba(98,233,255,.04);color:var(--dim);font-size:11px;font-weight:700;cursor:pointer;font-family:'Zen Kaku Gothic New';}
  .sb-seg button.on{background:var(--neon);color:#06080d;border-color:var(--neon);}
  .sb-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:10px;flex-wrap:wrap;}
  .sb-row input[type=range]{flex:1;min-width:120px;accent-color:var(--neon);}
  .sb-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--neon);}
  .sb-row span.v{font-family:'Orbitron';font-size:11px;color:var(--neon);}
  .sb-btn{display:block;width:100%;padding:11px;margin-bottom:8px;border-radius:9px;border:1px solid rgba(98,233,255,.2);background:rgba(98,233,255,.05);color:var(--ink);font-family:'Zen Kaku Gothic New';font-weight:700;font-size:13px;cursor:pointer;}
  .sb-btn:hover{border-color:var(--neon);}

  /* 手のトラッキング骨格 */
  #handcv{position:fixed;right:18px;bottom:60px;width:160px;height:120px;z-index:13;transform:scaleX(-1);pointer-events:none;opacity:0;transition:opacity .6s;border-radius:8px;}
  #handcv.on{opacity:.8;}
  /* ジェスチャー状態表示 */
  #gst{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:21;font-family:'Orbitron';font-size:14px;letter-spacing:.2em;color:var(--neon);text-shadow:0 0 12px var(--neon);background:rgba(8,16,28,.6);padding:8px 16px;border:1px solid var(--neon);border-radius:99px;opacity:0;transition:.2s;}
  #gst.show{opacity:1;}

  .sweep{position:fixed;top:50%;width:80px;height:80px;border-radius:50%;z-index:11;pointer-events:none;background:radial-gradient(circle,var(--neon) 0%,transparent 70%);opacity:0;transform:translateY(-50%) scale(0.5);transition:.3s;}
  .sweep.show{opacity:.7;}
  .sweep.left{left:8%;}
  .sweep.right{right:8%;}

  /* ===== 非表示モード：カード等を隠す（メニューは残す） ===== */
  body.clean #stage,
  body.clean .hud-top,
  body.clean .hud-status,
  body.clean .hud-counter,
  body.clean .corners,
  body.clean #scan,
  body.clean #vig,
  body.clean .hint,
  body.clean #idxBtn,
  body.clean #idxPanel,
  body.clean #handcv,
  body.clean #gst,
  body.clean .sweep{display:none !important;}
</style></head><body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="handcv" width="160" height="120"></canvas>
<div id="vig"></div>
<div id="scan"></div>
<div class="corners"><span class="c1"></span><span class="c2"></span><span class="c3"></span><span class="c4"></span></div>

<div class="hud-status">STREAMER DEX · LIVE</div>

<div id="gst">—</div>

<div id="stage"><div class="anchor" id="anchor"></div></div>

<div class="sweep left" id="swL">←</div>
<div class="sweep right" id="swR">→</div>

<button id="idxBtn">🔍 検索 / INDEX</button>

<div id="idxPanel">
  <div class="ix-head"><span class="t">配信者インデックス</span><span class="ix-close" id="ixClose">×</span></div>
  <div class="ix-search">
    <input type="search" id="ixSearch" placeholder="🔍 名前で検索（部分一致）" autocomplete="off">
  </div>
  <div class="ix-tabs" id="ixTabs">
    <button data-s="all" class="on">全部</button>
    <button data-s="twitcasting">ツイ</button>
    <button data-s="kick">Kick</button>
    <button data-s="fuwacchi">ふわ</button>
  </div>
  <div class="ix-letters" id="ixLetters"></div>
  <div id="idxList"></div>
</div>

<div id="menubtn">☰</div>
<div id="sidebar">
  <div class="sb-head"><span>HOLO DEX 設定</span><span id="sbclose">×</span></div>

  <div class="sb-sec">
    <h4>表示モード</h4>
    <div class="sb-seg" id="sb-mode">
      <button data-m="full" class="on">フル表示</button>
      <button data-m="clean">非表示モード</button>
    </div>
  </div>

  <div class="sb-sec">
    <h4>メモ文字サイズ</h4>
    <div class="sb-row">フォント <span class="v" id="sb-mf-v">14px</span></div>
    <input type="range" id="sb-mf" min="10" max="48" step="1" value="14" style="width:100%;accent-color:var(--neon);">
    <div class="sb-row">右メモ表示 <input type="checkbox" id="sb-memo" checked></div>
  </div>

  <div class="sb-sec">
    <h4>カード順</h4>
    <div class="sb-seg" id="sb-order">
      <button data-o="rank" class="on">同接順</button>
      <button data-o="site">サイト別</button>
      <button data-o="aiueo">あいうえお</button>
      <button data-o="shuffle">シャッフル</button>
    </div>
  </div>

  <div class="sb-sec">
    <h4>サイト・絞り込み</h4>
    <div class="sb-seg" id="sb-site">
      <button data-s="twitcasting" class="on">ツイキャス</button>
      <button data-s="kick" class="on">Kick</button>
      <button data-s="fuwacchi" class="on">ふわっち</button>
    </div>
    <div class="sb-row">配信中のみ表示 <input type="checkbox" id="sb-liveonly" checked></div>
    <div class="sb-row">最低同接 <span class="v" id="sb-minccu-v">0</span></div>
    <input type="range" id="sb-minccu" min="0" max="2000" step="50" value="0" style="width:100%;accent-color:var(--neon);">
  </div>

  <div class="sb-sec">
    <h4>操作</h4>
    <div class="sb-row">手で操作 <input type="checkbox" id="sb-cam"></div>
    <div class="sb-row">音声で名前ジャンプ <input type="checkbox" id="sb-voice"></div>
    <div class="sb-row">スワイプ感度 <span class="v" id="sb-sens-v">1.0</span></div>
    <input type="range" id="sb-sens" min="0.4" max="2.5" step="0.1" value="1.0" style="width:100%;accent-color:var(--neon);">
    <div class="sb-row">拡大/縮小の速さ <span class="v" id="sb-zoomrate-v">1.0</span></div>
    <input type="range" id="sb-zoomrate" min="0.2" max="2.5" step="0.1" value="1.0" style="width:100%;accent-color:var(--neon);">
  </div>

  <div class="sb-sec">
    <h4>データ</h4>
    <div class="sb-row" style="font-size:11px;color:var(--dim)">蓄積 <span class="v" id="sb-archive">0人</span></div>
    <button class="sb-btn" id="sb-refresh">最新データ取得</button>
    <button class="sb-btn" id="sb-clear" style="color:var(--pink);border-color:rgba(255,110,199,.4);">蓄積を初期化</button>
  </div>
</div>

<script type="module">
const URA_API='https://live-ranking-d702.onrender.com/api/ranking';
const SITE_INFO={
  twitcasting:{label:'TWITCASTING',jp:'ツイキャス',col:'#62e9ff'},
  kick:{label:'KICK',jp:'KICK',col:'#53fc18'},
  fuwacchi:{label:'FUWA',jp:'ふわっち',col:'#ff6ec7'}
};
const platToSite=p=>p==='ふわっち'?'fuwacchi':p==='Kick'?'kick':'twitcasting';
function siteBase(s){return s==='kick'?'https://kick.com':s==='fuwacchi'?'https://whowatch.tv':'https://twitcasting.tv';}

/* ===== 蓄積アーカイブ ===== */
const ARC_KEY='holo_archive';
function loadArchive(){try{const s=localStorage.getItem(ARC_KEY);if(s){const a=JSON.parse(s);if(Array.isArray(a))return a;}}catch(e){}return [];}
function saveArchive(){try{localStorage.setItem(ARC_KEY,JSON.stringify(archive));}catch(e){}}
let archive=loadArchive();   // [{name,site,ccu,icon,thumb,title,url,activity,live,firstSeen,lastSeen}, ...]

/* ===== メモ（永続） ===== */
const MEMO_KEY='holo_dex_memo';
function loadAllMemo(){try{return JSON.parse(localStorage.getItem(MEMO_KEY))||{};}catch(e){return {};}}
function getMemo(n){return loadAllMemo()[n]||'';}
function setMemo(n,t){const a=loadAllMemo();if(t.trim())a[n]=t;else delete a[n];try{localStorage.setItem(MEMO_KEY,JSON.stringify(a));}catch(e){}}

/* ===== 設定 ===== */
const SETTINGS_KEY='holo_settings';
let S={posX:50,posY:50,scale:1,memoFontPx:14,memoOn:true,order:'rank',
  siteOn:{twitcasting:true,kick:true,fuwacchi:true},liveOnly:true,minCcu:0,
  parallax:1.0,floatOn:true,swipeSens:1.0,zoomRate:1.0,mode:'full'};
try{const s=localStorage.getItem(SETTINGS_KEY);if(s)S=Object.assign(S,JSON.parse(s));}catch(e){}
function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(S));}catch(e){}}

let idx=0,viewList=[];

/* ===== データ取得＋蓄積 ===== */
async function loadData(){
  try{
    const r=await fetch(URA_API,{cache:'no-store'});
    const j=await r.json();
    const fresh=(j.ranking||[]).map(x=>({
      name:x.name||'???', site:platToSite(x.platform), ccu:+x.viewers||0,
      icon:x.thumb||'', thumb:x.thumb||'', title:x.title||'',
      url:x.url||siteBase(platToSite(x.platform)),
      activity:+x.activityScore||(+x.commentRatePerMin||0)*60||0,
      live:true
    }));
    mergeFresh(fresh);
    rebuildView();
  }catch(e){
    console.warn('API失敗(蓄積データのみ表示)',e);
    rebuildView();
  }
}
function mergeFresh(fresh){
  const now=Date.now();
  const seenSet=new Set(fresh.map(f=>f.name));
  // 既存はオフラインに
  archive.forEach(a=>{
    if(seenSet.has(a.name)){
      const f=fresh.find(x=>x.name===a.name);
      Object.assign(a,f,{lastSeen:now});
    }else{
      a.live=false; a.ccu=0;
    }
  });
  // 新規追加
  const archNames=new Set(archive.map(a=>a.name));
  fresh.forEach(f=>{if(!archNames.has(f.name)){archive.push({...f,firstSeen:now,lastSeen:now});}});
  saveArchive();
}

function aiueoKey(name){
  const k=name.replace(/^[\s\-_]+/,'').charAt(0);
  // ローマ字英字大文字統一/かな統一は荒いが許容
  return k.toUpperCase();
}

function rebuildView(){
  const prevName = viewList.length ? (viewList[idx]||{}).name : null;
  let arr=archive.slice();
  if(S.liveOnly)arr=arr.filter(s=>s.live);
  arr=arr.filter(s=>S.siteOn[s.site]&&(s.ccu>=S.minCcu||!S.liveOnly));
  if(S.order==='rank')arr.sort((a,b)=>b.ccu-a.ccu);
  else if(S.order==='site')arr.sort((a,b)=>a.site.localeCompare(b.site)||b.ccu-a.ccu);
  else if(S.order==='aiueo')arr.sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  else if(S.order==='shuffle')arr.sort(()=>Math.random()-0.5);
  viewList=arr;
  // 直前と同じ人にidxを合わせる（データ更新で勝手に別人に切り替わるのを防ぐ）
  if(prevName){
    const ni=viewList.findIndex(x=>x.name===prevName);
    if(ni>=0){idx=ni;}
    else if(idx>=viewList.length)idx=0;
  }else if(idx>=viewList.length)idx=0;
  if(viewList.length===0){anchor.innerHTML='<div style="color:var(--neon);font-family:Orbitron;font-size:18px;letter-spacing:.3em;text-shadow:0 0 12px var(--neon);">NO STREAMERS</div>';
    const a=document.getElementById('idxCur'),b=document.getElementById('idxTot');if(a)a.textContent='0';if(b)b.textContent='0';return;}
  // 既存カードが今のviewList[idx]と同一人物なら、再描画スキップして文字情報だけ更新
  if(currentCard && prevName===viewList[idx].name){
    // ランク表示だけ更新
    const rk=currentCard.querySelector('.rank');if(rk)rk.innerHTML='<div class="row1"><span class="num">'+(idx+1)+'</span><span class="lbl">位</span></div><span class="div"></span><div class="row2"><span class="slash">/</span><span class="tot">'+viewList.length+'</span><span class="totLbl">人中</span></div>';
    // 同接・activity数値更新
    const s=viewList[idx];
    const vals=currentCard.querySelectorAll('.stat .val');
    if(vals[0])vals[0].innerHTML=s.ccu.toLocaleString()+'<small> 人</small>';
    if(vals[1])vals[1].innerHTML=Math.round(s.activity||0)+'<small> /min</small>';
  }else{
    renderCard(0);
  }
  updateCounter();
  document.getElementById('sb-archive').textContent=archive.length+'人';
}
function updateCounter(){const a=document.getElementById('idxCur'),b=document.getElementById('idxTot');if(a)a.textContent=(idx+1);if(b)b.textContent=viewList.length;}

/* ===== カード生成 ===== */
const anchor=document.getElementById('anchor');
function holoLayers(){
  return `<div class="layer-shadow"></div><div class="layer-shadow2"></div><div class="layer-back"></div><div class="layer-back2"></div><div class="layer-back3"></div><div class="layer-rays"></div><div class="layer-corners"><span class="cb"></span><span class="cd"></span></div><div class="layer-flicker"></div><div class="layer-glitch"></div><div class="layer-rgb"></div><div class="layer-scan"></div>`;
}
function makeCardSet(s,rank){
  const info=SITE_INFO[s.site];
  const card=document.createElement('div');card.className='card holo-frame';card.style.color=info.col;
  const hasThumb=s.thumb&&s.thumb.startsWith('http');
  const ava=hasThumb?`<img class="ava" src="${s.icon}" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ava',textContent:'${(s.name[0]||'?').replace(/'/g,'')}'}))">`:`<span class="ava">${(s.name[0]||'?')}</span>`;
  card.innerHTML=`
    ${holoLayers()}
    <div class="layer-main">
      <div class="rank"><div class="row1"><span class="num">${rank+1}</span><span class="lbl">位</span></div><span class="div"></span><div class="row2"><span class="slash">/</span><span class="tot">${viewList.length}</span><span class="totLbl">人中</span></div></div>
      <div class="hdr">${ava}<div><div class="nm">${s.name}</div><span class="badge">${info.label}</span>${s.live?'':'<span class="offline">OFFLINE</span>'}</div></div>
      <div class="stat">
        <div class="s"><div class="lab">VIEWERS</div><div class="val">${s.ccu.toLocaleString()}<small> 人</small></div></div>
        <div class="s"><div class="lab">ACTIVITY</div><div class="val">${Math.round(s.activity||0)}<small> /min</small></div></div>
      </div>
      ${hasThumb?`<div class="thumb"><img src="${s.thumb}" referrerpolicy="no-referrer">${s.live?'<span class="live">● LIVE</span>':''}</div>`:''}
      ${s.title?`<div class="titleblock"><div class="lab">NOW STREAMING</div><div class="tt">${s.title}</div></div>`:''}
      <div class="btns"><a class="btn primary" href="${s.url}" target="_blank" rel="noopener"><span>配信ページへ ↗</span></a></div>
    </div>`;
  card.querySelectorAll('.btn').forEach(b=>['mousedown','pointerdown','touchstart'].forEach(ev=>b.addEventListener(ev,e=>e.stopPropagation())));

  let mp=null;
  if(S.memoOn){
    mp=document.createElement('div');mp.className='memo-panel holo-frame';mp.style.color=info.col;
    mp.innerHTML=`${holoLayers()}<div class="layer-main">
      <div class="ttl">MEMO <span class="for">${s.name}</span></div>
      <textarea placeholder="配信スタイル・特徴・推し度・タイミングなどメモ"></textarea>
      <div class="ft"><span class="m-stat saved">SAVED</span></div>
    </div>`;
    const ta=mp.querySelector('textarea');
    ta.style.fontSize=S.memoFontPx+'px';
    ta.value=getMemo(s.name);
    let tmr=null;
    ta.addEventListener('input',()=>{setMemo(s.name,ta.value);const st=mp.querySelector('.m-stat');st.textContent='SAVING…';st.classList.remove('saved');clearTimeout(tmr);tmr=setTimeout(()=>{st.textContent='SAVED';st.classList.add('saved');},250);});
    ta.addEventListener('blur',()=>setMemo(s.name,ta.value));
    ['mousedown','pointerdown','touchstart'].forEach(ev=>ta.addEventListener(ev,e=>e.stopPropagation()));
  }
  return {card,mp};
}

let currentCard=null,currentMemo=null;
function renderCard(direction){
  if(!viewList.length)return;
  const s=viewList[idx];
  // メモ表示の有無でgrid列数を調整
  anchor.classList.toggle('memo-off',!S.memoOn);

  const {card,mp}=makeCardSet(s,idx);
  const enterFromCard = direction>0 ? 'translate(60vw,0) rotateY(35deg)' : direction<0 ? 'translate(-60vw,0) rotateY(-35deg)' : 'translateY(20px) scale(.92)';
  const enterFromMemo = direction>0 ? 'translate(60vw,0) rotateY(35deg)' : direction<0 ? 'translate(-60vw,0) rotateY(-35deg)' : 'translateY(20px) scale(.92)';

  card.style.transform=enterFromCard;card.style.opacity='0';
  card.style.transition='transform .6s cubic-bezier(.2,.85,.25,1), opacity .35s ease';
  anchor.appendChild(card);
  if(mp){mp.style.transform=enterFromMemo;mp.style.opacity='0';
    mp.style.transition='transform .6s cubic-bezier(.2,.85,.25,1) .08s, opacity .35s ease .08s';
    anchor.appendChild(mp);}

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    card.style.transform='translate(0,0) rotateY(0)';card.style.opacity='1';
    if(mp){mp.style.transform='translate(0,0) rotateY(0)';mp.style.opacity='1';}
  }));

  const exitTo = direction>0 ? 'translate(-60vw,0) rotateY(-35deg)' : direction<0 ? 'translate(60vw,0) rotateY(35deg)' : 'scale(.9)';
  if(currentCard){const c=currentCard;
    // gridから外して新カードのレイアウトを乱さない
    const r=c.getBoundingClientRect();
    c.style.position='absolute';c.style.left=r.left+'px';c.style.top=r.top+'px';c.style.width=r.width+'px';c.style.height=r.height+'px';
    c.style.transition='transform .6s cubic-bezier(.6,0,.2,1), opacity .35s ease';c.style.transform=exitTo;c.style.opacity='0';setTimeout(()=>c.remove(),700);}
  if(currentMemo){const m=currentMemo;
    const r=m.getBoundingClientRect();
    m.style.position='absolute';m.style.left=r.left+'px';m.style.top=r.top+'px';m.style.width=r.width+'px';m.style.height=r.height+'px';
    m.style.transition='transform .6s cubic-bezier(.6,0,.2,1), opacity .35s ease';m.style.transform=exitTo;m.style.opacity='0';setTimeout(()=>m.remove(),700);}
  currentCard=card;currentMemo=mp;
  updateCounter();
}

function next(){if(!viewList.length)return;idx=(idx+1)%viewList.length;renderCard(+1);flash('R');}
function prev(){if(!viewList.length)return;idx=(idx-1+viewList.length)%viewList.length;renderCard(-1);flash('L');}
function jumpTo(name){const i=viewList.findIndex(x=>x.name===name);if(i<0)return false;const dir=i>idx?+1:-1;idx=i;renderCard(dir);return true;}
function flash(d){const el=document.getElementById(d==='L'?'swL':'swR');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),300);}

/* ===== アンカー位置・サイズ・視差 ===== */
let floatT=0;
function updateAnchor(){
  floatT+=0.006;
  const fY=Math.sin(floatT)*5;
  const ry=Math.sin(floatT*0.7)*5;
  const rx=Math.sin(floatT*0.4)*2.5;
  anchor.style.left=S.posX+'%';
  anchor.style.top=S.posY+'%';
  anchor.style.transform=`translate(-50%,calc(-50% + ${fY}px)) scale(${S.scale}) rotateY(${ry}deg) rotateX(${rx}deg)`;
  requestAnimationFrame(updateAnchor);
}
updateAnchor();

/* ===== ドラッグ移動 ===== */
let dragging=false,dsx=0,dsy=0,dpx=0,dpy=0,dmoved=false;
anchor.addEventListener('pointerdown',e=>{
  if(e.target.closest('textarea')||e.target.closest('.btn'))return;
  dragging=true;dsx=e.clientX;dsy=e.clientY;dpx=S.posX;dpy=S.posY;dmoved=false;
  anchor.classList.add('dragging');try{anchor.setPointerCapture(e.pointerId);}catch(_){}
});
anchor.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-dsx,dy=e.clientY-dsy;
  if(Math.abs(dx)+Math.abs(dy)>5)dmoved=true;
  S.posX=Math.max(5,Math.min(95,dpx+dx/innerWidth*100));
  S.posY=Math.max(5,Math.min(95,dpy+dy/innerHeight*100));
  document.getElementById('sb-px').value=S.posX;document.getElementById('sb-px-v').textContent=Math.round(S.posX)+'%';
  document.getElementById('sb-py').value=S.posY;document.getElementById('sb-py-v').textContent=Math.round(S.posY)+'%';
});
anchor.addEventListener('pointerup',()=>{if(dragging){dragging=false;anchor.classList.remove('dragging');if(dmoved)saveSettings();}});

/* ===== 背景スワイプ ===== */
let bgT=false,bgSx=0,bgSy=0;
addEventListener('pointerdown',e=>{if(e.target.closest('.anchor')||e.target.closest('#sidebar')||e.target.closest('#menubtn')||e.target.closest('#idxPanel')||e.target.closest('#idxBtn'))return;bgSx=e.clientX;bgSy=e.clientY;bgT=true;});
addEventListener('pointerup',e=>{if(!bgT)return;bgT=false;const dx=e.clientX-bgSx,dy=e.clientY-bgSy;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)){if(dx<0)next();else prev();}});
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')next();
  else if(e.key==='ArrowLeft')prev();
  else if(e.key==='Escape'&&S.mode==='clean'){
    S.mode='full';document.body.classList.remove('clean');
    document.querySelectorAll('#sb-mode button').forEach(b=>b.classList.toggle('on',b.dataset.m==='full'));
    saveSettings();
  }
});

// マウスホイールで拡大縮小
addEventListener('wheel',e=>{
  // メモやサイドバー上では既定スクロールを優先
  if(e.target.closest('textarea')||e.target.closest('#sidebar')||e.target.closest('#idxPanel'))return;
  e.preventDefault();
  const factor = e.deltaY<0 ? 1.08 : 0.93;  // 上スクロール=拡大、下=縮小
  S.scale=Math.max(0.3,Math.min(3.0,S.scale*factor));
  saveSettings();
},{passive:false});

/* ===== サイドバー ===== */
const sb=document.getElementById('sidebar');
document.getElementById('menubtn').addEventListener('click',()=>sb.classList.toggle('show'));
document.getElementById('sbclose').addEventListener('click',()=>sb.classList.remove('show'));
function bindSlider(id,vid,setter,fmt){const r=document.getElementById(id),v=document.getElementById(vid);r.addEventListener('input',()=>{setter(+r.value);v.textContent=fmt(+r.value);saveSettings();});}
function bindCheck(id,setter){document.getElementById(id).addEventListener('change',e=>{setter(e.target.checked);saveSettings();});}

bindSlider('sb-mf','sb-mf-v',v=>{S.memoFontPx=v;document.querySelectorAll('.memo-panel textarea').forEach(t=>t.style.fontSize=v+'px');},v=>v+'px');
bindCheck('sb-memo',v=>{S.memoOn=v;rebuildView();});
bindSlider('sb-minccu','sb-minccu-v',v=>{S.minCcu=v;rebuildView();},v=>String(v));
bindSlider('sb-sens','sb-sens-v',v=>S.swipeSens=v,v=>v.toFixed(1));
bindSlider('sb-zoomrate','sb-zoomrate-v',v=>S.zoomRate=v,v=>v.toFixed(1));
bindCheck('sb-liveonly',v=>{S.liveOnly=v;rebuildView();});

document.querySelectorAll('#sb-mode button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#sb-mode button').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.mode=b.dataset.m;document.body.classList.toggle('clean',S.mode==='clean');saveSettings();}));
document.querySelectorAll('#sb-order button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#sb-order button').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.order=b.dataset.o;idx=0;rebuildView();saveSettings();}));
document.querySelectorAll('#sb-site button').forEach(b=>b.addEventListener('click',()=>{const s=b.dataset.s;S.siteOn[s]=!S.siteOn[s];b.classList.toggle('on',S.siteOn[s]);rebuildView();saveSettings();}));
document.getElementById('sb-refresh').addEventListener('click',()=>loadData());
document.getElementById('sb-clear').addEventListener('click',()=>{if(!confirm('蓄積を全部消去します。メモは残ります。よいですか？'))return;archive=[];saveArchive();rebuildView();});
document.getElementById('sb-cam').addEventListener('change',e=>{if(e.target.checked)startHand();else stopHand();});
document.getElementById('sb-voice').addEventListener('change',e=>{if(e.target.checked)startVoice();else stopVoice();});

function applySettingsToUI(){
  document.getElementById('sb-mf').value=S.memoFontPx;document.getElementById('sb-mf-v').textContent=S.memoFontPx+'px';
  document.getElementById('sb-memo').checked=S.memoOn;
  document.getElementById('sb-minccu').value=S.minCcu;document.getElementById('sb-minccu-v').textContent=String(S.minCcu);
  document.getElementById('sb-sens').value=S.swipeSens;document.getElementById('sb-sens-v').textContent=S.swipeSens.toFixed(1);
  document.getElementById('sb-zoomrate').value=S.zoomRate;document.getElementById('sb-zoomrate-v').textContent=S.zoomRate.toFixed(1);
  document.getElementById('sb-liveonly').checked=S.liveOnly;
  document.querySelectorAll('#sb-order button').forEach(b=>b.classList.toggle('on',b.dataset.o===S.order));
  document.querySelectorAll('#sb-site button').forEach(b=>b.classList.toggle('on',!!S.siteOn[b.dataset.s]));
  document.querySelectorAll('#sb-mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));
  document.body.classList.toggle('clean',S.mode==='clean');
}
applySettingsToUI();

/* ===== インデックスパネル ===== */
const idxPanel=document.getElementById('idxPanel');
let idxSite='all',idxLetter='',idxSearch='';
document.getElementById('idxBtn').addEventListener('click',()=>{idxPanel.classList.toggle('show');rebuildIndex();setTimeout(()=>{if(idxPanel.classList.contains('show'))document.getElementById('ixSearch').focus();},100);});
document.getElementById('ixClose').addEventListener('click',()=>idxPanel.classList.remove('show'));
document.querySelectorAll('#ixTabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#ixTabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');idxSite=b.dataset.s;idxLetter='';rebuildIndex();}));
const ixSearch=document.getElementById('ixSearch');
ixSearch.addEventListener('input',()=>{idxSearch=ixSearch.value.trim();rebuildIndex();});
ixSearch.addEventListener('keydown',e=>{if(e.key==='Enter'){
  // 先頭にヒットしてる人にジャンプ
  const first=document.querySelector('#idxList .ix-item');
  if(first)first.click();
}});

function rebuildIndex(){
  const list=archive.filter(s=>idxSite==='all'||s.site===idxSite);
  // letters available
  const lettersBox=document.getElementById('ixLetters');lettersBox.innerHTML='';
  const present=new Set(list.map(s=>aiueoKey(s.name)));
  const realLetters=Array.from(present).sort();
  ['（全）',...realLetters].forEach(L=>{
    const b=document.createElement('button');b.textContent=L==='（全）'?'全':L;
    if(L==='（全）'){if(idxLetter==='')b.classList.add('on');b.addEventListener('click',()=>{idxLetter='';rebuildIndex();});}
    else{if(idxLetter===L)b.classList.add('on');b.addEventListener('click',()=>{idxLetter=L;rebuildIndex();});}
    lettersBox.appendChild(b);
  });
  // 一覧
  let filt=list.slice();
  if(idxLetter)filt=filt.filter(s=>aiueoKey(s.name)===idxLetter);
  if(idxSearch){const q=idxSearch.toLowerCase();filt=filt.filter(s=>s.name.toLowerCase().includes(q));}
  filt.sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  const box=document.getElementById('idxList');box.innerHTML='';
  if(!filt.length){box.innerHTML='<div style="color:var(--dim);text-align:center;padding:20px;font-size:12px;">該当なし</div>';return;}
  filt.forEach(s=>{
    const info=SITE_INFO[s.site];
    const it=document.createElement('div');it.className='ix-item'+(s.live?' live':'');it.style.color=info.col;
    const av=s.icon?`<span class="av"><img src="${s.icon}" referrerpolicy="no-referrer"></span>`:`<span class="av">${(s.name[0]||'?')}</span>`;
    it.innerHTML=`${av}<div class="info"><div class="nm">${s.name}</div><div class="cc">${s.live?(s.ccu.toLocaleString()+'人 LIVE'):'OFFLINE'}</div></div>`;
    it.addEventListener('click',()=>{
      const inView=viewList.findIndex(x=>x.name===s.name);
      if(inView<0){viewList.unshift(s);idx=0;renderCard(0);updateCounter();}
      else{idx=inView;renderCard(0);updateCounter();}
      idxPanel.classList.remove('show');
    });
    box.appendChild(it);
  });
}

/* ===== ジェスチャー操作 ===== */
let SWIPE_SENS=S.swipeSens;
const gst=document.getElementById('gst');
function setGst(t){if(t){gst.textContent=t;gst.classList.add('show');}else gst.classList.remove('show');}
const cam=document.getElementById('cam'),hcv=document.getElementById('handcv'),hctx=hcv.getContext('2d');
let hands=null,handOn=false,camLoop=null;
let idxPosHist=[],lastSwipeT=0;
let snapArmed=false,lastSnapT=0;

async function startHand(){
  if(handOn)return;
  if(!window.Hands){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
  hands=new window.Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
  hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.6});
  hands.onResults(onHand);
  const stream=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720},audio:false});
  cam.srcObject=stream;await cam.play();handOn=true;cam.classList.add('on');hcv.classList.add('on');
  const pump=async()=>{if(!handOn)return;await hands.send({image:cam});camLoop=requestAnimationFrame(pump);};pump();
}
function stopHand(){handOn=false;if(camLoop)cancelAnimationFrame(camLoop);if(cam.srcObject){cam.srcObject.getTracks().forEach(t=>t.stop());cam.srcObject=null;}cam.classList.remove('on');hcv.classList.remove('on');setGst('');}

function dist3(a,b){return Math.hypot(a.x-b.x,a.y-b.y,(a.z||0)-(b.z||0));}
let snapHoldStart=0;
let clapCount=0,lastClapWindow=0;
let clapHist=[];
let lastClapT=0;
function onHand(res){
  hctx.clearRect(0,0,160,120);
  const nowT=performance.now();

  // ==== 両手検出時：拍手 ====
  if(res.multiHandLandmarks && res.multiHandLandmarks.length>=2){
    const a=res.multiHandLandmarks[0][9], b=res.multiHandLandmarks[1][9];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    clapHist.push({d,t:nowT});
    clapHist=clapHist.filter(p=>nowT-p.t<500);
    for(const lm of res.multiHandLandmarks){
      hctx.fillStyle='#62e9ff';for(const p of lm){hctx.beginPath();hctx.arc(p.x*160,p.y*120,1.8,0,7);hctx.fill();}
    }
    if(clapHist.length>=4 && nowT-lastClapT>500){
      const maxD=Math.max(...clapHist.map(p=>p.d));
      const minD=Math.min(...clapHist.map(p=>p.d));
      if(maxD>0.12 && minD<0.09 && (maxD-minD)>0.05){
        lastClapT=nowT;clapHist=[];
        // 1秒以内に2回目なら「閉じる」、それ以外は1回目=「開く」
        if(nowT-lastClapWindow<1000){
          // 2回目：開いてる配信タブを閉じることはJSからは制限ある。最後に開いたwindow.openの参照があれば閉じれる
          if(lastOpenedTab && !lastOpenedTab.closed){try{lastOpenedTab.close();}catch(e){}lastOpenedTab=null;}
          setGst('👏👏 配信を閉じる');
          clapCount=0;lastClapWindow=0;
        }else{
          // 1回目：配信ページを開く
          const s=viewList[idx];
          if(s&&s.url){try{lastOpenedTab=window.open(s.url,'_blank','noopener');}catch(e){console.warn(e);}}
          setGst('👏 配信ページを開く');
          clapCount=1;lastClapWindow=nowT;
        }
        return;
      }
    }
    setGst('🙌 両手検出 (拍手→開く、もう一度→閉じる)');
    return;
  }else{
    clapHist=[];
  }

  // ==== 片手 ====
  if(!res.multiHandLandmarks||!res.multiHandLandmarks.length){
    idxPosHist=[];snapArmed=false;snapHoldStart=0;setGst('');return;
  }
  const lm=res.multiHandLandmarks[0];

  hctx.fillStyle='#62e9ff';for(const p of lm){hctx.beginPath();hctx.arc(p.x*160,p.y*120,1.8,0,7);hctx.fill();}
  hctx.strokeStyle='rgba(98,233,255,.5)';hctx.lineWidth=1;
  [[0,5],[5,8],[0,9],[9,12],[0,13],[13,16],[0,17],[17,20],[5,9],[9,13],[13,17],[0,1],[1,2],[2,3],[3,4]].forEach(([a,b])=>{hctx.beginPath();hctx.moveTo(lm[a].x*160,lm[a].y*120);hctx.lineTo(lm[b].x*160,lm[b].y*120);hctx.stroke();});

  const wrist=lm[0];
  function extended(tip,mid){
    const dt=Math.hypot(lm[tip].x-wrist.x,lm[tip].y-wrist.y);
    const dm=Math.hypot(lm[mid].x-wrist.x,lm[mid].y-wrist.y);
    return dt > dm*1.10;
  }
  const fI=extended(8,6), fM=extended(12,10), fR=extended(16,14), fP=extended(20,18);
  const up=(fI?1:0)+(fM?1:0)+(fR?1:0)+(fP?1:0);

  // 手のひら/手の甲 判定
  const handed=(res.multiHandedness&&res.multiHandedness[0])?res.multiHandedness[0].label:'Right';
  const palmFacing = handed==='Right' ? lm[4].x>lm[20].x : lm[4].x<lm[20].x;

  // 1. ピース → 移動
  if(fI && fM && !fR && !fP){
    const mx=(lm[8].x+lm[12].x)/2, my=(lm[8].y+lm[12].y)/2;
    const px=(1-mx)*100, py=my*100;
    S.posX=Math.max(5,Math.min(95,px));
    S.posY=Math.max(5,Math.min(95,py));
    setGst('✌ 移動');saveSettings();
    idxPosHist=[];snapArmed=false;snapHoldStart=0;
    return;
  }

  // 2. グー → 縮小
  if(up===0){
    const r=0.012*S.zoomRate;
    S.scale=Math.max(0.4,S.scale*(1-r));
    setGst('✊ 縮小');saveSettings();
    idxPosHist=[];snapArmed=false;snapHoldStart=0;
    return;
  }

  // 3. パー：手の甲=拡大、手のひら=停止
  if(up===4){
    if(palmFacing){
      // 手のひらは反応なし
      setGst('🖐 停止 (手の甲で拡大)');
      idxPosHist=[];snapArmed=false;snapHoldStart=0;
      return;
    }else{
      const r=0.012*S.zoomRate;
      S.scale=Math.min(2.5,S.scale*(1+r));
      setGst('🤚 拡大');saveSettings();
      idxPosHist=[];snapArmed=false;snapHoldStart=0;
      return;
    }
  }

  // 4. 指パッチン（廃止）

  // 5. 人差し指1本立て → スワイプ
  if(fI && !fM && !fR && !fP){
    const x=(1-lm[8].x);
    idxPosHist.push({x,t:nowT});
    idxPosHist=idxPosHist.filter(p=>nowT-p.t<450);
    if(idxPosHist.length>=3 && nowT-lastSwipeT>700){
      const dx=idxPosHist[idxPosHist.length-1].x-idxPosHist[0].x;
      const thr=0.10/SWIPE_SENS;
      if(dx>thr){lastSwipeT=nowT;idxPosHist=[];setGst('☝→');next();return;}
      if(dx<-thr){lastSwipeT=nowT;idxPosHist=[];setGst('☝←');prev();return;}
    }
    setGst('☝ 人差し指を振る');
    return;
  }

  setGst('');
  idxPosHist=[];snapArmed=false;snapHoldStart=0;
}
let lastOpenedTab=null;


/* ===== 音声で名前ジャンプ ===== */
let recog=null;
function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('このブラウザは音声認識未対応（Chrome推奨）');document.getElementById('sb-voice').checked=false;return;}
  recog=new SR();recog.lang='ja-JP';recog.continuous=true;recog.interimResults=false;
  recog.onresult=ev=>{
    const txt=ev.results[ev.results.length-1][0].transcript.replace(/\s/g,'');
    // 部分一致で最も長い名前にヒット
    let best=null,bl=0;
    for(const s of viewList){const n=s.name.replace(/\s/g,'');if(txt.includes(n)||n.includes(txt)){if(n.length>bl){bl=n.length;best=s;}}}
    // viewListに無くてもarchive全体から探す
    if(!best){for(const s of archive){const n=s.name.replace(/\s/g,'');if(txt.includes(n)||n.includes(txt)){if(n.length>bl){bl=n.length;best=s;}}}}
    if(best){
      const i=viewList.findIndex(x=>x.name===best.name);
      if(i>=0){idx=i;renderCard(0);}else{viewList.unshift(best);idx=0;renderCard(0);}
      updateCounter();setGst('🎤 '+best.name);setTimeout(()=>setGst(''),1500);
    }
  };
  recog.onerror=()=>{};recog.onend=()=>{if(recog)try{recog.start();}catch(e){}};
  try{recog.start();}catch(e){}
}
function stopVoice(){if(recog){const r=recog;recog=null;try{r.stop();}catch(e){}}}

/* ===== 起動 ===== */
loadData();
setInterval(loadData,30000);
